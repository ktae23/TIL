## 핵심 정리\n\n1. **정렬된 배열**에서만 사용 가능\n2. `left + (right - left) / 2`로 **오버플로우 방지**\n3. Lower/Upper Bound는 **경계 조건** 주의\n4. 시간 복잡도: **O(log n)**\n", "java_code": "", "java_file": ""}, {"id": "12_parametric_search", "title": "12. 파라메트릭 서치 (Parametric Search)", "md_content": "# 12. 파라메트릭 서치 (Parametric Search)\n\n> 관련 코드: `section5_essential2/parametric/ParametricSearchBasic.java`\n\n---\n\n## 1. 파라메트릭 서치란?\n\n**최적화 문제를 결정 문제로 바꾸어** 이분 탐색으로 해결하는 기법입니다.\n\n### 문제 변환\n- **최적화 문제**: \"최댓값/최솟값을 구하라\"\n- **결정 문제**: \"주어진 값이 조건을 만족하는가?\" → Yes/No\n\n### 예시\n- **최적화**: \"가장 큰 X를 구하라\"\n- **결정**: \"X가 가능한가?\" → Yes/No\n\n---\n\n## 2. 적용 조건\n\n결정 함수 f(x)가 **단조성**을 가져야 함:\n- f(x)가 True이면, x보다 작은(또는 큰) 모든 값도 True\n- **경계값**을 이분 탐색으로 찾을 수 있음\n\n### 예시\n\"최소 X 이상 가능한가?\"\n```\nx=5 불가능, x=6 불가능, x=7 가능, x=8 가능 ...\n→ 경계값 7을 이분 탐색으로 찾기\n```\n\n---\n\n## 3. 구현 패턴\n\n```java\nwhile (left < right) {\n    mid = (left + right) / 2;  // 또는 (left + right + 1) / 2\n    if (check(mid)) {\n        // 조건에 따라 범위 조정\n    } else {\n        // 반대쪽으로 범위 조정\n    }\n}\n```\n\n### 최댓값을 찾을 때\n```java\nwhile (left < right) {\n    long mid = (left + right + 1) / 2;  // 올림\n    if (canMake(mid)) {\n        left = mid;       // 가능하면 더 큰 값 시도\n    } else {\n        right = mid - 1;  // 불가능하면 더 작은 값\n    }\n}\n```\n\n### 최솟값을 찾을 때\n```java\nwhile (left < right) {\n    long mid = (left + right) / 2;  // 내림\n    if (canMake(mid)) {\n        right = mid;      // 가능하면 더 작은 값 시도\n    } else {\n        left = mid + 1;   // 불가능하면 더 큰 값\n    }\n}\n```\n\n---\n\n## 4. 대표 문제 유형\n\n### 1) \"최댓값의 최솟값, 최솟값의 최댓값\" 유형\n- 예: \"최대 거리의 최솟값을 구하라\"\n\n### 2) \"K개 이상 만들 수 있는 최대 길이\"\n- 예: 나무 자르기, 랜선 자르기\n\n### 3) \"조건을 만족하는 최소/최대 값\"\n- 예: 공유기 설치, 입국심사\n\n---\n\n## 5. 구현 예제\n\n### 랜선 자르기\n```java\n// K개의 랜선으로 N개 이상의 같은 길이 랜선을 만들 때 최대 길이\npublic static long maxLanLength(int[] lans, int need) {\n    long left = 1;\n    long right = 0;\n    for (int lan : lans) right = Math.max(right, lan);\n\n    while (left < right) {\n        long mid = (left + right + 1) / 2;  // 올림 (최댓값 찾기)\n\n        if (canMake(lans, mid, need)) {\n            left = mid;       // 가능하면 더 큰 값\n        } else {\n            right = mid - 1;  // 불가능하면 더 작은 값\n        }\n    }\n    return left;\n}\n\nprivate static boolean canMake(int[] lans, long length, int need) {\n    long count = 0;\n    for (int lan : lans) count += lan / length;\n    return count >= need;\n}\n```\n\n### 나무 자르기\n```java\n// 높이 H로 자를 때 M 미터 이상 얻을 수 있는 H의 최댓값\npublic static long maxCutHeight(int[] trees, long need) {\n    long left = 0;\n    long right = 0;\n    for (int tree : trees) right = Math.max(right, tree);\n\n    while (left < right) {\n        long mid = (left + right + 1) / 2;\n\n        if (getWood(trees, mid) >= need) {\n            left = mid;\n        } else {\n            right = mid - 1;\n        }\n    }\n    return left;\n}\n```\n\n### 공유기 설치 (최소 거리 최대화)\n```java\npublic static int maxMinDistance(int[] positions, int k) {\n    Arrays.sort(positions);\n\n    int left = 1;\n    int right = positions[positions.length - 1] - positions[0];\n\n    while (left < right) {\n        int mid = (left + right + 1) / 2;\n\n        if (canPlace(positions, mid, k)) {\n            left = mid;\n        } else {\n            right = mid - 1;\n        }\n    }\n    return left;\n}\n\nprivate static boolean canPlace(int[] positions, int minDist, int k) {\n    int count = 1;\n    int lastPos = positions[0];\n\n    for (int i = 1; i < positions.length; i++) {\n        if (positions[i] - lastPos >= minDist) {\n            count++;\n            lastPos = positions[i];\n        }\n    }\n    return count >= k;\n}\n```\n\n---\n\n## 핵심 정리\n\n1. **최적화 문제 → 결정 문제**로 변환\n2. 결정 함수가 **단조성**을 가지는지 확인\n3. 최댓값 찾기: `(left + right + 1) / 2` (올림)\n4. 최솟값 찾기: `(left + right) / 2` (내림)\n", "java_code": "", "java_file": ""}, {"id": "13_two_pointer", "title": "13. 투 포인터 (Two Pointer)", "md_content": "# 13. 투 포인터 (Two Pointer)\n\n> 관련 코드: `section5_essential2/twopointer/TwoPointerBasic.java`\n\n---\n\n## 1. 투 포인터란?\n\n**두 개의 포인터**를 사용하여 배열이나 리스트를 탐색하는 기법입니다.\n\n### 특징\n- **O(n²)을 O(n)으로** 줄일 수 있음\n- 정렬된 배열에서 특히 유용\n- 연속된 구간을 다룰 때 효과적\n\n---\n\n## 2. 투 포인터 유형\n\n### 1) 같은 방향 (슬라이딩 윈도우)\n- left, right가 **같은 방향**으로 이동\n- 연속된 부분 배열 문제\n\n### 2) 반대 방향\n- left는 **왼쪽**에서, right는 **오른쪽**에서\n- 두 수의 합 문제\n\n---\n\n## 3. 시간 복잡도\n\n- 각 포인터가 배열을 **한 번씩만** 순회: **O(n)**\n- 브루트포스 O(n²)보다 효율적\n\n---\n\n## 4. 구현 예제\n\n### 두 수의 합 (정렬된 배열)\n```java\npublic static int[] twoSum(int[] arr, int target) {\n    int left = 0;\n    int right = arr.length - 1;\n\n    while (left < right) {\n        int sum = arr[left] + arr[right];\n\n        if (sum == target) {\n            return new int[]{left, right};\n        } else if (sum < target) {\n            left++;   // 합이 작으면 왼쪽 포인터 증가\n        } else {\n            right--;  // 합이 크면 오른쪽 포인터 감소\n        }\n    }\n\n    return new int[]{-1, -1};  // 찾지 못함\n}\n```\n\n### 부분합 (합이 S 이상인 최소 길이)\n```java\npublic static int minSubArrayLen(int[] arr, int target) {\n    int n = arr.length;\n    int left = 0;\n    int sum = 0;\n    int minLen = Integer.MAX_VALUE;\n\n    for (int right = 0; right < n; right++) {\n        sum += arr[right];\n\n        // 합이 target 이상이면 왼쪽 포인터 이동\n        while (sum >= target) {\n            minLen = Math.min(minLen, right - left + 1);\n            sum -= arr[left];\n            left++;\n        }\n    }\n\n    return minLen == Integer.MAX_VALUE ? 0 : minLen;\n}\n```\n\n### 세 수의 합 (3Sum)\n```java\n// 정렬 후 첫 번째 수를 고정하고 나머지에 투 포인터\npublic static void threeSum(int[] arr, int target) {\n    Arrays.sort(arr);\n    int n = arr.length;\n\n    for (int i = 0; i < n - 2; i++) {\n        if (i > 0 && arr[i] == arr[i - 1]) continue;  // 중복 건너뛰기\n\n        int left = i + 1;\n        int right = n - 1;\n\n        while (left < right) {\n            int sum = arr[i] + arr[left] + arr[right];\n\n            if (sum == target) {\n                System.out.println(\"(\" + arr[i] + \", \" + arr[left] + \", \" + arr[right] + \")\");\n\n                while (left < right && arr[left] == arr[left + 1]) left++;\n                while (left < right && arr[right] == arr[right - 1]) right--;\n\n                left++;\n                right--;\n            } else if (sum < target) {\n                left++;\n            } else {\n                right--;\n            }\n        }\n    }\n}\n```\n\n### 물 담기 (Container With Most Water)\n```java\npublic static int maxWater(int[] heights) {\n    int left = 0;\n    int right = heights.length - 1;\n    int maxArea = 0;\n\n    while (left < right) {\n        int width = right - left;\n        int height = Math.min(heights[left], heights[right]);\n        int area = width * height;\n        maxArea = Math.max(maxArea, area);\n\n        // 높이가 낮은 쪽을 이동\n        if (heights[left] < heights[right]) {\n            left++;\n        } else {\n            right--;\n        }\n    }\n\n    return maxArea;\n}\n```\n\n---\n\n## 5. 슬라이딩 윈도우 패턴\n\n```java\nint left = 0;\nint sum = 0;\n\nfor (int right = 0; right < n; right++) {\n    sum += arr[right];  // 오른쪽 확장\n\n    while (조건) {\n        // 왼쪽 축소\n        sum -= arr[left];\n        left++;\n    }\n}\n```\n\n---\n\n## 핵심 정리\n\n1. **같은 방향**: 연속 구간 문제 (슬라이딩 윈도우)\n2. **반대 방향**: 정렬된 배열의 두 수 문제\n3. 시간 복잡도: O(n²) → **O(n)**\n4. 정렬이 필요한 경우가 많음\n", "java_code": "", "java_file": ""}, {"id": "14_graph", "title": "14. 그래프 표현 (Graph Representation)", "md_content": "# 14. 그래프 표현 (Graph Representation)\n\n> 관련 코드: `section6_graph/basics/GraphRepresentation.java`\n\n---\n\n## 1. 그래프란?\n\n**G = (V, E)**\n- **V**: 정점(Vertex/Node)의 집합\n- **E**: 간선(Edge)의 집합\n\n### 그래프 종류\n\n| 종류 | 설명 |\n|------|------|\n| 방향 그래프 | 간선에 방향이 있음 |\n| 무방향 그래프 | 양방향 이동 가능 |\n| 가중치 그래프 | 간선에 비용이 있음 |\n\n---\n\n## 2. 그래프 표현 방법\n\n### 1) 인접 행렬 (Adjacency Matrix)\n\n2D 배열로 연결 여부 저장\n- `adj[i][j] = 1` if 간선 존재\n- `adj[i][j] = 0` otherwise\n\n| 항목 | 복잡도 |\n|------|--------|\n| 공간 | O(V²) |\n| 간선 확인 | O(1) |\n| 인접 정점 순회 | O(V) |\n\n```java\npublic class AdjacencyMatrix {\n    int V;\n    int[][] matrix;\n\n    public AdjacencyMatrix(int V) {\n        this.V = V;\n        matrix = new int[V][V];\n    }\n\n    // 무방향 간선\n    public void addEdge(int u, int v) {\n        matrix[u][v] = 1;\n        matrix[v][u] = 1;\n    }\n\n    // 방향 간선\n    public void addDirectedEdge(int u, int v) {\n        matrix[u][v] = 1;\n    }\n\n    // 간선 존재 여부\n    public boolean hasEdge(int u, int v) {\n        return matrix[u][v] != 0;\n    }\n}\n```\n\n### 2) 인접 리스트 (Adjacency List)\n\n각 정점에 연결된 정점들의 리스트\n\n| 항목 | 복잡도 |\n|------|--------|\n| 공간 | O(V + E) |\n| 간선 확인 | O(degree) |\n| 인접 정점 순회 | O(degree) |\n\n```java\npublic class AdjacencyList {\n    int V;\n    List<List<Integer>> adj;\n\n    public AdjacencyList(int V) {\n        this.V = V;\n        adj = new ArrayList<>();\n        for (int i = 0; i < V; i++) {\n            adj.add(new ArrayList<>());\n        }\n    }\n\n    // 무방향 간선\n    public void addEdge(int u, int v) {\n        adj.get(u).add(v);\n        adj.get(v).add(u);\n    }\n\n    // 방향 간선\n    public void addDirectedEdge(int u, int v) {\n        adj.get(u).add(v);\n    }\n}\n```\n\n### 3) 가중치 인접 리스트\n\n```java\nList<List<int[]>> adj;  // int[] = {연결 정점, 가중치}\n\npublic void addEdge(int u, int v, int weight) {\n    adj.get(u).add(new int[]{v, weight});\n    adj.get(v).add(new int[]{u, weight});\n}\n```\n\n### 4) 간선 리스트 (Edge List)\n\n크루스칼 알고리즘 등에서 사용\n\n```java\nList<int[]> edges;  // int[] = {시작, 끝, 가중치}\n\npublic void addEdge(int u, int v, int weight) {\n    edges.add(new int[]{u, v, weight});\n}\n\n// 가중치 기준 정렬\npublic void sortByWeight() {\n    edges.sort((a, b) -> a[2] - b[2]);\n}\n```\n\n---\n\n## 3. 선택 기준\n\n### 인접 행렬이 유리한 경우\n- 간선이 많은 **밀집 그래프** (E ≈ V²)\n- 특정 간선의 존재 여부를 **자주 확인**\n\n### 인접 리스트가 유리한 경우\n- 간선이 적은 **희소 그래프** (E << V²)\n- 모든 **인접 정점을 순회**해야 하는 경우\n- **대부분의 코딩 테스트** 문제\n\n---\n\n## 4. 예시 그래프\n\n```\n    0 --- 1\n    |   / |\n    |  /  |\n    | /   |\n    2 --- 3\n```\n\n### 인접 행렬\n```\n  0 1 2 3\n0 0 1 1 0\n1 1 0 1 1\n2 1 1 0 1\n3 0 1 1 0\n```\n\n### 인접 리스트\n```\n0 → [1, 2]\n1 → [0, 2, 3]\n2 → [0, 1, 3]\n3 → [1, 2]\n```\n\n---\n\n## 핵심 정리\n\n1. **희소 그래프** → 인접 리스트 (대부분의 경우)\n2. **밀집 그래프** 또는 간선 조회가 많음 → 인접 행렬\n3. 가중치 그래프는 `int[]` 또는 클래스로 저장\n4. 간선 정렬이 필요하면 간선 리스트\n", "java_code": "", "java_file": ""}, {"id": "15_dfs", "title": "15. 깊이 우선 탐색 (DFS)", "md_content": "# 15. 깊이 우선 탐색 (DFS)\n\n> 관련 코드: `section6_graph/traversal/DFSBasic.java`\n\n---\n\n## 1. DFS란?\n\n그래프를 탐색하는 방법 중 하나로, 가능한 **깊이 들어갔다가** 더 이상 갈 곳이 없으면 **돌아오는** 방식입니다.\n\n### 특징\n- **스택** 또는 **재귀**로 구현\n- 경로 탐색, 사이클 검출 등에 유용\n- 모든 정점을 방문하려면 **visited 배열** 필요\n\n---\n\n## 2. 시간/공간 복잡도\n\n| 표현 방식 | 시간 복잡도 |\n|-----------|-------------|\n| 인접 리스트 | O(V + E) |\n| 인접 행렬 | O(V²) |\n\n공간: O(V) - visited 배열 + 재귀 스택\n\n---\n\n## 3. DFS 활용\n\n- 연결 요소(Connected Component) 찾기\n- 사이클 검출\n- 위상 정렬\n- 경로 탐색\n- 미로 탐색\n- **백트래킹**\n\n---\n\n## 4. 구현\n\n### 재귀 구현\n```java\nstatic List<List<Integer>> adj;\nstatic boolean[] visited;\n\npublic static void dfsRecursive(int node) {\n    visited[node] = true;\n    System.out.print(node + \" \");\n\n    for (int next : adj.get(node)) {\n        if (!visited[next]) {\n            dfsRecursive(next);\n        }\n    }\n}\n```\n\n### 스택 구현\n```java\npublic static void dfsStack(int start) {\n    Stack<Integer> stack = new Stack<>();\n    boolean[] visited = new boolean[adj.size()];\n\n    stack.push(start);\n\n    while (!stack.isEmpty()) {\n        int node = stack.pop();\n\n        if (visited[node]) continue;\n\n        visited[node] = true;\n        System.out.print(node + \" \");\n\n        // 역순으로 넣어야 작은 번호부터 방문\n        List<Integer> neighbors = adj.get(node);\n        for (int i = neighbors.size() - 1; i >= 0; i--) {\n            int next = neighbors.get(i);\n            if (!visited[next]) {\n                stack.push(next);\n            }\n        }\n    }\n}\n```\n\n---\n\n## 5. 응용 예제\n\n### 연결 요소 개수\n```java\npublic static int countComponents(int n, List<List<Integer>> graph) {\n    boolean[] visited = new boolean[n];\n    int count = 0;\n\n    for (int i = 0; i < n; i++) {\n        if (!visited[i]) {\n            dfs(i, graph, visited);\n            count++;\n        }\n    }\n    return count;\n}\n```\n\n### 사이클 검출 (무방향 그래프)\n```java\npublic static boolean hasCycleUndirected(int n, List<List<Integer>> graph) {\n    boolean[] visited = new boolean[n];\n\n    for (int i = 0; i < n; i++) {\n        if (!visited[i]) {\n            if (dfsCycle(i, -1, graph, visited)) {\n                return true;\n            }\n        }\n    }\n    return false;\n}\n\nprivate static boolean dfsCycle(int node, int parent, List<List<Integer>> graph, boolean[] visited) {\n    visited[node] = true;\n\n    for (int next : graph.get(node)) {\n        if (!visited[next]) {\n            if (dfsCycle(next, node, graph, visited)) return true;\n        } else if (next != parent) {\n            return true;  // 방문했는데 부모가 아니면 사이클\n        }\n    }\n    return false;\n}\n```\n\n### 경로 탐색\n```java\npublic static boolean hasPath(int start, int end, List<List<Integer>> graph) {\n    boolean[] visited = new boolean[graph.size()];\n    return dfsPath(start, end, graph, visited);\n}\n\nprivate static boolean dfsPath(int node, int end, List<List<Integer>> graph, boolean[] visited) {\n    if (node == end) return true;\n\n    visited[node] = true;\n\n    for (int next : graph.get(node)) {\n        if (!visited[next]) {\n            if (dfsPath(next, end, graph, visited)) return true;\n        }\n    }\n    return false;\n}\n```\n\n### 모든 경로 출력 (백트래킹)\n```java\npublic static void printAllPaths(int start, int end, List<List<Integer>> graph) {\n    boolean[] visited = new boolean[graph.size()];\n    List<Integer> path = new ArrayList<>();\n    dfsAllPaths(start, end, graph, visited, path);\n}\n\nprivate static void dfsAllPaths(int node, int end, List<List<Integer>> graph,\n                                boolean[] visited, List<Integer> path) {\n    visited[node] = true;\n    path.add(node);\n\n    if (node == end) {\n        System.out.println(path);\n    } else {\n        for (int next : graph.get(node)) {\n            if (!visited[next]) {\n                dfsAllPaths(next, end, graph, visited, path);\n            }\n        }\n    }\n\n    // 백트래킹\n    visited[node] = false;\n    path.remove(path.size() - 1);\n}\n```\n\n---\n\n## 핵심 정리\n\n1. **재귀**가 직관적이지만 스택오버플로우 주의\n2. **visited 배열**로 무한 루프 방지\n3. 백트래킹: visited를 다시 **false로 복원**\n4. 시간 복잡도: O(V + E)\n", "java_code": "", "java_file": ""}, {"id": "16_bfs", "title": "16. 너비 우선 탐색 (BFS)", "md_content": "# 16. 너비 우선 탐색 (BFS)\n\n> 관련 코드: `section6_graph/traversal/BFSBasic.java`\n\n---\n\n## 1. BFS란?\n\n그래프를 탐색하는 방법 중 하나로, 시작점에서 **가까운 정점부터** 차례대로 방문하는 방식입니다.\n\n### 특징\n- **큐(Queue)**로 구현\n- **최단 경로** 탐색에 유용 (가중치 없는 그래프)\n- 레벨 순회\n\n---\n\n## 2. 시간/공간 복잡도\n\n| 표현 방식 | 시간 복잡도 |\n|-----------|-------------|\n| 인접 리스트 | O(V + E) |\n| 인접 행렬 | O(V²) |\n\n공간: O(V) - visited 배열 + 큐\n\n---\n\n## 3. BFS 활용\n\n- **최단 경로** (가중치 없는 그래프)\n- 레벨 순회 (트리)\n- 연결 요소 찾기\n- 이분 그래프 판별\n- **미로 탐색** (최단 거리)\n\n---\n\n## 4. DFS vs BFS\n\n| 구분 | DFS | BFS |\n|------|-----|-----|\n| 탐색 방식 | 깊이 우선 | 너비 우선 |\n| 구현 | 스택/재귀 | 큐 |\n| 용도 | 경로 탐색, 백트래킹 | **최단 경로**, 레벨 순회 |\n| 메모리 | 효율적 (희소 그래프) | 더 많이 사용 |\n\n---\n\n## 5. 구현\n\n### 기본 BFS\n```java\npublic static void bfs(int start, List<List<Integer>> adj) {\n    boolean[] visited = new boolean[adj.size()];\n    Queue<Integer> queue = new LinkedList<>();\n\n    visited[start] = true;\n    queue.offer(start);\n\n    while (!queue.isEmpty()) {\n        int node = queue.poll();\n        System.out.print(node + \" \");\n\n        for (int next : adj.get(node)) {\n            if (!visited[next]) {\n                visited[next] = true;\n                queue.offer(next);\n            }\n        }\n    }\n}\n```\n\n### 최단 거리 계산\n```java\npublic static int[] shortestDistance(int start, List<List<Integer>> adj) {\n    int n = adj.size();\n    int[] dist = new int[n];\n    Arrays.fill(dist, -1);  // -1: 미방문\n\n    Queue<Integer> queue = new LinkedList<>();\n    dist[start] = 0;\n    queue.offer(start);\n\n    while (!queue.isEmpty()) {\n        int node = queue.poll();\n\n        for (int next : adj.get(node)) {\n            if (dist[next] == -1) {\n                dist[next] = dist[node] + 1;\n                queue.offer(next);\n            }\n        }\n    }\n    return dist;\n}\n```\n\n### 최단 경로 역추적\n```java\npublic static List<Integer> shortestPath(int start, int end, List<List<Integer>> adj) {\n    int n = adj.size();\n    int[] dist = new int[n];\n    int[] parent = new int[n];\n    Arrays.fill(dist, -1);\n    Arrays.fill(parent, -1);\n\n    Queue<Integer> queue = new LinkedList<>();\n    dist[start] = 0;\n    queue.offer(start);\n\n    while (!queue.isEmpty()) {\n        int node = queue.poll();\n        if (node == end) break;\n\n        for (int next : adj.get(node)) {\n            if (dist[next] == -1) {\n                dist[next] = dist[node] + 1;\n                parent[next] = node;\n                queue.offer(next);\n            }\n        }\n    }\n\n    // 경로 역추적\n    List<Integer> path = new ArrayList<>();\n    if (dist[end] == -1) return path;\n\n    for (int node = end; node != -1; node = parent[node]) {\n        path.add(node);\n    }\n    Collections.reverse(path);\n    return path;\n}\n```\n\n### 레벨 순회\n```java\npublic static void bfsLevel(int start, List<List<Integer>> adj) {\n    boolean[] visited = new boolean[adj.size()];\n    Queue<Integer> queue = new LinkedList<>();\n\n    visited[start] = true;\n    queue.offer(start);\n    int level = 0;\n\n    while (!queue.isEmpty()) {\n        int size = queue.size();  // 현재 레벨의 노드 수\n        System.out.print(\"Level \" + level + \": \");\n\n        for (int i = 0; i < size; i++) {\n            int node = queue.poll();\n            System.out.print(node + \" \");\n\n            for (int next : adj.get(node)) {\n                if (!visited[next]) {\n                    visited[next] = true;\n                    queue.offer(next);\n                }\n            }\n        }\n        System.out.println();\n        level++;\n    }\n}\n```\n\n### 2D 그리드 BFS (미로 탐색)\n```java\npublic static int shortestPathGrid(int[][] grid, int[] start, int[] end) {\n    int rows = grid.length, cols = grid[0].length;\n    int[] dr = {-1, 1, 0, 0};\n    int[] dc = {0, 0, -1, 1};\n\n    boolean[][] visited = new boolean[rows][cols];\n    Queue<int[]> queue = new LinkedList<>();\n\n    visited[start[0]][start[1]] = true;\n    queue.offer(new int[]{start[0], start[1], 0});  // {row, col, distance}\n\n    while (!queue.isEmpty()) {\n        int[] curr = queue.poll();\n        int r = curr[0], c = curr[1], dist = curr[2];\n\n        if (r == end[0] && c == end[1]) return dist;\n\n        for (int d = 0; d < 4; d++) {\n            int nr = r + dr[d], nc = c + dc[d];\n\n            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols\n                    && !visited[nr][nc] && grid[nr][nc] == 0) {\n                visited[nr][nc] = true;\n                queue.offer(new int[]{nr, nc, dist + 1});\n            }\n        }\n    }\n    return -1;\n}\n```\n\n---\n\n## 핵심 정리\n\n1. **최단 경로** 문제 → BFS\n2. **큐**로 구현, 방문 표시는 **큐에 넣을 때**\n3. 레벨 구분: `queue.size()`로 현재 레벨 노드 수 확인\n4. 그리드: 4방향 `{-1,0}, {1,0}, {0,-1}, {0,1}`\n", "java_code": "", "java_file": ""}, {"id": "17_dijkstra", "title": "17. 다익스트라 알고리즘 (Dijkstra)", "md_content": "# 17. 다익스트라 알고리즘 (Dijkstra)\n\n> 관련 코드: `section6_graph/shortest/DijkstraBasic.java`, `DijkstraProblems.java`\n\n---\n\n## 1. 다익스트라란?\n\n**하나의 시작점**에서 다른 모든 정점까지의 **최단 경로**를 구하는 알고리즘입니다.\n\n### 특징\n- **가중치가 있는 그래프**에서 최단 경로\n- **음수 가중치가 없어야** 함\n- 그리디 알고리즘의 일종\n\n---\n\n## 2. 동작 원리\n\n1. 시작점의 거리를 0으로, 나머지는 **무한대**로 초기화\n2. 방문하지 않은 정점 중 **거리가 가장 짧은 정점** 선택\n3. 선택한 정점을 통해 이웃 정점까지의 거리 **갱신**\n4. 모든 정점을 방문할 때까지 반복\n\n---\n\n## 3. 시간 복잡도\n\n| 구현 방식 | 시간 복잡도 |\n|-----------|-------------|\n| 배열 사용 | O(V²) |\n| **우선순위 큐** | O((V + E) log V) |\n\n---\n\n## 4. 비교\n\n| 알고리즘 | 용도 |\n|----------|------|\n| BFS | 가중치 **없는** 그래프의 최단 경로 |\n| **다익스트라** | **양수 가중치** 그래프의 최단 경로 |\n| 벨만-포드 | **음수 가중치** 허용, 음수 사이클 감지 |\n| 플로이드-워셜 | **모든 쌍** 최단 경로 |\n\n---\n\n## 5. 구현\n\n### 우선순위 큐 사용 (권장)\n```java\npublic static int[] dijkstra(int start, List<List<int[]>> adj) {\n    int n = adj.size();\n    int[] dist = new int[n];\n    Arrays.fill(dist, Integer.MAX_VALUE);\n\n    // 우선순위 큐: {거리, 정점}\n    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);\n\n    dist[start] = 0;\n    pq.offer(new int[]{0, start});\n\n    while (!pq.isEmpty()) {\n        int[] curr = pq.poll();\n        int d = curr[0];\n        int node = curr[1];\n\n        // 이미 처리된 정점이면 스킵\n        if (d > dist[node]) continue;\n\n        // 인접 정점들의 거리 갱신\n        for (int[] edge : adj.get(node)) {\n            int next = edge[0];\n            int weight = edge[1];\n\n            if (dist[node] + weight < dist[next]) {\n                dist[next] = dist[node] + weight;\n                pq.offer(new int[]{dist[next], next});\n            }\n        }\n    }\n\n    return dist;\n}\n```\n\n### 최단 경로 역추적\n```java\npublic static List<Integer> dijkstraPath(int start, int end, List<List<int[]>> adj) {\n    int n = adj.size();\n    int[] dist = new int[n];\n    int[] parent = new int[n];\n    Arrays.fill(dist, Integer.MAX_VALUE);\n    Arrays.fill(parent, -1);\n\n    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);\n    dist[start] = 0;\n    pq.offer(new int[]{0, start});\n\n    while (!pq.isEmpty()) {\n        int[] curr = pq.poll();\n        int d = curr[0];\n        int node = curr[1];\n\n        if (d > dist[node]) continue;\n\n        for (int[] edge : adj.get(node)) {\n            int next = edge[0];\n            int weight = edge[1];\n\n            if (dist[node] + weight < dist[next]) {\n                dist[next] = dist[node] + weight;\n                parent[next] = node;\n                pq.offer(new int[]{dist[next], next});\n            }\n        }\n    }\n\n    // 경로 역추적\n    List<Integer> path = new ArrayList<>();\n    if (dist[end] == Integer.MAX_VALUE) return path;\n\n    for (int node = end; node != -1; node = parent[node]) {\n        path.add(node);\n    }\n    Collections.reverse(path);\n    return path;\n}\n```\n\n---\n\n## 6. 응용 문제\n\n### 경유지를 거치는 최단 경로\n```java\n// 1 → v1 → v2 → N 또는 1 → v2 → v1 → N\npublic static long pathWithTwoPoints(int n, int v1, int v2, List<List<int[]>> adj) {\n    int[] distFrom1 = dijkstra(1, adj);\n    int[] distFromV1 = dijkstra(v1, adj);\n    int[] distFromV2 = dijkstra(v2, adj);\n\n    long path1 = (long) distFrom1[v1] + distFromV1[v2] + distFromV2[n];\n    long path2 = (long) distFrom1[v2] + distFromV2[v1] + distFromV1[n];\n\n    long result = Math.min(path1, path2);\n    return result >= Integer.MAX_VALUE ? -1 : result;\n}\n```\n\n### 그리드에서 다익스트라\n```java\npublic static int minCostGrid(int[][] grid) {\n    int n = grid.length, m = grid[0].length;\n    int[][] dist = new int[n][m];\n    for (int[] row : dist) Arrays.fill(row, Integer.MAX_VALUE);\n\n    int[] dr = {-1, 1, 0, 0};\n    int[] dc = {0, 0, -1, 1};\n\n    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);\n    dist[0][0] = grid[0][0];\n    pq.offer(new int[]{grid[0][0], 0, 0});\n\n    while (!pq.isEmpty()) {\n        int[] curr = pq.poll();\n        int d = curr[0], r = curr[1], c = curr[2];\n\n        if (d > dist[r][c]) continue;\n\n        for (int i = 0; i < 4; i++) {\n            int nr = r + dr[i], nc = c + dc[i];\n\n            if (nr >= 0 && nr < n && nc >= 0 && nc < m) {\n                int newDist = dist[r][c] + grid[nr][nc];\n                if (newDist < dist[nr][nc]) {\n                    dist[nr][nc] = newDist;\n                    pq.offer(new int[]{newDist, nr, nc});\n                }\n            }\n        }\n    }\n    return dist[n - 1][m - 1];\n}\n```\n\n---\n\n## 핵심 정리\n\n1. **양수 가중치**에서만 사용 가능\n2. **우선순위 큐**로 O((V+E) log V)\n3. `if (d > dist[node]) continue;`로 **중복 처리 방지**\n4. 음수 가중치 → **벨만-포드** 사용\n", "java_code": "", "java_file": ""}, {"id": "18_tree", "title": "18. 트리 순회 (Tree Traversal)", "md_content": "# 18. 트리 순회 (Tree Traversal)\n\n> 관련 코드: `section6_graph/tree/TreeTraversal.java`\n\n---\n\n## 1. 트리란?\n\n**사이클이 없는 연결 그래프**입니다.\n\n### 특징\n- N개의 노드, **N-1개의 간선**\n- **루트 노드**가 있음 (rooted tree)\n- 부모-자식 관계\n\n---\n\n## 2. 이진 트리 순회 방법\n\n| 순회 | 순서 | 용도 |\n|------|------|------|\n| **전위** (Preorder) | 루트 → 왼쪽 → 오른쪽 | 트리 복사, 전위 표기법 |\n| **중위** (Inorder) | 왼쪽 → 루트 → 오른쪽 | BST 정렬 순서 |\n| **후위** (Postorder) | 왼쪽 → 오른쪽 → 루트 | 트리 삭제, 후위 표기법 |\n| **레벨** (Level-order) | BFS | 최단 경로, 층별 처리 |\n\n---\n\n## 3. 순회 시각화\n\n```\n        1\n       / \\\n      2   3\n     / \\   \\\n    4   5   6\n```\n\n| 순회 | 결과 |\n|------|------|\n| 전위 | 1 2 4 5 3 6 |\n| 중위 | 4 2 5 1 3 6 |\n| 후위 | 4 5 2 6 3 1 |\n| 레벨 | 1 2 3 4 5 6 |\n\n---\n\n## 4. 구현\n\n### 이진 트리 노드\n```java\nclass TreeNode {\n    int val;\n    TreeNode left;\n    TreeNode right;\n\n    TreeNode(int val) {\n        this.val = val;\n    }\n}\n```\n\n### 전위 순회 (Preorder)\n```java\npublic static void preorder(TreeNode node) {\n    if (node == null) return;\n\n    System.out.print(node.val + \" \");  // 루트\n    preorder(node.left);                // 왼쪽\n    preorder(node.right);               // 오른쪽\n}\n```\n\n### 중위 순회 (Inorder)\n```java\npublic static void inorder(TreeNode node) {\n    if (node == null) return;\n\n    inorder(node.left);                 // 왼쪽\n    System.out.print(node.val + \" \");   // 루트\n    inorder(node.right);                // 오른쪽\n}\n```\n\n### 후위 순회 (Postorder)\n```java\npublic static void postorder(TreeNode node) {\n    if (node == null) return;\n\n    postorder(node.left);               // 왼쪽\n    postorder(node.right);              // 오른쪽\n    System.out.print(node.val + \" \");   // 루트\n}\n```\n\n### 레벨 순회 (Level-order)\n```java\npublic static void levelOrder(TreeNode root) {\n    if (root == null) return;\n\n    Queue<TreeNode> queue = new LinkedList<>();\n    queue.offer(root);\n\n    while (!queue.isEmpty()) {\n        TreeNode node = queue.poll();\n        System.out.print(node.val + \" \");\n\n        if (node.left != null) queue.offer(node.left);\n        if (node.right != null) queue.offer(node.right);\n    }\n}\n```\n\n### 레벨별 구분\n```java\npublic static List<List<Integer>> levelOrderList(TreeNode root) {\n    List<List<Integer>> result = new ArrayList<>();\n    if (root == null) return result;\n\n    Queue<TreeNode> queue = new LinkedList<>();\n    queue.offer(root);\n\n    while (!queue.isEmpty()) {\n        int size = queue.size();\n        List<Integer> level = new ArrayList<>();\n\n        for (int i = 0; i < size; i++) {\n            TreeNode node = queue.poll();\n            level.add(node.val);\n\n            if (node.left != null) queue.offer(node.left);\n            if (node.right != null) queue.offer(node.right);\n        }\n\n        result.add(level);\n    }\n    return result;\n}\n```\n\n---\n\n## 5. 반복문 구현 (스택)\n\n### 전위 순회\n```java\npublic static void preorderIterative(TreeNode root) {\n    if (root == null) return;\n\n    Stack<TreeNode> stack = new Stack<>();\n    stack.push(root);\n\n    while (!stack.isEmpty()) {\n        TreeNode node = stack.pop();\n        System.out.print(node.val + \" \");\n\n        // 오른쪽을 먼저 넣어야 왼쪽이 먼저 나옴\n        if (node.right != null) stack.push(node.right);\n        if (node.left != null) stack.push(node.left);\n    }\n}\n```\n\n### 중위 순회\n```java\npublic static void inorderIterative(TreeNode root) {\n    Stack<TreeNode> stack = new Stack<>();\n    TreeNode curr = root;\n\n    while (curr != null || !stack.isEmpty()) {\n        // 왼쪽 끝까지 이동\n        while (curr != null) {\n            stack.push(curr);\n            curr = curr.left;\n        }\n\n        curr = stack.pop();\n        System.out.print(curr.val + \" \");\n\n        curr = curr.right;\n    }\n}\n```\n\n---\n\n## 6. 트리 정보\n\n### 트리의 높이\n```java\npublic static int height(TreeNode node) {\n    if (node == null) return 0;\n    return 1 + Math.max(height(node.left), height(node.right));\n}\n```\n\n### 노드 개수\n```java\npublic static int countNodes(TreeNode node) {\n    if (node == null) return 0;\n    return 1 + countNodes(node.left) + countNodes(node.right);\n}\n```\n\n---\n\n## 7. N-ary 트리 순회\n\n코딩 테스트에서 자주 등장하는 형태\n\n```java\npublic static void traverseNaryTree(int node, List<List<Integer>> adj, boolean[] visited) {\n    visited[node] = true;\n    System.out.print(node + \" \");\n\n    for (int child : adj.get(node)) {\n        if (!visited[child]) {\n            traverseNaryTree(child, adj, visited);\n        }\n    }\n}\n```\n\n---\n\n## 핵심 정리\n\n1. **전위**: 루트 먼저 (복사, 직렬화)\n2. **중위**: BST에서 정렬 순서\n3. **후위**: 자식 먼저 (삭제, 계산)\n4. **레벨**: BFS로 층별 처리\n", "java_code": "", "java_file": ""}];

        function init() {
            applyTheme(state.theme);
            buildTopicList();
            initTabs();
            initEditor();
            initEventHandlers();
            if (TOPICS.length > 0) loadTopic(TOPICS[0].id);
        }

        function buildTopicList() {
            const container = document.getElementById('topic-list');
            container.innerHTML = '';
            TOPICS.forEach(topic => {
                const item = document.createElement('div');
                item.className = 'topic-item' + (state.currentTopic === topic.id ? ' active' : '');
                item.textContent = topic.title;
                item.onclick = () => loadTopic(topic.id);
                container.appendChild(item);
            });
        }

        function loadTopic(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            state.currentTopic = topicId;
            state.originalCode = topic.java_code;
            buildTopicList();
            document.getElementById('current-topic-title').textContent = topic.title;
            const mdContent = document.getElementById('md-content');
            mdContent.innerHTML = marked.parse(topic.md_content);
            mdContent.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            buildTOC();
            document.getElementById('editor-title').textContent = topic.java_file || 'Example.java';
            if (state.editor) state.editor.setValue(topic.java_code || '// Java 코드');
            document.getElementById('sidebar').classList.remove('open');
        }

        function buildTOC() {
            const mdContent = document.getElementById('md-content');
            const headings = mdContent.querySelectorAll('h2');
            if (headings.length === 0) return;

            // 기존 TOC 제거
            const oldToc = mdContent.querySelector('.inline-toc');
            if (oldToc) oldToc.remove();

            // 인라인 TOC 생성
            const toc = document.createElement('div');
            toc.className = 'inline-toc';
            toc.style.cssText = 'background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 24px;';

            const tocTitle = document.createElement('div');
            tocTitle.style.cssText = 'font-weight: 600; margin-bottom: 12px; font-size: 14px;';
            tocTitle.textContent = '📑 목차';
            toc.appendChild(tocTitle);

            const tocList = document.createElement('div');
            tocList.style.cssText = 'display: flex; flex-wrap: wrap; gap: 8px 16px;';

            headings.forEach((heading, idx) => {
                const id = 'section-' + idx;
                heading.id = id;
                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = heading.textContent;
                a.style.cssText = 'color: var(--accent-color); text-decoration: none; font-size: 13px;';
                a.onclick = (e) => {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                };
                tocList.appendChild(a);
            });

            toc.appendChild(tocList);

            // h1 다음에 삽입
            const h1 = mdContent.querySelector('h1');
            if (h1 && h1.nextSibling) {
                h1.parentNode.insertBefore(toc, h1.nextSibling);
            } else {
                mdContent.insertBefore(toc, mdContent.firstChild);
            }
        }

        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.onclick = () => {
                    state.currentTab = tab.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab.dataset.tab));
                    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === tab.dataset.tab + '-panel'));
                    if (tab.dataset.tab === 'practice' && state.editor) state.editor.refresh();
                };
            });
        }

        function initEditor() {
            state.editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                mode: 'text/x-java', theme: state.theme === 'dark' ? 'dracula' : 'default',
                lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, lineWrapping: true, matchBrackets: true, readOnly: false
            });
        }

        function initEventHandlers() {
            document.getElementById('theme-toggle').onclick = () => applyTheme(state.theme === 'light' ? 'dark' : 'light');
            document.getElementById('copy-btn').onclick = () => {
                navigator.clipboard.writeText(state.editor.getValue()).then(() => {
                    const btn = document.getElementById('copy-btn');
                    btn.textContent = '복사됨!';
                    setTimeout(() => btn.textContent = '복사', 1500);
                });
            };
            document.getElementById('reset-btn').onclick = () => state.editor.setValue(state.originalCode);
            document.getElementById('menu-btn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
        }

        function applyTheme(theme) {
            state.theme = theme;
            localStorage.setItem('algo-theme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-toggle').textContent = theme === 'dark' ? 'Light' : 'Dark';
            document.getElementById('hljs-light').disabled = (theme === 'dark');
            document.getElementById('hljs-dark').disabled = (theme === 'light');
            if (state.editor) state.editor.setOption('theme', theme === 'dark' ? 'dracula' : 'default');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
