에서 데이터 저장\n@Bean\npublic Step saveContextStep(JobRepository jobRepository,\n                            PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"saveContextStep\", jobRepository)\n            .tasklet((contribution, chunkContext) -> {\n                ExecutionContext stepContext =\n                        chunkContext.getStepContext().getStepExecution().getExecutionContext();\n                stepContext.putInt(\"processedCount\", 500);\n\n                ExecutionContext jobContext =\n                        chunkContext.getStepContext().getStepExecution()\n                                .getJobExecution().getExecutionContext();\n                jobContext.putString(\"status\", \"PROCESSING\");\n\n                return RepeatStatus.FINISHED;\n            }, transactionManager)\n            .build();\n}\n\n// 다른 Step에서 데이터 읽기\n@Bean\n@StepScope\npublic Tasklet readContextTasklet(\n        @Value(\"#{jobExecutionContext['status']}\") String status) {\n    return (contribution, chunkContext) -> {\n        log.info(\"Job 상태: {}\", status);\n        return RepeatStatus.FINISHED;\n    };\n}\n```\n\n---\n\n## Job 실행하기\n\n### CommandLineJobRunner\n\n```bash\njava -jar my-batch.jar \\\n  --spring.batch.job.name=sampleJob \\\n  inputFile=/data/input.csv \\\n  date=2024-01-15\n```\n\n### JobLauncher를 통한 프로그래밍 방식\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class BatchJobService {\n\n    private final JobLauncher jobLauncher;\n    private final Job sampleJob;\n\n    public void runJob(String inputFile) throws Exception {\n        JobParameters params = new JobParametersBuilder()\n                .addString(\"inputFile\", inputFile)\n                .addLocalDateTime(\"runTime\", LocalDateTime.now())\n                .toJobParameters();\n\n        JobExecution execution = jobLauncher.run(sampleJob, params);\n\n        log.info(\"Job 실행 결과: {}\", execution.getStatus());\n    }\n}\n```\n\n### 스케줄러 연동\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class BatchScheduler {\n\n    private final JobLauncher jobLauncher;\n    private final Job dailyJob;\n\n    @Scheduled(cron = \"0 0 2 * * *\")  // 매일 새벽 2시\n    public void runDailyBatch() {\n        try {\n            JobParameters params = new JobParametersBuilder()\n                    .addLocalDateTime(\"scheduledTime\", LocalDateTime.now())\n                    .toJobParameters();\n            jobLauncher.run(dailyJob, params);\n        } catch (Exception e) {\n            log.error(\"스케줄된 배치 실패\", e);\n        }\n    }\n}\n```\n\n---\n\n## 다음 문서\n\n- [Spring Batch Chunk 처리](./spring-batch-chunk.md) - ItemReader, ItemProcessor, ItemWriter 상세\n- [Spring Batch ExecutionContext 가이드](./spring-batch-execution-context.md) - 상태 저장과 재시작\n- [Spring Batch 고급 활용](./spring-batch-advanced.md) - 비동기, 파티셔닝, 원격 실행\n- [Spring Batch 실무 베스트 프랙티스](./spring-batch-best-practices.md) - 정기 결제, 정산 사례\n\n*마지막 업데이트: 2024년 12월*\n", "size": 14216, "lines": 451}, {"filename": "spring-batch-best-practices.md", "title": "Spring Batch 실무 베스트 프랙티스 - 정기 결제 & 정산 사례", "path": "spring/spring-batch-best-practices.md", "content": "# Spring Batch 실무 베스트 프랙티스 - 정기 결제 & 정산 사례\n\n실무에서 자주 사용되는 정기 결제와 정산 배치를 예시로 베스트 프랙티스를 정리한다.\n\n## 목차\n\n- [정기 결제 배치 설계](#정기-결제-배치-설계)\n- [정산 배치 설계](#정산-배치-설계)\n- [공통 베스트 프랙티스](#공통-베스트-프랙티스)\n- [장애 대응 패턴](#장애-대응-패턴)\n- [운영 체크리스트](#운영-체크리스트)\n\n---\n\n## 정기 결제 배치 설계\n\n### 전체 아키텍처\n\n```\n┌─────────────────────────────────────────────────────────────────────┐\n│                    정기 결제 배치 Job                                │\n│                                                                      │\n│  ┌────────────┐   ┌────────────┐   ┌────────────┐   ┌────────────┐ │\n│  │ 대상 조회   │──▶│ 결제 시도   │──▶│ 결과 처리   │──▶│ 알림 발송   │ │\n│  │   Step     │   │   Step     │   │   Step     │   │   Step     │ │\n│  └────────────┘   └────────────┘   └────────────┘   └────────────┘ │\n│        │               │                │                │         │\n│        ▼               ▼                ▼                ▼         │\n│   subscription    payment_log      subscription      notification  │\n│      table           table            table             queue      │\n└─────────────────────────────────────────────────────────────────────┘\n```\n\n### 도메인 모델\n\n```java\n@Entity\n@Table(name = \"subscriptions\")\npublic class Subscription {\n    @Id\n    private Long id;\n    private Long userId;\n    private Long planId;\n    private BigDecimal amount;\n    private LocalDate nextBillingDate;\n    private int failedAttempts;\n\n    @Enumerated(EnumType.STRING)\n    private SubscriptionStatus status;  // ACTIVE, SUSPENDED, CANCELLED\n\n    private LocalDateTime lastPaymentAt;\n    private String paymentMethodId;\n}\n\n@Entity\n@Table(name = \"payment_logs\")\npublic class PaymentLog {\n    @Id\n    private Long id;\n    private Long subscriptionId;\n    private Long userId;\n    private BigDecimal amount;\n    private String transactionId;\n\n    @Enumerated(EnumType.STRING)\n    private PaymentStatus status;  // SUCCESS, FAILED, PENDING\n\n    private String failureReason;\n    private LocalDateTime processedAt;\n    private String idempotencyKey;  // 멱등성 보장용\n}\n```\n\n### Step 1: 결제 대상 조회\n\n```java\n@Configuration\n@RequiredArgsConstructor\npublic class BillingTargetStepConfig {\n\n    private final DataSource dataSource;\n\n    /**\n     * Best Practice: 결제 대상 조회 시 조건을 명확히\n     * - 오늘 결제 예정인 구독\n     * - ACTIVE 상태\n     * - 실패 횟수 3회 미만 (3회 이상은 별도 처리)\n     */\n    @Bean\n    @StepScope\n    public JdbcPagingItemReader<Subscription> billingTargetReader(\n            @Value(\"#{jobParameters['billingDate']}\") String billingDate) {\n\n        Map<String, Order> sortKeys = new LinkedHashMap<>();\n        sortKeys.put(\"id\", Order.ASCENDING);\n\n        return new JdbcPagingItemReaderBuilder<Subscription>()\n                .name(\"billingTargetReader\")\n                .dataSource(dataSource)\n                .selectClause(\"\"\"\n                    SELECT id, user_id, plan_id, amount, next_billing_date,\n                           failed_attempts, status, payment_method_id\n                    \"\"\")\n                .fromClause(\"FROM subscriptions\")\n                .whereClause(\"\"\"\n                    WHERE next_billing_date = :billingDate\n                      AND status = 'ACTIVE'\n                      AND failed_attempts < 3\n                    \"\"\")\n                .parameterValues(Map.of(\"billingDate\", billingDate))\n                .sortKeys(sortKeys)\n                .pageSize(100)\n                .rowMapper(new BeanPropertyRowMapper<>(Subscription.class))\n                .build();\n    }\n}\n```\n\n### Step 2: 결제 처리 (핵심)\n\n```java\n@Configuration\n@RequiredArgsConstructor\npublic class PaymentProcessStepConfig {\n\n    /**\n     * Best Practice: 결제 처리 Chunk 설계\n     * - Chunk Size는 작게 (10~50): 결제 실패 시 롤백 범위 최소화\n     * - 멱등성 보장: idempotencyKey 사용\n     * - 타임아웃 설정: 외부 PG 연동 시 필수\n     */\n    @Bean\n    public Step paymentProcessStep(JobRepository jobRepository,\n                                   PlatformTransactionManager transactionManager) {\n        return new StepBuilder(\"paymentProcessStep\", jobRepository)\n                .<Subscription, PaymentResult>chunk(10, transactionManager)  // 작은 chunk\n                .reader(billingTargetReader(null))\n                .processor(paymentProcessor())\n                .writer(paymentResultWriter())\n                .faultTolerant()\n                .retry(PgConnectionException.class)      // PG 연결 오류는 재시도\n                .retry(PgTimeoutException.class)\n                .retryLimit(3)\n                .backOffPolicy(exponentialBackOff())     // 지수 백오프\n                .skip(PaymentDeclinedException.class)    // 카드 거절은 스킵\n                .skip(InvalidPaymentMethodException.class)\n                .skipLimit(Integer.MAX_VALUE)            // 스킵은 무제한 (로그로 추적)\n                .listener(paymentSkipListener())\n                .listener(paymentRetryListener())\n                .build();\n    }\n\n    @Bean\n    public BackOffPolicy exponentialBackOff() {\n        ExponentialBackOffPolicy policy = new ExponentialBackOffPolicy();\n        policy.setInitialInterval(1000);   // 1초\n        policy.setMultiplier(2.0);         // 2배씩 증가\n        policy.setMaxInterval(10000);      // 최대 10초\n        return policy;\n    }\n}\n```\n\n### 결제 Processor - 멱등성 보장\n\n```java\n@Component\n@RequiredArgsConstructor\n@Slf4j\npublic class PaymentProcessor implements ItemProcessor<Subscription, PaymentResult> {\n\n    private final PaymentGateway paymentGateway;\n    private final PaymentLogRepository paymentLogRepository;\n\n    /**\n     * Best Practice: 멱등성 보장\n     * - 동일한 구독 + 결제일 조합으로 idempotencyKey 생성\n     * - 이미 처리된 결제는 스킵\n     * - PG사에도 idempotencyKey 전달\n     */\n    @Override\n    public PaymentResult process(Subscription subscription) throws Exception {\n        String idempotencyKey = generateIdempotencyKey(subscription);\n\n        // 이미 처리된 결제인지 확인\n        Optional<PaymentLog> existingLog = paymentLogRepository\n                .findByIdempotencyKey(idempotencyKey);\n\n        if (existingLog.isPresent()) {\n            log.info(\"이미 처리된 결제 - subscriptionId: {}, key: {}\",\n                    subscription.getId(), idempotencyKey);\n            return PaymentResult.alreadyProcessed(existingLog.get());\n        }\n\n        try {\n            // PG 결제 요청 (타임아웃 설정 필수)\n            PgResponse response = paymentGateway.charge(\n                    PaymentRequest.builder()\n                            .amount(subscription.getAmount())\n                            .paymentMethodId(subscription.getPaymentMethodId())\n                            .idempotencyKey(idempotencyKey)\n                            .metadata(Map.of(\n                                    \"subscriptionId\", subscription.getId(),\n                                    \"userId\", subscription.getUserId()\n                            ))\n                            .build()\n            );\n\n            return PaymentResult.success(subscription, response.getTransactionId());\n\n        } catch (PaymentDeclinedException e) {\n            // 카드 거절: 재시도해도 의미 없음\n            log.warn(\"결제 거절 - subscriptionId: {}, reason: {}\",\n                    subscription.getId(), e.getDeclineCode());\n            return PaymentResult.failed(subscription, e.getDeclineCode());\n\n        } catch (PgException e) {\n            // PG 오류: 상위에서 재시도 처리\n            log.error(\"PG 오류 - subscriptionId: {}\", subscription.getId(), e);\n            throw e;\n        }\n    }\n\n    private String generateIdempotencyKey(Subscription subscription) {\n        return String.format(\"billing_%d_%s\",\n                subscription.getId(),\n                subscription.getNextBillingDate());\n    }\n}\n```\n\n### 결제 결과 Writer - 트랜잭션 분리\n\n```java\n@Component\n@RequiredArgsConstructor\n@Slf4j\npublic class PaymentResultWriter implements ItemWriter<PaymentResult> {\n\n    private final PaymentLogRepository paymentLogRepository;\n    private final SubscriptionRepository subscriptionRepository;\n    private final EventPublisher eventPublisher;\n\n    /**\n     * Best Practice: 결과 처리 분리\n     * - 결제 로그 저장 (항상)\n     * - 구독 상태 업데이트 (성공/실패에 따라)\n     * - 이벤트 발행 (후속 처리용)\n     */\n    @Override\n    public void write(Chunk<? extends PaymentResult> results) throws Exception {\n        List<PaymentLog> logs = new ArrayList<>();\n        List<Subscription> subscriptionsToUpdate = new ArrayList<>();\n\n        for (PaymentResult result : results) {\n            if (result.isAlreadyProcessed()) {\n                continue;  // 이미 처리된 건은 스킵\n            }\n\n            // 1. 결제 로그 생성\n            PaymentLog log = PaymentLog.builder()\n                    .subscriptionId(result.getSubscriptionId())\n                    .userId(result.getUserId())\n                    .amount(result.getAmount())\n                    .transactionId(result.getTransactionId())\n                    .status(result.isSuccess() ? PaymentStatus.SUCCESS : PaymentStatus.FAILED)\n                    .failureReason(result.getFailureReason())\n                    .idempotencyKey(result.getIdempotencyKey())\n                    .processedAt(LocalDateTime.now())\n                    .build();\n            logs.add(log);\n\n            // 2. 구독 상태 업데이트\n            Subscription subscription = result.getSubscription();\n            if (result.isSuccess()) {\n                subscription.paymentSucceeded();  // 다음 결제일 설정, 실패 횟수 초기화\n            } else {\n                subscription.paymentFailed();     // 실패 횟수 증가\n            }\n            subscriptionsToUpdate.add(subscription);\n        }\n\n        // 벌크 저장\n        paymentLogRepository.saveAll(logs);\n        subscriptionRepository.saveAll(subscriptionsToUpdate);\n\n        // 3. 이벤트 발행 (비동기 후속 처리)\n        for (PaymentResult result : results) {\n            if (result.isSuccess()) {\n                eventPublisher.publish(new PaymentSucceededEvent(result));\n            } else {\n                eventPublisher.publish(new PaymentFailedEvent(result));\n            }\n        }\n    }\n}\n```\n\n### Step 3: 실패 처리 (별도 Step)\n\n```java\n@Configuration\n@RequiredArgsConstructor\npublic class FailureHandlingStepConfig {\n\n    /**\n     * Best Practice: 실패 케이스 별도 처리\n     * - 1-2회 실패: 다음 날 재시도\n     * - 3회 실패: 구독 일시정지 + 사용자 알림\n     * - 결제 수단 만료: 업데이트 요청 알림\n     */\n    @Bean\n    public Step failureHandlingStep(JobRepository jobRepository,\n                                    PlatformTransactionManager transactionManager) {\n        return new StepBuilder(\"failureHandlingStep\", jobRepository)\n                .<PaymentLog, FailureAction>chunk(100, transactionManager)\n                .reader(failedPaymentReader(null))\n                .processor(failureActionProcessor())\n                .writer(failureActionWriter())\n                .build();\n    }\n\n    @Bean\n    @StepScope\n    public JdbcPagingItemReader<PaymentLog> failedPaymentReader(\n            @Value(\"#{jobParameters['billingDate']}\") String billingDate) {\n\n        return new JdbcPagingItemReaderBuilder<PaymentLog>()\n                .name(\"failedPaymentReader\")\n                .dataSource(dataSource)\n                .selectClause(\"SELECT pl.*, s.failed_attempts, s.user_id\")\n                .fromClause(\"\"\"\n                    FROM payment_logs pl\n                    JOIN subscriptions s ON pl.subscription_id = s.id\n                    \"\"\")\n                .whereClause(\"\"\"\n                    WHERE DATE(pl.processed_at) = :billingDate\n                      AND pl.status = 'FAILED'\n                    \"\"\")\n                .parameterValues(Map.of(\"billingDate\", billingDate))\n                .sortKeys(Map.of(\"pl.id\", Order.ASCENDING))\n                .pageSize(100)\n                .rowMapper(new FailedPaymentRowMapper())\n                .build();\n    }\n\n    @Bean\n    public ItemProcessor<PaymentLog, FailureAction> failureActionProcessor() {\n        return log -> {\n            int failedAttempts = log.getFailedAttempts();\n\n            if (failedAttempts >= 3) {\n                return FailureAction.suspendSubscription(log);\n            } else if (\"card_expired\".equals(log.getFailureReason())) {\n                return FailureAction.requestCardUpdate(log);\n            } else {\n                return FailureAction.scheduleRetry(log, LocalDate.now().plusDays(1));\n            }\n        };\n    }\n}\n```\n\n---\n\n## 정산 배치 설계\n\n### 전체 아키텍처\n\n```\n┌─────────────────────────────────────────────────────────────────────────┐\n│                         정산 배치 Job                                    │\n│                                                                          │\n│  ┌──────────────┐                                                       │\n│  │ 검증 Step    │  거래 내역 무결성 검증                                  │\n│  └──────┬───────┘                                                       │\n│         │                                                                │\n│         ▼                                                                │\n│  ┌──────────────┐                                                       │\n│  │ 집계 Step    │  판매자별 거래 집계 (파티셔닝)                          │\n│  │ (Partitioned)│                                                       │\n│  └──────┬───────┘                                                       │\n│         │                                                                │\n│         ▼                                                                │\n│  ┌──────────────┐                                                       │\n│  │ 정산금 계산   │  수수료 차감, 세금 계산                                │\n│  └──────┬───────┘                                                       │\n│         │                                                                │\n│         ▼                                                                │\n│  ┌──────────────┐   ┌──────────────┐                                   │\n│  │ 정산서 생성   │──▶│ 출금 요청    │  (별도 Job 또는 수동 승인 후)       │\n│  └──────────────┘   └──────────────┘                                   │\n└─────────────────────────────────────────────────────────────────────────┘\n```\n\n### 도메인 모델\n\n```java\n@Entity\n@Table(name = \"settlements\")\npublic class Settlement {\n    @Id\n    private Long id;\n    private Long sellerId;\n    private LocalDate settlementDate;     // 정산 기준일\n    private LocalDate periodStart;        // 정산 기간 시작\n    private LocalDate periodEnd;          // 정산 기간 종료\n\n    private BigDecimal totalSales;        // 총 매출\n    private BigDecimal platformFee;       // 플랫폼 수수료\n    private BigDecimal pgFee;             // PG 수수료\n    private BigDecimal tax;               // 세금\n    private BigDecimal netAmount;         // 정산 금액\n\n    private int transactionCount;         // 거래 건수\n\n    @Enumerated(EnumType.STRING)\n    private SettlementStatus status;      // PENDING, CONFIRMED, PAID\n\n    private String checksum;              // 무결성 검증용\n}\n\n@Entity\n@Table(name = \"transactions\")\npublic class Transaction {\n    @Id\n    private Long id;\n    private Long orderId;\n    private Long sellerId;\n    private Long buyerId;\n    private BigDecimal amount;\n    private BigDecimal platformFee;\n    private BigDecimal pgFee;\n\n    @Enumerated(EnumType.STRING)\n    private TransactionStatus status;     // COMPLETED, REFUNDED, CANCELLED\n\n    private LocalDateTime completedAt;\n    private boolean settled;              // 정산 완료 여부\n    private Long settlementId;\n}\n```\n\n### Step 1: 거래 내역 검증\n\n```java\n@Configuration\n@RequiredArgsConstructor\npublic class ValidationStepConfig {\n\n    /**\n     * Best Practice: 정산 전 데이터 무결성 검증\n     * - 거래 금액 합계 vs 결제 금액 합계 일치 확인\n     * - 중복 거래 체크\n     * - 누락 거래 체크\n     */\n    @Bean\n    public Step validationStep(JobRepository jobRepository,\n                               PlatformTransactionManager transactionManager) {\n        return new StepBuilder(\"validationStep\", jobRepository)\n                .tasklet(validationTasklet(null, null), transactionManager)\n                .listener(new StepExecutionListener() {\n                    @Override\n                    public ExitStatus afterStep(StepExecution stepExecution) {\n                        // 검증 실패 시 Job 중단\n                        Boolean isValid = (Boolean) stepExecution\n                                .getExecutionContext().get(\"validationPassed\");\n                        if (!Boolean.TRUE.equals(isValid)) {\n                            return new ExitStatus(\"VALIDATION_FAILED\");\n                        }\n                        return ExitStatus.COMPLETED;\n                    }\n                })\n                .build();\n    }\n\n    @Bean\n    @StepScope\n    public Tasklet validationTasklet(\n            @Value(\"#{jobParameters['periodStart']}\") String periodStart,\n            @Value(\"#{jobParameters['periodEnd']}\") String periodEnd) {\n\n        return (contribution, chunkContext) -> {\n            ExecutionContext context = chunkContext.getStepContext()\n                    .getStepExecution().getExecutionContext();\n\n            // 1. 거래 금액 합계 조회\n            BigDecimal transactionSum = jdbcTemplate.queryForObject(\n                    \"\"\"\n                    SELECT COALESCE(SUM(amount), 0)\n                    FROM transactions\n                    WHERE status = 'COMPLETED'\n                      AND completed_at BETWEEN ? AND ?\n                      AND settled = false\n                    \"\"\",\n                    BigDecimal.class, periodStart, periodEnd);\n\n            // 2. 결제 금액 합계 조회\n            BigDecimal paymentSum = jdbcTemplate.queryForObject(\n                    \"\"\"\n                    SELECT COALESCE(SUM(amount), 0)\n                    FROM payments\n                    WHERE status = 'SUCCESS'\n                      AND paid_at BETWEEN ? AND ?\n                    \"\"\",\n                    BigDecimal.class, periodStart, periodEnd);\n\n            // 3. 차이 검증 (오차 허용: 0.01%)\n            BigDecimal diff = transactionSum.subtract(paymentSum).abs();\n            BigDecimal tolerance = transactionSum.multiply(new BigDecimal(\"0.0001\"));\n\n            boolean isValid = diff.compareTo(tolerance) <= 0;\n            context.put(\"validationPassed\", isValid);\n            context.put(\"transactionSum\", transactionSum);\n            context.put(\"paymentSum\", paymentSum);\n\n            if (!isValid) {\n                log.error(\"정산 검증 실패 - 거래합계: {}, 결제합계: {}, 차이: {}\",\n                        transactionSum, paymentSum, diff);\n                // 알림 발송\n                alertService.sendValidationFailure(transactionSum, paymentSum, diff);\n            }\n\n            return RepeatStatus.FINISHED;\n        };\n    }\n}\n```\n\n### Step 2: 판매자별 집계 (파티셔닝)\n\n```java\n@Configuration\n@RequiredArgsConstructor\npublic class AggregationStepConfig {\n\n    /**\n     * Best Practice: 대용량 집계는 파티셔닝으로\n     * - 판매자 ID 기준 파티셔닝\n     * - 각 파티션 독립적으로 처리\n     * - 장애 시 해당 파티션만 재처리\n     */\n    @Bean\n    public Step aggregationManagerStep(JobRepository jobRepository) {\n        return new StepBuilder(\"aggregationManagerStep\", jobRepository)\n                .partitioner(\"aggregationWorkerStep\", sellerPartitioner(null, null))\n                .step(aggregationWorkerStep(null, null))\n                .gridSize(10)  // 10개 파티션\n                .taskExecutor(aggregationTaskExecutor())\n                .build();\n    }\n\n    @Bean\n    @StepScope\n    public Partitioner sellerPartitioner(\n            @Value(\"#{jobParameters['periodStart']}\") String periodStart,\n            @Value(\"#{jobParameters['periodEnd']}\") String periodEnd) {\n\n        return gridSize -> {\n            // 정산 대상 판매자 목록 조회\n            List<Long> sellerIds = jdbcTemplate.queryForList(\n                    \"\"\"\n                    SELECT DISTINCT seller_id\n                    FROM transactions\n                    WHERE status = 'COMPLETED'\n                      AND completed_at BETWEEN ? AND ?\n                      AND settled = false\n                    ORDER BY seller_id\n                    \"\"\",\n                    Long.class, periodStart, periodEnd);\n\n            // 판매자를 gridSize 개의 파티션으로 분배\n            Map<String, ExecutionContext> partitions = new HashMap<>();\n            int partitionSize = (sellerIds.size() / gridSize) + 1;\n\n            for (int i = 0; i < gridSize; i++) {\n                int start = i * partitionSize;\n                int end = Math.min(start + partitionSize, sellerIds.size());\n\n                if (start >= sellerIds.size()) break;\n\n                List<Long> partitionSellerIds = sellerIds.subList(start, end);\n\n                ExecutionContext context = new ExecutionContext();\n                context.put(\"sellerIds\", partitionSellerIds);\n                context.putString(\"partitionName\", \"partition\" + i);\n\n                partitions.put(\"partition\" + i, context);\n            }\n\n            return partitions;\n        };\n    }\n\n    @Bean\n    public Step aggregationWorkerStep(JobRepository jobRepository,\n                                      PlatformTransactionManager transactionManager) {\n        return new StepBuilder(\"aggregationWorkerStep\", jobRepository)\n                .<Long, SellerAggregation>chunk(10, transactionManager)\n                .reader(sellerIdReader(null))\n                .processor(aggregationProcessor(null, null))\n                .writer(aggregationWriter())\n                .build();\n    }\n\n    @Bean\n    @StepScope\n    public ListItemReader<Long> sellerIdReader(\n            @Value(\"#{stepExecutionContext['sellerIds']}\") List<Long> sellerIds) {\n        return new ListItemReader<>(sellerIds);\n    }\n}\n```\n\n### 집계 Processor\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class AggregationProcessor implements ItemProcessor<Long, SellerAggregation> {\n\n    private final JdbcTemplate jdbcTemplate;\n\n    /**\n     * Best Practice: 정확한 금액 계산\n     * - BigDecimal 사용 (부동소수점 오차 방지)\n     * - 반올림 정책 명시\n     * - 수수료율 중앙 관리\n     */\n    @Override\n    public SellerAggregation process(Long sellerId) throws Exception {\n        // 판매자별 거래 집계\n        Map<String, Object> result = jdbcTemplate.queryForMap(\n                \"\"\"\n                SELECT\n                    COUNT(*) as transaction_count,\n                    COALESCE(SUM(amount), 0) as total_sales,\n                    COALESCE(SUM(platform_fee), 0) as total_platform_fee,\n                    COALESCE(SUM(pg_fee), 0) as total_pg_fee\n                FROM transactions\n                WHERE seller_id = ?\n                  AND status = 'COMPLETED'\n                  AND completed_at BETWEEN ? AND ?\n                  AND settled = false\n                \"\"\",\n                sellerId, periodStart, periodEnd);\n\n        BigDecimal totalSales = (BigDecimal) result.get(\"total_sales\");\n        BigDecimal platformFee = (BigDecimal) result.get(\"total_platform_fee\");\n        BigDecimal pgFee = (BigDecimal) result.get(\"total_pg_fee\");\n        int transactionCount = ((Number) result.get(\"transaction_count\")).intValue();\n\n        // 세금 계산 (원천징수 3.3%)\n        BigDecimal taxRate = new BigDecimal(\"0.033\");\n        BigDecimal taxableAmount = totalSales.subtract(platformFee).subtract(pgFee);\n        BigDecimal tax = taxableAmount.multiply(taxRate)\n                .setScale(0, RoundingMode.DOWN);  // 원 단위 절사\n\n        // 정산 금액\n        BigDecimal netAmount = taxableAmount.subtract(tax);\n\n        // 체크섬 생성 (무결성 검증용)\n        String checksum = generateChecksum(sellerId, totalSales, netAmount);\n\n        return SellerAggregation.builder()\n                .sellerId(sellerId)\n                .totalSales(totalSales)\n                .platformFee(platformFee)\n                .pgFee(pgFee)\n                .tax(tax)\n                .netAmount(netAmount)\n                .transactionCount(transactionCount)\n                .checksum(checksum)\n                .build();\n    }\n\n    private String generateChecksum(Long sellerId, BigDecimal totalSales,\n                                     BigDecimal netAmount) {\n        String data = String.format(\"%d:%s:%s:%s\",\n                sellerId, totalSales, netAmount, periodStart);\n        return DigestUtils.sha256Hex(data);\n    }\n}\n```\n\n### Step 3: 정산서 생성\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class SettlementWriter implements ItemWriter<SellerAggregation> {\n\n    private final SettlementRepository settlementRepository;\n    private final TransactionRepository transactionRepository;\n\n    /**\n     * Best Practice: 정산 데이터 원자성 보장\n     * - 정산서 생성 + 거래 내역 정산 완료 처리를 하나의 트랜잭션으로\n     * - 정산 ID로 거래 내역 역추적 가능하도록\n     */\n    @Override\n    @Transactional\n    public void write(Chunk<? extends SellerAggregation> aggregations) throws Exception {\n        for (SellerAggregation agg : aggregations) {\n            // 1. 정산서 생성\n            Settlement settlement = Settlement.builder()\n                    .sellerId(agg.getSellerId())\n                    .settlementDate(LocalDate.now())\n                    .periodStart(periodStart)\n                    .periodEnd(periodEnd)\n                    .totalSales(agg.getTotalSales())\n                    .platformFee(agg.getPlatformFee())\n                    .pgFee(agg.getPgFee())\n                    .tax(agg.getTax())\n                    .netAmount(agg.getNetAmount())\n                    .transactionCount(agg.getTransactionCount())\n                    .status(SettlementStatus.PENDING)\n                    .checksum(agg.getChecksum())\n                    .build();\n\n            settlement = settlementRepository.save(settlement);\n\n            // 2. 해당 거래 내역에 정산 ID 기록 및 정산 완료 처리\n            transactionRepository.markAsSettled(\n                    agg.getSellerId(),\n                    periodStart,\n                    periodEnd,\n                    settlement.getId()\n            );\n\n            log.info(\"정산서 생성 완료 - sellerId: {}, netAmount: {}, txCount: {}\",\n                    agg.getSellerId(), agg.getNetAmount(), agg.getTransactionCount());\n        }\n    }\n}\n```\n\n---\n\n## 공통 베스트 프랙티스\n\n### 1. Job 파라미터 설계\n\n```java\n/**\n * Best Practice: 필수/선택 파라미터 명확히 구분\n * - 필수: 실행에 반드시 필요한 값\n * - 선택: 기본값이 있는 값\n * - 실행 시점 자동 생성: runId, timestamp 등\n */\n@Bean\npublic Job billingJob(JobRepository jobRepository) {\n    return new JobBuilder(\"billingJob\", jobRepository)\n            .validator(new CompositeJobParametersValidator(List.of(\n                    // 필수 파라미터\n                    new DefaultJobParametersValidator(\n                            new String[]{\"billingDate\"},\n                            new String[]{\"dryRun\", \"maxRetryCount\"}\n                    ),\n                    // 커스텀 검증\n                    parameters -> {\n                        String billingDate = parameters.getString(\"billingDate\");\n                        if (!isValidDate(billingDate)) {\n                            throw new JobParametersInvalidException(\n                                    \"Invalid billingDate format: \" + billingDate);\n                        }\n                    }\n            )))\n            .incrementer(new RunIdIncrementer())  // 동일 파라미터 재실행 허용\n            .start(paymentStep())\n            .build();\n}\n\n// 실행 예시\nJobParameters params = new JobParametersBuilder()\n        .addString(\"billingDate\", \"2024-01-15\")\n        .addString(\"dryRun\", \"false\")           // 선택\n        .addLong(\"runId\", System.currentTimeMillis())  // 자동 생성\n        .toJobParameters();\n```\n\n### 2. 배치 실행 모드 (Dry Run)\n\n```java\n/**\n * Best Practice: Dry Run 모드 지원\n * - 실제 DB/외부 시스템 변경 없이 로직 검증\n * - 예상 처리 건수, 금액 등 미리 확인\n */\n@Component\n@RequiredArgsConstructor\npublic class PaymentProcessor implements ItemProcessor<Subscription, PaymentResult> {\n\n    @Value(\"#{jobParameters['dryRun'] ?: 'false'}\")\n    private boolean dryRun;\n\n    @Override\n    public PaymentResult process(Subscription subscription) {\n        if (dryRun) {\n            log.info(\"[DRY RUN] 결제 시뮬레이션 - subscriptionId: {}, amount: {}\",\n                    subscription.getId(), subscription.getAmount());\n            return PaymentResult.dryRun(subscription);\n        }\n\n        // 실제 결제 로직\n        return executePayment(subscription);\n    }\n}\n\n@Component\npublic class DryRunWriter implements ItemWriter<PaymentResult> {\n\n    @Value(\"#{jobParameters['dryRun'] ?: 'false'}\")\n    private boolean dryRun;\n\n    @Override\n    public void write(Chunk<? extends PaymentResult> items) {\n        if (dryRun) {\n            // 통계만 기록\n            long successCount = items.getItems().stream()\n                    .filter(PaymentResult::isSuccess).count();\n            BigDecimal totalAmount = items.getItems().stream()\n                    .map(PaymentResult::getAmount)\n                    .reduce(BigDecimal.ZERO, BigDecimal::add);\n\n            log.info(\"[DRY RUN] 처리 예정 - 건수: {}, 성공: {}, 금액: {}\",\n                    items.size(), successCount, totalAmount);\n            return;\n        }\n\n        // 실제 저장 로직\n        actualWriter.write(items);\n    }\n}\n```\n\n### 3. 배치 모니터링\n\n```java\n/**\n * Best Practice: 핵심 메트릭 수집\n * - 처리량 (items/sec)\n * - 성공/실패 건수\n * - 처리 시간\n * - 비즈니스 메트릭 (결제 금액 등)\n */\n@Component\n@RequiredArgsConstructor\npublic class BatchMetricsListener implements JobExecutionListener, StepExecutionListener {\n\n    private final MeterRegistry meterRegistry;\n\n    @Override\n    public void afterJob(JobExecution jobExecution) {\n        String jobName = jobExecution.getJobInstance().getJobName();\n        String status = jobExecution.getStatus().toString();\n\n        // Job 완료 카운터\n        meterRegistry.counter(\"batch.job.completed\",\n                \"job\", jobName,\n                \"status\", status\n        ).increment();\n\n        // Job 실행 시간\n        long duration = Duration.between(\n                jobExecution.getStartTime(),\n                jobExecution.getEndTime()\n        ).toMillis();\n\n        meterRegistry.timer(\"batch.job.duration\", \"job\", jobName)\n                .record(duration, TimeUnit.MILLISECONDS);\n\n        // 비즈니스 메트릭 (ExecutionContext에서 수집)\n        ExecutionContext context = jobExecution.getExecutionContext();\n        if (context.containsKey(\"totalPaymentAmount\")) {\n            meterRegistry.gauge(\"batch.billing.total_amount\",\n                    Tags.of(\"job\", jobName),\n                    context.getDouble(\"totalPaymentAmount\"));\n        }\n    }\n\n    @Override\n    public ExitStatus afterStep(StepExecution stepExecution) {\n        String stepName = stepExecution.getStepName();\n\n        // Step 처리 건수\n        meterRegistry.gauge(\"batch.step.read_count\",\n                Tags.of(\"step\", stepName),\n                stepExecution.getReadCount());\n\n        meterRegistry.gauge(\"batch.step.write_count\",\n                Tags.of(\"step\", stepName),\n                stepExecution.getWriteCount());\n\n        meterRegistry.gauge(\"batch.step.skip_count\",\n                Tags.of(\"step\", stepName),\n                stepExecution.getSkipCount());\n\n        // 처리량 계산\n        long duration = Duration.between(\n                stepExecution.getStartTime(),\n                stepExecution.getEndTime()\n        ).toSeconds();\n\n        if (duration > 0) {\n            double throughput = (double) stepExecution.getWriteCount() / duration;\n            meterRegistry.gauge(\"batch.step.throughput\",\n                    Tags.of(\"step\", stepName), throughput);\n        }\n\n        return stepExecution.getExitStatus();\n    }\n}\n```\n\n### 4. 알림 설정\n\n```java\n/**\n * Best Practice: 배치 상태별 알림\n * - 시작/종료: 정보성 알림\n * - 실패: 즉시 알림 (Slack/PagerDuty)\n * - 임계값 초과: 경고 알림\n */\n@Component\n@RequiredArgsConstructor\npublic class BatchAlertListener implements JobExecutionListener {\n\n    private final SlackNotifier slackNotifier;\n    private final PagerDutyClient pagerDuty;\n\n    @Override\n    public void beforeJob(JobExecution jobExecution) {\n        slackNotifier.send(SlackMessage.info(\n                String.format(\"🚀 배치 시작: %s (params: %s)\",\n                        jobExecution.getJobInstance().getJobName(),\n                        jobExecution.getJobParameters())\n        ));\n    }\n\n    @Override\n    public void afterJob(JobExecution jobExecution) {\n        String jobName = jobExecution.getJobInstance().getJobName();\n        BatchStatus status = jobExecution.getStatus();\n\n        if (status == BatchStatus.COMPLETED) {\n            // 성공 시 요약 정보 발송\n            String summary = buildSuccessSummary(jobExecution);\n            slackNotifier.send(SlackMessage.success(summary));\n\n            // 스킵 건수가 임계값 초과 시 경고\n            long totalSkips = jobExecution.getStepExecutions().stream()\n                    .mapToLong(StepExecution::getSkipCount)\n                    .sum();\n\n            if (totalSkips > 100) {\n                slackNotifier.send(SlackMessage.warning(\n                        String.format(\"⚠️ %s: 스킵 건수 %d건 (확인 필요)\",\n                                jobName, totalSkips)));\n            }\n\n        } else if (status == BatchStatus.FAILED) {\n            // 실패 시 즉시 알림\n            String errorMessage = jobExecution.getAllFailureExceptions().stream()\n                    .map(Throwable::getMessage)\n                    .collect(Collectors.joining(\", \"));\n\n            slackNotifier.send(SlackMessage.error(\n                    String.format(\"🚨 배치 실패: %s - %s\", jobName, errorMessage)));\n\n            // 중요 배치는 PagerDuty 호출\n            if (isCriticalJob(jobName)) {\n                pagerDuty.triggerIncident(\n                        \"Batch Job Failed: \" + jobName,\n                        errorMessage,\n                        Severity.HIGH\n                );\n            }\n        }\n    }\n\n    private boolean isCriticalJob(String jobName) {\n        return Set.of(\"billingJob\", \"settlementJob\", \"payoutJob\")\n                .contains(jobName);\n    }\n}\n```\n\n---\n\n## 장애 대응 패턴\n\n### 1. 부분 재처리\n\n```java\n/**\n * Best Practice: 실패 건만 재처리\n * - 전체 재실행 대신 실패 건만 선별 처리\n * - 처리 시간 및 비용 절감\n */\n@Bean\npublic Job retryFailedPaymentsJob(JobRepository jobRepository) {\n    return new JobBuilder(\"retryFailedPaymentsJob\", jobRepository)\n            .start(retryStep())\n            .build();\n}\n\n@Bean\n@StepScope\npublic JdbcPagingItemReader<PaymentLog> failedPaymentReader(\n        @Value(\"#{jobParameters['originalJobExecutionId']}\") Long executionId) {\n\n    return new JdbcPagingItemReaderBuilder<PaymentLog>()\n            .name(\"failedPaymentReader\")\n            .dataSource(dataSource)\n            .selectClause(\"SELECT * FROM payment_logs\")\n            .whereClause(\"\"\"\n                WHERE job_execution_id = :executionId\n                  AND status = 'FAILED'\n                  AND retry_count < 3\n                \"\"\")\n            .parameterValues(Map.of(\"executionId\", executionId))\n            .sortKeys(Map.of(\"id\", Order.ASCENDING))\n            .pageSize(100)\n            .build();\n}\n```\n\n### 2. 보상 트랜잭션\n\n```java\n/**\n * Best Practice: 롤백 불가능한 외부 연동 보상 처리\n * - 결제 성공 후 DB 저장 실패 시 결제 취소\n * - 보상 실패 시 수동 처리 큐로 이관\n */\n@Component\n@RequiredArgsConstructor\npublic class CompensatingPaymentWriter implements ItemWriter<PaymentResult> {\n\n    private final PaymentGateway paymentGateway;\n    private final PaymentLogRepository repository;\n    private final ManualProcessingQueue manualQueue;\n\n    @Override\n    public void write(Chunk<? extends PaymentResult> results) {\n        List<PaymentResult> successfulPayments = new ArrayList<>();\n\n        try {\n            for (PaymentResult result : results) {\n                if (result.isSuccess()) {\n                    successfulPayments.add(result);\n                }\n            }\n\n            // DB 저장 시도\n            repository.saveAll(toEntities(results.getItems()));\n\n        } catch (Exception e) {\n            log.error(\"DB 저장 실패, 보상 트랜잭션 시작\", e);\n\n            // 성공한 결제 취소 (보상)\n            for (PaymentResult payment : successfulPayments) {\n                try {\n                    paymentGateway.refund(RefundRequest.builder()\n                            .transactionId(payment.getTransactionId())\n                            .reason(\"SYSTEM_ERROR_COMPENSATION\")\n                            .idempotencyKey(\"refund_\" + payment.getIdempotencyKey())\n                            .build());\n\n                    log.info(\"보상 환불 완료 - txId: {}\", payment.getTransactionId());\n\n                } catch (Exception refundError) {\n                    // 환불도 실패하면 수동 처리 큐로\n                    log.error(\"보상 환불 실패, 수동 처리 필요 - txId: {}\",\n                            payment.getTransactionId(), refundError);\n\n                    manualQueue.enqueue(ManualTask.builder()\n                            .type(TaskType.REFUND_REQUIRED)\n                            .transactionId(payment.getTransactionId())\n                            .amount(payment.getAmount())\n                            .reason(\"Compensation refund failed\")\n                            .build());\n                }\n            }\n\n            throw e;  // 원래 예외 다시 던짐\n        }\n    }\n}\n```\n\n### 3. 데드락 방지\n\n```java\n/**\n * Best Practice: 데드락 방지 전략\n * - 일관된 락 순서 (ID 오름차순)\n * - 락 타임아웃 설정\n * - 낙관적 락 사용 고려\n */\n@Bean\n@StepScope\npublic JdbcPagingItemReader<Subscription> orderedReader() {\n    return new JdbcPagingItemReaderBuilder<Subscription>()\n            .name(\"orderedReader\")\n            .dataSource(dataSource)\n            .selectClause(\"SELECT * FROM subscriptions\")\n            .whereClause(\"WHERE status = 'ACTIVE'\")\n            .sortKeys(Map.of(\"id\", Order.ASCENDING))  // 항상 ID 순서로\n            .pageSize(100)\n            .build();\n}\n\n// JPA 낙관적 락\n@Entity\npublic class Settlement {\n    @Version\n    private Long version;  // 낙관적 락\n\n    // ...\n}\n\n// 재시도 설정\n@Bean\npublic Step settlementStep(JobRepository jobRepository,\n                           PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"settlementStep\", jobRepository)\n            .<SellerAggregation, Settlement>chunk(10, transactionManager)\n            .reader(aggregationReader())\n            .writer(settlementWriter())\n            .faultTolerant()\n            .retry(OptimisticLockingFailureException.class)\n            .retry(DeadlockLoserDataAccessException.class)\n            .retryLimit(3)\n            .backOffPolicy(new FixedBackOffPolicy())  // 1초 대기 후 재시도\n            .build();\n}\n```\n\n---\n\n## 운영 체크리스트\n\n### 배포 전 체크리스트\n\n```markdown\n## 배포 전 확인사항\n\n### 코드\n- [ ] Chunk Size 적절한가? (테스트 환경에서 검증)\n- [ ] 멱등성 보장되는가? (동일 입력 → 동일 결과)\n- [ ] Skip/Retry 정책 적절한가?\n- [ ] 타임아웃 설정되어 있는가? (외부 연동)\n- [ ] Dry Run 모드 동작하는가?\n\n### 데이터\n- [ ] 인덱스 최적화되어 있는가? (실행 계획 확인)\n- [ ] 배치 테이블 파티셔닝 필요한가?\n- [ ] 메타데이터 테이블 정리 정책 있는가?\n\n### 모니터링\n- [ ] 핵심 메트릭 수집되는가?\n- [ ] 알림 설정되어 있는가?\n- [ ] 로그 레벨 적절한가?\n\n### 장애 대응\n- [ ] 재실행 절차 문서화되어 있는가?\n- [ ] 롤백 절차 준비되어 있는가?\n- [ ] 담당자 연락처 최신화되어 있는가?\n```\n\n### 실행 전 체크리스트\n\n```markdown\n## 실행 전 확인사항\n\n### 데이터 검증\n- [ ] 처리 대상 건수 예상치와 일치하는가?\n- [ ] 이전 실행 결과 정상 종료되었는가?\n- [ ] 중복 실행 아닌가?\n\n### 시스템 상태\n- [ ] DB 커넥션 풀 여유 있는가?\n- [ ] 디스크 용량 충분한가?\n- [ ] 외부 시스템 정상인가? (PG, 알림 등)\n\n### 실행 환경\n- [ ] 파라미터 올바른가?\n- [ ] 실행 시간대 적절한가? (트래픽 낮은 시간)\n- [ ] 동시 실행 배치와 충돌 없는가?\n```\n\n### 실행 후 체크리스트\n\n```markdown\n## 실행 후 확인사항\n\n### 결과 검증\n- [ ] 처리 건수 예상치와 일치하는가?\n- [ ] 실패/스킵 건수 허용 범위인가?\n- [ ] 비즈니스 데이터 정합성 확인 (금액 합계 등)\n\n### 후속 조치\n- [ ] 실패 건 원인 분석 완료\n- [ ] 재처리 필요 건 식별\n- [ ] 이해관계자 결과 공유\n```\n\n---\n\n## 관련 문서\n\n- [Spring Batch 기초](./spring-batch-basics.md) - Job, Step, 실행 흐름\n- [Spring Batch Chunk 처리](./spring-batch-chunk.md) - ItemReader, ItemProcessor, ItemWriter\n- [Spring Batch ExecutionContext 가이드](./spring-batch-execution-context.md) - 상태 저장과 재시작\n- [Spring Batch 고급 활용](./spring-batch-advanced.md) - 비동기, 파티셔닝, 원격 실행\n\n*마지막 업데이트: 2024년 12월*\n", "size": 44200, "lines": 1220}, {"filename": "spring-batch-chunk.md", "title": "Spring Batch Chunk 처리 - ItemReader, ItemProcessor, ItemWriter", "path": "spring/spring-batch-chunk.md", "content": "# Spring Batch Chunk 처리 - ItemReader, ItemProcessor, ItemWriter\n\n대용량 데이터를 효율적으로 처리하는 Chunk 기반 처리 방식을 정리한다.\n\n## 목차\n\n- [Chunk 처리 개념](#chunk-처리-개념)\n- [ItemReader](#itemreader)\n- [ItemProcessor](#itemprocessor)\n- [ItemWriter](#itemwriter)\n- [오류 처리와 Skip/Retry](#오류-처리와-skipretry)\n- [트랜잭션 관리](#트랜잭션-관리)\n\n---\n\n## Chunk 처리 개념\n\nChunk 처리는 데이터를 일정 단위(chunk)로 나누어 처리하는 방식이다.\n\n```\n┌──────────────────────────────────────────────────────────────┐\n│                      Chunk Processing                         │\n│                                                               │\n│   ┌─────────┐      ┌───────────┐      ┌─────────┐           │\n│   │ Reader  │─────▶│ Processor │─────▶│ Writer  │           │\n│   └─────────┘      └───────────┘      └─────────┘           │\n│       │                 │                  │                 │\n│       │    chunk-size   │    chunk-size    │                 │\n│       │◀───────────────▶│◀────────────────▶│                 │\n│       │     (1개씩)      │     (1개씩)       │   (chunk 단위)  │\n│                                                               │\n│   [트랜잭션 시작] ──────────────────────── [커밋] ────────────│\n└──────────────────────────────────────────────────────────────┘\n```\n\n### 기본 구조\n\n```java\n@Bean\npublic Step chunkStep(JobRepository jobRepository,\n                      PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"chunkStep\", jobRepository)\n            .<String, String>chunk(100, transactionManager)  // 100개 단위로 커밋\n            .reader(reader())\n            .processor(processor())\n            .writer(writer())\n            .build();\n}\n```\n\n**Chunk Size 선택 기준:**\n\n| Chunk Size | 적합한 상황 |\n|------------|------------|\n| 10~50 | 개별 아이템 처리 시간이 긴 경우 |\n| 100~500 | 일반적인 데이터 처리 |\n| 1000+ | 단순 데이터 이관, I/O 최적화 필요 시 |\n\n---\n\n## ItemReader\n\n데이터 소스에서 아이템을 하나씩 읽어오는 역할을 한다.\n\n### FlatFileItemReader (파일)\n\n```java\n@Bean\npublic FlatFileItemReader<Customer> fileReader() {\n    return new FlatFileItemReaderBuilder<Customer>()\n            .name(\"customerReader\")\n            .resource(new ClassPathResource(\"customers.csv\"))\n            .linesToSkip(1)  // 헤더 스킵\n            .delimited()\n            .delimiter(\",\")\n            .names(\"id\", \"name\", \"email\", \"age\")\n            .targetType(Customer.class)\n            .build();\n}\n\n// 고정 길이 파일\n@Bean\npublic FlatFileItemReader<Customer> fixedLengthReader() {\n    return new FlatFileItemReaderBuilder<Customer>()\n            .name(\"fixedLengthReader\")\n            .resource(new ClassPathResource(\"customers.dat\"))\n            .fixedLength()\n            .columns(new Range(1, 10), new Range(11, 30), new Range(31, 50))\n            .names(\"id\", \"name\", \"email\")\n            .targetType(Customer.class)\n            .build();\n}\n```\n\n### JdbcCursorItemReader (DB - Cursor)\n\n```java\n@Bean\npublic JdbcCursorItemReader<Customer> cursorReader(DataSource dataSource) {\n    return new JdbcCursorItemReaderBuilder<Customer>()\n            .name(\"customerCursorReader\")\n            .dataSource(dataSource)\n            .sql(\"SELECT id, name, email, age FROM customers WHERE status = ?\")\n            .preparedStatementSetter(ps -> ps.setString(1, \"ACTIVE\"))\n            .rowMapper((rs, rowNum) -> Customer.builder()\n                    .id(rs.getLong(\"id\"))\n                    .name(rs.getString(\"name\"))\n                    .email(rs.getString(\"email\"))\n                    .age(rs.getInt(\"age\"))\n                    .build())\n            .build();\n}\n```\n\n### JdbcPagingItemReader (DB - Paging)\n\n대용량 데이터 처리에 적합하다. 메모리 효율적.\n\n```java\n@Bean\npublic JdbcPagingItemReader<Customer> pagingReader(DataSource dataSource) {\n    Map<String, Order> sortKeys = new HashMap<>();\n    sortKeys.put(\"id\", Order.ASCENDING);\n\n    return new JdbcPagingItemReaderBuilder<Customer>()\n            .name(\"customerPagingReader\")\n            .dataSource(dataSource)\n            .selectClause(\"SELECT id, name, email, age\")\n            .fromClause(\"FROM customers\")\n            .whereClause(\"WHERE status = :status\")\n            .parameterValues(Map.of(\"status\", \"ACTIVE\"))\n            .sortKeys(sortKeys)\n            .pageSize(100)\n            .rowMapper(new BeanPropertyRowMapper<>(Customer.class))\n            .build();\n}\n```\n\n### JpaPagingItemReader (JPA)\n\n```java\n@Bean\npublic JpaPagingItemReader<Customer> jpaReader(EntityManagerFactory emf) {\n    return new JpaPagingItemReaderBuilder<Customer>()\n            .name(\"customerJpaReader\")\n            .entityManagerFactory(emf)\n            .queryString(\"SELECT c FROM Customer c WHERE c.status = :status\")\n            .parameterValues(Map.of(\"status\", Status.ACTIVE))\n            .pageSize(100)\n            .build();\n}\n\n// QueryDSL 사용 시\n@Bean\npublic RepositoryItemReader<Customer> repositoryReader(CustomerRepository repository) {\n    return new RepositoryItemReaderBuilder<Customer>()\n            .name(\"repositoryReader\")\n            .repository(repository)\n            .methodName(\"findByStatus\")\n            .arguments(Status.ACTIVE)\n            .pageSize(100)\n            .sorts(Map.of(\"id\", Sort.Direction.ASC))\n            .build();\n}\n```\n\n### 커스텀 ItemReader\n\n```java\n@Component\npublic class ApiItemReader implements ItemReader<ApiData> {\n\n    private final ApiClient apiClient;\n    private Iterator<ApiData> dataIterator;\n    private boolean initialized = false;\n\n    @Override\n    public ApiData read() {\n        if (!initialized) {\n            List<ApiData> data = apiClient.fetchAll();\n            dataIterator = data.iterator();\n            initialized = true;\n        }\n\n        if (dataIterator.hasNext()) {\n            return dataIterator.next();\n        }\n        return null;  // null 반환 시 읽기 종료\n    }\n}\n```\n\n### @StepScope로 Late Binding\n\n```java\n@Bean\n@StepScope\npublic FlatFileItemReader<Customer> scopedReader(\n        @Value(\"#{jobParameters['inputFile']}\") String inputFile,\n        @Value(\"#{stepExecutionContext['minId']}\") Long minId) {\n\n    return new FlatFileItemReaderBuilder<Customer>()\n            .name(\"scopedReader\")\n            .resource(new FileSystemResource(inputFile))\n            .delimited()\n            .names(\"id\", \"name\", \"email\")\n            .targetType(Customer.class)\n            .build();\n}\n```\n\n---\n\n## ItemProcessor\n\n읽은 데이터를 변환하거나 필터링하는 역할을 한다.\n\n### 기본 Processor\n\n```java\n@Bean\npublic ItemProcessor<Customer, CustomerDto> processor() {\n    return customer -> {\n        // null 반환 시 해당 아이템 필터링 (Writer로 전달 안 됨)\n        if (!customer.isActive()) {\n            return null;\n        }\n\n        return CustomerDto.builder()\n                .id(customer.getId())\n                .fullName(customer.getFirstName() + \" \" + customer.getLastName())\n                .email(customer.getEmail().toLowerCase())\n                .build();\n    };\n}\n```\n\n### ValidatingItemProcessor\n\n```java\n@Bean\npublic ValidatingItemProcessor<Customer> validatingProcessor() {\n    ValidatingItemProcessor<Customer> processor = new ValidatingItemProcessor<>();\n    processor.setValidator(new SpringValidator<>(customerValidator()));\n    processor.setFilter(true);  // 유효성 검사 실패 시 필터링 (예외 대신)\n    return processor;\n}\n\n@Bean\npublic Validator customerValidator() {\n    return new Validator() {\n        @Override\n        public boolean supports(Class<?> clazz) {\n            return Customer.class.isAssignableFrom(clazz);\n        }\n\n        @Override\n        public void validate(Object target, Errors errors) {\n            Customer customer = (Customer) target;\n            if (StringUtils.isBlank(customer.getEmail())) {\n                errors.rejectValue(\"email\", \"email.required\");\n            }\n        }\n    };\n}\n```\n\n### CompositeItemProcessor (체이닝)\n\n```java\n@Bean\npublic CompositeItemProcessor<Customer, CustomerDto> compositeProcessor() {\n    return new CompositeItemProcessorBuilder<Customer, CustomerDto>()\n            .delegates(\n                    validationProcessor(),   // 1. 유효성 검사\n                    enrichmentProcessor(),   // 2. 데이터 보강\n                    transformProcessor()     // 3. DTO 변환\n            )\n            .build();\n}\n\n@Bean\npublic ItemProcessor<Customer, Customer> enrichmentProcessor() {\n    return customer -> {\n        // 외부 API 호출하여 추가 정보 조회\n        CustomerDetails details = externalApi.getDetails(customer.getId());\n        customer.setDetails(details);\n        return customer;\n    };\n}\n```\n\n### ClassifierCompositeItemProcessor (조건부 처리)\n\n```java\n@Bean\npublic ClassifierCompositeItemProcessor<Customer, CustomerDto> classifierProcessor() {\n    ClassifierCompositeItemProcessor<Customer, CustomerDto> processor =\n            new ClassifierCompositeItemProcessor<>();\n\n    processor.setClassifier(customer -> {\n        if (customer.getType() == CustomerType.PREMIUM) {\n            return premiumProcessor();\n        } else {\n            return standardProcessor();\n        }\n    });\n\n    return processor;\n}\n```\n\n---\n\n## ItemWriter\n\n처리된 데이터를 출력하는 역할을 한다. Chunk 단위로 호출된다.\n\n### FlatFileItemWriter (파일)\n\n```java\n@Bean\npublic FlatFileItemWriter<CustomerDto> fileWriter() {\n    return new FlatFileItemWriterBuilder<CustomerDto>()\n            .name(\"customerWriter\")\n            .resource(new FileSystemResource(\"output/customers.csv\"))\n            .headerCallback(writer -> writer.write(\"ID,NAME,EMAIL\"))\n            .footerCallback(writer -> writer.write(\"--- END OF FILE ---\"))\n            .delimited()\n            .delimiter(\",\")\n            .names(\"id\", \"fullName\", \"email\")\n            .build();\n}\n\n// 포맷 지정\n@Bean\npublic FlatFileItemWriter<CustomerDto> formattedWriter() {\n    return new FlatFileItemWriterBuilder<CustomerDto>()\n            .name(\"formattedWriter\")\n            .resource(new FileSystemResource(\"output/customers.txt\"))\n            .formatted()\n            .format(\"%-10d %-30s %-50s\")\n            .names(\"id\", \"fullName\", \"email\")\n            .build();\n}\n```\n\n### JdbcBatchItemWriter (DB)\n\n```java\n@Bean\npublic JdbcBatchItemWriter<CustomerDto> jdbcWriter(DataSource dataSource) {\n    return new JdbcBatchItemWriterBuilder<CustomerDto>()\n            .dataSource(dataSource)\n            .sql(\"INSERT INTO customers_backup (id, name, email, created_at) \" +\n                 \"VALUES (:id, :fullName, :email, :createdAt)\")\n            .beanMapped()\n            .build();\n}\n\n// ItemPreparedStatementSetter 사용\n@Bean\npublic JdbcBatchItemWriter<CustomerDto> jdbcWriterWithSetter(DataSource dataSource) {\n    return new JdbcBatchItemWriterBuilder<CustomerDto>()\n            .dataSource(dataSource)\n            .sql(\"INSERT INTO customers_backup (id, name, email) VALUES (?, ?, ?)\")\n            .itemPreparedStatementSetter((item, ps) -> {\n                ps.setLong(1, item.getId());\n                ps.setString(2, item.getFullName());\n                ps.setString(3, item.getEmail());\n            })\n            .build();\n}\n```\n\n### JpaItemWriter (JPA)\n\n```java\n@Bean\npublic JpaItemWriter<CustomerEntity> jpaWriter(EntityManagerFactory emf) {\n    JpaItemWriter<CustomerEntity> writer = new JpaItemWriter<>();\n    writer.setEntityManagerFactory(emf);\n    writer.setUsePersist(true);  // persist() 사용 (기본: merge())\n    return writer;\n}\n\n// Spring Data JPA Repository 사용\n@Bean\npublic RepositoryItemWriter<CustomerEntity> repositoryWriter(\n        CustomerRepository repository) {\n    return new RepositoryItemWriterBuilder<CustomerEntity>()\n            .repository(repository)\n            .methodName(\"save\")\n            .build();\n}\n```\n\n### CompositeItemWriter (다중 출력)\n\n```java\n@Bean\npublic CompositeItemWriter<CustomerDto> compositeWriter() {\n    return new CompositeItemWriterBuilder<CustomerDto>()\n            .delegates(\n                    jdbcWriter(),    // DB 저장\n                    fileWriter(),    // 파일 출력\n                    kafkaWriter()    // Kafka 전송\n            )\n            .build();\n}\n```\n\n### ClassifierCompositeItemWriter (조건부 출력)\n\n```java\n@Bean\npublic ClassifierCompositeItemWriter<CustomerDto> classifierWriter() {\n    ClassifierCompositeItemWriter<CustomerDto> writer =\n            new ClassifierCompositeItemWriter<>();\n\n    writer.setClassifier(customer -> {\n        if (customer.getCountry().equals(\"KR\")) {\n            return koreanDbWriter();\n        } else {\n            return globalDbWriter();\n        }\n    });\n\n    return writer;\n}\n```\n\n### 커스텀 ItemWriter\n\n```java\n@Component\npublic class ApiItemWriter implements ItemWriter<CustomerDto> {\n\n    private final ApiClient apiClient;\n\n    @Override\n    public void write(Chunk<? extends CustomerDto> items) {\n        List<CustomerDto> customers = new ArrayList<>(items.getItems());\n\n        // 배치로 API 호출\n        apiClient.bulkCreate(customers);\n\n        log.info(\"{}건 API 전송 완료\", customers.size());\n    }\n}\n```\n\n---\n\n## 오류 처리와 Skip/Retry\n\n### Skip 설정\n\n특정 예외 발생 시 해당 아이템을 건너뛰고 계속 진행한다.\n\n```java\n@Bean\npublic Step skipStep(JobRepository jobRepository,\n                     PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"skipStep\", jobRepository)\n            .<Customer, CustomerDto>chunk(100, transactionManager)\n            .reader(reader())\n            .processor(processor())\n            .writer(writer())\n            .faultTolerant()\n            .skip(ValidationException.class)\n            .skip(DuplicateKeyException.class)\n            .skipLimit(100)  // 최대 100건까지 스킵\n            .skipPolicy(new AlwaysSkipItemSkipPolicy())  // 커스텀 정책\n            .listener(new SkipListener<Customer, CustomerDto>() {\n                @Override\n                public void onSkipInRead(Throwable t) {\n                    log.warn(\"읽기 중 스킵: {}\", t.getMessage());\n                }\n\n                @Override\n                public void onSkipInProcess(Customer item, Throwable t) {\n                    log.warn(\"처리 중 스킵 - ID: {}, 오류: {}\",\n                            item.getId(), t.getMessage());\n                }\n\n                @Override\n                public void onSkipInWrite(CustomerDto item, Throwable t) {\n                    log.warn(\"쓰기 중 스킵 - ID: {}\", item.getId());\n                }\n            })\n            .build();\n}\n```\n\n### Retry 설정\n\n일시적 오류에 대해 재시도한다.\n\n```java\n@Bean\npublic Step retryStep(JobRepository jobRepository,\n                      PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"retryStep\", jobRepository)\n            .<Customer, CustomerDto>chunk(100, transactionManager)\n            .reader(reader())\n            .processor(processor())\n            .writer(writer())\n            .faultTolerant()\n            .retry(DeadlockLoserDataAccessException.class)\n            .retry(OptimisticLockingFailureException.class)\n            .retryLimit(3)\n            .retryPolicy(new SimpleRetryPolicy(3,\n                    Map.of(TransientDataAccessException.class, true)))\n            .backOffPolicy(new ExponentialBackOffPolicy())  // 지수 백오프\n            .listener(new RetryListener() {\n                @Override\n                public <T, E extends Throwable> void onError(\n                        RetryContext context, RetryCallback<T, E> callback, Throwable t) {\n                    log.warn(\"재시도 #{}: {}\", context.getRetryCount(), t.getMessage());\n                }\n            })\n            .build();\n}\n```\n\n### Skip + Retry 조합\n\n```java\n@Bean\npublic Step robustStep(JobRepository jobRepository,\n                       PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"robustStep\", jobRepository)\n            .<Customer, CustomerDto>chunk(100, transactionManager)\n            .reader(reader())\n            .processor(processor())\n            .writer(writer())\n            .faultTolerant()\n            // Retry 설정\n            .retry(TransientDataAccessException.class)\n            .retryLimit(3)\n            // Skip 설정 (재시도 후에도 실패하면 스킵)\n            .skip(Exception.class)\n            .skipLimit(10)\n            .noSkip(FileNotFoundException.class)  // 이 예외는 스킵하지 않음\n            .noRetry(ValidationException.class)   // 이 예외는 재시도하지 않음\n            .build();\n}\n```\n\n---\n\n## 트랜잭션 관리\n\n### Chunk 단위 트랜잭션\n\n기본적으로 각 Chunk는 하나의 트랜잭션으로 처리된다.\n\n```java\n@Bean\npublic Step transactionalStep(JobRepository jobRepository,\n                              PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"transactionalStep\", jobRepository)\n            .<Customer, CustomerDto>chunk(100, transactionManager)\n            .reader(reader())\n            .processor(processor())\n            .writer(writer())\n            .transactionAttribute(new DefaultTransactionAttribute(\n                    TransactionDefinition.PROPAGATION_REQUIRED))\n            .build();\n}\n```\n\n### Reader 트랜잭션 분리\n\nReader를 트랜잭션 밖에서 실행한다.\n\n```java\n@Bean\npublic Step readerOutsideTxStep(JobRepository jobRepository,\n                                 PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"readerOutsideTxStep\", jobRepository)\n            .<Customer, CustomerDto>chunk(100, transactionManager)\n            .reader(reader())\n            .processor(processor())\n            .writer(writer())\n            .readerIsTransactionalQueue()  // Reader를 트랜잭션 밖에서 실행\n            .build();\n}\n```\n\n### 롤백 제어\n\n```java\n@Bean\npublic Step rollbackControlStep(JobRepository jobRepository,\n                                 PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"rollbackControlStep\", jobRepository)\n            .<Customer, CustomerDto>chunk(100, transactionManager)\n            .reader(reader())\n            .processor(processor())\n            .writer(writer())\n            .faultTolerant()\n            .noRollback(ValidationException.class)  // 이 예외는 롤백하지 않음\n            .build();\n}\n```\n\n---\n\n## 성능 최적화 팁\n\n### Chunk Size 튜닝\n\n```java\n// 처리량 측정 리스너\n@Component\npublic class ChunkPerformanceListener implements ChunkListener {\n\n    private long chunkStartTime;\n\n    @Override\n    public void beforeChunk(ChunkContext context) {\n        chunkStartTime = System.currentTimeMillis();\n    }\n\n    @Override\n    public void afterChunk(ChunkContext context) {\n        long duration = System.currentTimeMillis() - chunkStartTime;\n        StepExecution stepExecution = context.getStepContext().getStepExecution();\n        log.info(\"Chunk 처리 완료 - 읽기: {}, 쓰기: {}, 소요시간: {}ms\",\n                stepExecution.getReadCount(),\n                stepExecution.getWriteCount(),\n                duration);\n    }\n}\n```\n\n### Reader Fetch Size\n\n```java\n@Bean\npublic JdbcCursorItemReader<Customer> optimizedReader(DataSource dataSource) {\n    return new JdbcCursorItemReaderBuilder<Customer>()\n            .name(\"optimizedReader\")\n            .dataSource(dataSource)\n            .sql(\"SELECT * FROM customers WHERE status = 'ACTIVE'\")\n            .fetchSize(1000)  // DB에서 한 번에 가져올 행 수\n            .rowMapper(new BeanPropertyRowMapper<>(Customer.class))\n            .build();\n}\n```\n\n### Writer 배치 크기\n\n```java\n@Bean\npublic JpaItemWriter<CustomerEntity> optimizedJpaWriter(EntityManagerFactory emf) {\n    JpaItemWriter<CustomerEntity> writer = new JpaItemWriter<>();\n    writer.setEntityManagerFactory(emf);\n    return writer;\n}\n\n// application.yml\n// spring.jpa.properties.hibernate.jdbc.batch_size=50\n```\n\n---\n\n## 다음 문서\n\n- [Spring Batch 기초](./spring-batch-basics.md) - Job, Step, 실행 흐름\n- [Spring Batch ExecutionContext 가이드](./spring-batch-execution-context.md) - 상태 저장과 재시작\n- [Spring Batch 고급 활용](./spring-batch-advanced.md) - 비동기, 파티셔닝, 원격 실행\n- [Spring Batch 실무 베스트 프랙티스](./spring-batch-best-practices.md) - 정기 결제, 정산 사례\n\n*마지막 업데이트: 2024년 12월*\n", "size": 21295, "lines": 678}, {"filename": "spring-batch-execution-context.md", "title": "Spring Batch ExecutionContext 완벽 가이드", "path": "spring/spring-batch-execution-context.md", "content": "# Spring Batch ExecutionContext 완벽 가이드\n\n배치 실행 상태를 저장하고 재시작 시 복구하는 ExecutionContext의 활용법을 정리한다.\n\n## 목차\n\n- [ExecutionContext란?](#executioncontext란)\n- [Job vs Step ExecutionContext](#job-vs-step-executioncontext)\n- [데이터 저장과 조회](#데이터-저장과-조회)\n- [SpEL을 통한 Late Binding](#spel을-통한-late-binding)\n- [ItemStream 인터페이스](#itemstream-인터페이스)\n- [재시작 시나리오](#재시작-시나리오)\n- [lastProcessedId 심화](#lastprocessedid-심화)\n- [실무 활용 패턴](#실무-활용-패턴)\n- [주의사항](#주의사항)\n\n---\n\n## ExecutionContext란?\n\nExecutionContext는 배치 실행 중 **상태를 저장하는 키-값 저장소**다. 메타데이터 테이블에 직렬화되어 저장되므로, Job이 실패 후 재시작할 때 이전 상태를 복구할 수 있다.\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                      ExecutionContext 흐름                       │\n│                                                                  │\n│   Step 실행 중                    DB 메타데이터 테이블            │\n│   ┌──────────────┐               ┌──────────────────────┐       │\n│   │ ExecutionContext │  ──────▶  │ BATCH_STEP_EXECUTION  │       │\n│   │ {                │   직렬화   │ _CONTEXT              │       │\n│   │   \"lastId\": 500, │           │ ───────────────────── │       │\n│   │   \"count\": 1000  │           │ SHORT_CONTEXT (JSON)  │       │\n│   │ }                │           └──────────────────────┘       │\n│   └──────────────┘                                              │\n│         │                                                        │\n│         │ 재시작 시                                               │\n│         ▼                                                        │\n│   ┌──────────────┐                                              │\n│   │ 이전 상태 복구  │  ◀──────  DB에서 읽어옴                      │\n│   │ lastId = 500   │                                             │\n│   └──────────────┘                                              │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## Job vs Step ExecutionContext\n\n두 종류의 ExecutionContext가 있으며, **범위(scope)**가 다르다.\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                           Job                                    │\n│   ┌─────────────────────────────────────────────────────────┐   │\n│   │              JobExecutionContext                         │   │\n│   │              (Job 전체에서 공유)                          │   │\n│   │              예: 총 처리 건수, 전역 설정                   │   │\n│   └─────────────────────────────────────────────────────────┘   │\n│                                                                  │\n│   ┌──────────────┐   ┌──────────────┐   ┌──────────────┐       │\n│   │    Step 1     │   │    Step 2     │   │    Step 3     │       │\n│   │ ┌──────────┐ │   │ ┌──────────┐ │   │ ┌──────────┐ │       │\n│   │ │StepExec  │ │   │ │StepExec  │ │   │ │StepExec  │ │       │\n│   │ │Context   │ │   │ │Context   │ │   │ │Context   │ │       │\n│   │ │(Step 내) │ │   │ │(Step 내) │ │   │ │(Step 내) │ │       │\n│   │ └──────────┘ │   │ └──────────┘ │   │ └──────────┘ │       │\n│   └──────────────┘   └──────────────┘   └──────────────┘       │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 비교\n\n| 구분 | JobExecutionContext | StepExecutionContext |\n|------|---------------------|---------------------|\n| **범위** | Job 전체 | 해당 Step 내 |\n| **공유** | 모든 Step에서 접근 가능 | 해당 Step에서만 접근 |\n| **저장 테이블** | BATCH_JOB_EXECUTION_CONTEXT | BATCH_STEP_EXECUTION_CONTEXT |\n| **용도** | Step 간 데이터 전달, 전역 상태 | Step 내 진행 상태 추적 |\n\n### 접근 방법\n\n```java\n// Tasklet에서 접근\n@Bean\npublic Tasklet myTasklet() {\n    return (contribution, chunkContext) -> {\n        // StepExecutionContext\n        ExecutionContext stepContext = chunkContext.getStepContext()\n                .getStepExecution()\n                .getExecutionContext();\n\n        // JobExecutionContext\n        ExecutionContext jobContext = chunkContext.getStepContext()\n                .getStepExecution()\n                .getJobExecution()\n                .getExecutionContext();\n\n        // 데이터 저장\n        stepContext.putLong(\"lastProcessedId\", 12345L);\n        jobContext.putInt(\"totalProcessed\", 1000);\n\n        return RepeatStatus.FINISHED;\n    };\n}\n```\n\n---\n\n## 데이터 저장과 조회\n\n### 지원하는 데이터 타입\n\n```java\nExecutionContext context = stepExecution.getExecutionContext();\n\n// 기본 타입\ncontext.putString(\"status\", \"PROCESSING\");\ncontext.putLong(\"lastId\", 12345L);\ncontext.putInt(\"count\", 100);\ncontext.putDouble(\"rate\", 0.95);\n\n// 조회\nString status = context.getString(\"status\");\nLong lastId = context.getLong(\"lastId\");\nint count = context.getInt(\"count\");\ndouble rate = context.getDouble(\"rate\");\n\n// 기본값 지정\nLong id = context.getLong(\"lastId\", 0L);  // 없으면 0L 반환\n\n// 존재 여부 확인\nif (context.containsKey(\"lastId\")) {\n    // ...\n}\n```\n\n### 복합 객체 저장\n\n```java\n// 직렬화 가능한 객체 저장\ncontext.put(\"checkpoint\", new Checkpoint(lastId, lastDate));\n\n// 조회\nCheckpoint checkpoint = (Checkpoint) context.get(\"checkpoint\");\n\n// ⚠️ 주의: 객체는 Serializable 구현 필수\n@Data\npublic class Checkpoint implements Serializable {\n    private static final long serialVersionUID = 1L;\n    private Long lastId;\n    private LocalDate lastDate;\n}\n```\n\n### List/Map 저장\n\n```java\n// List 저장\nList<Long> processedIds = Arrays.asList(1L, 2L, 3L);\ncontext.put(\"processedIds\", new ArrayList<>(processedIds));\n\n// Map 저장\nMap<String, Integer> stats = new HashMap<>();\nstats.put(\"success\", 100);\nstats.put(\"failed\", 5);\ncontext.put(\"stats\", stats);\n\n// 조회\nList<Long> ids = (List<Long>) context.get(\"processedIds\");\nMap<String, Integer> savedStats = (Map<String, Integer>) context.get(\"stats\");\n```\n\n---\n\n## SpEL을 통한 Late Binding\n\n**@StepScope**와 **SpEL(Spring Expression Language)**을 조합하면, Step 실행 시점에 ExecutionContext 값을 주입받을 수 있다.\n\n### 기본 문법\n\n```java\n@Bean\n@StepScope  // 필수! Step 실행 시점에 빈 생성\npublic ItemReader<Customer> reader(\n        // StepExecutionContext에서 값 주입\n        @Value(\"#{stepExecutionContext['lastProcessedId']}\") Long lastId,\n\n        // JobExecutionContext에서 값 주입\n        @Value(\"#{jobExecutionContext['globalSetting']}\") String setting,\n\n        // JobParameters에서 값 주입\n        @Value(\"#{jobParameters['inputFile']}\") String inputFile) {\n\n    // lastId, setting, inputFile 사용\n}\n```\n\n### 상세 예시: 마지막 처리 ID 기반 재시작\n\n```java\n@Configuration\n@RequiredArgsConstructor\npublic class RestartableStepConfig {\n\n    private final DataSource dataSource;\n\n    /**\n     * 마지막으로 처리한 ID 이후부터 읽기 시작\n     * - 최초 실행: lastProcessedId = null → 0부터 시작\n     * - 재시작: lastProcessedId = 이전 마지막 ID → 그 이후부터\n     */\n    @Bean\n    @StepScope\n    public JdbcPagingItemReader<Customer> reader(\n            @Value(\"#{stepExecutionContext['lastProcessedId']}\") Long lastProcessedId) {\n\n        // null 처리 (최초 실행 시)\n        long startId = (lastProcessedId != null) ? lastProcessedId : 0L;\n\n        log.info(\"Reader 시작 ID: {}\", startId);\n\n        return new JdbcPagingItemReaderBuilder<Customer>()\n                .name(\"customerReader\")\n                .dataSource(dataSource)\n                .selectClause(\"SELECT id, name, email, status\")\n                .fromClause(\"FROM customers\")\n                .whereClause(\"WHERE id > :startId AND status = 'PENDING'\")\n                .parameterValues(Map.of(\"startId\", startId))\n                .sortKeys(Map.of(\"id\", Order.ASCENDING))\n                .pageSize(100)\n                .rowMapper(new BeanPropertyRowMapper<>(Customer.class))\n                .build();\n    }\n\n    /**\n     * 처리한 마지막 ID를 ExecutionContext에 저장\n     */\n    @Bean\n    public ItemWriter<Customer> writer() {\n        return new ItemWriter<>() {\n            @Override\n            public void write(Chunk<? extends Customer> customers) throws Exception {\n                // 실제 저장 로직\n                customerRepository.saveAll(customers.getItems());\n            }\n        };\n    }\n\n    /**\n     * Chunk 처리 후 마지막 ID 업데이트\n     */\n    @Bean\n    public StepExecutionListener lastIdTracker() {\n        return new StepExecutionListener() {\n            @Override\n            public ExitStatus afterStep(StepExecution stepExecution) {\n                // 마지막 처리 ID 로깅\n                Long lastId = stepExecution.getExecutionContext()\n                        .getLong(\"lastProcessedId\", 0L);\n                log.info(\"Step 완료 - 마지막 처리 ID: {}\", lastId);\n                return stepExecution.getExitStatus();\n            }\n        };\n    }\n\n    @Bean\n    public Step restartableStep(JobRepository jobRepository,\n                                PlatformTransactionManager transactionManager) {\n        return new StepBuilder(\"restartableStep\", jobRepository)\n                .<Customer, Customer>chunk(100, transactionManager)\n                .reader(reader(null))  // @StepScope로 실제 값은 런타임에 주입\n                .processor(processor())\n                .writer(writer())\n                .listener(lastIdTracker())\n                .listener(new ChunkListener() {\n                    @Override\n                    public void afterChunk(ChunkContext context) {\n                        // Chunk 완료 후 마지막 ID 저장\n                        StepExecution stepExecution = context.getStepContext()\n                                .getStepExecution();\n                        // ItemStream에서 저장됨 (아래 참고)\n                    }\n                })\n                .build();\n    }\n}\n```\n\n### null 안전 처리 (Elvis 연산자)\n\n```java\n// 방법 1: Elvis 연산자 (?:)\n@Value(\"#{stepExecutionContext['lastId'] ?: 0}\")\nLong lastId;  // null이면 0\n\n// 방법 2: 삼항 연산자\n@Value(\"#{stepExecutionContext['lastId'] != null ? stepExecutionContext['lastId'] : 0}\")\nLong lastId;\n\n// 방법 3: 코드에서 처리\n@Bean\n@StepScope\npublic ItemReader<Customer> reader(\n        @Value(\"#{stepExecutionContext['lastId']}\") Long lastId) {\n    long startId = Optional.ofNullable(lastId).orElse(0L);\n    // ...\n}\n```\n\n---\n\n## ItemStream 인터페이스\n\n**ItemStream**은 Reader/Writer가 ExecutionContext와 상호작용하는 표준 인터페이스다.\n\n```java\npublic interface ItemStream {\n    // Step 시작 시 호출 - ExecutionContext에서 상태 복구\n    void open(ExecutionContext executionContext);\n\n    // Chunk 완료 시 호출 - ExecutionContext에 상태 저장\n    void update(ExecutionContext executionContext);\n\n    // Step 종료 시 호출 - 리소스 정리\n    void close();\n}\n```\n\n### 동작 흐름\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                    ItemStream 라이프사이클                        │\n│                                                                  │\n│  Step 시작                                                       │\n│      │                                                           │\n│      ▼                                                           │\n│  ┌─────────────────────────────────────────────────────────┐    │\n│  │ open(executionContext)                                   │    │\n│  │   - DB에서 이전 ExecutionContext 로드                     │    │\n│  │   - 재시작이면 lastProcessedId 등 복구                    │    │\n│  └─────────────────────────────────────────────────────────┘    │\n│      │                                                           │\n│      ▼                                                           │\n│  ┌─────────────────────────────────────────────────────────┐    │\n│  │ Chunk 1: Read → Process → Write                          │    │\n│  │   └─▶ update(executionContext) - 진행 상태 저장           │    │\n│  │                                                           │    │\n│  │ Chunk 2: Read → Process → Write                          │    │\n│  │   └─▶ update(executionContext) - 진행 상태 저장           │    │\n│  │                                                           │    │\n│  │ ...반복...                                                │    │\n│  └─────────────────────────────────────────────────────────┘    │\n│      │                                                           │\n│      ▼                                                           │\n│  ┌─────────────────────────────────────────────────────────┐    │\n│  │ close()                                                   │    │\n│  │   - 리소스 정리 (파일 핸들, DB 커서 등)                    │    │\n│  └─────────────────────────────────────────────────────────┘    │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 커스텀 ItemStreamReader 구현\n\n```java\n@Component\n@Slf4j\npublic class RestartableApiReader implements ItemStreamReader<ApiData> {\n\n    private static final String LAST_OFFSET_KEY = \"lastOffset\";\n    private static final String TOTAL_READ_KEY = \"totalRead\";\n\n    private final ApiClient apiClient;\n\n    private int currentOffset = 0;\n    private int totalRead = 0;\n    private List<ApiData> buffer = new ArrayList<>();\n    private int bufferIndex = 0;\n\n    @Override\n    public void open(ExecutionContext executionContext) {\n        // 재시작 시 이전 상태 복구\n        if (executionContext.containsKey(LAST_OFFSET_KEY)) {\n            this.currentOffset = executionContext.getInt(LAST_OFFSET_KEY);\n            this.totalRead = executionContext.getInt(TOTAL_READ_KEY);\n            log.info(\"이전 상태 복구 - offset: {}, totalRead: {}\",\n                    currentOffset, totalRead);\n        } else {\n            log.info(\"신규 실행 시작\");\n        }\n    }\n\n    @Override\n    public ApiData read() {\n        // 버퍼가 비었으면 API 호출\n        if (bufferIndex >= buffer.size()) {\n            buffer = apiClient.fetchData(currentOffset, 100);\n            bufferIndex = 0;\n            currentOffset += 100;\n\n            if (buffer.isEmpty()) {\n                return null;  // 더 이상 데이터 없음\n            }\n        }\n\n        totalRead++;\n        return buffer.get(bufferIndex++);\n    }\n\n    @Override\n    public void update(ExecutionContext executionContext) {\n        // 현재 진행 상태 저장 (Chunk 완료마다 호출)\n        executionContext.putInt(LAST_OFFSET_KEY, currentOffset);\n        executionContext.putInt(TOTAL_READ_KEY, totalRead);\n        log.debug(\"상태 저장 - offset: {}, totalRead: {}\", currentOffset, totalRead);\n    }\n\n    @Override\n    public void close() {\n        buffer.clear();\n        log.info(\"Reader 종료 - 총 읽기: {}\", totalRead);\n    }\n}\n```\n\n### 커스텀 ItemStreamWriter 구현\n\n```java\n@Component\n@Slf4j\npublic class CheckpointWriter implements ItemStreamWriter<ProcessedData> {\n\n    private static final String LAST_WRITTEN_ID_KEY = \"lastWrittenId\";\n    private static final String WRITE_COUNT_KEY = \"writeCount\";\n\n    private final DataRepository repository;\n\n    private Long lastWrittenId = 0L;\n    private int writeCount = 0;\n\n    @Override\n    public void open(ExecutionContext executionContext) {\n        if (executionContext.containsKey(LAST_WRITTEN_ID_KEY)) {\n            this.lastWrittenId = executionContext.getLong(LAST_WRITTEN_ID_KEY);\n            this.writeCount = executionContext.getInt(WRITE_COUNT_KEY);\n            log.info(\"Writer 상태 복구 - lastWrittenId: {}\", lastWrittenId);\n        }\n    }\n\n    @Override\n    public void write(Chunk<? extends ProcessedData> items) throws Exception {\n        for (ProcessedData item : items) {\n            repository.save(item);\n            lastWrittenId = item.getId();\n            writeCount++;\n        }\n    }\n\n    @Override\n    public void update(ExecutionContext executionContext) {\n        executionContext.putLong(LAST_WRITTEN_ID_KEY, lastWrittenId);\n        executionContext.putInt(WRITE_COUNT_KEY, writeCount);\n    }\n\n    @Override\n    public void close() {\n        log.info(\"Writer 종료 - 총 쓰기: {}\", writeCount);\n    }\n}\n```\n\n---\n\n## 재시작 시나리오\n\n### 시나리오 1: 정상 재시작\n\n```\n[1차 실행]\nChunk 1: ID 1-100 처리 → ExecutionContext: {lastId: 100}\nChunk 2: ID 101-200 처리 → ExecutionContext: {lastId: 200}\nChunk 3: ID 201-300 처리 중 실패 ❌\n         → ExecutionContext: {lastId: 200} (Chunk 3은 롤백)\n\n[2차 실행 - 재시작]\nopen() 호출 → ExecutionContext에서 lastId: 200 복구\nChunk 3: ID 201-300 처리 (다시 시작) → 성공 ✅\nChunk 4: ID 301-400 처리 → 성공 ✅\n...완료\n```\n\n```jav
