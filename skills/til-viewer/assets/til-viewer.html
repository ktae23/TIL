    <script>const TIL_DATA = {"categories": {"AI": {"files": [{"filename": "llm-prompt-engineering.md", "title": "LLM 프롬프트 엔지니어링", "path": "AI/llm-prompt-engineering.md", "content": "# LLM 프롬프트 엔지니어링\n\nLLM(Large Language Model)을 효과적으로 활용하기 위한 프롬프트 설계 기법과 실무 베스트 프랙티스를 정리합니다. 기본 패턴부터 문서 OCR 정확도 향상을 위한 고급 기법까지 다룹니다.\n\n## 목차\n\n1. [기본 프롬프트 패턴](#1-기본-프롬프트-패턴)\n2. [시스템 프롬프트 설계](#2-시스템-프롬프트-설계)\n3. [문서 OCR 정확도 향상 베스트 프랙티스](#3-문서-ocr-정확도-향상-베스트-프랙티스)\n4. [일관성 확보 전략](#4-일관성-확보-전략)\n\n---\n\n## 1. 기본 프롬프트 패턴\n\n### 1.1 Zero-shot Prompting\n\n사전 예시 없이 직접 지시만으로 작업을 수행하는 방식입니다.\n\n**특징:**\n- 가장 단순한 형태의 프롬프트\n- 모델의 사전 학습된 지식에 의존\n- 단순하고 명확한 작업에 적합\n\n**예시:**\n```\n다음 텍스트의 감정을 분석해주세요: \"오늘 날씨가 정말 좋아서 기분이 좋다\"\n```\n\n**적합한 상황:**\n- 일반적이고 널리 알려진 작업\n- 명확한 지시가 가능한 경우\n- 빠른 프로토타이핑\n\n### 1.2 Few-shot Prompting\n\n몇 가지 예시를 제공하여 모델이 패턴을 학습하도록 유도하는 방식입니다.\n\n**특징:**\n- 예시를 통해 원하는 출력 형식을 명확히 전달\n- Zero-shot 대비 정확도 향상\n- 도메인 특화 작업에 효과적\n\n**예시:**\n```\n다음은 텍스트 감정 분석 예시입니다:\n\n텍스트: \"이 제품 정말 최고예요!\"\n감정: 긍정\n\n텍스트: \"배송이 너무 늦어서 실망했습니다\"\n감정: 부정\n\n텍스트: \"그냥 평범한 제품이에요\"\n감정: 중립\n\n텍스트: \"서비스가 친절하고 품질도 좋았습니다\"\n감정:\n```\n\n**Best Practice:**\n- 예시는 3-5개가 적당 (너무 많으면 컨텍스트 낭비)\n- 다양한 케이스를 커버하는 예시 선정\n- 예시의 형식을 일관되게 유지\n\n### 1.3 Chain of Thought (CoT) Prompting\n\n모델이 단계별로 사고 과정을 거쳐 답변하도록 유도하는 방식입니다.\n\n**특징:**\n- 복잡한 추론 문제에서 정확도 대폭 향상\n- 모델의 사고 과정을 투명하게 확인 가능\n- 디버깅과 검증이 용이\n\n**기본 CoT 예시:**\n```\n문제: 철수는 사과 5개를 가지고 있었습니다. 영희에게 2개를 주고,\n시장에서 3개를 더 샀습니다. 철수는 지금 사과를 몇 개 가지고 있나요?\n\n단계별로 생각해봅시다:\n1. 처음 가지고 있던 사과: 5개\n2. 영희에게 준 후: 5 - 2 = 3개\n3. 시장에서 산 후: 3 + 3 = 6개\n\n따라서 철수는 6개의 사과를 가지고 있습니다.\n```\n\n**Zero-shot CoT:**\n```\n다음 문제를 단계별로 생각하여 풀어주세요.\n(Let's think step by step)\n```\n\n### 1.4 Self-Consistency\n\n동일한 질문에 대해 여러 번 추론하고 가장 일관된 답을 선택하는 방식입니다.\n\n**구현 방법:**\n1. 동일한 프롬프트로 여러 번 (보통 3-5회) 응답 생성\n2. Temperature를 약간 높여 다양성 확보 (0.5-0.7)\n3. 다수결 또는 가중 투표로 최종 답변 결정\n\n**적합한 상황:**\n- 높은 정확도가 요구되는 작업\n- 계산이나 추론이 포함된 문제\n- 비용보다 정확도가 중요한 경우\n\n### 1.5 ReAct (Reasoning + Acting)\n\n추론과 행동을 번갈아 수행하며 외부 도구를 활용하는 패턴입니다.\n\n**구조:**\n```\nThought: 현재 상황 분석 및 다음 행동 계획\nAction: 수행할 작업 (검색, 계산 등)\nObservation: 행동의 결과\n... (반복)\nFinal Answer: 최종 답변\n```\n\n---\n\n## 2. 시스템 프롬프트 설계\n\n### 2.1 시스템 프롬프트의 역할\n\n시스템 프롬프트는 모델의 전반적인 행동 방식, 페르소나, 제약 조건을 정의합니다.\n\n**핵심 구성 요소:**\n\n| 구성 요소 | 설명 | 예시 |\n|----------|------|------|\n| 역할 정의 | 모델이 수행할 역할 | \"당신은 전문 번역가입니다\" |\n| 행동 지침 | 응답 방식 규칙 | \"항상 공손하게 응답합니다\" |\n| 제약 조건 | 하지 말아야 할 것 | \"개인정보를 요청하지 않습니다\" |\n| 출력 형식 | 응답 포맷 | \"JSON 형식으로 응답합니다\" |\n\n### 2.2 효과적인 시스템 프롬프트 구조\n\n```\n# 역할 및 목적\n당신은 [역할]입니다. 주요 목적은 [목적]입니다.\n\n# 핵심 능력\n- 능력 1\n- 능력 2\n- 능력 3\n\n# 응답 규칙\n1. [규칙 1]\n2. [규칙 2]\n3. [규칙 3]\n\n# 제약 사항\n- [제약 1]\n- [제약 2]\n\n# 출력 형식\n[원하는 출력 형식 명시]\n```\n\n### 2.3 시스템 프롬프트 작성 원칙\n\n**1. 명확성 (Clarity)**\n```\n❌ 좋은 응답을 해주세요\n✅ 모든 응답은 3문장 이내로 작성하고, 전문 용어 사용 시 괄호 안에 설명을 추가합니다\n```\n\n**2. 구체성 (Specificity)**\n```\n❌ 친절하게 대답하세요\n✅ 모든 응답의 시작은 \"안녕하세요,\"로 시작하고,\n   끝에는 \"추가 질문이 있으시면 말씀해주세요\"를 포함합니다\n```\n\n**3. 우선순위 명시**\n```\n다음 우선순위로 응답합니다:\n1. 정확성: 불확실한 정보는 \"확인이 필요합니다\"라고 명시\n2. 간결성: 핵심 내용을 먼저 전달\n3. 실용성: 바로 적용 가능한 예시 포함\n```\n\n---\n\n## 3. 문서 OCR 정확도 향상 베스트 프랙티스\n\nLLM의 비전 기능을 활용한 문서 텍스트 인식에서 정확도를 높이는 실무 기법입니다.\n\n### 3.1 이미지 전처리\n\n**해상도 최적화:**\n- 최소 150 DPI 이상 권장 (300 DPI 최적)\n- 이미지 크기: 긴 변 기준 1500-2000px 권장\n- 너무 큰 이미지는 리사이즈하여 처리 속도 개선\n\n**이미지 품질 개선:**\n```python\n# 전처리 예시\nfrom PIL import Image, ImageEnhance\n\ndef preprocess_image(image_path):\n    img = Image.open(image_path)\n\n    # 1. 그레이스케일 변환 (텍스트 인식에 유리)\n    img = img.convert('L')\n\n    # 2. 대비 향상\n    enhancer = ImageEnhance.Contrast(img)\n    img = enhancer.enhance(1.5)\n\n    # 3. 선명도 향상\n    enhancer = ImageEnhance.Sharpness(img)\n    img = enhancer.enhance(2.0)\n\n    return img\n```\n\n### 3.2 프롬프트 설계 전략\n\n**구조화된 추출 지시:**\n```\n이 문서 이미지에서 다음 정보를 추출해주세요:\n\n## 추출 규칙\n1. 텍스트를 있는 그대로 정확히 읽어주세요\n2. 불분명한 글자는 [불명확] 표시\n3. 표가 있는 경우 마크다운 표 형식으로 변환\n4. 빈 칸이나 체크박스는 □(미체크) 또는 ☑(체크)로 표시\n\n## 출력 형식\n{\n  \"title\": \"문서 제목\",\n  \"date\": \"날짜\",\n  \"content\": \"본문 내용\",\n  \"tables\": [...],\n  \"confidence\": \"high/medium/low\"\n}\n```\n\n**영역별 분할 처리:**\n```\n이 문서를 다음 영역으로 나누어 분석해주세요:\n\n1. 헤더 영역 (상단 20%): 제목, 날짜, 문서번호\n2. 본문 영역 (중앙 60%): 주요 내용\n3. 푸터 영역 (하단 20%): 서명, 직인, 페이지 번호\n\n각 영역별로 추출된 텍스트를 구분하여 제공해주세요.\n```\n\n### 3.3 정확도 향상 기법\n\n**1. 이중 검증 (Double Verification)**\n```\n## 1차 추출\n이미지의 텍스트를 추출해주세요.\n\n## 2차 검증\n추출한 텍스트를 다시 이미지와 비교하여:\n- 오탈자 가능성이 있는 부분 표시\n- 숫자의 정확성 재확인\n- 날짜 형식 검증\n```\n\n**2. 맥락 기반 보정:**\n```\n이 문서는 [문서 유형]입니다.\n\n다음 도메인 지식을 참고하여 텍스트를 보정해주세요:\n- 회사명은 \"ABC주식회사\"입니다\n- 날짜 형식은 YYYY년 MM월 DD일 입니다\n- 금액은 원화(₩) 단위입니다\n\n추출된 텍스트 중 위 정보와 맞지 않는 부분은 재검토해주세요.\n```\n\n**3. 특정 필드 집중 추출:**\n```\n이 영수증 이미지에서 다음 필드만 정확히 추출해주세요:\n\n| 필드 | 위치 힌트 | 형식 |\n|-----|---------|------|\n| 총금액 | 하단, \"합계\" 옆 | 숫자만 (쉼표 포함 가능) |\n| 날짜 | 상단 | YYYY-MM-DD |\n| 상호명 | 최상단 | 텍스트 |\n\n각 필드의 confidence score (0-100)도 함께 제공해주세요.\n```\n\n### 3.4 편차 줄이기 전략\n\n**Temperature 설정:**\n- OCR 작업: `temperature: 0` 권장 (결정적 출력)\n- 창의적 해석 불필요한 작업에서는 낮은 temperature 유지\n\n**출력 형식 고정:**\n```json\n{\n  \"extracted_text\": \"추출된 원본 텍스트\",\n  \"structured_data\": {\n    \"field1\": \"value1\",\n    \"field2\": \"value2\"\n  },\n  \"metadata\": {\n    \"confidence\": 0.95,\n    \"unclear_sections\": [\"2번째 줄 3번째 단어\"],\n    \"processing_notes\": \"우측 상단 일부 잘림\"\n  }\n}\n```\n\n---\n\n## 4. 일관성 확보 전략\n\n### 4.1 출력 스키마 정의\n\n**JSON Schema 활용:**\n```json\n{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"type\": \"object\",\n  \"required\": [\"result\", \"confidence\"],\n  \"properties\": {\n    \"result\": {\n      \"type\": \"string\",\n      \"description\": \"추출된 텍스트\"\n    },\n    \"confidence\": {\n      \"type\": \"number\",\n      \"minimum\": 0,\n      \"maximum\": 1\n    }\n  }\n}\n```\n\n### 4.2 검증 레이어 구축\n\n**다단계 검증 파이프라인:**\n\n```\n[이미지 입력]\n    ↓\n[1차 추출] → LLM (temperature: 0)\n    ↓\n[형식 검증] → JSON Schema 검증\n    ↓\n[내용 검증] → 비즈니스 규칙 체크\n    ↓\n[2차 확인] → 불확실 항목 재처리\n    ↓\n[최종 출력]\n```\n\n### 4.3 에러 처리 전략\n\n**Fallback 체인:**\n```\n1차 시도: GPT-4 Vision\n    ↓ (실패 시)\n2차 시도: 이미지 전처리 후 재시도\n    ↓ (실패 시)\n3차 시도: 이미지 분할 후 부분 처리\n    ↓ (실패 시)\n수동 검토 대기열로 이동\n```\n\n**불확실성 표현:**\n```\n다음 규칙으로 불확실한 부분을 표시해주세요:\n\n- 확실함: 그대로 출력\n- 불확실함 (70-90% 확신): 텍스트 뒤에 (?) 표시\n- 매우 불확실함 (50-70%): [추정: 텍스트] 형식\n- 인식 불가 (<50%): [인식불가] 표시\n```\n\n### 4.4 실무 체크리스트\n\n| 항목 | 확인 사항 |\n|-----|----------|\n| 이미지 품질 | 해상도, 조명, 기울기 보정 |\n| 프롬프트 | 구체적 지시, 출력 형식 명시 |\n| 파라미터 | temperature: 0, 적절한 max_tokens |\n| 검증 | 스키마 검증, 비즈니스 규칙 체크 |\n| 에러 처리 | Fallback 로직, 재시도 전략 |\n| 모니터링 | 정확도 지표, 실패율 추적 |\n\n---\n\n## 참고 자료\n\n- [OpenAI Prompt Engineering Guide](https://platform.openai.com/docs/guides/prompt-engineering)\n- [Anthropic Claude Documentation](https://docs.anthropic.com/)\n- [Chain-of-Thought Prompting Paper](https://arxiv.org/abs/2201.11903)\n\n---\n\n*마지막 업데이트: 2024년 12월*\n", "size": 10679, "lines": 403}, {"filename": "rag-패턴.md", "title": "RAG 패턴 (Retrieval-Augmented Generation)", "path": "AI/rag-패턴.md", "content": "# RAG 패턴 (Retrieval-Augmented Generation)\n\nRAG는 대규모 언어 모델(LLM)의 성능을 향상시키기 위해 외부 지식 검색을 결합한 아키텍처 패턴입니다. LLM의 환각(hallucination) 문제를 완화하고, 최신 정보나 도메인 특화 지식을 활용할 수 있게 해줍니다.\n\n## 목차\n\n- [RAG란 무엇인가?](#rag란-무엇인가)\n- [RAG가 필요한 이유](#rag가-필요한-이유)\n- [RAG의 기본 구조](#rag의-기본-구조)\n- [RAG의 핵심 구성 요소](#rag의-핵심-구성-요소)\n- [RAG의 작동 방식](#rag의-작동-방식)\n- [RAG의 장단점](#rag의-장단점)\n- [실제 활용 사례](#실제-활용-사례)\n\n---\n\n## RAG란 무엇인가?\n\n**RAG (Retrieval-Augmented Generation)**는 2020년 Meta AI가 제안한 자연어 처리 아키텍처로, 다음 두 가지를 결합합니다:\n\n1. **Retrieval (검색)**: 외부 데이터베이스나 문서에서 관련 정보를 검색\n2. **Generation (생성)**: 검색된 정보를 기반으로 LLM이 응답 생성\n\n기존 LLM은 학습 데이터에만 의존하지만, RAG는 실시간으로 외부 지식을 참조하여 더 정확하고 최신의 답변을 제공합니다.\n\n---\n\n## RAG가 필요한 이유\n\n### 1. LLM의 근본적인 한계\n\n**환각 현상 (Hallucination)**\n- LLM은 그럴듯하지만 사실이 아닌 정보를 생성할 수 있습니다\n- 학습 데이터에 없는 내용을 추측하여 만들어냅니다\n\n**지식의 시간적 한계**\n- 모델은 학습 시점까지의 데이터만 알고 있습니다\n- 최신 정보나 실시간 데이터에 접근할 수 없습니다\n\n**도메인 지식 부족**\n- 특정 기업이나 조직의 내부 문서, 전문 지식은 학습되지 않았습니다\n- 일반적인 지식만 제공할 수 있습니다\n\n### 2. RAG의 해결책\n\nRAG는 이러한 문제를 **외부 지식 소스를 실시간으로 참조**함으로써 해결합니다:\n\n- 검색된 실제 문서를 기반으로 답변 → 환각 감소\n- 최신 문서를 인덱싱하여 검색 → 최신 정보 제공\n- 회사 내부 문서, 매뉴얼 등을 지식 베이스로 활용 → 도메인 특화\n\n---\n\n## RAG의 기본 구조\n\n```\n[사용자 질문]\n       ↓\n[질문 임베딩 벡터화]\n       ↓\n[벡터 DB에서 유사 문서 검색] ← [지식 베이스 (문서들)]\n       ↓\n[검색된 문서 + 원래 질문]\n       ↓\n[LLM이 컨텍스트 기반 응답 생성]\n       ↓\n[최종 답변]\n```\n\n---\n\n## RAG의 핵심 구성 요소\n\n### 1. 지식 베이스 (Knowledge Base)\n\n외부 정보의 원천이 되는 문서 저장소입니다.\n\n- **형태**: PDF, 웹페이지, 데이터베이스, API 응답 등\n- **예시**:\n  - 회사 내부 문서, 기술 문서\n  - 뉴스 기사, 위키피디아\n  - 제품 매뉴얼, FAQ\n\n### 2. 임베딩 모델 (Embedding Model)\n\n텍스트를 벡터로 변환하여 의미적 유사도를 계산할 수 있게 합니다.\n\n- **역할**: 문서와 질문을 같은 벡터 공간에 표현\n- **대표 모델**:\n  - OpenAI의 `text-embedding-ada-002`\n  - Sentence Transformers\n  - Cohere Embed\n\n**임베딩 과정**:\n```\n\"RAG란 무엇인가?\"\n  ↓ 임베딩\n[0.234, -0.521, 0.892, ..., 0.123]  (벡터)\n```\n\n### 3. 벡터 데이터베이스 (Vector Database)\n\n임베딩된 문서들을 저장하고, 질문과 유사한 문서를 빠르게 검색합니다.\n\n- **대표적인 벡터 DB**:\n  - Pinecone\n  - Weaviate\n  - Chroma\n  - FAISS (Facebook AI Similarity Search)\n\n- **검색 방식**: 코사인 유사도(Cosine Similarity)를 사용하여 가장 관련성 높은 문서 찾기\n\n### 4. 리트리버 (Retriever)\n\n사용자 질문과 관련된 문서를 벡터 DB에서 검색하는 컴포넌트입니다.\n\n- **검색 전략**:\n  - Top-K 검색: 가장 유사한 상위 K개 문서 반환\n  - Threshold 기반: 유사도가 일정 수준 이상인 문서만 반환\n\n### 5. 생성 모델 (Generator - LLM)\n\n검색된 문서를 컨텍스트로 받아 최종 답변을 생성합니다.\n\n- **대표 모델**:\n  - GPT-4, GPT-3.5\n  - Claude\n  - LLaMA\n  - PaLM\n\n---\n\n## RAG의 작동 방식\n\n### 단계별 프로세스\n\n**1단계: 지식 베이스 구축 (사전 작업)**\n\n```\n원본 문서들\n    ↓ 청크 분할 (Chunking)\n작은 단위 텍스트 조각들\n    ↓ 임베딩\n벡터들\n    ↓ 저장\n벡터 데이터베이스\n```\n\n**청크 분할 예시**:\n```\n원본: 5000자 문서\n  ↓\n청크1: 500자 (오버랩 50자)\n청크2: 500자 (오버랩 50자)\n청크3: 500자 (오버랩 50자)\n...\n```\n\n**2단계: 질문 처리 (실시간)**\n\n```\n사용자: \"RAG의 장점은 무엇인가요?\"\n    ↓ 임베딩\n질문 벡터 [0.123, 0.456, ...]\n    ↓ 벡터 DB 검색 (유사도 계산)\n관련 문서 청크 3개 검색\n    ↓ 프롬프트 구성\n\"다음 문서를 참고하여 답변하세요:\n[검색된 문서1]\n[검색된 문서2]\n[검색된 문서3]\n\n질문: RAG의 장점은 무엇인가요?\"\n    ↓ LLM 생성\n최종 답변\n```\n\n### 프롬프트 구성 예시\n\n```\nYou are a helpful assistant. Answer the question based on the context below.\n\nContext:\n\"\"\"\n[검색된 문서1 내용]\n[검색된 문서2 내용]\n[검색된 문서3 내용]\n\"\"\"\n\nQuestion: RAG의 장점은 무엇인가요?\n\nAnswer: [LLM이 생성]\n```\n\n---\n\n## RAG의 장단점\n\n### 장점\n\n| 장점 | 설명 |\n|------|------|\n| **환각 감소** | 실제 문서 기반 답변으로 신뢰성 향상 |\n| **최신 정보** | 지식 베이스 업데이트만으로 최신 정보 반영 가능 |\n| **도메인 특화** | 특정 조직/분야의 지식을 쉽게 통합 |\n| **비용 효율적** | 전체 모델 재학습 없이 지식 확장 가능 |\n| **출처 추적** | 답변의 근거가 된 문서를 제시 가능 |\n| **프라이버시** | 민감한 데이터를 모델 학습 없이 활용 |\n\n### 단점\n\n| 단점 | 설명 |\n|------|------|\n| **검색 품질 의존** | 관련 문서를 찾지 못하면 답변 품질 저하 |\n| **지연 시간** | 검색 과정으로 인한 응답 시간 증가 |\n| **컨텍스트 길이 제한** | LLM의 토큰 제한으로 많은 문서 참조 불가 |\n| **인프라 복잡도** | 벡터 DB, 임베딩 모델 등 추가 시스템 필요 |\n| **청킹 전략** | 문서 분할 방식에 따라 성능 크게 달라짐 |\n\n---\n\n## 실제 활용 사례\n\n### 1. 고객 지원 챗봇\n\n**시나리오**: 제품 매뉴얼 기반 고객 문의 응답\n\n- **지식 베이스**: 제품 매뉴얼, FAQ, 이전 고객 문의 기록\n- **효과**: 정확한 제품 정보 제공, 고객 만족도 향상\n\n### 2. 기업 내부 지식 검색\n\n**시나리오**: 직원들이 사내 문서를 자연어로 검색\n\n- **지식 베이스**: 회의록, 정책 문서, 프로젝트 문서\n- **효과**: 빠른 정보 접근, 업무 효율성 증대\n\n### 3. 법률/의료 자문\n\n**시나리오**: 전문 지식 기반 초안 작성 지원\n\n- **지식 베이스**: 법률 판례, 의학 논문, 가이드라인\n- **효과**: 전문가의 의사결정 지원, 참고 자료 빠른 검색\n\n### 4. 코드 문서화 도우미\n\n**시나리오**: 코드베이스 질의응답\n\n- **지식 베이스**: 코드, API 문서, 커밋 히스토리\n- **효과**: 신입 개발자 온보딩, 코드 이해도 향상\n\n---\n\n## 참고 자료\n\n- [RAG 원논문: \"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\" (Lewis et al., 2020)](https://arxiv.org/abs/2005.11401)\n- [LangChain RAG Tutorial](https://python.langchain.com/docs/use_cases/question_answering/)\n- [OpenAI Embeddings Guide](https://platform.openai.com/docs/guides/embeddings)\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 7563, "lines": 263}]}, "DB": {"files": [{"filename": "mysql-lock-types.md", "title": "MySQL Lock 종류", "path": "DB/mysql-lock-types.md", "content": "# MySQL Lock 종류\n\nMySQL에서 동시성 제어를 위해 사용되는 다양한 Lock의 종류와 특징을 정리한다.\n\n## 목차\n\n- [Lock의 기본 개념](#lock의-기본-개념)\n- [Lock 종류 비교](#lock-종류-비교)\n- [Lock 레벨별 분류](#lock-레벨별-분류)\n- [InnoDB Lock 종류](#innodb-lock-종류)\n- [Lock 확인 방법](#lock-확인-방법)\n\n---\n\n## Lock의 기본 개념\n\nLock은 여러 트랜잭션이 동시에 같은 데이터에 접근할 때 **데이터 일관성**을 보장하기 위한 메커니즘이다.\n\n---\n\n## Lock 종류 비교\n\n### Shared Lock vs Exclusive Lock\n\n| 구분 | Shared Lock (S Lock) | Exclusive Lock (X Lock) |\n|------|---------------------|------------------------|\n| **용도** | 읽기 작업 | 쓰기 작업 |\n| **다른 S Lock과 호환** | O (호환) | X (비호환) |\n| **다른 X Lock과 호환** | X (비호환) | X (비호환) |\n| **발생 시점** | `SELECT ... FOR SHARE` | `SELECT ... FOR UPDATE`, `UPDATE`, `DELETE` |\n| **특징** | 여러 트랜잭션이 동시에 읽기 가능 | 하나의 트랜잭션만 쓰기 가능 |\n\n### Lock 호환성 매트릭스\n\n|  | S Lock | X Lock |\n|--|--------|--------|\n| **S Lock** | 호환 | 비호환 |\n| **X Lock** | 비호환 | 비호환 |\n\n---\n\n## Lock 레벨별 분류\n\n| Lock 레벨 | 설명 | 장점 | 단점 |\n|-----------|------|------|------|\n| **Global Lock** | 데이터베이스 전체에 Lock | 단순함 | 동시성 매우 낮음 |\n| **Table Lock** | 테이블 단위 Lock | 구현 단순, 오버헤드 적음 | 동시성 낮음 |\n| **Row Lock** | 행 단위 Lock | 높은 동시성 | 오버헤드 큼, Deadlock 가능성 |\n\n---\n\n## InnoDB Lock 종류\n\n### Record Lock\n\n- **정의**: 인덱스 레코드에 거는 Lock\n- **특징**: 테이블에 인덱스가 없어도 숨겨진 Clustered Index를 사용\n\n```sql\n-- Record Lock 발생 예시\nSELECT * FROM users WHERE id = 1 FOR UPDATE;\n```\n\n### Gap Lock\n\n- **정의**: 인덱스 레코드 사이의 간격(Gap)에 거는 Lock\n- **용도**: Phantom Read 방지\n- **특징**: 범위 내 새로운 레코드 삽입 방지\n\n```sql\n-- Gap Lock 발생 예시 (id가 10~20 사이에 Lock)\nSELECT * FROM users WHERE id BETWEEN 10 AND 20 FOR UPDATE;\n```\n\n### Next-Key Lock\n\n- **정의**: Record Lock + Gap Lock의 조합\n- **특징**: InnoDB의 기본 Lock 방식 (REPEATABLE READ)\n\n| Lock 종류 | 잠금 범위 | Phantom Read 방지 |\n|-----------|----------|------------------|\n| Record Lock | 해당 레코드만 | X |\n| Gap Lock | 레코드 사이 간격 | O |\n| Next-Key Lock | 레코드 + 앞쪽 간격 | O |\n\n### Insert Intention Lock\n\n- **정의**: INSERT 전에 획득하는 특수한 Gap Lock\n- **특징**: 같은 Gap 내 서로 다른 위치에 INSERT하는 경우 서로 대기하지 않음\n\n### Auto-Increment Lock\n\n- **정의**: AUTO_INCREMENT 컬럼 값 생성 시 사용되는 테이블 레벨 Lock\n- **모드**: `innodb_autoinc_lock_mode` 설정으로 제어\n\n| 모드 | 값 | 설명 |\n|------|---|------|\n| Traditional | 0 | 모든 INSERT에 테이블 Lock |\n| Consecutive | 1 | 단순 INSERT는 Mutex, Bulk INSERT는 테이블 Lock |\n| Interleaved | 2 | Lock 없이 Mutex만 사용 (가장 빠름) |\n\n---\n\n## Lock 확인 방법\n\n### 현재 Lock 상태 확인\n\n```sql\n-- InnoDB Lock 정보 조회\nSELECT * FROM performance_schema.data_locks;\n\n-- Lock 대기 정보 조회\nSELECT * FROM performance_schema.data_lock_waits;\n\n-- InnoDB 상태 확인\nSHOW ENGINE INNODB STATUS;\n```\n\n### Deadlock 로그 확인\n\n```sql\n-- 최근 Deadlock 정보\nSHOW ENGINE INNODB STATUS\\G\n```\n\n---\n\n## 정리\n\n| Lock 종류 | 잠금 대상 | 주요 용도 |\n|-----------|----------|----------|\n| Shared Lock | 레코드 | 읽기 보호 |\n| Exclusive Lock | 레코드 | 쓰기 보호 |\n| Record Lock | 인덱스 레코드 | 특정 행 보호 |\n| Gap Lock | 인덱스 간격 | Phantom Read 방지 |\n| Next-Key Lock | 레코드 + 간격 | 기본 Lock 방식 |\n| Insert Intention Lock | 간격 | INSERT 동시성 향상 |\n| Auto-Increment Lock | 테이블 | AUTO_INCREMENT 값 생성 |\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 4089, "lines": 143}]}, "algorithm": {"files": [{"filename": "advanced-algorithms.md", "title": "고급 알고리즘", "path": "algorithm/advanced-algorithms.md", "content": "# 고급 알고리즘\n\n효율성과 최적화가 중요한 고급 알고리즘들을 다룹니다. 힙 정렬, 최단 경로 알고리즘, 고급 동적 프로그래밍을 학습합니다.\n\n## 목차\n1. [고급 정렬 - 힙 정렬](#고급-정렬---힙-정렬)\n2. [최단 경로 알고리즘](#최단-경로-알고리즘)\n3. [고급 동적 프로그래밍](#고급-동적-프로그래밍)\n4. [고급 조합 최적화](#고급-조합-최적화)\n\n---\n\n## 고급 정렬 - 힙 정렬\n\n### 힙 정렬 (Heap Sort)\n\n**개념**: 힙(Heap) 자료구조를 이용한 정렬입니다. 최대 힙을 구성한 후, 루트 노드(최댓값)를 배열 끝으로 보내는 과정을 반복합니다.\n\n**힙이란?**: 완전 이진 트리의 일종으로, 부모 노드가 자식 노드보다 크거나(최대 힙) 작습니다(최소 힙).\n\n**시간 복잡도**: O(n log n) - 모든 경우\n**공간 복잡도**: O(1) - 제자리 정렬\n\n```java\npublic class HeapSort {\n    public static void heapSort(int[] arr) {\n        int n = arr.length;\n\n        // 1단계: 최대 힙 구성 (Heapify)\n        // 마지막 부모 노드부터 루트까지 heapify\n        for (int i = n / 2 - 1; i >= 0; i--) {\n            heapify(arr, n, i);\n        }\n\n        // 2단계: 하나씩 원소를 힙에서 꺼내어 정렬\n        for (int i = n - 1; i > 0; i--) {\n            // 루트(최댓값)를 끝으로 이동\n            int temp = arr[0];\n            arr[0] = arr[i];\n            arr[i] = temp;\n\n            // 축소된 힙에 대해 heapify\n            heapify(arr, i, 0);\n        }\n    }\n\n    // 서브트리를 힙으로 만드는 함수\n    private static void heapify(int[] arr, int n, int i) {\n        int largest = i;        // 루트를 최댓값으로 가정\n        int left = 2 * i + 1;   // 왼쪽 자식\n        int right = 2 * i + 2;  // 오른쪽 자식\n\n        // 왼쪽 자식이 루트보다 크면\n        if (left < n && arr[left] > arr[largest]) {\n            largest = left;\n        }\n\n        // 오른쪽 자식이 현재 최댓값보다 크면\n        if (right < n && arr[right] > arr[largest]) {\n            largest = right;\n        }\n\n        // 최댓값이 루트가 아니면\n        if (largest != i) {\n            int swap = arr[i];\n            arr[i] = arr[largest];\n            arr[largest] = swap;\n\n            // 재귀적으로 영향받은 서브트리를 heapify\n            heapify(arr, n, largest);\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {12, 11, 13, 5, 6, 7};\n        heapSort(arr);\n        System.out.println(Arrays.toString(arr));\n        // 출력: [5, 6, 7, 11, 12, 13]\n    }\n}\n```\n\n---\n\n## 최단 경로 알고리즘\n\n그래프에서 두 정점 간의 최단 경로를 찾는 알고리즘들입니다.\n\n### 1. 다익스트라 알고리즘 (Dijkstra's Algorithm)\n\n**개념**: 하나의 시작 정점에서 다른 모든 정점까지의 최단 경로를 찾습니다. **양의 가중치**만 허용합니다.\n\n**시간 복잡도**:\n- 인접 행렬: O(V²)\n- 우선순위 큐 사용: O((V + E) log V)\n**공간 복잡도**: O(V)\n\n```java\nimport java.util.*;\n\nclass Edge {\n    int target, weight;\n\n    Edge(int target, int weight) {\n        this.target = target;\n        this.weight = weight;\n    }\n}\n\nclass Node implements Comparable<Node> {\n    int vertex, distance;\n\n    Node(int vertex, int distance) {\n        this.vertex = vertex;\n        this.distance = distance;\n    }\n\n    @Override\n    public int compareTo(Node other) {\n        return Integer.compare(this.distance, other.distance);\n    }\n}\n\npublic class Dijkstra {\n    private int V;\n    private List<List<Edge>> adj;\n\n    public Dijkstra(int v) {\n        V = v;\n        adj = new ArrayList<>();\n        for (int i = 0; i < v; i++) {\n            adj.add(new ArrayList<>());\n        }\n    }\n\n    public void addEdge(int source, int target, int weight) {\n        adj.get(source).add(new Edge(target, weight));\n    }\n\n    public int[] dijkstra(int start) {\n        int[] dist = new int[V];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[start] = 0;\n\n        PriorityQueue<Node> pq = new PriorityQueue<>();\n        pq.offer(new Node(start, 0));\n\n        boolean[] visited = new boolean[V];\n\n        while (!pq.isEmpty()) {\n            Node current = pq.poll();\n            int u = current.vertex;\n\n            if (visited[u]) continue;\n            visited[u] = true;\n\n            // 인접한 모든 정점 확인\n            for (Edge edge : adj.get(u)) {\n                int v = edge.target;\n                int weight = edge.weight;\n\n                // 더 짧은 경로를 발견하면 업데이트\n                if (dist[u] + weight < dist[v]) {\n                    dist[v] = dist[u] + weight;\n                    pq.offer(new Node(v, dist[v]));\n                }\n            }\n        }\n\n        return dist;\n    }\n\n    public static void main(String[] args) {\n        Dijkstra graph = new Dijkstra(5);\n\n        graph.addEdge(0, 1, 10);\n        graph.addEdge(0, 4, 5);\n        graph.addEdge(1, 2, 1);\n        graph.addEdge(1, 4, 2);\n        graph.addEdge(2, 3, 4);\n        graph.addEdge(3, 2, 6);\n        graph.addEdge(3, 0, 7);\n        graph.addEdge(4, 1, 3);\n        graph.addEdge(4, 2, 9);\n        graph.addEdge(4, 3, 2);\n\n        int[] distances = graph.dijkstra(0);\n\n        System.out.println(\"정점 0에서 각 정점까지의 최단 거리:\");\n        for (int i = 0; i < distances.length; i++) {\n            System.out.println(\"0 -> \" + i + \": \" + distances[i]);\n        }\n    }\n}\n```\n\n### 2. 벨만-포드 알고리즘 (Bellman-Ford Algorithm)\n\n**개념**: 다익스트라와 달리 **음의 가중치**도 허용하며, **음의 사이클** 검출이 가능합니다.\n\n**시간 복잡도**: O(VE)\n**공간 복잡도**: O(V)\n\n```java\nimport java.util.*;\n\nclass WeightedEdge {\n    int source, target, weight;\n\n    WeightedEdge(int source, int target, int weight) {\n        this.source = source;\n        this.target = target;\n        this.weight = weight;\n    }\n}\n\npublic class BellmanFord {\n    private int V, E;\n    private List<WeightedEdge> edges;\n\n    public BellmanFord(int v, int e) {\n        V = v;\n        E = e;\n        edges = new ArrayList<>();\n    }\n\n    public void addEdge(int source, int target, int weight) {\n        edges.add(new WeightedEdge(source, target, weight));\n    }\n\n    public int[] bellmanFord(int start) {\n        int[] dist = new int[V];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[start] = 0;\n\n        // V-1번 반복하여 최단 거리 갱신\n        for (int i = 0; i < V - 1; i++) {\n            for (WeightedEdge edge : edges) {\n                int u = edge.source;\n                int v = edge.target;\n                int weight = edge.weight;\n\n                if (dist[u] != Integer.MAX_VALUE && dist[u] + weight < dist[v]) {\n                    dist[v] = dist[u] + weight;\n                }\n            }\n        }\n\n        // 음의 사이클 검출\n        for (WeightedEdge edge : edges) {\n            int u = edge.source;\n            int v = edge.target;\n            int weight = edge.weight;\n\n            if (dist[u] != Integer.MAX_VALUE && dist[u] + weight < dist[v]) {\n                System.out.println(\"음의 사이클이 존재합니다!\");\n                return null;\n            }\n        }\n\n        return dist;\n    }\n\n    public static void main(String[] args) {\n        BellmanFord graph = new BellmanFord(5, 8);\n\n        graph.addEdge(0, 1, -1);\n        graph.addEdge(0, 2, 4);\n        graph.addEdge(1, 2, 3);\n        graph.addEdge(1, 3, 2);\n        graph.addEdge(1, 4, 2);\n        graph.addEdge(3, 2, 5);\n        graph.addEdge(3, 1, 1);\n        graph.addEdge(4, 3, -3);\n\n        int[] distances = graph.bellmanFord(0);\n\n        if (distances != null) {\n            System.out.println(\"정점 0에서 각 정점까지의 최단 거리:\");\n            for (int i = 0; i < distances.length; i++) {\n                System.out.println(\"0 -> \" + i + \": \" +\n                    (distances[i] == Integer.MAX_VALUE ? \"∞\" : distances[i]));\n            }\n        }\n    }\n}\n```\n\n### 3. 플로이드-워셜 알고리즘 (Floyd-Warshall Algorithm)\n\n**개념**: **모든 정점 쌍** 간의 최단 거리를 구합니다. 동적 프로그래밍을 사용합니다.\n\n**시간 복잡도**: O(V³)\n**공간 복잡도**: O(V²)\n\n```java\npublic class FloydWarshall {\n    final static int INF = 99999;\n\n    public static void floydWarshall(int[][] graph, int V) {\n        int[][] dist = new int[V][V];\n\n        // 거리 배열 초기화\n        for (int i = 0; i < V; i++) {\n            for (int j = 0; j < V; j++) {\n                dist[i][j] = graph[i][j];\n            }\n        }\n\n        // k: 경유 정점\n        for (int k = 0; k < V; k++) {\n            // i: 시작 정점\n            for (int i = 0; i < V; i++) {\n                // j: 도착 정점\n                for (int j = 0; j < V; j++) {\n                    // i -> j 직접 vs i -> k -> j 비교\n                    if (dist[i][k] + dist[k][j] < dist[i][j]) {\n                        dist[i][j] = dist[i][k] + dist[k][j];\n                    }\n                }\n            }\n        }\n\n        // 결과 출력\n        printSolution(dist, V);\n    }\n\n    private static void printSolution(int[][] dist, int V) {\n        System.out.println(\"모든 정점 쌍의 최단 거리:\");\n        for (int i = 0; i < V; i++) {\n            for (int j = 0; j < V; j++) {\n                if (dist[i][j] == INF) {\n                    System.out.print(\"INF \");\n                } else {\n                    System.out.printf(\"%3d \", dist[i][j]);\n                }\n            }\n            System.out.println();\n        }\n    }\n\n    public static void main(String[] args) {\n        int V = 4;\n        int[][] graph = {\n            {0, 5, INF, 10},\n            {INF, 0, 3, INF},\n            {INF, INF, 0, 1},\n            {INF, INF, INF, 0}\n        };\n\n        floydWarshall(graph, V);\n    }\n}\n```\n\n---\n\n## 고급 동적 프로그래밍\n\n### 1. 최장 공통 부분 수열 (LCS - Longest Common Subsequence)\n\n**개념**: 두 문자열에서 공통으로 나타나는 가장 긴 부분 수열을 찾습니다. (연속적일 필요 없음)\n\n**시간 복잡도**: O(m × n)\n**공간 복잡도**: O(m × n)\n\n```java\npublic class LCS {\n    public static int lcs(String text1, String text2) {\n        int m = text1.length();\n        int n = text2.length();\n\n        int[][] dp = new int[m + 1][n + 1];\n\n        // DP 테이블 채우기\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (text1.charAt(i - 1) == text2.charAt(j - 1)) {\n                    // 문자가 같으면 이전 대각선 값 + 1\n                    dp[i][j] = dp[i - 1][j - 1] + 1;\n                } else {\n                    // 문자가 다르면 위 또는 왼쪽 중 큰 값\n                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n    // LCS 문자열 복원\n    public static String getLCSString(String text1, String text2) {\n        int m = text1.length();\n        int n = text2.length();\n        int[][] dp = new int[m + 1][n + 1];\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (text1.charAt(i - 1) == text2.charAt(j - 1)) {\n                    dp[i][j] = dp[i - 1][j - 1] + 1;\n                } else {\n                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);\n                }\n            }\n        }\n\n        // 역추적으로 LCS 문자열 구성\n        StringBuilder lcs = new StringBuilder();\n        int i = m, j = n;\n\n        while (i > 0 && j > 0) {\n            if (text1.charAt(i - 1) == text2.charAt(j - 1)) {\n                lcs.append(text1.charAt(i - 1));\n                i--;\n                j--;\n            } else if (dp[i - 1][j] > dp[i][j - 1]) {\n                i--;\n            } else {\n                j--;\n            }\n        }\n\n        return lcs.reverse().toString();\n    }\n\n    public static void main(String[] args) {\n        String text1 = \"ABCDGH\";\n        String text2 = \"AEDFHR\";\n\n        System.out.println(\"LCS 길이: \" + lcs(text1, text2)); // 3\n        System.out.println(\"LCS: \" + getLCSString(text1, text2)); // ADH\n    }\n}\n```\n\n### 2. 배낭 문제 (Knapsack Problem)\n\n**개념**: 무게 제한이 있는 배낭에 최대 가치를 갖도록 물건을 넣는 문제입니다.\n\n**0/1 배낭 문제**: 각 물건을 넣거나 넣지 않거나 (분할 불가)\n\n**시간 복잡도**: O(n × W) - n은 물건 수, W는 배낭 용량\n**공간 복잡도**: O(n × W)\n\n```java\npublic class Knapsack {\n    public static int knapsack(int[] weights, int[] values, int capacity) {\n        int n = weights.length;\n        int[][] dp = new int[n + 1][capacity + 1];\n\n        // dp[i][w]: i번째 물건까지 고려하고 용량이 w일 때 최대 가치\n        for (int i = 1; i <= n; i++) {\n            for (int w = 1; w <= capacity; w++) {\n                if (weights[i - 1] <= w) {\n                    // 물건을 넣을 수 있는 경우\n                    // max(넣지 않음, 넣음)\n                    dp[i][w] = Math.max(\n                        dp[i - 1][w],  // 넣지 않음\n                        dp[i - 1][w - weights[i - 1]] + values[i - 1]  // 넣음\n                    );\n                } else {\n                    // 물건을 넣을 수 없는 경우\n                    dp[i][w] = dp[i - 1][w];\n                }\n            }\n        }\n\n        return dp[n][capacity];\n    }\n\n    // 공간 최적화 버전 (1차원 배열)\n    public static int knapsackOptimized(int[] weights, int[] values, int capacity) {\n        int n = weights.length;\n        int[] dp = new int[capacity + 1];\n\n        for (int i = 0; i < n; i++) {\n            // 뒤에서부터 업데이트 (중복 사용 방지)\n            for (int w = capacity; w >= weights[i]; w--) {\n                dp[w] = Math.max(dp[w], dp[w - weights[i]] + values[i]);\n            }\n        }\n\n        return dp[capacity];\n    }\n\n    public static void main(String[] args) {\n        int[] weights = {1, 3, 4, 5};\n        int[] values = {1, 4, 5, 7};\n        int capacity = 7;\n\n        System.out.println(\"최대 가치: \" + knapsack(weights, values, capacity));\n        // 출력: 9 (물건 1, 2 선택)\n\n        System.out.println(\"최대 가치 (최적화): \" + knapsackOptimized(weights, values, capacity));\n    }\n}\n```\n\n### 3. 편집 거리 (Edit Distance)\n\n**개념**: 두 문자열을 같게 만들기 위한 최소 편집 횟수를 구합니다. (삽입, 삭제, 교체)\n\n**시간 복잡도**: O(m × n)\n**공간 복잡도**: O(m × n)\n\n```java\npublic class EditDistance {\n    public static int minDistance(String word1, String word2) {\n        int m = word1.length();\n        int n = word2.length();\n\n        int[][] dp = new int[m + 1][n + 1];\n\n        // 초기화: 빈 문자열로 변환\n        for (int i = 0; i <= m; i++) {\n            dp[i][0] = i; // word1[0..i]를 빈 문자열로\n        }\n        for (int j = 0; j <= n; j++) {\n            dp[0][j] = j; // 빈 문자열을 word2[0..j]로\n        }\n\n        // DP 테이블 채우기\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (word1.charAt(i - 1) == word2.charAt(j - 1)) {\n                    // 문자가 같으면 편집 불필요\n                    dp[i][j] = dp[i - 1][j - 1];\n                } else {\n                    // 문자가 다르면 3가지 연산 중 최소 선택\n                    dp[i][j] = 1 + Math.min(\n                        dp[i - 1][j],      // 삭제\n                        Math.min(\n                            dp[i][j - 1],  // 삽입\n                            dp[i - 1][j - 1] // 교체\n                        )\n                    );\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n    public static void main(String[] args) {\n        String word1 = \"horse\";\n        String word2 = \"ros\";\n\n        System.out.println(\"편집 거리: \" + minDistance(word1, word2));\n        // 출력: 3 (horse -> rorse -> rose -> ros)\n    }\n}\n```\n\n---\n\n## 고급 조합 최적화\n\n### 비트마스킹을 이용한 부분집합 생성\n\n**개념**: 비트 연산을 사용하여 모든 부분집합을 효율적으로 생성합니다.\n\n**시간 복잡도**: O(2ⁿ × n)\n**공간 복잡도**: O(1)\n\n```java\nimport java.util.*;\n\npublic class SubsetBitmask {\n    public static List<List<Integer>> generateSubsets(int[] nums) {\n        List<List<Integer>> result = new ArrayList<>();\n        int n = nums.length;\n\n        // 2^n개의 부분집합\n        for (int mask = 0; mask < (1 << n); mask++) {\n            List<Integer> subset = new ArrayList<>();\n\n            // 각 비트 확인\n            for (int i = 0; i < n; i++) {\n                // i번째 비트가 1이면 nums[i] 포함\n                if ((mask & (1 << i)) != 0) {\n                    subset.add(nums[i]);\n                }\n            }\n\n            result.add(subset);\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {1, 2, 3};\n        List<List<Integer>> subsets = generateSubsets(nums);\n\n        System.out.println(\"모든 부분집합:\");\n        for (List<Integer> subset : subsets) {\n            System.out.println(subset);\n        }\n        // 출력: [], [1], [2], [1,2], [3], [1,3], [2,3], [1,2,3]\n    }\n}\n```\n\n### 백트래킹 최적화 - N-Queens 문제\n\n**개념**: N×N 체스판에 N개의 퀸을 서로 공격할 수 없게 배치하는 문제입니다.\n\n**시간 복잡도**: O(N!)\n**공간 복잡도**: O(N)\n\n```java\nimport java.util.*;\n\npublic class NQueens {\n    private List<List<String>> solutions;\n\n    public List<List<String>> solveNQueens(int n) {\n        solutions = new ArrayList<>();\n        char[][] board = new char[n][n];\n\n        // 체스판 초기화\n        for (int i = 0; i < n; i++) {\n            Arrays.fill(board[i], '.');\n        }\n\n        backtrack(board, 0, n);\n        return solutions;\n    }\n\n    private void backtrack(char[][] board, int row, int n) {\n        if (row == n) {\n            // 모든 퀸을 배치했으면 해답 추가\n            solutions.add(construct(board));\n            return;\n        }\n\n        // 현재 행의 각 열에 퀸 배치 시도\n        for (int col = 0; col < n; col++) {\n            if (isValid(board, row, col, n)) {\n                board[row][col] = 'Q';\n                backtrack(board, row + 1, n);\n                board[row][col] = '.'; // 백트래킹\n            }\n        }\n    }\n\n    private boolean isValid(char[][] board, int row, int col, int n) {\n        // 같은 열 확인\n        for (int i = 0; i < row; i++) {\n            if (board[i][col] == 'Q') return false;\n        }\n\n        // 왼쪽 대각선 확인\n        for (int i = row - 1, j = col - 1; i >= 0 && j >= 0; i--, j--) {\n            if (board[i][j] == 'Q') return false;\n        }\n\n        // 오른쪽 대각선 확인\n        for (int i = row - 1, j = col + 1; i >= 0 && j < n; i--, j++) {\n            if (board[i][j] == 'Q') return false;\n        }\n\n        return true;\n    }\n\n    private List<String> construct(char[][] board) {\n        List<String> result = new ArrayList<>();\n        for (char[] row : board) {\n            result.add(new String(row));\n        }\n        return result;\n    }\n\n    public static void main(String[] args) {\n        NQueens nq = new NQueens();\n        List<List<String>> solutions = nq.solveNQueens(4);\n\n        System.out.println(\"4-Queens 해답 개수: \" + solutions.size());\n        for (List<String> solution : solutions) {\n            for (String row : solution) {\n                System.out.println(row);\n            }\n            System.out.println();\n        }\n    }\n}\n```\n\n---\n\n## 정리\n\n### 최단 경로 알고리즘 비교\n\n| 알고리즘 | 시간 복잡도 | 음의 가중치 | 특징 |\n|---------|-----------|-----------|-----|\n| 다익스트라 | O((V+E) log V) | X | 단일 시작점, 빠름 |\n| 벨만-포드 | O(VE) | O | 음의 사이클 검출 |\n| 플로이드-워셜 | O(V³) | O | 모든 쌍 최단 경로 |\n\n### 고급 DP 문제 유형\n\n| 문제 | 핵심 아이디어 | 시간 복잡도 |\n|-----|------------|-----------|\n| LCS | 문자 일치/불일치 | O(m × n) |\n| 배낭 문제 | 넣음/안 넣음 | O(n × W) |\n| 편집 거리 | 삽입/삭제/교체 | O(m × n) |\n\n### 학습 팁\n1. **힙 정렬**: 힙 자료구조의 원리를 먼저 이해\n2. **최단 경로**: 그래프 종류에 따라 알고리즘 선택\n3. **고급 DP**: 2차원 테이블 점화식 도출 연습\n4. **백트래킹**: 가지치기(Pruning)로 성능 향상\n5. **비트마스킹**: 집합 연산을 비트로 표현하여 최적화\n\n### 면접 대비 핵심\n- **정렬**: O(n log n) 보장 → 합병/힙 정렬\n- **최단 경로**: 양의 가중치 → 다익스트라, 음의 가중치 → 벨만-포드\n- **DP**: 부분 문제의 중복 → 메모이제이션\n- **조합**: 백트래킹 + 가지치기\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 21120, "lines": 725}, {"filename": "basic-algorithms.md", "title": "기초 알고리즘", "path": "algorithm/basic-algorithms.md", "content": "# 기초 알고리즘\n\n알고리즘의 기초를 다지는 핵심 개념들을 정리합니다. 각 알고리즘의 원리, 구현 방법, 시간/공간 복잡도를 이해하는 것이 중요합니다.\n\n## 목차\n1. [정렬 알고리즘](#정렬-알고리즘)\n2. [탐색 알고리즘](#탐색-알고리즘)\n3. [브루트포스](#브루트포스)\n4. [순열과 조합](#순열과-조합)\n\n---\n\n## 정렬 알고리즘\n\n### 1. 버블 정렬 (Bubble Sort)\n\n**개념**: 인접한 두 원소를 비교하여 큰 값을 뒤로 보내는 과정을 반복합니다. 마치 거품이 수면으로 올라오는 것처럼 가장 큰 값이 배열의 끝으로 이동합니다.\n\n**시간 복잡도**: O(n²)\n**공간 복잡도**: O(1) - 제자리 정렬\n\n```java\npublic class BubbleSort {\n    public static void bubbleSort(int[] arr) {\n        int n = arr.length;\n\n        // 외부 루프: n-1번 반복\n        for (int i = 0; i < n - 1; i++) {\n            boolean swapped = false;\n\n            // 내부 루프: 인접한 원소 비교\n            for (int j = 0; j < n - 1 - i; j++) {\n                if (arr[j] > arr[j + 1]) {\n                    // 교환\n                    int temp = arr[j];\n                    arr[j] = arr[j + 1];\n                    arr[j + 1] = temp;\n                    swapped = true;\n                }\n            }\n\n            // 최적화: 한 번도 교환이 일어나지 않으면 이미 정렬됨\n            if (!swapped) break;\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {64, 34, 25, 12, 22, 11, 90};\n        bubbleSort(arr);\n        System.out.println(Arrays.toString(arr));\n        // 출력: [11, 12, 22, 25, 34, 64, 90]\n    }\n}\n```\n\n### 2. 선택 정렬 (Selection Sort)\n\n**개념**: 매 단계마다 남은 원소 중 최솟값을 찾아 맨 앞의 원소와 교환합니다. 정렬된 부분과 정렬되지 않은 부분을 나누어 진행합니다.\n\n**시간 복잡도**: O(n²)\n**공간 복잡도**: O(1) - 제자리 정렬\n\n```java\npublic class SelectionSort {\n    public static void selectionSort(int[] arr) {\n        int n = arr.length;\n\n        for (int i = 0; i < n - 1; i++) {\n            // 최솟값의 인덱스 찾기\n            int minIdx = i;\n            for (int j = i + 1; j < n; j++) {\n                if (arr[j] < arr[minIdx]) {\n                    minIdx = j;\n                }\n            }\n\n            // 최솟값을 현재 위치와 교환\n            int temp = arr[minIdx];\n            arr[minIdx] = arr[i];\n            arr[i] = temp;\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {64, 25, 12, 22, 11};\n        selectionSort(arr);\n        System.out.println(Arrays.toString(arr));\n        // 출력: [11, 12, 22, 25, 64]\n    }\n}\n```\n\n### 3. 삽입 정렬 (Insertion Sort)\n\n**개념**: 카드 게임에서 카드를 정렬하는 방식과 유사합니다. 각 원소를 이미 정렬된 부분의 적절한 위치에 삽입합니다.\n\n**시간 복잡도**:\n- 최선: O(n) - 이미 정렬된 경우\n- 평균/최악: O(n²)\n\n**공간 복잡도**: O(1) - 제자리 정렬\n\n```java\npublic class InsertionSort {\n    public static void insertionSort(int[] arr) {\n        int n = arr.length;\n\n        for (int i = 1; i < n; i++) {\n            int key = arr[i];\n            int j = i - 1;\n\n            // key보다 큰 원소들을 한 칸씩 뒤로 이동\n            while (j >= 0 && arr[j] > key) {\n                arr[j + 1] = arr[j];\n                j--;\n            }\n\n            // key를 적절한 위치에 삽입\n            arr[j + 1] = key;\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {12, 11, 13, 5, 6};\n        insertionSort(arr);\n        System.out.println(Arrays.toString(arr));\n        // 출력: [5, 6, 11, 12, 13]\n    }\n}\n```\n\n---\n\n## 탐색 알고리즘\n\n### 1. 선형 탐색 (Linear Search)\n\n**개념**: 배열의 처음부터 끝까지 순차적으로 탐색합니다. 가장 단순하지만 느린 탐색 방법입니다.\n\n**시간 복잡도**: O(n)\n**공간 복잡도**: O(1)\n\n```java\npublic class LinearSearch {\n    public static int linearSearch(int[] arr, int target) {\n        for (int i = 0; i < arr.length; i++) {\n            if (arr[i] == target) {\n                return i; // 찾은 경우 인덱스 반환\n            }\n        }\n        return -1; // 못 찾은 경우 -1 반환\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {10, 23, 45, 70, 11, 15};\n        int target = 70;\n        int result = linearSearch(arr, target);\n\n        if (result != -1) {\n            System.out.println(\"원소를 인덱스 \" + result + \"에서 찾았습니다.\");\n        } else {\n            System.out.println(\"원소를 찾지 못했습니다.\");\n        }\n    }\n}\n```\n\n### 2. 이진 탐색 (Binary Search)\n\n**개념**: **정렬된 배열**에서 중간값과 비교하며 탐색 범위를 절반씩 줄여나갑니다. 매우 효율적인 탐색 알고리즘입니다.\n\n**전제 조건**: 배열이 정렬되어 있어야 함\n**시간 복잡도**: O(log n)\n**공간 복잡도**: O(1) - 반복문 / O(log n) - 재귀\n\n```java\npublic class BinarySearch {\n    // 반복문 방식\n    public static int binarySearchIterative(int[] arr, int target) {\n        int left = 0;\n        int right = arr.length - 1;\n\n        while (left <= right) {\n            int mid = left + (right - left) / 2; // 오버플로우 방지\n\n            if (arr[mid] == target) {\n                return mid; // 찾음\n            } else if (arr[mid] < target) {\n                left = mid + 1; // 오른쪽 절반 탐색\n            } else {\n                right = mid - 1; // 왼쪽 절반 탐색\n            }\n        }\n\n        return -1; // 못 찾음\n    }\n\n    // 재귀 방식\n    public static int binarySearchRecursive(int[] arr, int target, int left, int right) {\n        if (left > right) {\n            return -1; // 못 찾음\n        }\n\n        int mid = left + (right - left) / 2;\n\n        if (arr[mid] == target) {\n            return mid;\n        } else if (arr[mid] < target) {\n            return binarySearchRecursive(arr, target, mid + 1, right);\n        } else {\n            return binarySearchRecursive(arr, target, left, mid - 1);\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {2, 3, 4, 10, 40, 50, 60};\n        int target = 10;\n\n        int result = binarySearchIterative(arr, target);\n        System.out.println(\"반복문 방식: \" + result); // 출력: 3\n\n        result = binarySearchRecursive(arr, target, 0, arr.length - 1);\n        System.out.println(\"재귀 방식: \" + result); // 출력: 3\n    }\n}\n```\n\n---\n\n## 브루트포스\n\n**개념**: 모든 가능한 경우를 전부 시도해보는 방법입니다. \"무식하게 푼다\"는 의미로, 완전 탐색이라고도 합니다. 효율적이지 않지만 확실한 답을 찾을 수 있습니다.\n\n**시간 복잡도**: 문제에 따라 다름 (보통 O(n!), O(2ⁿ) 등 지수 시간)\n**공간 복잡도**: 문제에 따라 다름\n\n### 예제: 배열에서 합이 특정 값인 두 수 찾기\n\n```java\npublic class BruteForce {\n    // 브루트포스로 두 수의 합 찾기\n    public static int[] twoSumBruteForce(int[] arr, int target) {\n        int n = arr.length;\n\n        // 모든 쌍을 확인\n        for (int i = 0; i < n - 1; i++) {\n            for (int j = i + 1; j < n; j++) {\n                if (arr[i] + arr[j] == target) {\n                    return new int[]{i, j};\n                }\n            }\n        }\n\n        return new int[]{-1, -1}; // 못 찾음\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {2, 7, 11, 15};\n        int target = 9;\n        int[] result = twoSumBruteForce(arr, target);\n\n        System.out.println(\"인덱스: [\" + result[0] + \", \" + result[1] + \"]\");\n        // 출력: 인덱스: [0, 1] (2 + 7 = 9)\n    }\n}\n```\n\n### 예제: 최댓값과 최솟값 찾기\n\n```java\npublic class MinMaxBruteForce {\n    public static void findMinMax(int[] arr) {\n        if (arr.length == 0) return;\n\n        int min = arr[0];\n        int max = arr[0];\n\n        // 모든 원소를 확인\n        for (int i = 1; i < arr.length; i++) {\n            if (arr[i] < min) {\n                min = arr[i];\n            }\n            if (arr[i] > max) {\n                max = arr[i];\n            }\n        }\n\n        System.out.println(\"최솟값: \" + min);\n        System.out.println(\"최댓값: \" + max);\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {3, 5, 1, 8, 2, 9, 4};\n        findMinMax(arr);\n        // 출력: 최솟값: 1, 최댓값: 9\n    }\n}\n```\n\n---\n\n## 순열과 조합\n\n### 순열 (Permutation)\n\n**개념**: n개 중에서 r개를 선택하여 순서를 고려하여 나열하는 경우의 수입니다.\n**공식**: P(n, r) = n! / (n-r)!\n\n**시간 복잡도**: O(n!)\n**공간 복잡도**: O(n) - 재귀 깊이\n\n```java\nimport java.util.*;\n\npublic class Permutation {\n    // 순열 생성 (재귀)\n    public static void permutation(int[] arr, int depth, int n, int r, boolean[] visited, int[] output) {\n        if (depth == r) {\n            // r개를 선택했으면 출력\n            System.out.println(Arrays.toString(output));\n            return;\n        }\n\n        for (int i = 0; i < n; i++) {\n            if (!visited[i]) {\n                visited[i] = true;\n                output[depth] = arr[i];\n                permutation(arr, depth + 1, n, r, visited, output);\n                visited[i] = false; // 백트래킹\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {1, 2, 3};\n        int n = arr.length;\n        int r = 2;\n\n        boolean[] visited = new boolean[n];\n        int[] output = new int[r];\n\n        System.out.println(\"3개 중 2개를 선택하는 순열:\");\n        permutation(arr, 0, n, r, visited, output);\n        // 출력: [1,2], [1,3], [2,1], [2,3], [3,1], [3,2]\n    }\n}\n```\n\n### 조합 (Combination)\n\n**개념**: n개 중에서 r개를 선택하는데 순서를 고려하지 않는 경우의 수입니다.\n**공식**: C(n, r) = n! / (r! × (n-r)!)\n\n**시간 복잡도**: O(2ⁿ)\n**공간 복잡도**: O(n) - 재귀 깊이\n\n```java\nimport java.util.*;\n\npublic class Combination {\n    // 조합 생성 (재귀)\n    public static void combination(int[] arr, int start, int n, int r, int depth, int[] output) {\n        if (depth == r) {\n            // r개를 선택했으면 출력\n            System.out.println(Arrays.toString(output));\n            return;\n        }\n\n        for (int i = start; i < n; i++) {\n            output[depth] = arr[i];\n            combination(arr, i + 1, n, r, depth + 1, output);\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {1, 2, 3, 4};\n        int n = arr.length;\n        int r = 2;\n\n        int[] output = new int[r];\n\n        System.out.println(\"4개 중 2개를 선택하는 조합:\");\n        combination(arr, 0, n, r, 0, output);\n        // 출력: [1,2], [1,3], [1,4], [2,3], [2,4], [3,4]\n    }\n}\n```\n\n### 중복 순열\n\n**개념**: 중복을 허용하여 n개 중에서 r개를 선택하여 순서를 고려하여 나열합니다.\n\n```java\npublic class PermutationWithRepetition {\n    public static void permutationWithRep(int[] arr, int depth, int r, int[] output) {\n        if (depth == r) {\n            System.out.println(Arrays.toString(output));\n            return;\n        }\n\n        for (int i = 0; i < arr.length; i++) {\n            output[depth] = arr[i];\n            permutationWithRep(arr, depth + 1, r, output);\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {1, 2, 3};\n        int r = 2;\n        int[] output = new int[r];\n\n        System.out.println(\"중복 순열:\");\n        permutationWithRep(arr, 0, r, output);\n        // 출력: [1,1], [1,2], [1,3], [2,1], [2,2], [2,3], [3,1], [3,2], [3,3]\n    }\n}\n```\n\n---\n\n## 정리\n\n### 정렬 알고리즘 비교\n\n| 알고리즘 | 시간 복잡도 (평균) | 공간 복잡도 | 안정성 | 특징 |\n|---------|------------------|-----------|-------|-----|\n| 버블 정렬 | O(n²) | O(1) | 안정 | 구현 간단, 비효율적 |\n| 선택 정렬 | O(n²) | O(1) | 불안정 | 교환 횟수 적음 |\n| 삽입 정렬 | O(n²) | O(1) | 안정 | 거의 정렬된 경우 빠름 |\n\n### 탐색 알고리즘 비교\n\n| 알고리즘 | 시간 복잡도 | 전제 조건 | 특징 |\n|---------|-----------|---------|-----|\n| 선형 탐색 | O(n) | 없음 | 단순, 느림 |\n| 이진 탐색 | O(log n) | 정렬된 배열 | 매우 빠름 |\n\n### 학습 팁\n1. **기초 정렬은 손으로 직접 그려보며 이해**하세요\n2. **시간/공간 복잡도**는 알고리즘 선택의 핵심입니다\n3. **이진 탐색**은 정렬된 배열에서만 사용 가능합니다\n4. **브루트포스**는 문제 해결의 첫 단계로 유용합니다\n5. **순열/조합**은 백트래킹의 기초입니다\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 12971, "lines": 448}, {"filename": "intermediate-algorithms.md", "title": "중급 알고리즘", "path": "algorithm/intermediate-algorithms.md", "content": "# 중급 알고리즘\n\n기초를 넘어서는 효율적인 알고리즘들을 학습합니다. 분할 정복, 그래프 탐색, 그리디, 동적 프로그래밍의 기본 개념을 다룹니다.\n\n## 목차\n1. [고급 정렬 알고리즘](#고급-정렬-알고리즘)\n2. [그래프 탐색](#그래프-탐색)\n3. [그리디 알고리즘](#그리디-알고리즘)\n4. [동적 프로그래밍 기초](#동적-프로그래밍-기초)\n\n---\n\n## 고급 정렬 알고리즘\n\n### 1. 퀵 정렬 (Quick Sort)\n\n**개념**: 분할 정복(Divide and Conquer) 방식을 사용합니다. 피벗(pivot)을 선택하여 피벗보다 작은 값은 왼쪽, 큰 값은 오른쪽으로 분할한 후 재귀적으로 정렬합니다.\n\n**시간 복잡도**:\n- 평균: O(n log n)\n- 최악: O(n²) - 이미 정렬된 경우\n**공간 복잡도**: O(log n) - 재귀 호출 스택\n\n```java\npublic class QuickSort {\n    public static void quickSort(int[] arr, int low, int high) {\n        if (low < high) {\n            // 파티션 인덱스 찾기\n            int pi = partition(arr, low, high);\n\n            // 피벗 기준 왼쪽 부분 정렬\n            quickSort(arr, low, pi - 1);\n            // 피벗 기준 오른쪽 부분 정렬\n            quickSort(arr, pi + 1, high);\n        }\n    }\n\n    private static int partition(int[] arr, int low, int high) {\n        // 마지막 원소를 피벗으로 선택\n        int pivot = arr[high];\n        int i = low - 1; // 작은 원소들의 인덱스\n\n        for (int j = low; j < high; j++) {\n            // 현재 원소가 피벗보다 작으면\n            if (arr[j] < pivot) {\n                i++;\n                // arr[i]와 arr[j] 교환\n                int temp = arr[i];\n                arr[i] = arr[j];\n                arr[j] = temp;\n            }\n        }\n\n        // 피벗을 올바른 위치에 배치\n        int temp = arr[i + 1];\n        arr[i + 1] = arr[high];\n        arr[high] = temp;\n\n        return i + 1;\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {10, 7, 8, 9, 1, 5};\n        quickSort(arr, 0, arr.length - 1);\n        System.out.println(Arrays.toString(arr));\n        // 출력: [1, 5, 7, 8, 9, 10]\n    }\n}\n```\n\n### 2. 합병 정렬 (Merge Sort)\n\n**개념**: 분할 정복 방식으로 배열을 절반으로 나눈 후, 각각을 정렬하고 합치는 과정을 반복합니다. 항상 O(n log n)을 보장하는 안정적인 알고리즘입니다.\n\n**시간 복잡도**: O(n log n) - 모든 경우\n**공간 복잡도**: O(n) - 추가 배열 필요\n\n```java\npublic class MergeSort {\n    public static void mergeSort(int[] arr, int left, int right) {\n        if (left < right) {\n            // 중간 지점 찾기\n            int mid = left + (right - left) / 2;\n\n            // 왼쪽 절반 정렬\n            mergeSort(arr, left, mid);\n            // 오른쪽 절반 정렬\n            mergeSort(arr, mid + 1, right);\n\n            // 합치기\n            merge(arr, left, mid, right);\n        }\n    }\n\n    private static void merge(int[] arr, int left, int mid, int right) {\n        // 서브 배열의 크기 계산\n        int n1 = mid - left + 1;\n        int n2 = right - mid;\n\n        // 임시 배열 생성\n        int[] L = new int[n1];\n        int[] R = new int[n2];\n\n        // 데이터 복사\n        for (int i = 0; i < n1; i++) {\n            L[i] = arr[left + i];\n        }\n        for (int j = 0; j < n2; j++) {\n            R[j] = arr[mid + 1 + j];\n        }\n\n        // 합치기\n        int i = 0, j = 0;\n        int k = left;\n\n        while (i < n1 && j < n2) {\n            if (L[i] <= R[j]) {\n                arr[k] = L[i];\n                i++;\n            } else {\n                arr[k] = R[j];\n                j++;\n            }\n            k++;\n        }\n\n        // 남은 원소들 복사\n        while (i < n1) {\n            arr[k] = L[i];\n            i++;\n            k++;\n        }\n\n        while (j < n2) {\n            arr[k] = R[j];\n            j++;\n            k++;\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {12, 11, 13, 5, 6, 7};\n        mergeSort(arr, 0, arr.length - 1);\n        System.out.println(Arrays.toString(arr));\n        // 출력: [5, 6, 7, 11, 12, 13]\n    }\n}\n```\n\n---\n\n## 그래프 탐색\n\n그래프는 **정점(Vertex)**과 **간선(Edge)**으로 구성된 자료구조입니다. 그래프 탐색은 모든 정점을 방문하는 방법입니다.\n\n### 1. 깊이 우선 탐색 (DFS - Depth First Search)\n\n**개념**: 한 방향으로 끝까지 탐색한 후 다시 돌아와서 다른 방향을 탐색합니다. **스택** 또는 **재귀**를 사용합니다.\n\n**시간 복잡도**: O(V + E) - V는 정점 수, E는 간선 수\n**공간 복잡도**: O(V) - 재귀 스택 또는 명시적 스택\n\n```java\nimport java.util.*;\n\npublic class DFS {\n    private int V; // 정점의 개수\n    private LinkedList<Integer>[] adj; // 인접 리스트\n\n    public DFS(int v) {\n        V = v;\n        adj = new LinkedList[v];\n        for (int i = 0; i < v; i++) {\n            adj[i] = new LinkedList<>();\n        }\n    }\n\n    // 간선 추가\n    public void addEdge(int v, int w) {\n        adj[v].add(w);\n    }\n\n    // DFS 재귀 함수\n    private void dfsUtil(int v, boolean[] visited) {\n        // 현재 노드를 방문 처리\n        visited[v] = true;\n        System.out.print(v + \" \");\n\n        // 인접한 모든 정점을 재귀적으로 방문\n        for (int n : adj[v]) {\n            if (!visited[n]) {\n                dfsUtil(n, visited);\n            }\n        }\n    }\n\n    // DFS 시작\n    public void dfs(int start) {\n        boolean[] visited = new boolean[V];\n        dfsUtil(start, visited);\n    }\n\n    // 스택을 사용한 반복적 DFS\n    public void dfsIterative(int start) {\n        boolean[] visited = new boolean[V];\n        Stack<Integer> stack = new Stack<>();\n\n        stack.push(start);\n\n        while (!stack.isEmpty()) {\n            int v = stack.pop();\n\n            if (!visited[v]) {\n                visited[v] = true;\n                System.out.print(v + \" \");\n\n                // 인접 정점들을 스택에 추가\n                for (int n : adj[v]) {\n                    if (!visited[n]) {\n                        stack.push(n);\n                    }\n                }\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        DFS graph = new DFS(4);\n\n        graph.addEdge(0, 1);\n        graph.addEdge(0, 2);\n        graph.addEdge(1, 2);\n        graph.addEdge(2, 0);\n        graph.addEdge(2, 3);\n        graph.addEdge(3, 3);\n\n        System.out.print(\"DFS (재귀): \");\n        graph.dfs(2);\n        // 출력: 2 0 1 3\n\n        System.out.print(\"\\nDFS (반복): \");\n        graph.dfsIterative(2);\n    }\n}\n```\n\n### 2. 너비 우선 탐색 (BFS - Breadth First Search)\n\n**개념**: 시작 정점에서 가까운 정점부터 순서대로 탐색합니다. **큐(Queue)**를 사용합니다. 최단 경로를 찾을 때 유용합니다.\n\n**시간 복잡도**: O(V + E)\n**공간 복잡도**: O(V) - 큐\n\n```java\nimport java.util.*;\n\npublic class BFS {\n    private int V;\n    private LinkedList<Integer>[] adj;\n\n    public BFS(int v) {\n        V = v;\n        adj = new LinkedList[v];\n        for (int i = 0; i < v; i++) {\n            adj[i] = new LinkedList<>();\n        }\n    }\n\n    public void addEdge(int v, int w) {\n        adj[v].add(w);\n    }\n\n    public void bfs(int start) {\n        boolean[] visited = new boolean[V];\n        Queue<Integer> queue = new LinkedList<>();\n\n        // 시작 노드를 방문 처리하고 큐에 추가\n        visited[start] = true;\n        queue.add(start);\n\n        while (!queue.isEmpty()) {\n            // 큐에서 하나 꺼내기\n            int v = queue.poll();\n            System.out.print(v + \" \");\n\n            // 인접한 모든 정점 확인\n            for (int n : adj[v]) {\n                if (!visited[n]) {\n                    visited[n] = true;\n                    queue.add(n);\n                }\n            }\n        }\n    }\n\n    // 최단 거리 구하기\n    public int[] shortestPath(int start) {\n        boolean[] visited = new boolean[V];\n        int[] distance = new int[V];\n        Arrays.fill(distance, -1);\n\n        Queue<Integer> queue = new LinkedList<>();\n        visited[start] = true;\n        distance[start] = 0;\n        queue.add(start);\n\n        while (!queue.isEmpty()) {\n            int v = queue.poll();\n\n            for (int n : adj[v]) {\n                if (!visited[n]) {\n                    visited[n] = true;\n                    distance[n] = distance[v] + 1;\n                    queue.add(n);\n                }\n            }\n        }\n\n        return distance;\n    }\n\n    public static void main(String[] args) {\n        BFS graph = new BFS(4);\n\n        graph.addEdge(0, 1);\n        graph.addEdge(0, 2);\n        graph.addEdge(1, 2);\n        graph.addEdge(2, 0);\n        graph.addEdge(2, 3);\n        graph.addEdge(3, 3);\n\n        System.out.print(\"BFS: \");\n        graph.bfs(2);\n        // 출력: 2 0 3 1\n\n        System.out.println(\"\\n최단 거리:\");\n        int[] distances = graph.shortestPath(2);\n        for (int i = 0; i < distances.length; i++) {\n            System.out.println(\"2 -> \" + i + \": \" + distances[i]);\n        }\n    }\n}\n```\n\n---\n\n## 그리디 알고리즘\n\n**개념**: 매 순간 최선의 선택을 하는 알고리즘입니다. 항상 최적해를 보장하지는 않지만, 특정 문제에서는 최적해를 찾을 수 있습니다.\n\n**특징**:\n- 빠른 실행 시간\n- 직관적인 해결 방법\n- 모든 문제에 적용 불가능\n\n### 예제 1: 거스름돈 문제\n\n**시간 복잡도**: O(n) - n은 동전 종류의 수\n**공간 복잡도**: O(1)\n\n```java\npublic class CoinChange {\n    public static int getMinCoins(int amount) {\n        int[] coins = {500, 100, 50, 10}; // 동전 종류 (큰 것부터)\n        int count = 0;\n\n        for (int coin : coins) {\n            count += amount / coin; // 해당 동전 개수 추가\n            amount %= coin; // 남은 금액 갱신\n        }\n\n        return count;\n    }\n\n    public static void main(String[] args) {\n        int amount = 1260;\n        int result = getMinCoins(amount);\n        System.out.println(\"최소 동전 개수: \" + result);\n        // 출력: 최소 동전 개수: 6 (500*2 + 100*2 + 50*1 + 10*1)\n    }\n}\n```\n\n### 예제 2: 활동 선택 문제\n\n**개념**: 시작 시간과 종료 시간이 있는 여러 활동 중, 겹치지 않게 최대한 많은 활동을 선택합니다.\n\n**시간 복잡도**: O(n log n) - 정렬 때문\n**공간 복잡도**: O(1)\n\n```java\nimport java.util.*;\n\nclass Activity {\n    int start, end;\n\n    Activity(int start, int end) {\n        this.start = start;\n        this.end = end;\n    }\n}\n\npublic class ActivitySelection {\n    public static List<Activity> selectActivities(Activity[] activities) {\n        // 종료 시간 기준으로 정렬\n        Arrays.sort(activities, Comparator.comparingInt(a -> a.end));\n\n        List<Activity> selected = new ArrayList<>();\n        selected.add(activities[0]);\n        int lastEnd = activities[0].end;\n\n        for (int i = 1; i < activities.length; i++) {\n            // 시작 시간이 이전 활동의 종료 시간 이후면 선택\n            if (activities[i].start >= lastEnd) {\n                selected.add(activities[i]);\n                lastEnd = activities[i].end;\n            }\n        }\n\n        return selected;\n    }\n\n    public static void main(String[] args) {\n        Activity[] activities = {\n            new Activity(1, 4),\n            new Activity(3, 5),\n            new Activity(0, 6),\n            new Activity(5, 7),\n            new Activity(8, 9),\n            new Activity(5, 9)\n        };\n\n        List<Activity> result = selectActivities(activities);\n        System.out.println(\"선택된 활동 수: \" + result.size());\n        // 출력: 선택된 활동 수: 4\n    }\n}\n```\n\n---\n\n## 동적 프로그래밍 기초\n\n**개념**: 큰 문제를 작은 부분 문제로 나누고, 한 번 계산한 결과를 **메모이제이션(Memoization)** 또는 **테이블화(Tabulation)**로 저장하여 재사용합니다.\n\n**핵심 조건**:\n1. **최적 부분 구조**: 큰 문제의 최적해가 작은 문제의 최적해로 구성됨\n2. **중복되는 부분 문제**: 같은 계산이 반복됨\n\n### 예제 1: 피보나치 수열\n\n**시간 복잡도**: O(n)\n**공간 복잡도**: O(n)\n\n```java\npublic class Fibonacci {\n    // 일반 재귀 (비효율적 - O(2^n))\n    public static int fibRecursive(int n) {\n        if (n <= 1) return n;\n        return fibRecursive(n - 1) + fibRecursive(n - 2);\n    }\n\n    // 메모이제이션 (Top-Down DP)\n    public static int fibMemo(int n, int[] memo) {\n        if (n <= 1) return n;\n        if (memo[n] != 0) return memo[n]; // 이미 계산됨\n\n        memo[n] = fibMemo(n - 1, memo) + fibMemo(n - 2, memo);\n        return memo[n];\n    }\n\n    // 테이블화 (Bottom-Up DP)\n    public static int fibTabulation(int n) {\n        if (n <= 1) return n;\n\n        int[] dp = new int[n + 1];\n        dp[0] = 0;\n        dp[1] = 1;\n\n        for (int i = 2; i <= n; i++) {\n            dp[i] = dp[i - 1] + dp[i - 2];\n        }\n\n        return dp[n];\n    }\n\n    // 공간 최적화 버전\n    public static int fibOptimized(int n) {\n        if (n <= 1) return n;\n\n        int prev2 = 0, prev1 = 1;\n        int current = 0;\n\n        for (int i = 2; i <= n; i++) {\n            current = prev1 + prev2;\n            prev2 = prev1;\n            prev1 = current;\n        }\n\n        return current;\n    }\n\n    public static void main(String[] args) {\n        int n = 10;\n\n        System.out.println(\"재귀: \" + fibRecursive(n));\n        System.out.println(\"메모이제이션: \" + fibMemo(n, new int[n + 1]));\n        System.out.println(\"테이블화: \" + fibTabulation(n));\n        System.out.println(\"최적화: \" + fibOptimized(n));\n        // 모두 출력: 55\n    }\n}\n```\n\n### 예제 2: 계단 오르기\n\n**문제**: n개의 계단을 오르는데, 한 번에 1계단 또는 2계단씩 오를 수 있을 때 방법의 수를 구합니다.\n\n**시간 복잡도**: O(n)\n**공간 복잡도**: O(n) 또는 O(1)\n\n```java\npublic class ClimbingStairs {\n    // DP 테이블화\n    public static int climbStairs(int n) {\n        if (n <= 2) return n;\n\n        int[] dp = new int[n + 1];\n        dp[1] = 1; // 1계단: 1가지\n        dp[2] = 2; // 2계단: 2가지\n\n        for (int i = 3; i <= n; i++) {\n            dp[i] = dp[i - 1] + dp[i - 2];\n        }\n\n        return dp[n];\n    }\n\n    // 공간 최적화\n    public static int climbStairsOptimized(int n) {\n        if (n <= 2) return n;\n\n        int prev2 = 1, prev1 = 2;\n        int current = 0;\n\n        for (int i = 3; i <= n; i++) {\n            current = prev1 + prev2;\n            prev2 = prev1;\n            prev1 = current;\n        }\n\n        return current;\n    }\n\n    public static void main(String[] args) {\n        int n = 5;\n        System.out.println(n + \"계단 오르는 방법: \" + climbStairs(n));\n        // 출력: 8가지\n    }\n}\n```\n\n### 예제 3: 최소 비용으로 계단 오르기\n\n**문제**: 각 계단마다 비용이 있고, 한 번에 1~2계단씩 오를 수 있을 때 최소 비용을 구합니다.\n\n**시간 복잡도**: O(n)\n**공간 복잡도**: O(n)\n\n```java\npublic class MinCostClimbingStairs {\n    public static int minCostClimbingStairs(int[] cost) {\n        int n = cost.length;\n        int[] dp = new int[n + 1];\n\n        // 0번째와 1번째는 비용 없음 (시작점)\n        dp[0] = 0;\n        dp[1] = 0;\n\n        for (int i = 2; i <= n; i++) {\n            // i번째 계단에 도달하는 최소 비용\n            dp[i] = Math.min(\n                dp[i - 1] + cost[i - 1],  // 1계단 전에서 오는 경우\n                dp[i - 2] + cost[i - 2]   // 2계단 전에서 오는 경우\n            );\n        }\n\n        return dp[n];\n    }\n\n    public static void main(String[] args) {\n        int[] cost = {10, 15, 20};\n        System.out.println(\"최소 비용: \" + minCostClimbingStairs(cost));\n        // 출력: 15 (1번 계단에서 바로 꼭대기로)\n    }\n}\n```\n\n---\n\n## 정리\n\n### 정렬 알고리즘 비교\n\n| 알고리즘 | 시간 복잡도 (평균) | 공간 복잡도 | 안정성 | 특징 |\n|---------|------------------|-----------|-------|-----|\n| 퀵 정렬 | O(n log n) | O(log n) | 불안정 | 빠름, 피벗 선택 중요 |\n| 합병 정렬 | O(n log n) | O(n) | 안정 | 항상 O(n log n) 보장 |\n\n### DFS vs BFS\n\n| 특징 | DFS | BFS |\n|-----|-----|-----|\n| 자료구조 | 스택/재귀 | 큐 |\n| 시간 복잡도 | O(V + E) | O(V + E) |\n| 공간 복잡도 | O(V) | O(V) |\n| 최단 경로 | X | O (가중치 없는 그래프) |\n| 사용 사례 | 경로 존재 확인, 사이클 검출 | 최단 거리, 레벨별 탐색 |\n\n### 학습 팁\n1. **분할 정복**: 문제를 작게 나눠 해결 (퀵/합병 정렬)\n2. **그래프**: 인접 리스트 vs 인접 행렬 구현 차이 이해\n3. **그리디**: 항상 최적해를 보장하지 않음을 주의\n4. **DP**: 재귀 → 메모이제이션 → 테이블화 순으로 학습\n5. **시간 복잡도**: O(n log n)이 중급 알고리즘의 핵심\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 17207, "lines": 630}]}, "auth": {"files": [{"filename": "jwt-jwk-oauth-comparison.md", "title": "JWT, JWK, OAuth 2.0 개념과 차이점 비교", "path": "auth/jwt-jwk-oauth-comparison.md", "content": "# JWT, JWK, OAuth 2.0 개념과 차이점 비교\n\n인증(Authentication)과 인가(Authorization)를 구현할 때 자주 등장하는 JWT, JWK, OAuth 2.0의 개념과 차이점을 정리한다.\n\n## 목차\n\n- [개념 정리](#개념-정리)\n  - [JWT (JSON Web Token)](#jwt-json-web-token)\n  - [JWK (JSON Web Key)](#jwk-json-web-key)\n  - [OAuth 2.0](#oauth-20)\n- [핵심 차이점 비교](#핵심-차이점-비교)\n- [사용 사례](#사용-사례)\n- [보안 고려사항](#보안-고려사항)\n- [함께 사용하는 방법](#함께-사용하는-방법)\n\n---\n\n## 개념 정리\n\n### JWT (JSON Web Token)\n\n**JWT**는 두 당사자 간에 정보를 안전하게 전송하기 위한 **토큰 형식(Format)**이다.\n\n#### 구조\n\nJWT는 점(`.`)으로 구분된 세 부분으로 구성된다:\n\n```\nxxxxx.yyyyy.zzzzz\nHeader.Payload.Signature\n```\n\n| 구성 요소 | 설명 | 예시 |\n|----------|------|------|\n| **Header** | 토큰 타입과 서명 알고리즘 | `{\"alg\": \"RS256\", \"typ\": \"JWT\"}` |\n| **Payload** | 클레임(Claims) - 전달할 데이터 | `{\"sub\": \"1234\", \"name\": \"John\", \"exp\": 1234567890}` |\n| **Signature** | 토큰 위변조 검증용 서명 | Header + Payload를 비밀키로 서명 |\n\n#### 주요 클레임(Claims)\n\n```json\n{\n  \"iss\": \"https://auth.example.com\",  // Issuer: 토큰 발급자\n  \"sub\": \"user123\",                    // Subject: 토큰 대상자\n  \"aud\": \"https://api.example.com\",   // Audience: 토큰 수신자\n  \"exp\": 1735689600,                  // Expiration: 만료 시간\n  \"iat\": 1735686000,                  // Issued At: 발급 시간\n  \"jti\": \"unique-token-id\"            // JWT ID: 고유 식별자\n}\n```\n\n---\n\n### JWK (JSON Web Key)\n\n**JWK**는 암호화 키를 JSON 형식으로 표현하는 **표준 방식**이다. JWT 서명 검증에 필요한 공개키를 배포할 때 주로 사용된다.\n\n#### JWK 예시 (RSA 공개키)\n\n```json\n{\n  \"kty\": \"RSA\",\n  \"kid\": \"my-key-id\",\n  \"use\": \"sig\",\n  \"alg\": \"RS256\",\n  \"n\": \"0vx7agoebGcQSuuPiLJXZpt...\",\n  \"e\": \"AQAB\"\n}\n```\n\n| 필드 | 설명 |\n|------|------|\n| `kty` | Key Type - 키 종류 (RSA, EC, oct 등) |\n| `kid` | Key ID - 키 식별자 |\n| `use` | 용도 (sig: 서명, enc: 암호화) |\n| `alg` | 알고리즘 (RS256, ES256 등) |\n| `n`, `e` | RSA 공개키 구성 요소 |\n\n#### JWKS (JWK Set)\n\n여러 JWK를 묶어서 제공하는 형식. 보통 `/.well-known/jwks.json` 엔드포인트로 제공된다.\n\n```json\n{\n  \"keys\": [\n    { \"kty\": \"RSA\", \"kid\": \"key-1\", ... },\n    { \"kty\": \"RSA\", \"kid\": \"key-2\", ... }\n  ]\n}\n```\n\n---\n\n### OAuth 2.0\n\n**OAuth 2.0**은 리소스 접근 권한을 위임하기 위한 **인가 프레임워크(Authorization Framework)**이다.\n\n#### 주요 역할\n\n| 역할 | 설명 | 예시 |\n|------|------|------|\n| **Resource Owner** | 리소스 소유자 (사용자) | 일반 사용자 |\n| **Client** | 리소스에 접근하려는 애플리케이션 | 웹/모바일 앱 |\n| **Authorization Server** | 인증/토큰 발급 서버 | Google, Kakao 인증 서버 |\n| **Resource Server** | 보호된 리소스를 가진 서버 | API 서버 |\n\n#### 주요 Grant Types\n\n| Grant Type | 사용 상황 | 보안 수준 |\n|------------|----------|----------|\n| **Authorization Code** | 서버 사이드 앱 (가장 안전) | 높음 |\n| **Authorization Code + PKCE** | SPA, 모바일 앱 | 높음 |\n| **Client Credentials** | 서버 간 통신 (사용자 없음) | 중간 |\n| **Refresh Token** | 액세스 토큰 갱신 | - |\n| ~~Implicit~~ | (더 이상 권장하지 않음) | 낮음 |\n| ~~Password~~ | (더 이상 권장하지 않음) | 낮음 |\n\n#### Authorization Code Flow\n\n```\n┌──────────┐                              ┌─────────────────────┐\n│  User    │                              │ Authorization Server│\n└────┬─────┘                              └──────────┬──────────┘\n     │                                               │\n     │  1. 로그인 요청                                │\n     ├──────────────────────────────────────────────>│\n     │                                               │\n     │  2. 로그인 페이지 표시                         │\n     │<──────────────────────────────────────────────┤\n     │                                               │\n     │  3. 자격 증명 제출                             │\n     ├──────────────────────────────────────────────>│\n     │                                               │\n     │  4. Authorization Code 반환                   │\n     │<──────────────────────────────────────────────┤\n     │                                               │\n┌────┴─────┐                                         │\n│  Client  │  5. Code + Client Secret으로 토큰 요청   │\n│  Server  ├────────────────────────────────────────>│\n│          │                                         │\n│          │  6. Access Token (+ Refresh Token) 반환 │\n│          │<────────────────────────────────────────┤\n└──────────┘\n```\n\n---\n\n## 핵심 차이점 비교\n\n| 구분 | JWT | JWK | OAuth 2.0 |\n|------|-----|-----|-----------|\n| **무엇인가?** | 토큰 형식 (Format) | 키 표현 방식 (Key Format) | 인가 프레임워크 (Framework) |\n| **역할** | 정보를 안전하게 전달 | 암호화 키를 JSON으로 표현 | 권한 위임 절차 정의 |\n| **레이어** | 데이터 포맷 | 키 관리 | 프로토콜/플로우 |\n| **단독 사용** | 가능 | 불가 (JWT/JWE와 함께) | 가능 |\n| **표준** | RFC 7519 | RFC 7517 | RFC 6749 |\n\n### 관계도\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                       OAuth 2.0                              │\n│                    (인가 프레임워크)                           │\n│                                                             │\n│   ┌─────────────────────────────────────────────────────┐   │\n│   │              Access Token으로 JWT 사용               │   │\n│   │                                                     │   │\n│   │   ┌──────────────┐        ┌──────────────┐         │   │\n│   │   │     JWT      │        │     JWK      │         │   │\n│   │   │  (토큰 형식)  │◄───────│  (키 표현)    │         │   │\n│   │   │              │  검증   │              │         │   │\n│   │   └──────────────┘        └──────────────┘         │   │\n│   └─────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 사용 사례\n\n### JWT 사용 사례\n\n| 사례 | 설명 |\n|------|------|\n| **Stateless 인증** | 서버에 세션 저장 없이 토큰만으로 인증 |\n| **마이크로서비스 간 통신** | 서비스 간 사용자 정보 전달 |\n| **Single Sign-On (SSO)** | 여러 서비스에서 동일 토큰 사용 |\n| **API 인증** | Bearer 토큰으로 API 접근 |\n\n### JWK 사용 사례\n\n| 사례 | 설명 |\n|------|------|\n| **공개키 배포** | JWKS 엔드포인트로 JWT 검증용 공개키 제공 |\n| **키 로테이션** | kid로 여러 키 버전 관리 |\n| **분산 시스템** | 여러 서비스가 동일 공개키로 JWT 검증 |\n\n### OAuth 2.0 사용 사례\n\n| 사례 | 설명 |\n|------|------|\n| **소셜 로그인** | Google, Kakao, Naver 로그인 |\n| **써드파티 API 접근** | 사용자 대신 외부 서비스 접근 |\n| **권한 범위 제어** | scope로 세밀한 권한 관리 |\n\n---\n\n## 보안 고려사항\n\n### JWT 보안\n\n| 주의점 | 권장사항 |\n|--------|----------|\n| **alg: none 공격** | 서버에서 허용 알고리즘 명시적 지정 |\n| **토큰 탈취** | 짧은 만료 시간 설정 (15분~1시간) |\n| **민감 정보 노출** | Payload에 민감 정보 저장 금지 (Base64 디코딩 가능) |\n| **토큰 무효화** | Refresh Token + Token Blacklist 사용 |\n| **알고리즘 선택** | RS256 또는 ES256 권장 (HS256보다 안전) |\n\n### JWK 보안\n\n| 주의점 | 권장사항 |\n|--------|----------|\n| **키 노출** | 공개키만 JWKS에 포함, 비밀키는 절대 노출 금지 |\n| **키 로테이션** | 정기적인 키 교체, 이전 키는 일정 기간 유지 |\n| **HTTPS 필수** | JWKS 엔드포인트는 반드시 HTTPS 사용 |\n\n### OAuth 2.0 보안\n\n| 주의점 | 권장사항 |\n|--------|----------|\n| **Authorization Code 탈취** | PKCE 사용 필수 (특히 public client) |\n| **Redirect URI 조작** | 정확한 URI 화이트리스트 등록 |\n| **CSRF 공격** | state 파라미터 사용 |\n| **Token 저장** | Access Token: 메모리, Refresh Token: HttpOnly Cookie |\n\n---\n\n## 함께 사용하는 방법\n\n실제 시스템에서는 세 가지를 조합하여 사용한다:\n\n```\n1. 사용자가 OAuth 2.0 Authorization Code Flow로 로그인\n                    ↓\n2. Authorization Server가 Access Token을 JWT 형식으로 발급\n                    ↓\n3. Resource Server가 JWKS 엔드포인트에서 JWK를 가져와 JWT 검증\n                    ↓\n4. 검증 성공 시 리소스 접근 허용\n```\n\n### 실제 구현 예시 (Spring Security)\n\n```java\n@Configuration\n@EnableWebSecurity\npublic class SecurityConfig {\n\n    @Bean\n    public SecurityFilterChain filterChain(HttpSecurity http) throws Exception {\n        http\n            .oauth2ResourceServer(oauth2 -> oauth2\n                .jwt(jwt -> jwt\n                    // JWKS 엔드포인트에서 공개키를 가져와 JWT 검증\n                    .jwkSetUri(\"https://auth.example.com/.well-known/jwks.json\")\n                )\n            );\n        return http.build();\n    }\n}\n```\n\n---\n\n## 요약\n\n| 개념 | 한 줄 정리 |\n|------|-----------|\n| **JWT** | JSON 기반의 자가 포함(self-contained) 토큰 형식 |\n| **JWK** | 암호화 키를 JSON으로 표현하는 표준 |\n| **OAuth 2.0** | 권한 위임을 위한 인가 프레임워크 |\n\n세 개념은 서로 다른 레이어에서 동작하며, 현대 인증 시스템에서는 이들을 조합하여 사용한다:\n- **OAuth 2.0**으로 인가 플로우를 정의하고\n- **JWT**를 토큰 형식으로 사용하며\n- **JWK**로 토큰 검증에 필요한 키를 배포한다\n\n*마지막 업데이트: 2025년 12월*\n", "size": 11523, "lines": 290}]}, "cache": {"files": [{"filename": "cache-strategies.md", "title": "캐시 전략 (Caching Strategies)", "path": "cache/cache-strategies.md", "content": "# 캐시 전략 (Caching Strategies)\n\n캐시를 효과적으로 사용하기 위한 다양한 읽기/쓰기 전략을 알아봅니다. 각 전략의 특징과 적합한 사용 사례를 이해하면 시스템에 맞는 최적의 캐싱 방식을 선택할 수 있습니다.\n\n## 목차\n\n- [읽기 전략](#읽기-전략)\n  - [Cache-Aside (Lazy Loading)](#1-cache-aside-lazy-loading)\n  - [Read-Through](#2-read-through)\n- [쓰기 전략](#쓰기-전략)\n  - [Write-Through](#3-write-through)\n  - [Write-Behind (Write-Back)](#4-write-behind-write-back)\n  - [Write-Around](#5-write-around)\n- [전략 비교](#전략-비교)\n- [캐시 무효화](#캐시-무효화)\n\n---\n\n## 읽기 전략\n\n### 1. Cache-Aside (Lazy Loading)\n\n**가장 널리 사용되는 전략.** 애플리케이션이 캐시와 DB를 직접 관리합니다.\n\n```\n[읽기 흐름]\n1. 캐시에서 데이터 조회\n2. 캐시 히트 → 데이터 반환\n3. 캐시 미스 → DB에서 조회 → 캐시에 저장 → 데이터 반환\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class ProductService {\n\n    private final ProductRepository productRepository;\n    private final RedisTemplate<String, Product> redisTemplate;\n\n    public Product findById(Long id) {\n        String cacheKey = \"product:\" + id;\n\n        // 1. 캐시 조회\n        Product cached = redisTemplate.opsForValue().get(cacheKey);\n        if (cached != null) {\n            return cached;  // 캐시 히트\n        }\n\n        // 2. 캐시 미스 → DB 조회\n        Product product = productRepository.findById(id)\n            .orElseThrow(() -> new ProductNotFoundException(id));\n\n        // 3. 캐시에 저장 (TTL 30분)\n        redisTemplate.opsForValue().set(cacheKey, product, Duration.ofMinutes(30));\n\n        return product;\n    }\n\n    // 데이터 변경 시 캐시 무효화\n    public Product update(Long id, ProductUpdateRequest request) {\n        Product product = productRepository.findById(id)\n            .orElseThrow(() -> new ProductNotFoundException(id));\n\n        product.update(request);\n        Product saved = productRepository.save(product);\n\n        // 캐시 삭제 (다음 조회 시 새로 캐싱)\n        redisTemplate.delete(\"product:\" + id);\n\n        return saved;\n    }\n}\n```\n\n**Spring @Cacheable 사용 시:**\n\n```java\n@Service\npublic class ProductService {\n\n    @Cacheable(value = \"products\", key = \"#id\")\n    public Product findById(Long id) {\n        return productRepository.findById(id)\n            .orElseThrow(() -> new ProductNotFoundException(id));\n    }\n\n    @CacheEvict(value = \"products\", key = \"#id\")\n    public Product update(Long id, ProductUpdateRequest request) {\n        // 업데이트 로직...\n    }\n}\n```\n\n| 장점 | 단점 |\n|------|------|\n| 구현이 간단함 | 첫 요청 시 지연 발생 (Cache Miss) |\n| 필요한 데이터만 캐싱 | 데이터 불일치 가능 (캐시 만료 전 DB 변경 시) |\n| 캐시 장애 시에도 서비스 가능 | 애플리케이션에서 캐시 로직 관리 필요 |\n\n---\n\n### 2. Read-Through\n\n캐시 라이브러리가 DB 로딩을 담당. 애플리케이션은 캐시만 바라봅니다.\n\n```\n[읽기 흐름]\n1. 애플리케이션 → 캐시에 데이터 요청\n2. 캐시 히트 → 데이터 반환\n3. 캐시 미스 → 캐시가 직접 DB에서 로드 → 저장 → 반환\n```\n\n```java\n// Caffeine + CacheLoader 예시\n@Configuration\npublic class CacheConfig {\n\n    @Bean\n    public LoadingCache<Long, Product> productCache(ProductRepository repository) {\n        return Caffeine.newBuilder()\n            .maximumSize(10_000)\n            .expireAfterWrite(Duration.ofMinutes(30))\n            .build(id -> repository.findById(id).orElse(null));  // CacheLoader\n    }\n}\n\n@Service\n@RequiredArgsConstructor\npublic class ProductService {\n\n    private final LoadingCache<Long, Product> productCache;\n\n    public Product findById(Long id) {\n        // 캐시가 알아서 로딩 처리\n        return productCache.get(id);\n    }\n}\n```\n\n| 장점 | 단점 |\n|------|------|\n| 애플리케이션 코드가 단순 | 캐시 라이브러리 지원 필요 |\n| 로딩 로직 중앙화 | 첫 요청 시 지연 발생 |\n| 중복 DB 조회 방지 | 캐시 장애 시 서비스 불가 |\n\n---\n\n## 쓰기 전략\n\n### 3. Write-Through\n\n데이터를 캐시와 DB에 **동시에** 씁니다. 항상 일관성 보장.\n\n```\n[쓰기 흐름]\n1. 애플리케이션 → 캐시에 쓰기 요청\n2. 캐시 → DB에 저장 (동기)\n3. 캐시 → 캐시에 저장\n4. 성공 응답\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class ProductService {\n\n    private final ProductRepository productRepository;\n    private final RedisTemplate<String, Product> redisTemplate;\n\n    @Transactional\n    public Product create(ProductCreateRequest request) {\n        Product product = Product.from(request);\n\n        // 1. DB에 저장\n        Product saved = productRepository.save(product);\n\n        // 2. 캐시에도 저장 (동기)\n        String cacheKey = \"product:\" + saved.getId();\n        redisTemplate.opsForValue().set(cacheKey, saved, Duration.ofMinutes(30));\n\n        return saved;\n    }\n\n    @Transactional\n    public Product update(Long id, ProductUpdateRequest request) {\n        Product product = productRepository.findById(id)\n            .orElseThrow(() -> new ProductNotFoundException(id));\n\n        product.update(request);\n\n        // 1. DB 업데이트\n        Product saved = productRepository.save(product);\n\n        // 2. 캐시 업데이트 (동기)\n        String cacheKey = \"product:\" + id;\n        redisTemplate.opsForValue().set(cacheKey, saved, Duration.ofMinutes(30));\n\n        return saved;\n    }\n}\n```\n\n**@CachePut 사용:**\n\n```java\n@CachePut(value = \"products\", key = \"#result.id\")\npublic Product create(ProductCreateRequest request) {\n    return productRepository.save(Product.from(request));\n}\n\n@CachePut(value = \"products\", key = \"#id\")\npublic Product update(Long id, ProductUpdateRequest request) {\n    Product product = productRepository.findById(id).orElseThrow();\n    product.update(request);\n    return productRepository.save(product);\n}\n```\n\n| 장점 | 단점 |\n|------|------|\n| 캐시-DB 항상 일관성 유지 | 쓰기 지연 증가 (두 곳에 저장) |\n| 읽기 시 캐시 미스 적음 | 사용되지 않는 데이터도 캐싱 |\n\n---\n\n### 4. Write-Behind (Write-Back)\n\n캐시에 먼저 쓰고, DB 저장은 **비동기로** 나중에 처리.\n\n```\n[쓰기 흐름]\n1. 애플리케이션 → 캐시에 저장\n2. 즉시 성공 응답\n3. (비동기) 캐시 → 일정 시간/조건 후 DB에 일괄 저장\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class ViewCountService {\n\n    private final RedisTemplate<String, String> redisTemplate;\n    private final ViewCountRepository viewCountRepository;\n\n    // 조회수 증가 (캐시에만 저장 - 빠름)\n    public void incrementViewCount(Long postId) {\n        String key = \"viewcount:\" + postId;\n        redisTemplate.opsForValue().increment(key);\n    }\n\n    // 주기적으로 DB에 동기화 (스케줄러)\n    @Scheduled(fixedRate = 60000)  // 1분마다\n    public void syncToDatabase() {\n        Set<String> keys = redisTemplate.keys(\"viewcount:*\");\n        if (keys == null || keys.isEmpty()) return;\n\n        List<ViewCount> updates = new ArrayList<>();\n\n        for (String key : keys) {\n            Long postId = Long.parseLong(key.replace(\"viewcount:\", \"\"));\n            String countStr = redisTemplate.opsForValue().getAndDelete(key);\n\n            if (countStr != null) {\n                updates.add(new ViewCount(postId, Long.parseLong(countStr)));\n            }\n        }\n\n        // 일괄 업데이트\n        viewCountRepository.batchUpdate(updates);\n    }\n}\n```\n\n**메시지 큐 활용:**\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n\n    private final RedisTemplate<String, Order> redisTemplate;\n    private final KafkaTemplate<String, Order> kafkaTemplate;\n\n    public Order create(OrderCreateRequest request) {\n        Order order = Order.from(request);\n        String cacheKey = \"order:\" + order.getId();\n\n        // 1. 캐시에 저장 (즉시)\n        redisTemplate.opsForValue().set(cacheKey, order, Duration.ofHours(1));\n\n        // 2. 메시지 큐로 DB 저장 요청 (비동기)\n        kafkaTemplate.send(\"order-events\", order);\n\n        return order;\n    }\n}\n\n// 컨슈머: DB 저장 처리\n@KafkaListener(topics = \"order-events\")\npublic void saveOrder(Order order) {\n    orderRepository.save(order);\n}\n```\n\n| 장점 | 단점 |\n|------|------|\n| 쓰기 성능 매우 빠름 | 데이터 유실 위험 (캐시 장애 시) |\n| DB 부하 감소 (일괄 처리) | 복잡한 구현 |\n| 쓰기 집중 워크로드에 적합 | 일시적 데이터 불일치 |\n\n---\n\n### 5. Write-Around\n\nDB에만 쓰고, 캐시는 읽기 시에 로드. 자주 읽히지 않는 데이터에 적합.\n\n```\n[쓰기 흐름]\n1. 애플리케이션 → DB에만 저장\n2. 캐시는 건드리지 않음 (또는 삭제)\n\n[읽기 흐름]\nCache-Aside와 동일\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class LogService {\n\n    private final LogRepository logRepository;\n    private final RedisTemplate<String, Log> redisTemplate;\n\n    // 로그 저장: DB에만 (자주 읽히지 않음)\n    public Log save(Log log) {\n        return logRepository.save(log);\n        // 캐시에 저장하지 않음\n    }\n\n    // 조회 시에만 캐싱 (필요할 때)\n    public Log findById(Long id) {\n        String cacheKey = \"log:\" + id;\n\n        Log cached = redisTemplate.opsForValue().get(cacheKey);\n        if (cached != null) {\n            return cached;\n        }\n\n        Log log = logRepository.findById(id).orElseThrow();\n        redisTemplate.opsForValue().set(cacheKey, log, Duration.ofMinutes(10));\n\n        return log;\n    }\n}\n```\n\n| 장점 | 단점 |\n|------|------|\n| 불필요한 캐시 쓰기 방지 | 읽기 시 캐시 미스 발생 |\n| 쓰기 성능 유지 | 자주 읽는 데이터에는 부적합 |\n| 저장 공간 효율적 | |\n\n---\n\n## 전략 비교\n\n| 전략 | 읽기 성능 | 쓰기 성능 | 일관성 | 복잡도 | 적합한 케이스 |\n|------|----------|----------|--------|--------|--------------|\n| **Cache-Aside** | 높음 (캐시 히트 시) | 보통 | 보통 | 낮음 | 범용, 읽기 많은 경우 |\n| **Read-Through** | 높음 | 보통 | 보통 | 보통 | 읽기 패턴 단순화 |\n| **Write-Through** | 매우 높음 | 낮음 | 높음 | 보통 | 일관성 중요한 경우 |\n| **Write-Behind** | 높음 | 매우 높음 | 낮음 | 높음 | 쓰기 집중, 성능 중요 |\n| **Write-Around** | 보통 | 높음 | 보통 | 낮음 | 쓰기 많고 읽기 적은 경우 |\n\n### 조합 예시\n\n```\n읽기: Cache-Aside + 쓰기: Write-Through\n→ 읽기 성능 좋고, 데이터 일관성도 보장\n\n읽기: Read-Through + 쓰기: Write-Behind\n→ 고성능 필요한 경우, 일시적 불일치 허용\n```\n\n---\n\n## 캐시 무효화\n\n### 1. TTL 기반 (Time-To-Live)\n\n```java\n// 30분 후 자동 만료\nredisTemplate.opsForValue().set(key, value, Duration.ofMinutes(30));\n```\n\n### 2. 이벤트 기반 무효화\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class ProductService {\n\n    private final ApplicationEventPublisher eventPublisher;\n\n    @Transactional\n    public Product update(Long id, ProductUpdateRequest request) {\n        Product product = productRepository.findById(id).orElseThrow();\n        product.update(request);\n        Product saved = productRepository.save(product);\n\n        // 이벤트 발행\n        eventPublisher.publishEvent(new ProductUpdatedEvent(id));\n\n        return saved;\n    }\n}\n\n@Component\n@RequiredArgsConstructor\npublic class CacheInvalidationHandler {\n\n    private final RedisTemplate<String, Object> redisTemplate;\n\n    @EventListener\n    public void handleProductUpdate(ProductUpdatedEvent event) {\n        redisTemplate.delete(\"product:\" + event.getProductId());\n        redisTemplate.delete(\"product:list\");  // 관련 캐시도 삭제\n    }\n}\n```\n\n### 3. 패턴 기반 삭제\n\n```java\n// 특정 패턴의 모든 키 삭제\npublic void invalidateByPattern(String pattern) {\n    Set<String> keys = redisTemplate.keys(pattern);\n    if (keys != null && !keys.isEmpty()) {\n        redisTemplate.delete(keys);\n    }\n}\n\n// 사용 예: 카테고리 변경 시 관련 상품 캐시 모두 삭제\ninvalidateByPattern(\"product:category:123:*\");\n```\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 12394, "lines": 450}, {"filename": "redis-basics.md", "title": "Redis 기초", "path": "cache/redis-basics.md", "content": "# Redis 기초\n\nRedis(Remote Dictionary Server)는 인메모리 데이터 구조 저장소로, 캐시, 메시지 브로커, 세션 저장소 등 다양한 용도로 사용됩니다.\n\n## 목차\n\n- [설치 및 실행](#설치-및-실행)\n- [기본 명령어](#기본-명령어)\n- [데이터 타입](#데이터-타입)\n- [TTL (Time To Live)](#ttl-time-to-live)\n- [Spring Boot 연동](#spring-boot-연동)\n- [클라우드 Redis 서비스](#클라우드-redis-서비스)\n\n---\n\n## 설치 및 실행\n\n### Docker로 설치 (권장)\n\n```bash\n# Redis 컨테이너 실행\ndocker run -d --name redis -p 6379:6379 redis:latest\n\n# Redis CLI 접속\ndocker exec -it redis redis-cli\n```\n\n### macOS (Homebrew)\n\n```bash\n# 설치\nbrew install redis\n\n# 서비스 시작\nbrew services start redis\n\n# CLI 접속\nredis-cli\n```\n\n### 연결 확인\n\n```bash\nredis-cli ping\n# 응답: PONG\n```\n\n---\n\n## 기본 명령어\n\n### 키-값 조작\n\n```bash\n# 값 저장\nSET user:1:name \"홍길동\"\n\n# 값 조회\nGET user:1:name\n# 결과: \"홍길동\"\n\n# 값 삭제\nDEL user:1:name\n# 결과: (integer) 1\n\n# 비동기 삭제 (권장)\nUNLINK user:1:name\n# 결과: (integer) 1\n# DEL은 동기 삭제(블로킹), UNLINK는 비동기 삭제(논블로킹)\n# 큰 데이터 삭제 시 UNLINK 사용 권장\n\n# 키 존재 확인\nEXISTS user:1:name\n# 결과: (integer) 0 (없음) / 1 (있음)\n\n# 여러 키-값 한번에 저장\nMSET user:1:name \"홍길동\" user:1:age \"25\" user:1:city \"서울\"\n\n# 여러 값 한번에 조회\nMGET user:1:name user:1:age user:1:city\n```\n\n### 키 관리\n\n```bash\n# 패턴으로 키 검색 (프로덕션에서는 SCAN 사용 권장)\nKEYS user:*\n\n# 키 타입 확인\nTYPE user:
