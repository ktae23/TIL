### 보안 특성 비교\n\n| 구분 | HTTP | HTTPS |\n|------|------|-------|\n| **암호화** | 없음 (평문 전송) | SSL/TLS 암호화 |\n| **데이터 무결성** | 보장 안 됨 | MAC(Message Authentication Code)으로 보장 |\n| **서버 인증** | 없음 | 인증서로 서버 신원 확인 |\n| **클라이언트 인증** | 없음 | 상호 TLS(mTLS)로 가능 |\n| **인증서 필요** | 불필요 | SSL/TLS 인증서 필수 |\n\n### 성능 및 운영 비교\n\n| 구분 | HTTP | HTTPS |\n|------|------|-------|\n| **초기 연결 속도** | 빠름 (TCP 3-way만) | 약간 느림 (TLS Handshake 추가) |\n| **데이터 전송 속도** | 동일 | 동일 (암호화 오버헤드 무시 가능) |\n| **CPU 사용량** | 낮음 | 약간 높음 (암/복호화) |\n| **캐싱** | 프록시 캐싱 자유로움 | 제한적 (중간자 복호화 불가) |\n| **인증서 비용** | 없음 | 무료 (Let's Encrypt) ~ 유료 |\n\n### 기타 비교\n\n| 구분 | HTTP | HTTPS |\n|------|------|-------|\n| **SEO 점수** | 불리 | Google 등 검색엔진 우대 |\n| **브라우저 표시** | \"안전하지 않음\" 경고 | 자물쇠 아이콘 |\n| **HTTP/2 지원** | 브라우저에서 미지원 | 필수 (브라우저 정책) |\n| **HTTP/3 지원** | 미지원 | 지원 |\n| **PWA 지원** | 불가 | 필수 요건 |\n| **Geolocation API** | 차단됨 | 허용 |\n\n---\n\n## 4. HTTP 동작 원리\n\n### 기본 통신 흐름\n\n```\n┌──────────────┐                              ┌──────────────┐\n│   Client     │                              │    Server    │\n│  (Browser)   │                              │  (Web App)   │\n└──────┬───────┘                              └──────┬───────┘\n       │                                             │\n       │──────── 1. TCP SYN ────────────────────────>│\n       │<─────── 2. TCP SYN-ACK ─────────────────────│\n       │──────── 3. TCP ACK ────────────────────────>│\n       │                                             │\n       │         === TCP 연결 완료 (3-way) ===       │\n       │                                             │\n       │──────── 4. HTTP Request (평문) ────────────>│\n       │         GET /index.html HTTP/1.1            │\n       │         Host: example.com                   │\n       │         User-Agent: Chrome/120              │\n       │                                             │\n       │<─────── 5. HTTP Response (평문) ────────────│\n       │         HTTP/1.1 200 OK                     │\n       │         Content-Type: text/html             │\n       │         <html>...</html>                    │\n       │                                             │\n```\n\n### HTTP 요청 구조\n\n```http\nGET /api/users HTTP/1.1\nHost: example.com\nUser-Agent: Mozilla/5.0\nAccept: application/json\nCookie: session_id=abc123\nAuthorization: Bearer eyJhbGciOiJIUzI1...\n\n(요청 본문 - POST/PUT인 경우)\n```\n\n### HTTP 응답 구조\n\n```http\nHTTP/1.1 200 OK\nContent-Type: application/json\nContent-Length: 256\nSet-Cookie: session_id=xyz789\nCache-Control: max-age=3600\n\n{\"id\": 1, \"name\": \"John\", \"email\": \"john@example.com\"}\n```\n\n### HTTP의 보안 취약점\n\n```\n┌──────────┐                    ┌──────────┐                    ┌──────────┐\n│  Client  │═══════════════════>│ Attacker │═══════════════════>│  Server  │\n└──────────┘     평문 데이터     └──────────┘     평문 데이터     └──────────┘\n                    │\n                    ▼\n            ┌──────────────┐\n            │ 데이터 탈취   │\n            │ 데이터 변조   │\n            │ 세션 하이재킹  │\n            └──────────────┘\n```\n\n---\n\n## 5. HTTPS 동작 원리 (TLS Handshake)\n\n### TLS 1.2 Handshake (전통적 방식)\n\n```\n┌──────────────┐                              ┌──────────────┐\n│   Client     │                              │    Server    │\n└──────┬───────┘                              └──────┬───────┘\n       │                                             │\n       │══════ TCP 3-way Handshake (동일) ══════════│\n       │                                             │\n       │────────── TLS Handshake 시작 ──────────────│\n       │                                             │\n       │─── 1. ClientHello ─────────────────────────>│\n       │    • 지원 TLS 버전: 1.2, 1.3               │\n       │    • 지원 Cipher Suites 목록               │\n       │    • 클라이언트 랜덤값 (32 bytes)          │\n       │    • Session ID (재연결 시)                │\n       │                                             │\n       │<── 2. ServerHello ──────────────────────────│\n       │    • 선택된 TLS 버전: 1.2                  │\n       │    • 선택된 Cipher Suite                   │\n       │    • 서버 랜덤값 (32 bytes)                │\n       │                                             │\n       │<── 3. Certificate ──────────────────────────│\n       │    • 서버 인증서 체인                      │\n       │    • 서버 공개키 포함                      │\n       │                                             │\n       │<── 4. ServerKeyExchange (선택적) ───────────│\n       │    • DHE/ECDHE 키 교환 파라미터            │\n       │                                             │\n       │<── 5. ServerHelloDone ──────────────────────│\n       │                                             │\n       │    [클라이언트: 인증서 검증]                │\n       │    • CA 서명 확인                          │\n       │    • 유효기간 확인                         │\n       │    • 도메인 일치 확인                      │\n       │    • 인증서 폐기 확인 (CRL/OCSP)           │\n       │                                             │\n       │─── 6. ClientKeyExchange ───────────────────>│\n       │    • Pre-Master Secret                     │\n       │    • (서버 공개키로 암호화)                │\n       │                                             │\n       │    [양측: Master Secret 생성]               │\n       │    Master Secret = PRF(                     │\n       │      Pre-Master Secret,                     │\n       │      \"master secret\",                       │\n       │      ClientRandom + ServerRandom            │\n       │    )                                        │\n       │                                             │\n       │─── 7. ChangeCipherSpec ────────────────────>│\n       │    (이후 암호화 통신 전환 알림)            │\n       │                                             │\n       │─── 8. Finished (암호화) ───────────────────>│\n       │    • 핸드셰이크 검증 해시                  │\n       │                                             │\n       │<── 9. ChangeCipherSpec ─────────────────────│\n       │<── 10. Finished (암호화) ───────────────────│\n       │                                             │\n       │══════════ TLS Handshake 완료 ══════════════│\n       │                                             │\n       │<═══════ 암호화된 HTTP 통신 ════════════════>│\n       │         (Application Data)                  │\n       │                                             │\n```\n\n### TLS 1.3 Handshake (개선된 방식)\n\nTLS 1.3은 **1-RTT (Round Trip Time)** 으로 핸드셰이크를 단축했습니다.\n\n```\n┌──────────────┐                              ┌──────────────┐\n│   Client     │                              │    Server    │\n└──────┬───────┘                              └──────┬───────┘\n       │                                             │\n       │─── 1. ClientHello ─────────────────────────>│\n       │    • 지원 TLS 버전                         │\n       │    • 지원 Cipher Suites                    │\n       │    • Key Share (ECDHE 공개키)              │ ← 키 교환 미리 시작\n       │    • Signature Algorithms                  │\n       │                                             │\n       │<── 2. ServerHello ──────────────────────────│\n       │    • 선택된 Cipher Suite                   │\n       │    • Key Share (ECDHE 공개키)              │\n       │                                             │\n       │<── 3. EncryptedExtensions ──────────────────│\n       │<── 4. Certificate ──────────────────────────│\n       │<── 5. CertificateVerify ────────────────────│\n       │<── 6. Finished ─────────────────────────────│\n       │                                             │\n       │    [모든 이후 통신 암호화됨]                │\n       │                                             │\n       │─── 7. Finished ────────────────────────────>│\n       │                                             │\n       │<═══════ 암호화된 HTTP 통신 ════════════════>│\n       │                                             │\n```\n\n### TLS 1.3 0-RTT (Zero Round Trip Time)\n\n이전에 연결했던 서버에 재연결 시 첫 패킷부터 암호화된 데이터 전송 가능:\n\n```\n┌──────────────┐                              ┌──────────────┐\n│   Client     │                              │    Server    │\n└──────┬───────┘                              └──────┬───────┘\n       │                                             │\n       │─── ClientHello + Early Data ───────────────>│\n       │    • PSK (Pre-Shared Key)                  │\n       │    • 암호화된 HTTP 요청 (0-RTT)            │ ← 첫 패킷부터 데이터 전송!\n       │                                             │\n       │<── ServerHello + Finished ──────────────────│\n       │<── 암호화된 HTTP 응답 ──────────────────────│\n       │                                             │\n```\n\n> **주의**: 0-RTT는 Replay Attack에 취약할 수 있어 멱등성(Idempotent) 요청에만 권장\n\n---\n\n## 6. TLS 버전별 특징\n\n| 버전 | 출시 | 상태 | 주요 특징 |\n|------|------|------|----------|\n| **SSL 2.0** | 1995 | 폐기 | 심각한 보안 취약점 |\n| **SSL 3.0** | 1996 | 폐기 | POODLE 취약점 |\n| **TLS 1.0** | 1999 | 폐기 | BEAST 취약점 |\n| **TLS 1.1** | 2006 | 폐기 | CBC 취약점 일부 해결 |\n| **TLS 1.2** | 2008 | 사용 | AEAD 암호화 지원, SHA-256 |\n| **TLS 1.3** | 2018 | 권장 | 1-RTT, 0-RTT, 취약 알고리즘 제거 |\n\n### TLS 1.3에서 제거된 것들\n\n- RSA 키 교환 (Forward Secrecy 미지원)\n- CBC 모드 암호화\n- RC4, DES, 3DES\n- MD5, SHA-1\n- 압축 (CRIME 공격 방지)\n- 재협상 (Renegotiation)\n\n---\n\n## 7. 암호화 기술 상세\n\n### 암호화 종류와 용도\n\n| 구분 | 알고리즘 예시 | 용도 | 특징 |\n|------|--------------|------|------|\n| **비대칭 암호화** | RSA, ECDSA, Ed25519 | 키 교환, 서명 | 느리지만 안전한 키 교환 |\n| **대칭 암호화** | AES-128-GCM, ChaCha20-Poly1305 | 데이터 암호화 | 빠른 대량 데이터 처리 |\n| **해시 함수** | SHA-256, SHA-384 | 무결성 검증 | 단방향, 고정 길이 출력 |\n| **MAC** | HMAC-SHA256, Poly1305 | 메시지 인증 | 무결성 + 인증 |\n| **키 교환** | ECDHE, X25519 | 세션 키 생성 | Forward Secrecy 제공 |\n\n### Cipher Suite 구조\n\nCipher Suite는 사용할 암호화 알고리즘 조합을 정의합니다:\n\n```\nTLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384\n│   │     │        │   │   │   │\n│   │     │        │   │   │   └── PRF 해시: SHA-384\n│   │     │        │   │   └────── 인증 태그 방식: GCM\n│   │     │        │   └────────── 키 길이: 256비트\n│   │     │        └────────────── 대칭 암호화: AES\n│   │     └─────────────────────── 인증서 타입: RSA\n│   └───────────────────────────── 키 교환: ECDHE\n└───────────────────────────────── 프로토콜: TLS\n```\n\n### TLS 1.3 Cipher Suites (간소화됨)\n\n```\nTLS_AES_256_GCM_SHA384\nTLS_AES_128_GCM_SHA256\nTLS_CHACHA20_POLY1305_SHA256\n```\n\n> TLS 1.3에서는 키 교환은 항상 ECDHE, 인증서 서명은 별도 협상\n\n### Forward Secrecy (전방향 비밀성)\n\n```\n일반 RSA 키 교환 (Forward Secrecy 없음):\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n• 서버의 개인키가 유출되면 과거 모든 통신 복호화 가능\n• 공격자가 과거 트래픽을 저장해두었다가 나중에 복호화\n\n\nECDHE 키 교환 (Forward Secrecy 있음):\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n• 매 세션마다 새로운 임시 키 쌍 생성\n• 서버 개인키가 유출되어도 과거 세션 키 복구 불가\n• 각 세션이 독립적으로 보호됨\n```\n\n---\n\n## 8. 인증서 체계 (PKI)\n\n### 인증서 체인 구조\n\n```\n┌─────────────────────────────────────────────────────────┐\n│                    Root CA 인증서                       │\n│  (DigiCert, Let's Encrypt, GlobalSign 등)               │\n│  • 브라우저/OS에 미리 내장 (Trust Store)                │\n│  • 자체 서명 (Self-signed)                             │\n│  • 유효기간: 20-30년                                   │\n└─────────────────────────┬───────────────────────────────┘\n                          │ 서명\n                          ▼\n┌─────────────────────────────────────────────────────────┐\n│               Intermediate CA 인증서                    │\n│  (중간 인증 기관)                                       │\n│  • Root CA가 서명                                       │\n│  • 실제 서버 인증서 발급 담당                           │\n│  • Root CA 보호 (오프라인 보관)                         │\n└─────────────────────────┬───────────────────────────────┘\n                          │ 서명\n                          ▼\n┌─────────────────────────────────────────────────────────┐\n│                End-Entity 인증서                        │\n│  (서버 인증서, 예: example.com)                         │\n│  • Intermediate CA가 서명                               │\n│  • 서버에 설치                                          │\n│  • 유효기간: 90일 ~ 1년                                 │\n└─────────────────────────────────────────────────────────┘\n```\n\n### 인증서 내용 (X.509 v3)\n\n```\nCertificate:\n    Data:\n        Version: 3 (0x2)\n        Serial Number: 04:00:00:00:00:01:2f:4e:e6:52:a3\n        Signature Algorithm: sha256WithRSAEncryption\n        Issuer: CN=DigiCert SHA2 Extended Validation Server CA\n        Validity:\n            Not Before: Jan  1 00:00:00 2024 GMT\n            Not After : Dec 31 23:59:59 2024 GMT\n        Subject: CN=www.example.com, O=Example Inc, L=Seoul, C=KR\n        Subject Public Key Info:\n            Public Key Algorithm: rsaEncryption\n            RSA Public-Key: (2048 bit)\n        X509v3 extensions:\n            X509v3 Subject Alternative Name:\n                DNS:example.com, DNS:www.example.com, DNS:api.example.com\n            X509v3 Key Usage:\n                Digital Signature, Key Encipherment\n            X509v3 Extended Key Usage:\n                TLS Web Server Authentication\n```\n\n### 인증서 유형 비교\n\n| 유형 | 검증 내용 | 발급 시간 | 비용 | 표시 |\n|------|----------|----------|------|------|\n| **DV (Domain Validation)** | 도메인 소유권만 | 수 분 | 무료 ~ 저렴 | 자물쇠 |\n| **OV (Organization Validation)** | 도메인 + 조직 | 수 일 | 중간 | 자물쇠 + 조직명 |\n| **EV (Extended Validation)** | 도메인 + 조직 + 법적 실체 | 수 주 | 고가 | 녹색 주소창 (구형 브라우저) |\n\n### 인증서 폐기 확인\n\n```\n┌──────────────────────────────────────────────────────────┐\n│ CRL (Certificate Revocation List)                        │\n│━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━│\n│ • CA가 주기적으로 폐기 목록 발행                         │\n│ • 클라이언트가 다운로드하여 확인                         │\n│ • 단점: 목록이 커지면 느림                               │\n└──────────────────────────────────────────────────────────┘\n\n┌──────────────────────────────────────────────────────────┐\n│ OCSP (Online Certificate Status Protocol)                │\n│━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━│\n│ • 실시간으로 CA에 인증서 상태 질의                       │\n│ • 개별 인증서 확인 가능                                  │\n│ • 단점: 프라이버시 우려 (CA가 방문 사이트 알 수 있음)    │\n└──────────────────────────────────────────────────────────┘\n\n┌──────────────────────────────────────────────────────────┐\n│ OCSP Stapling                                            │\n│━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━│\n│ • 서버가 미리 OCSP 응답을 받아 클라이언트에 제공         │\n│ • 프라이버시 보호 + 성능 향상                            │\n│ • 현재 권장 방식                                         │\n└──────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 9. 보안 위협 비교\n\n### 공격 유형별 방어 여부\n\n| 공격 유형 | 설명 | HTTP | HTTPS |\n|-----------|------|------|-------|\n| **도청 (Eavesdropping)** | 네트워크 트래픽 감청 | 취약 | 방어됨 |\n| **중간자 공격 (MITM)** | 통신 중간에서 가로채기/변조 | 취약 | 방어됨 |\n| **세션 하이재킹** | 세션 쿠키 탈취 | 취약 | 방어됨 |\n| **데이터 변조** | 전송 중 내용 수정 | 취약 | 방어됨 |\n| **Replay Attack** | 캡처한 요청 재전송 | 취약 | 부분 방어 |\n| **SSL Stripping** | HTTPS→HTTP 다운그레이드 | N/A | HSTS로 방어 |\n| **피싱** | 가짜 사이트로 유도 | 취약 | EV 인증서로 일부 방어 |\n\n### 중간자 공격 (MITM) 시나리오\n\n```\nHTTP (취약):\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[사용자] ──평문──> [공격자] ──평문──> [서버]\n   │                  │\n   │                  ▼\n   │           ┌─────────────┐\n   │           │ 비밀번호    │\n   │           │ 카드번호    │  ← 탈취!\n   │           │ 개인정보    │\n   │           └─────────────┘\n\n\nHTTPS (방어됨):\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[사용자] ══암호화══> [공격자] ══암호화══> [서버]\n   │                    │\n   │                    ▼\n   │              ┌──────────┐\n   │              │ ???????? │  ← 복호화 불가!\n   │              │ ???????? │\n   │              └──────────┘\n```\n\n### SSL Stripping 공격과 방어\n\n```\n공격 시나리오:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n1. 사용자가 http://bank.com 입력\n2. 공격자가 중간에서 요청 가로챔\n3. 공격자는 서버와 HTTPS로 통신\n4. 사용자에게는 HTTP로 응답\n5. 사용자는 평문으로 로그인 정보 전송 → 탈취!\n\n\nHSTS (HTTP Strict Transport Security)로 방어:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\nHTTP Response Header:\nStrict-Transport-Security: max-age=31536000; includeSubDomains; preload\n\n• 브라우저가 해당 도메인은 항상 HTTPS로만 접속\n• max-age 동안 HTTP 접속 시도 자체를 차단\n• preload: 브라우저에 미리 등록 (hstspreload.org)\n```\n\n---\n\n## 10. 실무 적용 가이드\n\n### HTTPS 적용 체크리스트\n\n```\n□ 1. 인증서 발급\n   ├─ Let's Encrypt (무료, 90일 자동 갱신)\n   ├─ 상용 CA (DigiCert, Sectigo 등)\n   └─ 와일드카드 인증서 (*.example.com)\n\n□ 2. 서버 설정\n   ├─ TLS 1.2+ 만 허용\n   ├─ 강력한 Cipher Suite 설정\n   ├─ OCSP Stapling 활성화\n   └─ HTTP → HTTPS 리다이렉트\n\n□ 3. 보안 헤더 설정\n   ├─ Strict-Transport-Security (HSTS)\n   ├─ Content-Security-Policy\n   └─ X-Content-Type-Options\n\n□ 4. 인증서 관리\n   ├─ 자동 갱신 설정 (certbot)\n   ├─ 만료 알림 모니터링\n   └─ 인증서 체인 완전성 확인\n```\n\n### Nginx HTTPS 설정 예시\n\n```nginx\nserver {\n    listen 443 ssl http2;\n    server_name example.com;\n\n    # 인증서 설정\n    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;\n\n    # TLS 설정\n    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;\n    ssl_prefer_server_ciphers off;\n\n    # OCSP Stapling\n    ssl_stapling on;\n    ssl_stapling_verify on;\n    resolver 8.8.8.8 8.8.4.4 valid=300s;\n\n    # 보안 헤더\n    add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n}\n\n# HTTP → HTTPS 리다이렉트\nserver {\n    listen 80;\n    server_name example.com;\n    return 301 https://$server_name$request_uri;\n}\n```\n\n### SSL Labs 등급 기준\n\n| 등급 | 점수 | 의미 |\n|------|------|------|\n| **A+** | 80+ & HSTS | 최상의 보안 설정 |\n| **A** | 80-100 | 우수한 보안 |\n| **B** | 65-79 | 양호하나 개선 필요 |\n| **C** | 50-64 | 취약점 존재 |\n| **F** | 0-49 | 심각한 취약점 |\n\n> 테스트: https://www.ssllabs.com/ssltest/\n\n### 현대 웹 환경에서의 HTTPS\n\n| 기술/정책 | HTTPS 요구 사항 |\n|-----------|----------------|\n| **HTTP/2** | 브라우저에서 HTTPS 필수 |\n| **HTTP/3 (QUIC)** | TLS 1.3 내장 (필수) |\n| **PWA (Progressive Web App)** | Service Worker 사용 시 필수 |\n| **Geolocation API** | Secure Context 필수 |\n| **Web Bluetooth/USB** | Secure Context 필수 |\n| **Payment Request API** | Secure Context 필수 |\n| **Clipboard API** | Secure Context 필수 |\n| **Google SEO** | HTTPS 사이트 순위 우대 |\n| **Chrome 브라우저** | HTTP 사이트 \"안전하지 않음\" 표시 |\n\n---\n\n## 참고 자료\n\n- [RFC 2818 - HTTP Over TLS](https://tools.ietf.org/html/rfc2818)\n- [RFC 8446 - TLS 1.3](https://tools.ietf.org/html/rfc8446)\n- [Mozilla SSL Configuration Generator](https://ssl-config.mozilla.org/)\n- [SSL Labs Server Test](https://www.ssllabs.com/ssltest/)\n- [HSTS Preload List](https://hstspreload.org/)\n- [Let's Encrypt Documentation](https://letsencrypt.org/docs/)\n\n---\n\n*마지막 업데이트: 2026년 1월*\n", "size": 31406, "lines": 655}]}, "python": {"files": [{"filename": "django-프레임워크-사용법.md", "title": "Django 프레임워크 사용법", "path": "python/django-프레임워크-사용법.md", "content": "# Django 프레임워크 사용법\n\nDjango를 사용한 풀스택 웹 애플리케이션 개발의 핵심 개념과 실전 예제를 정리한 문서입니다.\n\n## 목차\n\n1. [설치 및 프로젝트 생성](#설치-및-프로젝트-생성)\n2. [모델과 ORM](#모델과-orm)\n3. [뷰 (Views)](#뷰-views)\n4. [템플릿 (Templates)](#템플릿-templates)\n5. [폼 (Forms)](#폼-forms)\n6. [URL 라우팅](#url-라우팅)\n7. [Admin 관리자 페이지](#admin-관리자-페이지)\n8. [인증 시스템](#인증-시스템)\n9. [Django REST Framework](#django-rest-framework)\n10. [배포](#배포)\n\n---\n\n## 설치 및 프로젝트 생성\n\n### Django 설치\n\n```bash\n# 가상환경 생성\npython -m venv venv\nsource venv/bin/activate  # Windows: venv\\Scripts\\activate\n\n# Django 설치\npip install django\n\n# 버전 확인\npython -m django --version\n```\n\n### 프로젝트 및 앱 생성\n\n```bash\n# 프로젝트 생성\ndjango-admin startproject myproject\ncd myproject\n\n# 앱 생성\npython manage.py startapp blog\npython manage.py startapp accounts\n\n# 개발 서버 실행\npython manage.py runserver\n```\n\n### 프로젝트 구조\n\n```\nmyproject/\n├── manage.py\n├── myproject/\n│   ├── __init__.py\n│   ├── settings.py\n│   ├── urls.py\n│   ├── asgi.py\n│   └── wsgi.py\n├── blog/\n│   ├── migrations/\n│   ├── __init__.py\n│   ├── admin.py\n│   ├── apps.py\n│   ├── models.py\n│   ├── tests.py\n│   └── views.py\n└── accounts/\n    └── ...\n```\n\n### 앱 등록\n\n```python\n# myproject/settings.py\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'blog',  # 추가\n    'accounts',  # 추가\n]\n```\n\n---\n\n## 모델과 ORM\n\n### 모델 정의\n\n```python\n# blog/models.py\nfrom django.db import models\nfrom django.contrib.auth.models import User\nfrom django.utils import timezone\n\nclass Category(models.Model):\n    name = models.CharField(max_length=100, unique=True)\n    slug = models.SlugField(max_length=100, unique=True)\n    description = models.TextField(blank=True)\n\n    class Meta:\n        verbose_name_plural = \"Categories\"\n        ordering = ['name']\n\n    def __str__(self):\n        return self.name\n\nclass Post(models.Model):\n    STATUS_CHOICES = [\n        ('draft', 'Draft'),\n        ('published', 'Published'),\n    ]\n\n    title = models.CharField(max_length=200)\n    slug = models.SlugField(max_length=200, unique=True)\n    author = models.ForeignKey(User, on_delete=models.CASCADE, related_name='blog_posts')\n    category = models.ForeignKey(Category, on_delete=models.SET_NULL, null=True, related_name='posts')\n    content = models.TextField()\n    created_at = models.DateTimeField(auto_now_add=True)\n    updated_at = models.DateTimeField(auto_now=True)\n    published_at = models.DateTimeField(default=timezone.now)\n    status = models.CharField(max_length=10, choices=STATUS_CHOICES, default='draft')\n\n    class Meta:\n        ordering = ['-published_at']\n        indexes = [\n            models.Index(fields=['-published_at']),\n        ]\n\n    def __str__(self):\n        return self.title\n\nclass Comment(models.Model):\n    post = models.ForeignKey(Post, on_delete=models.CASCADE, related_name='comments')\n    author = models.ForeignKey(User, on_delete=models.CASCADE)\n    content = models.TextField()\n    created_at = models.DateTimeField(auto_now_add=True)\n    active = models.BooleanField(default=True)\n\n    class Meta:\n        ordering = ['created_at']\n\n    def __str__(self):\n        return f'Comment by {self.author} on {self.post}'\n```\n\n### 마이그레이션\n\n```bash\n# 마이그레이션 파일 생성\npython manage.py makemigrations\n\n# 마이그레이션 적용\npython manage.py migrate\n\n# 마이그레이션 확인\npython manage.py showmigrations\n```\n\n### ORM 쿼리\n\n```python\n# Shell에서 테스트\npython manage.py shell\n\n# Create\nfrom blog.models import Post, Category\nfrom django.contrib.auth.models import User\n\nuser = User.objects.first()\ncategory = Category.objects.create(name=\"Technology\", slug=\"tech\")\n\npost = Post.objects.create(\n    title=\"First Post\",\n    slug=\"first-post\",\n    author=user,\n    category=category,\n    content=\"This is my first post\",\n    status=\"published\"\n)\n\n# Read\nall_posts = Post.objects.all()\npublished_posts = Post.objects.filter(status='published')\npost = Post.objects.get(id=1)\npost = Post.objects.get(slug='first-post')\n\n# 복잡한 쿼리\nfrom django.db.models import Q, Count\n\n# OR 조건\nposts = Post.objects.filter(\n    Q(title__icontains='django') | Q(content__icontains='django')\n)\n\n# 관계 조회 (select_related, prefetch_related)\nposts = Post.objects.select_related('author', 'category').all()\nposts = Post.objects.prefetch_related('comments').all()\n\n# 집계\ncategory_post_count = Category.objects.annotate(\n    post_count=Count('posts')\n).filter(post_count__gt=0)\n\n# Update\npost.title = \"Updated Title\"\npost.save()\n\n# 또는\nPost.objects.filter(id=1).update(title=\"Updated Title\")\n\n# Delete\npost.delete()\nPost.objects.filter(status='draft').delete()\n```\n\n---\n\n## 뷰 (Views)\n\n### Function-Based Views (FBV)\n\n```python\n# blog/views.py\nfrom django.shortcuts import render, get_object_or_404, redirect\nfrom django.http import HttpResponse, Http404\nfrom django.contrib.auth.decorators import login_required\nfrom .models import Post, Category\n\ndef post_list(request):\n    posts = Post.objects.filter(status='published').select_related('author', 'category')\n    return render(request, 'blog/post_list.html', {'posts': posts})\n\ndef post_detail(request, slug):\n    post = get_object_or_404(Post, slug=slug, status='published')\n    comments = post.comments.filter(active=True)\n\n    return render(request, 'blog/post_detail.html', {\n        'post': post,\n        'comments': comments\n    })\n\n@login_required\ndef post_create(request):\n    if request.method == 'POST':\n        # 폼 처리\n        title = request.POST.get('title')\n        content = request.POST.get('content')\n\n        post = Post.objects.create(\n            title=title,\n            content=content,\n            author=request.user\n        )\n        return redirect('post_detail', slug=post.slug)\n\n    return render(request, 'blog/post_form.html')\n```\n\n### Class-Based Views (CBV)\n\n```python\n# blog/views.py\nfrom django.views.generic import ListView, DetailView, CreateView, UpdateView, DeleteView\nfrom django.contrib.auth.mixins import LoginRequiredMixin\nfrom django.urls import reverse_lazy\nfrom .models import Post\n\nclass PostListView(ListView):\n    model = Post\n    template_name = 'blog/post_list.html'\n    context_object_name = 'posts'\n    paginate_by = 10\n\n    def get_queryset(self):\n        return Post.objects.filter(status='published').select_related('author', 'category')\n\nclass PostDetailView(DetailView):\n    model = Post\n    template_name = 'blog/post_detail.html'\n    context_object_name = 'post'\n\n    def get_queryset(self):\n        return Post.objects.filter(status='published')\n\nclass PostCreateView(LoginRequiredMixin, CreateView):\n    model = Post\n    template_name = 'blog/post_form.html'\n    fields = ['title', 'slug', 'category', 'content', 'status']\n    success_url = reverse_lazy('post_list')\n\n    def form_valid(self, form):\n        form.instance.author = self.request.user\n        return super().form_valid(form)\n\nclass PostUpdateView(LoginRequiredMixin, UpdateView):\n    model = Post\n    template_name = 'blog/post_form.html'\n    fields = ['title', 'category', 'content', 'status']\n\n    def get_queryset(self):\n        # 본인의 글만 수정 가능\n        return Post.objects.filter(author=self.request.user)\n\nclass PostDeleteView(LoginRequiredMixin, DeleteView):\n    model = Post\n    success_url = reverse_lazy('post_list')\n\n    def get_queryset(self):\n        return Post.objects.filter(author=self.request.user)\n```\n\n---\n\n## 템플릿 (Templates)\n\n### 템플릿 설정\n\n```python\n# settings.py\nTEMPLATES = [\n    {\n        'BACKEND': 'django.template.backends.django.DjangoTemplates',\n        'DIRS': [BASE_DIR / 'templates'],\n        'APP_DIRS': True,\n        ...\n    },\n]\n```\n\n### 베이스 템플릿\n\n```html\n<!-- templates/base.html -->\n<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>{% block title %}My Blog{% endblock %}</title>\n    {% load static %}\n    <link rel=\"stylesheet\" href=\"{% static 'css/style.css' %}\">\n</head>\n<body>\n    <nav>\n        <a href=\"{% url 'post_list' %}\">Home</a>\n        {% if user.is_authenticated %}\n            <a href=\"{% url 'post_create' %}\">New Post</a>\n            <a href=\"{% url 'logout' %}\">Logout ({{ user.username }})</a>\n        {% else %}\n            <a href=\"{% url 'login' %}\">Login</a>\n        {% endif %}\n    </nav>\n\n    <main>\n        {% if messages %}\n            {% for message in messages %}\n                <div class=\"alert alert-{{ message.tags }}\">\n                    {{ message }}\n                </div>\n            {% endfor %}\n        {% endif %}\n\n        {% block content %}{% endblock %}\n    </main>\n\n    <footer>\n        <p>&copy; 2025 My Blog</p>\n    </footer>\n</body>\n</html>\n```\n\n### 포스트 목록 템플릿\n\n```html\n<!-- templates/blog/post_list.html -->\n{% extends 'base.html' %}\n\n{% block title %}Blog Posts{% endblock %}\n\n{% block content %}\n    <h1>Blog Posts</h1>\n\n    {% for post in posts %}\n        <article>\n            <h2><a href=\"{% url 'post_detail' post.slug %}\">{{ post.title }}</a></h2>\n            <p class=\"meta\">\n                By {{ post.author.username }} in {{ post.category.name }}\n                | {{ post.published_at|date:\"Y-m-d\" }}\n            </p>\n            <p>{{ post.content|truncatewords:30 }}</p>\n        </article>\n    {% empty %}\n        <p>No posts yet.</p>\n    {% endfor %}\n\n    <!-- 페이지네이션 -->\n    {% if is_paginated %}\n        <div class=\"pagination\">\n            {% if page_obj.has_previous %}\n                <a href=\"?page=1\">First</a>\n                <a href=\"?page={{ page_obj.previous_page_number }}\">Previous</a>\n            {% endif %}\n\n            <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>\n\n            {% if page_obj.has_next %}\n                <a href=\"?page={{ page_obj.next_page_number }}\">Next</a>\n                <a href=\"?page={{ page_obj.paginator.num_pages }}\">Last</a>\n            {% endif %}\n        </div>\n    {% endif %}\n{% endblock %}\n```\n\n### 템플릿 필터와 태그\n\n```html\n<!-- 내장 필터 -->\n{{ post.title|upper }}\n{{ post.content|truncatewords:50 }}\n{{ post.published_at|date:\"Y년 m월 d일\" }}\n{{ post.content|linebreaks }}\n\n<!-- 커스텀 필터 -->\n{% load blog_extras %}\n{{ post.content|markdown }}\n```\n\n```python\n# blog/templatetags/blog_extras.py\nfrom django import template\nimport markdown as md\n\nregister = template.Library()\n\n@register.filter(name='markdown')\ndef markdown_format(text):\n    return md.markdown(text, extensions=['extra', 'codehilite'])\n```\n\n---\n\n## 폼 (Forms)\n\n### Django Forms\n\n```python\n# blog/forms.py\nfrom django import forms\nfrom .models import Post, Comment\n\nclass PostForm(forms.ModelForm):\n    class Meta:\n        model = Post\n        fields = ['title', 'slug', 'category', 'content', 'status']\n        widgets = {\n            'title': forms.TextInput(attrs={'class': 'form-control'}),\n            'content': forms.Textarea(attrs={'class': 'form-control', 'rows': 10}),\n        }\n\n    def clean_slug(self):\n        slug = self.cleaned_data.get('slug')\n        if Post.objects.filter(slug=slug).exists():\n            raise forms.ValidationError('This slug already exists.')\n        return slug\n\nclass CommentForm(forms.ModelForm):\n    class Meta:\n        model = Comment\n        fields = ['content']\n        widgets = {\n            'content': forms.Textarea(attrs={'rows': 3, 'placeholder': 'Write your comment...'})\n        }\n```\n\n### 폼 사용\n\n```python\n# views.py\nfrom .forms import PostForm, CommentForm\n\ndef post_create(request):\n    if request.method == 'POST':\n        form = PostForm(request.POST)\n        if form.is_valid():\n            post = form.save(commit=False)\n            post.author = request.user\n            post.save()\n            messages.success(request, 'Post created successfully!')\n            return redirect('post_detail', slug=post.slug)\n    else:\n        form = PostForm()\n\n    return render(request, 'blog/post_form.html', {'form': form})\n```\n\n```html\n<!-- templates/blog/post_form.html -->\n{% extends 'base.html' %}\n\n{% block content %}\n    <h1>Create Post</h1>\n\n    <form method=\"post\">\n        {% csrf_token %}\n        {{ form.as_p }}\n        <button type=\"submit\">Submit</button>\n    </form>\n{% endblock %}\n```\n\n---\n\n## URL 라우팅\n\n### 프로젝트 URL 설정\n\n```python\n# myproject/urls.py\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('blog/', include('blog.urls')),\n    path('accounts/', include('accounts.urls')),\n]\n```\n\n### 앱 URL 설정\n\n```python\n# blog/urls.py\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    # FBV\n    path('', views.post_list, name='post_list'),\n    path('post/<slug:slug>/', views.post_detail, name='post_detail'),\n\n    # CBV\n    path('posts/', views.PostListView.as_view(), name='post_list_cbv'),\n    path('post/<slug:slug>/', views.PostDetailView.as_view(), name='post_detail_cbv'),\n    path('post/create/', views.PostCreateView.as_view(), name='post_create'),\n    path('post/<slug:slug>/edit/', views.PostUpdateView.as_view(), name='post_update'),\n    path('post/<slug:slug>/delete/', views.PostDeleteView.as_view(), name='post_delete'),\n]\n```\n\n---\n\n## Admin 관리자 페이지\n\n### Admin 등록\n\n```python\n# blog/admin.py\nfrom django.contrib import admin\nfrom .models import Category, Post, Comment\n\n@admin.register(Category)\nclass CategoryAdmin(admin.ModelAdmin):\n    list_display = ['name', 'slug']\n    prepopulated_fields = {'slug': ('name',)}\n\n@admin.register(Post)\nclass PostAdmin(admin.ModelAdmin):\n    list_display = ['title', 'author', 'category', 'status', 'published_at']\n    list_filter = ['status', 'category', 'created_at', 'published_at']\n    search_fields = ['title', 'content']\n    prepopulated_fields = {'slug': ('title',)}\n    date_hierarchy = 'published_at'\n    ordering = ['-published_at']\n\n    # 인라인 편집\n    class CommentInline(admin.TabularInline):\n        model = Comment\n        extra = 0\n\n    inlines = [CommentInline]\n\n@admin.register(Comment)\nclass CommentAdmin(admin.ModelAdmin):\n    list_display = ['author', 'post', 'created_at', 'active']\n    list_filter = ['active', 'created_at']\n    search_fields = ['author__username', 'content']\n    actions = ['approve_comments']\n\n    def approve_comments(self, request, queryset):\n        queryset.update(active=True)\n    approve_comments.short_description = \"Approve selected comments\"\n```\n\n### 슈퍼유저 생성\n\n```bash\npython manage.py createsuperuser\n# Username: admin\n# Email: admin@example.com\n# Password: ****\n```\n\n---\n\n## 인증 시스템\n\n### 내장 인증 뷰 사용\n\n```python\n# myproject/urls.py\nfrom django.contrib.auth import views as auth_views\n\nurlpatterns = [\n    path('login/', auth_views.LoginView.as_view(template_name='accounts/login.html'), name='login'),\n    path('logout/', auth_views.LogoutView.as_view(), name='logout'),\n    path('password_change/', auth_views.PasswordChangeView.as_view(), name='password_change'),\n]\n```\n\n### 커스텀 회원가입\n\n```python\n# accounts/forms.py\nfrom django.contrib.auth.forms import UserCreationForm\nfrom django.contrib.auth.models import User\n\nclass SignUpForm(UserCreationForm):\n    email = forms.EmailField(required=True)\n\n    class Meta:\n        model = User\n        fields = ['username', 'email', 'password1', 'password2']\n\n# accounts/views.py\ndef signup(request):\n    if request.method == 'POST':\n        form = SignUpForm(request.POST)\n        if form.is_valid():\n            user = form.save()\n            login(request, user)\n            return redirect('post_list')\n    else:\n        form = SignUpForm()\n\n    return render(request, 'accounts/signup.html', {'form': form})\n```\n\n### 로그인 필수 데코레이터\n\n```python\nfrom django.contrib.auth.decorators import login_required\n\n@login_required\ndef protected_view(request):\n    return render(request, 'protected.html')\n\n# CBV\nfrom django.contrib.auth.mixins import LoginRequiredMixin\n\nclass ProtectedView(LoginRequiredMixin, View):\n    login_url = '/login/'\n```\n\n---\n\n## Django REST Framework\n\n### 설치 및 설정\n\n```bash\npip install djangorestframework\n```\n\n```python\n# settings.py\nINSTALLED_APPS = [\n    ...\n    'rest_framework',\n]\n\nREST_FRAMEWORK = {\n    'DEFAULT_PAGINATION_CLASS': 'rest_framework.pagination.PageNumberPagination',\n    'PAGE_SIZE': 10\n}\n```\n\n### Serializer\n\n```python\n# blog/serializers.py\nfrom rest_framework import serializers\nfrom .models import Post, Category\n\nclass CategorySerializer(serializers.ModelSerializer):\n    class Meta:\n        model = Category\n        fields = ['id', 'name', 'slug']\n\nclass PostSerializer(serializers.ModelSerializer):\n    author = serializers.ReadOnlyField(source='author.username')\n    category = CategorySerializer(read_only=True)\n\n    class Meta:\n        model = Post\n        fields = ['id', 'title', 'slug', 'author', 'category', 'content', 'published_at', 'status']\n        read_only_fields = ['author']\n```\n\n### API Views\n\n```python\n# blog/api_views.py\nfrom rest_framework import viewsets\nfrom rest_framework.permissions import IsAuthenticatedOrReadOnly\nfrom .models import Post\nfrom .serializers import PostSerializer\n\nclass PostViewSet(viewsets.ModelViewSet):\n    queryset = Post.objects.filter(status='published')\n    serializer_class = PostSerializer\n    permission_classes = [IsAuthenticatedOrReadOnly]\n\n    def perform_create(self, serializer):\n        serializer.save(author=self.request.user)\n```\n\n### API URL\n\n```python\n# blog/urls.py\nfrom rest_framework.routers import DefaultRouter\nfrom .api_views import PostViewSet\n\nrouter = DefaultRouter()\nrouter.register(r'posts', PostViewSet)\n\nurlpatterns = [\n    path('api/', include(router.urls)),\n]\n```\n\n---\n\n## 배포\n\n### 프로덕션 설정\n\n```python\n# settings.py\nDEBUG = False\nALLOWED_HOSTS = ['yourdomain.com', 'www.yourdomain.com']\n\n# 정적 파일\nSTATIC_URL = '/static/'\nSTATIC_ROOT = BASE_DIR / 'staticfiles'\n\n# 미디어 파일\nMEDIA_URL = '/media/'\nMEDIA_ROOT = BASE_DIR / 'media'\n```\n\n### 정적 파일 수집\n\n```bash\npython manage.py collectstatic\n```\n\n### Gunicorn으로 실행\n\n```bash\npip install gunicorn\n\ngunicorn myproject.wsgi:application --bind 0.0.0.0:8000\n```\n\n### requirements.txt\n\n```\nDjango==5.0.1\ndjangorestframework==3.14.0\ngunicorn==21.2.0\npsycopg2-binary==2.9.9\npython-decouple==3.8\nPillow==10.2.0\n```\n\n### Dockerfile\n\n```dockerfile\nFROM python:3.11-slim\n\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nRUN python manage.py collectstatic --noinput\n\nEXPOSE 8000\n\nCMD [\"gunicorn\", \"myproject.wsgi:application\", \"--bind\", \"0.0.0.0:8000\"]\n```\n\n---\n\n## 참고 자료\n\n- [Django 공식 문서](https://docs.djangoproject.com/)\n- [Django REST Framework 문서](https://www.django-rest-framework.org/)\n- [Django Girls Tutorial](https://tutorial.djangogirls.org/)\n- [Two Scoops of Django](https://www.feldroy.com/books/two-scoops-of-django-3-x)\n\n*마지막 업데이트: 2025년 12월*\n", "size": 19528, "lines": 825}, {"filename": "fastapi-프레임워크-사용법.md", "title": "FastAPI 프레임워크 사용법", "path": "python/fastapi-프레임워크-사용법.md", "content": "# FastAPI 프레임워크 사용법\n\nFastAPI를 사용한 고성능 API 개발의 핵심 개념과 실용적인 코드 예제를 정리한 문서입니다.\n\n## 목차\n\n1. [설치 및 기본 설정](#설치-및-기본-설정)\n2. [라우팅과 경로 매개변수](#라우팅과-경로-매개변수)\n3. [Pydantic을 활용한 요청/응답 검증](#pydantic을-활용한-요청응답-검증)\n4. [의존성 주입 (Dependency Injection)](#의존성-주입-dependency-injection)\n5. [비동기 프로그래밍](#비동기-프로그래밍)\n6. [데이터베이스 연동](#데이터베이스-연동)\n7. [인증과 보안](#인증과-보안)\n8. [자동 문서화](#자동-문서화)\n9. [배포](#배포)\n\n---\n\n## 설치 및 기본 설정\n\n### 설치\n\n```bash\n# 가상환경 생성\npython -m venv venv\nsource venv/bin/activate  # Windows: venv\\Scripts\\activate\n\n# FastAPI 및 Uvicorn 설치\npip install fastapi uvicorn[standard]\n\n# 추가 패키지\npip install pydantic-settings sqlalchemy databases[sqlite]\n```\n\n### 기본 앱 구조\n\n```python\n# main.py\nfrom fastapi import FastAPI\n\napp = FastAPI(\n    title=\"My API\",\n    description=\"API 설명\",\n    version=\"1.0.0\"\n)\n\n@app.get(\"/\")\nasync def root():\n    return {\"message\": \"Hello, FastAPI!\"}\n\n@app.get(\"/health\")\nasync def health_check():\n    return {\"status\": \"healthy\"}\n```\n\n```bash\n# 실행\nuvicorn main:app --reload\n\n# 자동 문서 확인\n# http://localhost:8000/docs (Swagger UI)\n# http://localhost:8000/redoc (ReDoc)\n```\n\n---\n\n## 라우팅과 경로 매개변수\n\n### 기본 라우팅\n\n```python\nfrom fastapi import FastAPI, Path, Query\nfrom typing import Optional\n\napp = FastAPI()\n\n# 경로 매개변수\n@app.get(\"/items/{item_id}\")\nasync def read_item(item_id: int):\n    return {\"item_id\": item_id}\n\n# 경로 매개변수 검증\n@app.get(\"/users/{user_id}\")\nasync def read_user(\n    user_id: int = Path(..., title=\"사용자 ID\", ge=1, le=1000)\n):\n    return {\"user_id\": user_id}\n\n# 쿼리 매개변수\n@app.get(\"/search\")\nasync def search(\n    q: str = Query(..., min_length=1, max_length=50),\n    page: int = Query(1, ge=1),\n    size: int = Query(10, ge=1, le=100)\n):\n    return {\n        \"query\": q,\n        \"page\": page,\n        \"size\": size,\n        \"results\": []\n    }\n\n# Optional 쿼리 매개변수\n@app.get(\"/filter\")\nasync def filter_items(\n    category: Optional[str] = None,\n    min_price: Optional[float] = None,\n    max_price: Optional[float] = None\n):\n    filters = {}\n    if category:\n        filters[\"category\"] = category\n    if min_price:\n        filters[\"min_price\"] = min_price\n    if max_price:\n        filters[\"max_price\"] = max_price\n\n    return {\"filters\": filters}\n```\n\n---\n\n## Pydantic을 활용한 요청/응답 검증\n\n### Request Body 모델\n\n```python\nfrom pydantic import BaseModel, Field, EmailStr, validator\nfrom typing import Optional, List\nfrom datetime import datetime\n\nclass UserCreate(BaseModel):\n    username: str = Field(..., min_length=3, max_length=50)\n    email: EmailStr\n    password: str = Field(..., min_length=8)\n    age: int = Field(..., ge=0, le=150)\n\n    @validator('username')\n    def username_alphanumeric(cls, v):\n        assert v.isalnum(), '사용자명은 영숫자만 가능합니다'\n        return v\n\nclass UserResponse(BaseModel):\n    id: int\n    username: str\n    email: str\n    created_at: datetime\n\n    class Config:\n        orm_mode = True  # ORM 객체를 Pydantic 모델로 변환\n\n# 사용 예제\n@app.post(\"/users\", response_model=UserResponse, status_code=201)\nasync def create_user(user: UserCreate):\n    # 실제로는 DB에 저장\n    new_user = {\n        \"id\": 1,\n        \"username\": user.username,\n        \"email\": user.email,\n        \"created_at\": datetime.now()\n    }\n    return new_user\n```\n\n### 중첩 모델\n\n```python\nclass Address(BaseModel):\n    street: str\n    city: str\n    country: str\n    postal_code: str\n\nclass UserProfile(BaseModel):\n    username: str\n    email: EmailStr\n    address: Address\n    tags: List[str] = []\n\n@app.post(\"/profiles\")\nasync def create_profile(profile: UserProfile):\n    return profile\n\n# 요청 예시:\n# {\n#   \"username\": \"john\",\n#   \"email\": \"john@example.com\",\n#   \"address\": {\n#     \"street\": \"123 Main St\",\n#     \"city\": \"Seoul\",\n#     \"country\": \"Korea\",\n#     \"postal_code\": \"12345\"\n#   },\n#   \"tags\": [\"developer\", \"python\"]\n# }\n```\n\n### Response Model 활용\n\n```python\nfrom typing import List\n\nclass Item(BaseModel):\n    id: int\n    name: str\n    description: Optional[str] = None\n    price: float\n    tax: Optional[float] = None\n\n@app.get(\"/items/{item_id}\", response_model=Item)\nasync def get_item(item_id: int):\n    # DB에서 조회\n    return {\n        \"id\": item_id,\n        \"name\": \"Sample Item\",\n        \"price\": 29.99,\n        \"tax\": 2.99\n    }\n\n@app.get(\"/items\", response_model=List[Item])\nasync def list_items(skip: int = 0, limit: int = 10):\n    # DB에서 목록 조회\n    items = [\n        {\"id\": i, \"name\": f\"Item {i}\", \"price\": i * 10.0}\n        for i in range(skip, skip + limit)\n    ]\n    return items\n```\n\n---\n\n## 의존성 주입 (Dependency Injection)\n\n### 기본 의존성\n\n```python\nfrom fastapi import Depends, HTTPException, Header\n\n# 공통 쿼리 매개변수\nasync def common_parameters(\n    skip: int = 0,\n    limit: int = 10,\n    q: Optional[str] = None\n):\n    return {\"skip\": skip, \"limit\": limit, \"q\": q}\n\n@app.get(\"/items\")\nasync def read_items(commons: dict = Depends(common_parameters)):\n    return commons\n\n# 헤더 검증\nasync def verify_token(x_token: str = Header(...)):\n    if x_token != \"secret-token\":\n        raise HTTPException(status_code=401, detail=\"Invalid token\")\n    return x_token\n\n@app.get(\"/protected\")\nasync def protected_route(token: str = Depends(verify_token)):\n    return {\"message\": \"You have access\", \"token\": token}\n```\n\n### 클래스 기반 의존성\n\n```python\nfrom typing import Optional\n\nclass Pagination:\n    def __init__(\n        self,\n        page: int = Query(1, ge=1),\n        size: int = Query(10, ge=1, le=100)\n    ):\n        self.page = page\n        self.size = size\n        self.skip = (page - 1) * size\n\n@app.get(\"/users\")\nasync def get_users(pagination: Pagination = Depends()):\n    return {\n        \"page\": pagination.page,\n        \"size\": pagination.size,\n        \"skip\": pagination.skip,\n        \"users\": []\n    }\n```\n\n### 데이터베이스 세션 의존성\n\n```python\nfrom sqlalchemy.orm import Session\n\n# 데이터베이스 세션 생성\ndef get_db():\n    db = SessionLocal()\n    try:\n        yield db\n    finally:\n        db.close()\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(\n    user_id: int,\n    db: Session = Depends(get_db)\n):\n    user = db.query(User).filter(User.id == user_id).first()\n    if not user:\n        raise HTTPException(status_code=404, detail=\"User not found\")\n    return user\n```\n\n---\n\n## 비동기 프로그래밍\n\n### async/await 사용\n\n```python\nimport asyncio\nimport httpx\n\n@app.get(\"/sync\")\ndef sync_endpoint():\n    # 동기 함수\n    return {\"type\": \"sync\"}\n\n@app.get(\"/async\")\nasync def async_endpoint():\n    # 비동기 함수\n    return {\"type\": \"async\"}\n\n# 외부 API 호출\n@app.get(\"/external-data\")\nasync def fetch_external_data():\n    async with httpx.AsyncClient() as client:\n        response = await client.get(\"https://api.example.com/data\")\n        return response.json()\n\n# 여러 비동기 작업 병렬 실행\n@app.get(\"/parallel\")\nasync def parallel_requests():\n    async with httpx.AsyncClient() as client:\n        tasks = [\n            client.get(\"https://api.example.com/users\"),\n            client.get(\"https://api.example.com/posts\"),\n            client.get(\"https://api.example.com/comments\")\n        ]\n        results = await asyncio.gather(*tasks)\n        return {\n            \"users\": results[0].json(),\n            \"posts\": results[1].json(),\n            \"comments\": results[2].json()\n        }\n```\n\n### 백그라운드 작업\n\n```python\nfrom fastapi import BackgroundTasks\n\ndef send_email(email: str, message: str):\n    # 이메일 발송 로직 (시간이 걸리는 작업)\n    print(f\"Sending email to {email}: {message}\")\n\n@app.post(\"/send-notification\")\nasync def send_notification(\n    email: str,\n    background_tasks: BackgroundTasks\n):\n    background_tasks.add_task(send_email, email, \"Welcome!\")\n    return {\"message\": \"Notification will be sent in background\"}\n```\n\n---\n\n## 데이터베이스 연동\n\n### SQLAlchemy 설정\n\n```python\n# database.py\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.ext.declarative import declarative_base\nfrom sqlalchemy.orm import sessionmaker\n\nSQLALCHEMY_DATABASE_URL = \"sqlite:///./app.db\"\n\nengine = create_engine(\n    SQLALCHEMY_DATABASE_URL,\n    connect_args={\"check_same_thread\": False}\n)\n\nSessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)\nBase = declarative_base()\n```\n\n### 모델 정의\n\n```python\n# models.py\nfrom sqlalchemy import Column, Integer, String, DateTime, ForeignKey\nfrom sqlalchemy.orm import relationship\nfrom datetime import datetime\nfrom database import Base\n\nclass User(Base):\n    __tablename__ = \"users\"\n\n    id = Column(Integer, primary_key=True, index=True)\n    username = Column(String, unique=True, index=True)\n    email = Column(String, unique=True, index=True)\n    hashed_password = Column(String)\n    created_at = Column(DateTime, default=datetime.utcnow)\n\n    posts = relationship(\"Post\", back_populates=\"author\")\n\nclass Post(Base):\n    __tablename__ = \"posts\"\n\n    id = Column(Integer, primary_key=True, index=True)\n    title = Column(String, index=True)\n    content = Column(String)\n    author_id = Column(Integer, ForeignKey(\"users.id\"))\n    created_at = Column(DateTime, default=datetime.utcnow)\n\n    author = relationship(\"User\", back_populates=\"posts\")\n```\n\n### CRUD 작업\n\n```python\n# crud.py\nfrom sqlalchemy.orm import Session\nfrom models import User, Post\nfrom schemas import UserCreate, PostCreate\n\ndef get_user(db: Session, user_id: int):\n    return db.query(User).filter(User.id == user_id).first()\n\ndef get_users(db: Session, skip: int = 0, limit: int = 10):\n    return db.query(User).offset(skip).limit(limit).all()\n\ndef create_user(db: Session, user: UserCreate):\n    db_user = User(\n        username=user.username,\n        email=user.email,\n        hashed_password=hash_password(user.password)\n    )\n    db.add(db_user)\n    db.commit()\n    db.refresh(db_user)\n    return db_user\n\ndef create_post(db: Session, post: PostCreate, user_id: int):\n    db_post = Post(**post.dict(), author_id=user_id)\n    db.add(db_post)\n    db.commit()\n    db.refresh(db_post)\n    return db_post\n```\n\n### API 엔드포인트\n\n```python\n# main.py\nfrom fastapi import FastAPI, Depends, HTTPException\nfrom sqlalchemy.orm import Session\nimport crud, models, schemas\nfrom database import engine, SessionLocal\n\nmodels.Base.metadata.create_all(bind=engine)\n\napp = FastAPI()\n\ndef get_db():\n    db = SessionLocal()\n    try:\n        yield db\n    finally:\n        db.close()\n\n@app.post(\"/users\", response_model=schemas.UserResponse)\ndef create_user(user: schemas.UserCreate, db: Session = Depends(get_db)):\n    db_user = crud.get_user_by_email(db, email=user.email)\n    if db_user:\n        raise HTTPException(status_code=400, detail=\"Email already registered\")\n    return crud.create_user(db=db, user=user)\n\n@app.get(\"/users/{user_id}\", response_model=schemas.UserResponse)\ndef read_user(user_id: int, db: Session = Depends(get_db)):\n    db_user = crud.get_user(db, user_id=user_id)\n    if db_user is None:\n        raise HTTPException(status_code=404, detail=\"User not found\")\n    return db_user\n\n@app.get(\"/users\", response_model=List[schemas.UserResponse])\ndef read_users(skip: int = 0, limit: int = 10, db: Session = Depends(get_db)):\n    users = crud.get_users(db, skip=skip, limit=limit)\n    return users\n```\n\n---\n\n## 인증과 보안\n\n### JWT 인증\n\n```python\nfrom datetime import datetime, timedelta\nfrom jose import JWTError, jwt\nfrom passlib.context import CryptContext\nfrom fastapi.security import OAuth2PasswordBearer, OAuth2PasswordRequestForm\n\n# 설정\nSECRET_KEY = \"your-secret-key\"\nALGORITHM = \"HS256\"\nACCESS_TOKEN_EXPIRE_MINUTES = 30\n\npwd_context = CryptContext(schemes=[\"bcrypt\"], deprecated=\"auto\")\noauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"token\")\n\n# 비밀번호 해싱\ndef verify_password(plain_password, hashed_password):\n    return pwd_context.verify(plain_password, hashed_password)\n\ndef get_password_hash(password):\n    return pwd_context.hash(password)\n\n# JWT 토큰 생성\ndef create_access_token(data: dict):\n    to_encode = data.copy()\n    expire = datetime.utcnow() + timedelta(minutes=ACCESS_TOKEN_EXPIRE_MINUTES)\n    to_encode.update({\"exp\": expire})\n    encoded_jwt = jwt.encode(to_encode, SECRET_KEY, algorithm=ALGORITHM)\n    return encoded_jwt\n\n# 현재 사용자 가져오기\nasync def get_current_user(\n    token: str = Depends(oauth2_scheme),\n    db: Session = Depends(get_db)\n):\n    credentials_exception = HTTPException(\n        status_code=401,\n        detail=\"Could not validate credentials\",\n        headers={\"WWW-Authenticate\": \"Bearer\"},\n    )\n    try:\n        payload = jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM])\n        username: str = payload.get(\"sub\")\n        if username is None:\n            raise credentials_exception\n    except JWTError:\n        raise credentials_exception\n\n    user = crud.get_user_by_username(db, username=username)\n    if user is None:\n        raise credentials_exception\n    return user\n\n# 로그인 엔드포인트\n@app.post(\"/token\")\nasync def login(\n    form_data: OAuth2PasswordRequestForm = Depends(),\n    db: Session = Depends(get_db)\n):\n    user = authenticate_user(db, form_data.username, form_data.password)\n    if not user:\n        raise HTTPException(status_code=401, detail=\"Incorrect credentials\")\n\n    access_token = create_access_token(data={\"sub\": user.username})\n    return {\"access_token\": access_token, \"token_type\": \"bearer\"}\n\n# 보호된 라우트\n@app.get(\"/me\")\nasync def read_users_me(current_user: User = Depends(get_current_user)):\n    return current_user\n```\n\n---\n\n## 자동 문서화\n\n### Swagger UI 커스터마이징\n\n```python\napp = FastAPI(\n    title=\"My API\",\n    description=\"API 상세 설명\",\n    version=\"1.0.0\",\n    docs_url=\"/docs\",\n    redoc_url=\"/redoc\",\n    openapi_url=\"/openapi.json\"\n)\n\n@app.get(\n    \"/items/{item_id}\",\n    summary=\"아이템 조회\",\n    description=\"ID로 아이템을 조회합니다.\",\n    response_description=\"조회된 아이템\",\n    tags=[\"items\"]\n)\nasync def get_item(item_id: int):\n    \"\"\"\n    아이템을 조회하는 엔드포인트입니다.\n\n    - **item_id**: 조회할 아이템의 ID\n    \"\"\"\n    return {\"item_id\": item_id}\n```\n\n### 태그로 그룹화\n\n```python\ntags_metadata = [\n    {\n        \"name\": \"users\",\n        \"description\": \"사용자 관련 작업\",\n    },\n    {\n        \"name\": \"items\",\n        \"description\": \"아이템 관리\",\n    },\n]\n\napp = FastAPI(openapi_tags=tags_metadata)\n\n@app.get(\"/users\", tags=[\"users\"])\nasync def get_users():\n    return []\n\n@app.get(\"/items\", tags=[\"items\"])\nasync def get_items():\n    return []\n```\n\n---\n\n## 배포\n\n### 프로덕션 설정\n\n```python\n# config.py\nfrom pydantic_settings import BaseSettings\n\nclass Settings(BaseSettings):\n    database_url: str\n    secret_key: str\n    algorithm: str = \"HS256\"\n    access_token_expire_minutes: int = 30\n\n    class Config:\n        env_file = \".env\"\n\nsettings = Settings()\n```\n\n### Uvicorn 실행\n\n```bash\n# 개발\nuvicorn main:app --reload --host 0.0.0.0 --port 8000\n\n# 프로덕션\nuvicorn main:app --host 0.0.0.0 --port 8000 --workers 4\n```\n\n### Docker\n\n```dockerfile\n# Dockerfile\nFROM python:3.11-slim\n\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nEXPOSE 8000\n\nCMD [\"uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\n```yaml\n# docker-compose.yml\nversion: '3.8'\n\nservices:\n  api:\n    build: .\n    ports:\n      - \"8000:8000\"\n    environment:\n      - DATABASE_URL=postgresql://user:pass@db/mydb\n      - SECRET_KEY=your-secret-key\n    depends_on:\n      - db\n\n  db:\n    image: postgres:15\n    environment:\n      - POSTGRES_USER=user\n      - POSTGRES_PASSWORD=pass\n      - POSTGRES_DB=mydb\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\nvolumes:\n  postgres_data:\n```\n\n### requirements.txt\n\n```\nfastapi==0.109.0\nuvicorn[standard]==0.27.0\npydantic==2.5.3\npydantic-settings==2.1.0\nsqlalchemy==2.0.25\ndatabases[sqlite]==0.8.0\npython-jose[cryptography]==3.3.0\npasslib[bcrypt]==1.7.4\npython-multipart==0.0.6\n```\n\n---\n\n## 참고 자료\n\n- [FastAPI 공식 문서](https://fastapi.tiangolo.com/)\n- [Pydantic 문서](https://docs.pydantic.dev/)\n- [SQLAlchemy 문서](https://docs.sqlalchemy.org/)\n- [Uvicorn 문서](https://www.uvicorn.org/)\n\n*마지막 업데이트: 2025년 12월*\n", "size": 16739, "lines": 737}, {"filename": "flask-fastapi-django-프레임워크-비교.md", "title": "Flask, FastAPI, Django 프레임워크 비교", "path": "python/flask-fastapi-django-프레임워크-비교.md", "content": "# Flask, FastAPI, Django 프레임워크 비교\n\nPython 웹 프레임워크의 3대장인 Flask, FastAPI, Django를 비교 분석한 문서입니다. 각 프레임워크의 특징, 장단점, 사용 사례를 표 형식으로 정리했습니다.\n\n## 목차\n\n1. [개요](#개요)\n2. [기본 특성 비교](#기본-특성-비교)\n3. [Hello World 예제](#hello-world-예제)\n4. [상세 비교](#상세-비교)\n5. [성능 비교](#성능-비교)\n6. [사용 사례 및 권장사항](#사용-사례-및-권장사항)\n\n---\n\n## 개요\n\n### Flask\n- **타입**: 마이크로 프레임워크 (Micro Framework)\n- **출시**: 2010년\n- **철학**: 심플함과 확장성\n- **특징**: 최소한의 기능만 제공, 필요한 기능을 자유롭게 추가\n\n### FastAPI\n- **타입**: 현대적 웹 프레임워크\n- **출시**: 2018년\n- **철학**: 빠른 성능과 개발자 경험\n- **특징**: 비동기 지원, 자동 문서화, 타입 힌트 기반\n\n### Django\n- **타입**: 풀스택 프레임워크 (Full-Stack Framework)\n- **출시**: 2005년\n- **철학**: \"Batteries Included\" (모든 기능 포함)\n- **특징**: ORM, Admin 패널, 인증 등 기본 제공\n\n---\n\n## 기본 특성 비교\n\n| 특성 | Flask | FastAPI | Django |\n|------|-------|---------|--------|\n| **타입** | 마이크로 프레임워크 | API 프레임워크 | 풀스택 프레임워크 |\n| **학습 곡선** | 낮음 | 중간 | 높음 |\n| **성능** | 중간 | 매우 높음 | 중간 |\n| **비동기 지원** | 제한적 (Flask 2.0+) | 네이티브 지원 | 제한적 (Django 3.1+) |\n| **자동 문서화** | 없음 (확장 필요) | 자동 (Swagger/ReDoc) | 없음 |\n| **타입 검증** | 없음 | Pydantic 기반 | 없음 (ORM 레벨) |\n| **ORM** | 없음 (SQLAlchemy 사용) | 없음 (선택적) | Django ORM 내장 |\n| **Admin 패널** | 없음 | 없음 | 기본 제공 |\n| **템플릿 엔진** | Jinja2 | Jinja2 (선택적) | Django Templates |\n| **폼 처리** | WTForms (확장) | Pydantic | Django Forms 내장 |\n| **인증** | 확장 필요 | 직접 구현/확장 | 기본 제공 |\n| **주요 용도** | 소규모 앱, API | REST API, 마이크로서비스 | 풀스택 웹 앱 |\n\n---\n\n## Hello World 예제\n\n### Flask\n\n```python\nfrom flask import Flask\n\napp = Flask(__name__)\n\n@app.route('/')\ndef hello():\n    return {'message': 'Hello, World!'}\n\nif __name__ == '__main__':\n    app.run(debug=True)\n```\n\n### FastAPI\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get('/')\nasync def hello():\n    return {'message': 'Hello, World!'}\n\n# 실행: uvicorn main:app --reload\n```\n\n### Django\n\n```python\n# settings.py와 urls.py 설정 필요\n\n# views.py\nfrom django.http import JsonResponse\n\ndef hello(request):\n    return JsonResponse({'message': 'Hello, World!'})\n\n# urls.py\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('', views.hello),\n]\n```\n\n---\n\n## 상세 비교\n\n### 아키텍처 및 설계 철학\n\n| 측면 | Flask | FastAPI | Django |\n|------|-------|---------|--------|\n| **설계 철학** | 최소주의 | 성능 + 개발자 경험 | 완결성 |\n| **확장성** | 매우 높음 | 높음 | 중간 |\n| **유연성** | 매우 높음 | 높음 | 중간 |\n| **규약** | 적음 | 중간 | 많음 (강한 규약) |\n| **프로젝트 구조** | 자유로움 | 자유로움 | 정해진 구조 |\n\n### 개발자 경험\n\n| 측면 | Flask | FastAPI | Django |\n|------|-------|---------|--------|\n| **초기 설정** | 매우 간단 | 간단 | 복잡 |\n| **보일러플레이트** | 적음 | 적음 | 많음 |\n| **IDE 지원** | 좋음 | 매우 좋음 (타입 힌트) | 좋음 |\n| **디버깅** | 쉬움 | 쉬움 | 중간 |\n| **테스팅** | pytest 권장 | pytest 권장 | 내장 테스트 프레임워크 |\n| **문서 품질** | 좋음 | 매우 좋음 | 매우 좋음 |\n\n### 생태계 및 커뮤니티\n\n| 측면 | Flask | FastAPI | Django |\n|------|-------|---------|--------|\n| **커뮤니티 크기** | 대형 | 급성장 중 | 매우 대형 |\n| **확장 패키지** | 매우 많음 | 증가 중 | 매우 많음 |\n| **기업 도입** | 높음 | 증가 중 | 매우 높음 |\n| **활발한 개발** | 보통 | 매우 활발 | 활발 |\n| **Stack Overflow** | 많은 답변 | 증가 중 | 가장 많은 답변 |\n\n### 데이터베이스 지원\n\n| 측면 | Flask | FastAPI | Django |\n|------|-------|---------|--------|\n| **기본 ORM** | 없음 | 없음 | Django ORM |\n| **SQLAlchemy** | 권장 | 선택적 | 가능 |\n| **마이그레이션** | Flask-Migrate | Alembic | 내장 (makemigrations) |\n| **비동기 DB** | 제한적 | SQLAlchemy 2.0 지원 | 제한적 |\n| **NoSQL 지원** | 확장으로 가능 | 직접 구현 | 확장으로 가능 |\n\n---\n\n## 성능 비교\n\n### 요청 처리 성능 (대략적인 비교)\n\n| 프레임워크 | 초당 요청 수 (RPS) | 상대 성능 |\n|-----------|-------------------|----------|\n| **FastAPI** | ~25,000 | 가장 빠름 ⚡️ |\n| **Flask** | ~3,000 | 중간 |\n| **Django** | ~2,500 | 중간 |\n\n**주의**: 실제 성능은 애플리케이션 구조, 데이터베이스, 배포 환경 등에 따라 크게 달라질 수 있습니다.\n\n### 성능 특성\n\n| 측면 | Flask | FastAPI | Django |\n|------|-------|---------|--------|\n| **동기/비동기** | 주로 동기 | 비동기 네이티브 | 주로 동기 |\n| **WebSocket** | 확장 필요 | 네이티브 지원 | 확장 필요 |\n| **백그라운드 작업** | Celery | BackgroundTasks | Celery |\n| **스트리밍** | 가능 | 최적화됨 | 가능 |\n| **메모리 사용량** | 낮음 | 낮음 | 중간-높음 |\n\n---\n\n## 사용 사례 및 권장사항\n\n### Flask를 선택해야 할 때\n\n**장점**\n- 빠른 프로토타이핑\n- 유연한 구조가 필요할 때\n- 기존 Python 라이브러리와 쉽게 통합\n- 학습이 쉽고 진입 장벽이 낮음\n\n**단점**\n- 모든 것을 직접 구현해야 함\n- 대규모 프로젝트에서 구조화 어려움\n- 표준화된 방법이 없어 팀마다 다른 구조\n\n**추천 사용 사례**\n- 소규모 API 서버\n- 마이크로서비스\n- 간단한 웹 애플리케이션\n- 프로토타입 개발\n\n```python\n# Flask 프로젝트 예시\nfrom flask import Flask, jsonify\nfrom flask_sqlalchemy import SQLAlchemy\n\napp = Flask(__name__)\napp.config['SQLALCHEMY_DATABASE_URI'] = 'sqlite:///app.db'\ndb = SQLAlchemy(app)\n\n@app.route('/api/users')\ndef get_users():\n    users = User.query.all()\n    return jsonify([user.to_dict() for user in users])\n```\n\n---\n\n### FastAPI를 선택해야 할 때\n\n**장점**\n- 매우 빠른 성능 (Starlette 기반)\n- 자동 API 문서화 (Swagger UI, ReDoc)\n- 타입 힌트를 통한 자동 검증\n- 비동기 프로그래밍 네이티브 지원\n- 현대적인 개발자 경험\n\n**단점**\n- 비교적 새로운 프레임워크 (성숙도)\n- 커뮤니티가 작음 (증가 중)\n- 비동기 개념 이해 필요\n\n**추천 사용 사례**\n- REST API 개발\n- 마이크로서비스 아키텍처\n- 고성능이 필요한 서비스\n- 실시간 데이터 처리\n- ML 모델 서빙\n\n```python\n# FastAPI 프로젝트 예시\nfrom fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel\nfrom typing import List\n\napp = FastAPI()\n\nclass User(BaseModel):\n    id: int\n    name: str\n    email: str\n\n@app.get('/api/users', response_model=List[User])\nasync def get_users():\n    # 자동으로 Swagger 문서 생성\n    # Pydantic으로 자동 검증\n    return await fetch_users_from_db()\n```\n\n---\n\n### Django를 선택해야 할 때\n\n**장점**\n- 모든 기능이 포함됨 (Batteries Included)\n- 강력한 ORM과 마이그레이션\n- 관리자 페이지 자동 생성\n- 검증된 보안 기능\n- 대규모 커뮤니티와 풍부한 패키지\n\n**단점**\n- 무겁고 복잡한 구조\n- 유연성이 낮음\n- API만 필요한 경우 오버헤드\n- 학습 곡선이 가파름\n\n**추천 사용 사례**\n- 대규모 웹 애플리케이션\n- CMS, 전자상거래 사이트\n- 관리자 페이지가 필요한 서비스\n- 데이터 중심 애플리케이션\n- 빠른 MVP 개발 (이미 Django 경험이 있다면)\n\n```python\n# Django 프로젝트 예시\n# models.py\nfrom django.db import models\n\nclass User(models.Model):\n    name = models.CharField(max_length=100)\n    email = models.EmailField(unique=True)\n    created_at = models.DateTimeField(auto_now_add=True)\n\n    class Meta:\n        ordering = ['-created_at']\n\n# admin.py에 등록하면 자동으로 관리 페이지 생성\nfrom django.contrib import admin\nadmin.site.register(User)\n```\n\n---\n\n## 프레임워크 선택 가이드\n\n### 결정 플로우차트\n\n```\n프로젝트 시작\n    |\n    ├─ API만 필요한가?\n    |   └─ Yes\n    |       ├─ 고성능/비동기 필요?\n    |       |   └─ Yes → FastAPI ⚡️\n    |       |   └─ No → Flask\n    |       └─ 자동 문서화 중요?\n    |           └─ Yes → FastAPI\n    |           └─ No → Flask\n    |\n    └─ 풀스택 웹앱?\n        ├─ 관리자 페이지 필요?\n        |   └─ Yes → Django 🎯\n        |\n        ├─ 대규모 프로젝트?\n        |   └─ Yes → Django\n        |\n        └─ 빠른 프로토타입?\n            └─ Flask\n```\n\n### 규모별 추천\n\n| 프로젝트 규모 | 추천 프레임워크 | 이유 |\n|-------------|--------------|------|\n| **소규모 API** | FastAPI, Flask | 간결함, 빠른 개발 |\n| **중규모 API** | FastAPI | 성능, 문서화, 타입 안정성 |\n| **대규모 API** | FastAPI, Django REST Framework | 확장성, 생태계 |\n| **소규모 웹앱** | Flask | 유연성, 학습 용이 |\n| **중대규모 웹앱** | Django | 내장 기능, 관리자 페이지 |\n| **마이크로서비스** | FastAPI, Flask | 가벼움, 독립성 |\n| **데이터 중심 앱** | Django | 강력한 ORM |\n\n---\n\n## 실무 팁\n\n### 혼용 전략\n\n실제 프로젝트에서는 여러 프레임워크를 함께 사용하기도 합니다:\n\n**예시 1: Django + FastAPI**\n- Django: 메인 웹 애플리케이션, 관리자 페이지\n- FastAPI: 고성능 API 엔드포인트, 실시간 기능\n\n**예시 2: Flask + FastAPI**\n- Flask: 레거시 시스템, 웹 페이지\n- FastAPI: 새로운 API 서비스\n\n### 마이그레이션 고려사항\n\n| From → To | 난이도 | 고려사항 |\n|----------|--------|---------|\n| Flask → FastAPI | 쉬움 | 비슷한 구조, 비동기 개념 학습 필요 |\n| Flask → Django | 중간 | 구조 재설계 필요, ORM 전환 |\n| Django → FastAPI | 어려움 | ORM/Admin 대체 필요, 아키텍처 변경 |\n| FastAPI → Flask | 쉬움 | 비동기 포기, 기능 추가 개발 |\n\n---\n\n## 참고 자료\n\n- [Flask 공식 문서](https://flask.palletsprojects.com/)\n- [FastAPI 공식 문서](https://fastapi.tiangolo.com/)\n- [Django 공식 문서](https://docs.djangoproject.com/)\n- [Web Framework Benchmarks](https://www.techempower.com/benchmarks/)\n- [Python Web Framework Comparison (2024)](https://github.com/topics/python-web-framework)\n\n*마지막 업데이트: 2025년 12월*\n", "size": 10895, "lines": 377}, {"filename": "flask-프레임워크-사용법.md", "title": "Flask 프레임워크 사용법", "path": "python/flask-프레임워크-사용법.md", "content": "# Flask 프레임워크 사용법\n\nFlask를 사용한 웹 애플리케이션 개발의 기초부터 실무 활용까지 다루는 실전 가이드입니다. 많은 코드 예제와 함께 Flask의 핵심 기능을 학습합니다.\n\n## 목차\n\n1. [설치 및 기본 설정](#설치-및-기본-설정)\n2. [라우팅과 뷰 함수](#라우팅과-뷰-함수)\n3. [템플릿 엔진 (Jinja2)](#템플릿-엔진-jinja2)\n4. [폼 처리](#폼-처리)\n5. [데이터베이스 연동 (SQLAlchemy)](#데이터베이스-연동-sqlalchemy)\n6. [블루프린트를 통한 모듈화](#블루프린트를-통한-모듈화)\n7. [에러 핸들링](#에러-핸들링)\n8. [RESTful API 만들기](#restful-api-만들기)\n9. [인증과 세션 관리](#인증과-세션-관리)\n10. [배포 준비](#배포-준비)\n\n---\n\n## 설치 및 기본 설정\n\n### Flask 설치\n\n```bash\n# 가상환경 생성 (권장)\npython -m venv venv\nsource venv/bin/activate  # Windows: venv\\Scripts\\activate\n\n# Flask 설치\npip install Flask\n\n# 추가 패키지 (실무에서 자주 사용)\npip install Flask-SQLAlchemy Flask-Migrate Flask-WTF python-dotenv\n```\n\n### 기본 프로젝트 구조\n\n```\nmy_flask_app/\n├── app.py              # 메인 애플리케이션\n├── config.py           # 설정 파일\n├── requirements.txt    # 의존성 목록\n├── .env                # 환경 변수\n├── static/             # 정적 파일 (CSS, JS, 이미지)\n│   ├── css/\n│   ├── js/\n│   └── images/\n├── templates/          # HTML 템플릿\n│   ├── base.html\n│   └── index.html\n└── models/             # 데이터베이스 모델\n    └── user.py\n```\n\n### 최소 Flask 앱\n\n```python\n# app.py\nfrom flask import Flask\n\napp = Flask(__name__)\n\n@app.route('/')\ndef index():\n    return 'Hello, Flask!'\n\nif __name__ == '__main__':\n    app.run(debug=True)\n```\n\n```bash\n# 실행\npython app.py\n# 또는\nflask run\n```\n\n### 환경 변수 설정\n\n```python\n# .env\nFLASK_APP=app.py\nFLASK_ENV=development\nSECRET_KEY=your-secret-key-here\nDATABASE_URL=sqlite:///app.db\n```\n\n```python\n# config.py\nimport os\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nclass Config:\n    SECRET_KEY = os.getenv('SECRET_KEY', 'dev-secret-key')\n    SQLALCHEMY_DATABASE_URI = os.getenv('DATABASE_URL', 'sqlite:///app.db')\n    SQLALCHEMY_TRACK_MODIFICATIONS = False\n\n# app.py에서 사용\nfrom config import Config\napp.config.from_object(Config)\n```\n\n---\n\n## 라우팅과 뷰 함수\n\n### 기본 라우팅\n\n```python\nfrom flask import Flask, request, jsonify\n\napp = Flask(__name__)\n\n# GET 요청\n@app.route('/')\ndef home():\n    return 'Home Page'\n\n# 동적 URL\n@app.route('/user/<username>')\ndef show_user(username):\n    return f'User: {username}'\n\n# 타입 지정\n@app.route('/post/<int:post_id>')\ndef show_post(post_id):\n    return f'Post ID: {post_id}'\n\n# 여러 HTTP 메서드\n@app.route('/login', methods=['GET', 'POST'])\ndef login():\n    if request.method == 'POST':\n        username = request.form.get('username')\n        password = request.form.get('password')\n        return f'Logging in {username}'\n    return 'Login Form'\n```\n\n### URL 변수 타입\n\n```python\n# string (기본값)\n@app.route('/user/<username>')\n\n# int\n@app.route('/post/<int:post_id>')\n\n# float\n@app.route('/price/<float:amount>')\n\n# path (슬래시 포함)\n@app.route('/files/<path:filepath>')\n\n# uuid\n@app.route('/object/<uuid:obj_id>')\n```\n\n### 쿼리 파라미터 처리\n\n```python\nfrom flask import request\n\n@app.route('/search')\ndef search():\n    # /search?q=flask&page=1\n    query = request.args.get('q', '')\n    page = request.args.get('page', 1, type=int)\n\n    return {\n        'query': query,\n        'page': page,\n        'results': perform_search(query, page)\n    }\n```\n\n### URL 리다이렉트와 에러\n\n```python\nfrom flask import redirect, url_for, abort\n\n@app.route('/')\ndef index():\n    return redirect(url_for('login'))\n\n@app.route('/admin')\ndef admin():\n    if not is_admin():\n        abort(403)  # Forbidden\n    return 'Admin Panel'\n\n@app.route('/user/<int:user_id>')\ndef get_user(user_id):\n    user = User.query.get(user_id)\n    if user is None:\n        abort(404)\n    return render_template('user.html', user=user)\n```\n\n---\n\n## 템플릿 엔진 (Jinja2)\n\n### 기본 템플릿\n\n```python\n# app.py\nfrom flask import render_template\n\n@app.route('/hello/<name>')\ndef hello(name):\n    return render_template('hello.html', name=name)\n```\n\n```html\n<!-- templates/hello.html -->\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Hello</title>\n</head>\n<body>\n    <h1>Hello, {{ name }}!</h1>\n</body>\n</html>\n```\n\n### 템플릿 상속\n\n```html\n<!-- templates/base.html -->\n<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>{% block title %}My App{% endblock %}</title>\n    <link rel=\"stylesheet\" href=\"{{ url_for('static', filename='css/style.css') }}\">\n</head>\n<body>\n    <nav>\n        <a href=\"{{ url_for('index') }}\">Home</a>\n        <a href=\"{{ url_for('about') }}\">About</a>\n    </nav>\n\n    <main>\n        {% block content %}{% endblock %}\n    </main>\n\n    <footer>\n        <p>&copy; 2025 My App</p>\n    </footer>\n</body>\n</html>\n```\n\n```html\n<!-- templates/index.html -->\n{% extends \"base.html\" %}\n\n{% block title %}Home - My App{% endblock %}\n\n{% block content %}\n    <h1>Welcome to My App</h1>\n    <p>This is the home page.</p>\n{% endblock %}\n```\n\n### 조건문과 반복문\n\n```html\n<!-- templates/users.html -->\n{% extends \"base.html\" %}\n\n{% block content %}\n    <h1>Users</h1>\n\n    {% if users %}\n        <ul>\n        {% for user in users %}\n            <li>\n                {{ user.name }} ({{ user.email }})\n                {% if user.is_admin %}\n                    <span class=\"badge\">Admin</span>\n                {% endif %}\n            </li>\n        {% endfor %}\n        </ul>\n    {% else %}\n        <p>No users found.</p>\n    {% endif %}\n{% endblock %}\n```\n\n### 필터 사용\n\n```html\n<!-- Jinja2 필터 예제 -->\n<h1>{{ title|upper }}</h1>\n<p>{{ description|truncate(100) }}</p>\n<p>Posted: {{ date|datetimeformat }}</p>\n\n<!-- 커스텀 필터 -->\n<p>{{ price|currency }}</p>\n```\n\n```python\n# 커스텀 필터 정의\n@app.template_filter('currency')\ndef currency_filter(value):\n    return f'₩{value:,.0f}'\n\n@app.template_filter('datetimeformat')\ndef datetimeformat(value, format='%Y-%m-%d %H:%M'):\n    return value.strftime(format)\n```\n\n---\n\n## 폼 처리\n\n### Flask-WTF를 사용한 폼\n\n```python\n# forms.py\nfrom flask_wtf import FlaskForm\nfrom wtforms import StringField, PasswordField, SubmitField, TextAreaField\nfrom wtforms.validators import DataRequired, Email, Length, EqualTo\n\nclass LoginForm(FlaskForm):\n    email = StringField('이메일',\n                       validators=[DataRequired(), Email()])\n    password = PasswordField('비밀번호',\n                            validators=[DataRequired()])\n    submit = SubmitField('로그인')\n\nclass RegisterForm(FlaskForm):\n    username = StringField('사용자명',\n                          validators=[DataRequired(), Length(min=3, max=20)])\n    email = StringField('이메일',\n                       validators=[DataRequired(), Email()])\n    password = PasswordField('비밀번호',\n                            validators=[DataRequired(), Length(min=6)])\n    confirm_password = PasswordField('비밀번호 확인',\n                                    validators=[DataRequired(),\n                                               EqualTo('password')])\n    submit = SubmitField('가입하기')\n```\n\n```python\n# app.py\nfrom flask import render_template, redirect, url_for, flash\nfrom forms import LoginForm, RegisterForm\n\n@app.route('/login', methods=['GET', 'POST'])\ndef login():\n    form = LoginForm()\n\n    if form.validate_on_submit():\n        email = form.email.data\n        password = form.password.data\n\n        # 인증 로직\n        user = User.query.filter_by(email=email).first()\n        if user and user.check_password(password):\n            flash('로그인 성공!', 'success')\n            return redirect(url_for('dashboard'))\n        else:\n            flash('이메일 또는 비밀번호가 잘못되었습니다.', 'danger')\n\n    return render_template('login.html', form=form)\n```\n\n```html\n<!-- templates/login.html -->\n{% extends \"base.html\" %}\n\n{% block content %}\n    <h2>로그인</h2>\n\n    {% with messages = get_flashed_messages(with_categories=true) %}\n        {% if messages %}\n            {% for category, message in messages %}\n                <div class=\"alert alert-{{ category }}\">{{ message }}</div>\n            {% endfor %}\n        {% endif %}\n    {% endwith %}\n\n    <form method=\"POST\">\n        {{ form.hidden_tag() }}\n\n        <div class=\"form-group\">\n            {{ form.email.label }}\n            {{ form.email(class=\"form-control\") }}\n            {% if form.email.errors %}\n                <div class=\"error\">{{ form.email.errors[0] }}</div>\n            {% endif %}\n        </div>\n\n        <div class=\"form-group\">\n            {{ form.password.label }}\n            {{ form.password(class=\"form-control\") }}\n            {% if form.password.errors %}\n                <div class=\"error\">{{ form.password.errors[0] }}</div>\n            {% endif %}\n        </div>\n\n        {{ form.submit(class=\"btn btn-primary\") }}\n    </form>\n{% endblock %}\n```\n\n---\n\n## 데이터베이스 연동 (SQLAlchemy)\n\n### 설정\n\n```python\n# app.py\nfrom flask import Flask\nfrom flask_sqlalchemy import SQLAlchemy\nfrom flask_migrate import Migrate\n\napp = Flask(__name__)\napp.config['SQLALCHEMY_DATABASE_URI'] = 'sqlite:///app.db'\napp.config['SQLALCHEMY_TRACK_MODIFICATIONS'] = False\n\ndb = SQLAlchemy(app)\nmigrate = Migrate(app, db)\n```\n\n### 모델 정의\n\n```python\n# models.py\nfrom datetime import datetime\nfrom app import db\n\nclass User(db.Model):\n    __tablename__ = 'users'\n\n    id = db.Column(db.Integer, primary_key=True)\n    username = db.Column(db.String(80), unique=True, nullable=False)\n    email = db.Column(db.String(120), unique=True, nullable=False)\n    password_hash = db.Column(db.String(200))\n    created_at = db.Column(db.DateTime, default=datetime.utcnow)\n\n    # 관계 설정\n    posts = db.relationship('Post', backref='author', lazy=True)\n\n    def __repr__(self):\n        return f'<User {self.username}>'\n\nclass Post(db.Model):\n    __tablename__ = 'posts'\n\n    id = db.Column(db.Integer, primary_key=True)\n    title = db.Column(db.String(200), nullable=False)\n    content = db.Column(db.Text, nullable=False)\n    created_at = db.Column(db.DateTime, default=datetime.utcnow)\n    updated_at = db.Column(db.DateTime, default=datetime.utcnow,\n                          onupdate=datetime.utcnow)\n\n    # 외래 키\n    user_id = db.Column(db.Integer, db.ForeignKey('users.id'),\n                       nullable=False)\n\n    def __repr__(self):\n        return f'<Post {self.title}>'\n```\n\n### 데이터베이스 초기화\n\n```bash\n# 마이그레이션 초기화\nflask db init\n\n# 마이그레이션 파일 생성\nflask db migrate -m \"Initial migration\"\n\n# 마이그레이션 적용\nflask db upgrade\n```\n\n### CRUD 작업\n\n```python\n# Create\n@app.route('/user/create', methods=['POST'])\ndef create_user():\n    username = request.form.get('username')\n    email = request.form.get('email')\n\n    user = User(username=username, email=email)\n    db.session.add(user)\n    db.session.commit()\n\n    return jsonify({'id': user.id}), 201\n\n# Read\n@app.route('/users')\ndef get_users():\n    users = User.query.all()\n    return render_template('users.html', users=users)\n\n@app.route('/user/<int:user_id>')\ndef get_user(user_id):\n    user = User.query.get_or_404(user_id)\n    return render_template('user.html', user=user)\n\n# 복잡한 쿼리\n@app.route('/search/users')\ndef search_users():\n    query = request.args.get('q', '')\n    users = User.query.filter(\n        User.username.like(f'%{query}%')\n    ).order_by(User.created_at.desc()).all()\n\n    return render_template('search_results.html', users=users)\n\n# Update\n@app.route('/user/<int:user_id>/edit', methods=['POST'])\ndef update_user(user_id):\n    user = User.query.get_or_404(user_id)\n    user.username = request.form.get('username')\n    user.email = request.form.get('email')\n\n    db.session.commit()\n    flash('User updated successfully', 'success')\n    return redirect(url_for('get_user', user_id=user.id))\n\n# Delete\n@app.route('/user/<int:user_id>/delete', methods=['POST'])\ndef delete_user(user_id):\n    user = User.query.get_or_404(user_id)\n    db.session.delete(user)\n    db.session.commit()\n\n    flash('User deleted', 'info')\n    return redirect(url_for('get_users'))\n```\n\n---\n\n## 블루프린트를 통한 모듈화\n\n### 블루프린트 생성\n\n```python\n# blueprints/auth.py\nfrom flask import Blueprint, render_template, redirect, url_for\nfrom forms import LoginForm, RegisterForm\n\nauth_bp = Blueprint('auth', __name__, url_prefix='/auth')\n\n@auth_bp.route('/login', methods=['GET', 'POST'])\ndef login():\n    form = LoginForm()\n    if form.validate_on_submit():\n        # 로그인 로직\n        return redirect(url_for('main.index'))\n    return render_template('auth/login.html', form=form)\n\n@auth_bp.route('/register', methods=['GET', 'POST'])\ndef register():\n    form = RegisterForm()\n    if form.validate_on_submit():\n        # 회원가입 로직\n        return redirect(url_for('auth.login'))\n    return render_template('auth/register.html', form=form)\n\n@auth_bp.route('/logout')\ndef logout():\n    # 로그아웃 로직\n    return redirect(url_for('main.index'))\n```\n\n```python\n# blueprints/blog.py\nfrom flask import Blueprint, render_template, request\nfrom models import Post\n\nblog_bp = Blueprint('blog', __name__, url_prefix='/blog')\n\n@blog_bp.route('/')\ndef index():\n    posts = Post.query.order_by(Post.created_at.desc()).all()\n    return render_template('blog/index.html', posts=posts)\n\n@blog_bp.route('/post/<int:post_id>')\ndef show_post(post_id):\n    post = Post.query.get_or_404(post_id)\n    return render_template('blog/post.html', post=post)\n```\n\n### 블루프린트 등록\n\n```python\n# app.py\nfrom flask import Flask\nfrom blueprints.auth import auth_bp\nfrom blueprints.blog import blog_bp\n\napp = Flask(__name__)\n\n# 블루프린트 등록\napp.register_blueprint(auth_bp)\napp.register_blueprint(blog_bp)\n\n@app.route('/')\ndef index():\n    return render_template('index.html')\n```\n\n---\n\n## 에러 핸들링\n\n### 커스텀 에러 페이지\n\n```python\n# app.py\n@app.errorhandler(404)\ndef not_found_error(error):\n    return render_template('errors/404.html'), 404\n\n@app.errorhandler(500)\ndef internal_error(error):\n    db.session.rollback()  # DB 롤백\n    return render_template('errors/500.html'), 500\n\n@app.errorhandler(403)\ndef forbidden_error(error):\n    return render_template('errors/403.html'), 403\n```\n\n```html\n<!-- templates/errors/404.html -->\n{% extends \"base.html\" %}\n\n{% block content %}\n    <div class=\"error-page\">\n        <h1>404</h1>\n        <h2>Page Not Found</h2>\n        <p>요청하신 페이지를 찾을 수 없습니다.</p>\n        <a href=\"{{ url_for('index') }}\">홈으로 돌아가기</a>\n    </div>\n{% endblock %}\n```\n\n### 예외 처리\n\n```python\nfrom werkzeug.exceptions import BadRequest\n\n@app.route('/api/data', methods=['POST'])\ndef process_data():\n    try:\n        data = request.get_json()\n        if not data:\n            raise BadRequest('No data provided')\n\n        # 데이터 처리\n        result = process(data)\n        return jsonify(result), 200\n\n    except ValueError as e:\n        return jsonify({'error': str(e)}), 400\n    except Exception as e:\n        app.logger.error(f'Error processing data: {e}')\n        return jsonify({'error': 'Internal server error'}), 500\n```\n\n---\n\n## RESTful API 만들기\n\n### API 엔드포인트\n\n```python\n# api/resources.py\nfrom flask import Blueprint, request, jsonify\nfrom models import User, Post\nfrom app import db\n\napi_bp = Blueprint('api', __name__, url_prefix='/api')\n\n# Users API\n@api_bp.route('/users', methods=['GET'])\ndef get_users():\n    users = User.query.all()\n    return jsonify([{\n        'id': user.id,\n        'username': user.username,\n        'email': user.email\n    } for user in users])\n\n@api_bp.route('/users/<int:user_id>', methods=['GET'])\ndef get_user(user_id):\n    user = User.query.get_or_404(user_id)\n    return jsonify({\n        'id': user.id,\n        'username': user.username,\n        'email': user.email,\n        'created_at': user.created_at.isoformat()\n    })\n\n@api_bp.route('/users', methods=['POST'])\ndef create_user():\n    data = request.get_json()\n\n    # 검증\n    if not data or not data.get('username') or not data.get('email'):\n        return jsonify({'error': 'Missing required fields'}), 400\n\n    user = User(\n        username=data['username'],\n        email=data['email']\n    )\n    db.session.add(user)\n    db.session.commit()\n\n    return jsonify({'id': user.id}), 201\n\n@api_bp.route('/users/<int:user_id>', methods=['PUT'])\ndef update_user(user_id):\n    user = User.query.get_or_404(user_id)\n    data = request.get_json()\n\n    user.username = data.get('username', user.username)\n    user.email = data.get('email', user.email)\n\n    db.session.commit()\n\n    return jsonify({'message': 'User updated'})\n\n@api_bp.route('/users/<int:user_id>', methods=['DELETE'])\ndef delete_user(user_id):\n    user = User.query.get_or_404(user_id)\n    db.session.delete(user)\n    db.session.commit()\n\n    return jsonify({'message': 'User deleted'}), 204\n```\n\n---\n\n## 인증과 세션 관리\n\n### Flask-Login 사용\n\n```python\n# app.py\nfrom flask_login import LoginManager, UserMixin, login_user, logout_user, login_required, current_user\n\nlog
