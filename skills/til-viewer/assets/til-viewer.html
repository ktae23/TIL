a\n@Bean\npublic Step restartableStep(JobRepository jobRepository,\n                            PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"restartableStep\", jobRepository)\n            .<Customer, Customer>chunk(100, transactionManager)\n            .reader(reader(null))\n            .writer(writer())\n            .allowStartIfComplete(false)  // 완료된 Step은 재실행 안 함\n            .build();\n}\n```\n\n### 시나리오 2: saveState(false) 사용 시\n\n```java\n@Bean\n@StepScope\npublic JdbcPagingItemReader<Customer> nonRestartableReader() {\n    return new JdbcPagingItemReaderBuilder<Customer>()\n            .name(\"nonRestartableReader\")\n            .dataSource(dataSource)\n            .saveState(false)  // ExecutionContext에 상태 저장 안 함\n            // ... 기타 설정\n            .build();\n}\n```\n\n```\n[1차 실행]\nChunk 1: ID 1-100 처리\nChunk 2: ID 101-200 처리\nChunk 3: 실패 ❌\n\n[2차 실행]\nsaveState(false)이므로 처음부터 다시 시작!\nChunk 1: ID 1-100 (중복 처리 ⚠️)\n...\n```\n\n**saveState(false) 사용 시점:**\n- 멀티스레드 Step (상태 저장 불가)\n- 멱등성이 보장되어 중복 처리해도 무방할 때\n- 재시작 기능이 필요 없을 때\n\n### 시나리오 3: Step 간 데이터 전달\n\n```java\n@Configuration\npublic class MultiStepJobConfig {\n\n    // Step 1: 데이터 집계 후 결과를 JobExecutionContext에 저장\n    @Bean\n    public Step aggregationStep(JobRepository jobRepository,\n                                PlatformTransactionManager transactionManager) {\n        return new StepBuilder(\"aggregationStep\", jobRepository)\n                .tasklet((contribution, chunkContext) -> {\n                    int totalCount = calculateTotalCount();\n                    BigDecimal totalAmount = calculateTotalAmount();\n\n                    // JobExecutionContext에 저장 (다른 Step에서 사용)\n                    ExecutionContext jobContext = chunkContext.getStepContext()\n                            .getStepExecution()\n                            .getJobExecution()\n                            .getExecutionContext();\n\n                    jobContext.putInt(\"totalCount\", totalCount);\n                    jobContext.put(\"totalAmount\", totalAmount);\n\n                    return RepeatStatus.FINISHED;\n                }, transactionManager)\n                .build();\n    }\n\n    // Step 2: JobExecutionContext에서 데이터 읽기\n    @Bean\n    @StepScope\n    public Tasklet reportTasklet(\n            @Value(\"#{jobExecutionContext['totalCount']}\") Integer totalCount,\n            @Value(\"#{jobExecutionContext['totalAmount']}\") BigDecimal totalAmount) {\n\n        return (contribution, chunkContext) -> {\n            log.info(\"리포트 생성 - 건수: {}, 금액: {}\", totalCount, totalAmount);\n            generateReport(totalCount, totalAmount);\n            return RepeatStatus.FINISHED;\n        };\n    }\n\n    @Bean\n    public Step reportStep(JobRepository jobRepository,\n                           PlatformTransactionManager transactionManager) {\n        return new StepBuilder(\"reportStep\", jobRepository)\n                .tasklet(reportTasklet(null, null), transactionManager)\n                .build();\n    }\n\n    @Bean\n    public Job multiStepJob(JobRepository jobRepository) {\n        return new JobBuilder(\"multiStepJob\", jobRepository)\n                .start(aggregationStep(null, null))\n                .next(reportStep(null, null))\n                .build();\n    }\n}\n```\n\n---\n\n## lastProcessedId 심화\n\n재시작 가능한 배치에서 가장 중요한 **lastProcessedId**의 선택 기준과 저장 시점을 상세히 알아본다.\n\n### 어떤 값을 기준으로 선택하나?\n\n**개발자가 직접 정의**하는 값이다. 일반적으로 다음 기준을 사용한다:\n\n| 기준 | 적합한 상황 | 예시 |\n|------|------------|------|\n| **PK (Auto Increment)** | 단일 테이블, 순차 처리 | `id` |\n| **생성일시** | 시간 기반 처리 | `created_at` |\n| **복합 키** | 여러 조건 조합 | `date + sequence` |\n| **오프셋** | 페이징, API 호출 | `offset`, `page` |\n\n```java\n// 가장 일반적인 패턴: PK 기준\n@Bean\n@StepScope\npublic JdbcPagingItemReader<Order> reader(\n        @Value(\"#{stepExecutionContext['lastProcessedId']}\") Long lastId) {\n\n    return new JdbcPagingItemReaderBuilder<Order>()\n            .whereClause(\"WHERE id > :lastId\")  // PK 기준\n            .parameterValues(Map.of(\"lastId\", lastId != null ? lastId : 0L))\n            .sortKeys(Map.of(\"id\", Order.ASCENDING))  // 정렬 필수!\n            .build();\n}\n```\n\n**선택 기준 핵심 3가지:**\n- **유일성**: 중복 없이 식별 가능\n- **순서 보장**: 정렬했을 때 일관된 순서\n- **불변성**: 처리 중 값이 변하지 않음\n\n### 저장되는 시점\n\n```\n┌─────────────────────────────────────────────────────────────────────┐\n│                    Chunk 처리 + 저장 시점                            │\n│                                                                      │\n│  ┌─────────── 트랜잭션 시작 ───────────┐                            │\n│  │                                      │                            │\n│  │  [Read 100건]                        │                            │\n│  │       ↓                              │                            │\n│  │  [Process 100건]                     │                            │\n│  │       ↓                              │                            │\n│  │  [Write 100건]                       │  ← 비즈니스 데이터 저장     │\n│  │       ↓                              │                            │\n│  │  [ItemStream.update() 호출]          │  ← ExecutionContext 업데이트│\n│  │       ↓                              │                            │\n│  └─────────── 트랜잭션 커밋 ───────────┘  ← 메타데이터 테이블 저장   │\n│                                                                      │\n│  ✅ 커밋 성공 → lastProcessedId = 100 저장됨                         │\n│  ❌ 커밋 실패 → 전체 롤백 (lastProcessedId도 롤백)                   │\n└─────────────────────────────────────────────────────────────────────┘\n```\n\n**핵심 포인트:**\n- `update()` 호출 ≠ DB 저장\n- **트랜잭션 커밋 시점**에 `BATCH_STEP_EXECUTION_CONTEXT` 테이블에 저장\n- 비즈니스 데이터와 메타데이터가 **같은 트랜잭션**으로 묶임\n\n### 저장 시점 상세\n\n| 시점 | 이벤트 | ExecutionContext 상태 |\n|------|--------|----------------------|\n| Step 시작 | `open()` | DB에서 이전 값 로드 |\n| Read | 아이템 읽기 | 메모리에만 존재 |\n| Process | 아이템 처리 | 메모리에만 존재 |\n| Write | 아이템 저장 | 메모리에만 존재 |\n| Chunk 완료 | `update()` | 메모리 업데이트 |\n| **트랜잭션 커밋** | - | **DB에 저장** ⭐ |\n| Step 종료 | `close()` | - |\n\n**따라서:**\n- Chunk 100건 처리 중 50건째에서 실패 → lastProcessedId는 이전 Chunk의 마지막 값 유지\n- 재시작 시 해당 Chunk 처음부터 다시 처리\n\n### 구현 방법 A: ItemStream 직접 구현 (권장)\n\n```java\n@Component\npublic class OrderReader implements ItemStreamReader<Order> {\n\n    private static final String LAST_ID_KEY = \"lastProcessedId\";\n\n    private Long lastProcessedId = 0L;\n    private Iterator<Order> iterator;\n\n    @Override\n    public void open(ExecutionContext context) {\n        // 재시작 시 이전 값 복구\n        if (context.containsKey(LAST_ID_KEY)) {\n            lastProcessedId = context.getLong(LAST_ID_KEY);\n        }\n        // lastProcessedId 이후 데이터 조회\n        iterator = orderRepository.findByIdGreaterThan(lastProcessedId).iterator();\n    }\n\n    @Override\n    public Order read() {\n        if (iterator.hasNext()) {\n            Order order = iterator.next();\n            lastProcessedId = order.getId();  // 읽을 때마다 갱신\n            return order;\n        }\n        return null;\n    }\n\n    @Override\n    public void update(ExecutionContext context) {\n        // ⭐ Chunk 완료 후 호출됨 → 트랜잭션 커밋 시 DB 저장\n        context.putLong(LAST_ID_KEY, lastProcessedId);\n    }\n\n    @Override\n    public void close() {}\n}\n```\n\n### 구현 방법 B: ChunkListener 사용\n\n```java\n@Bean\npublic Step orderStep(JobRepository jobRepository,\n                      PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"orderStep\", jobRepository)\n            .<Order, Order>chunk(100, transactionManager)\n            .reader(reader(null))\n            .writer(writer())\n            .listener(new ChunkListener() {\n                @Override\n                public void afterChunk(ChunkContext context) {\n                    // Chunk의 마지막 아이템 ID 저장\n                    StepExecution stepExecution = context.getStepContext()\n                            .getStepExecution();\n\n                    // Writer에서 저장한 마지막 ID 가져오기\n                    Long lastId = (Long) context.getAttribute(\"lastWrittenId\");\n                    if (lastId != null) {\n                        stepExecution.getExecutionContext()\n                                .putLong(\"lastProcessedId\", lastId);\n                    }\n                }\n            })\n            .build();\n}\n\n@Bean\npublic ItemWriter<Order> writer() {\n    return chunk -> {\n        // 저장 로직\n        orderRepository.saveAll(chunk.getItems());\n\n        // 마지막 ID를 ChunkContext에 전달\n        Order lastOrder = chunk.getItems().get(chunk.size() - 1);\n        StepSynchronizationManager.getContext()\n                .setAttribute(\"lastWrittenId\", lastOrder.getId());\n    };\n}\n```\n\n### 구현 방법 C: 내장 Reader 자동 저장\n\nSpring Batch의 **내장 Reader들은 자동으로 상태를 저장**한다:\n\n```java\n@Bean\npublic JdbcPagingItemReader<Order> reader() {\n    return new JdbcPagingItemReaderBuilder<Order>()\n            .name(\"orderReader\")  // ⭐ name 필수! (저장 키로 사용)\n            .dataSource(dataSource)\n            .selectClause(\"SELECT *\")\n            .fromClause(\"FROM orders\")\n            .sortKeys(Map.of(\"id\", Order.ASCENDING))\n            .pageSize(100)\n            // saveState(true)가 기본값 → 자동으로 현재 페이지 저장\n            .build();\n}\n```\n\n내장 Reader가 자동 저장하는 값:\n```json\n// BATCH_STEP_EXECUTION_CONTEXT에 저장되는 내용\n{\n  \"orderReader.read.count\": 500,\n  \"orderReader.current.item.count\": 500\n}\n```\n\n### 실제 DB 저장 확인\n\n```sql\n-- BATCH_STEP_EXECUTION_CONTEXT 테이블\nSELECT STEP_EXECUTION_ID, SHORT_CONTEXT\nFROM BATCH_STEP_EXECUTION_CONTEXT\nWHERE STEP_EXECUTION_ID = 123;\n```\n\n| STEP_EXECUTION_ID | SHORT_CONTEXT |\n|-------------------|---------------|\n| 123 | `{\"lastProcessedId\":5000,\"totalRead\":5000}` |\n\n### 실패 시 동작 예시\n\n```\n[시나리오: Chunk 3 처리 중 50건째에서 실패]\n\nChunk 1: ID 1-100 처리 완료\n  → update() 호출: lastProcessedId = 100\n  → 트랜잭션 커밋 → DB 저장 ✅\n\nChunk 2: ID 101-200 처리 완료\n  → update() 호출: lastProcessedId = 200\n  → 트랜잭션 커밋 → DB 저장 ✅\n\nChunk 3: ID 201-300 처리 중...\n  → ID 250에서 예외 발생 ❌\n  → update() 호출 안 됨\n  → 트랜잭션 롤백 → lastProcessedId = 200 유지\n\n[재시작 시]\nopen() 호출 → DB에서 lastProcessedId = 200 복구\n→ ID 201부터 다시 처리 시작\n```\n\n---\n\n## 실무 활용 패턴\n\n### 패턴 1: 진행률 추적\n\n```java\n@Component\n@Slf4j\npublic class ProgressTrackingReader implements ItemStreamReader<Customer> {\n\n    private static final String PROCESSED_COUNT = \"processedCount\";\n    private static final String TOTAL_COUNT = \"totalCount\";\n\n    private final CustomerRepository repository;\n    private Iterator<Customer> iterator;\n    private int processedCount = 0;\n    private int totalCount = 0;\n\n    @Override\n    public void open(ExecutionContext context) {\n        // 전체 건수 조회\n        totalCount = (int) repository.countByStatus(Status.PENDING);\n        context.putInt(TOTAL_COUNT, totalCount);\n\n        // 재시작 시 이전 진행 상태 복구\n        if (context.containsKey(PROCESSED_COUNT)) {\n            processedCount = context.getInt(PROCESSED_COUNT);\n            log.info(\"재시작 - 진행률: {}/{} ({}%)\",\n                    processedCount, totalCount,\n                    (processedCount * 100) / totalCount);\n        }\n\n        // Iterator 초기화 (offset 적용)\n        List<Customer> customers = repository.findByStatusWithOffset(\n                Status.PENDING, processedCount);\n        iterator = customers.iterator();\n    }\n\n    @Override\n    public Customer read() {\n        if (iterator.hasNext()) {\n            processedCount++;\n            return iterator.next();\n        }\n        return null;\n    }\n\n    @Override\n    public void update(ExecutionContext context) {\n        context.putInt(PROCESSED_COUNT, processedCount);\n\n        // 진행률 로깅 (10% 단위)\n        int progress = (processedCount * 100) / totalCount;\n        if (progress % 10 == 0) {\n            log.info(\"진행률: {}% ({}/{})\", progress, processedCount, totalCount);\n        }\n    }\n\n    @Override\n    public void close() {\n        log.info(\"처리 완료: {}/{}\", processedCount, totalCount);\n    }\n}\n```\n\n### 패턴 2: 파티션 정보 전달\n\n```java\n@Configuration\npublic class PartitionedStepConfig {\n\n    @Bean\n    public Partitioner rangePartitioner() {\n        return gridSize -> {\n            Map<String, ExecutionContext> partitions = new HashMap<>();\n\n            long min = 1;\n            long max = 1000000;\n            long range = (max - min) / gridSize + 1;\n\n            for (int i = 0; i < gridSize; i++) {\n                ExecutionContext context = new ExecutionContext();\n\n                long start = min + (range * i);\n                long end = Math.min(start + range - 1, max);\n\n                context.putLong(\"minId\", start);\n                context.putLong(\"maxId\", end);\n                context.putString(\"partitionName\", \"partition\" + i);\n\n                partitions.put(\"partition\" + i, context);\n            }\n\n            return partitions;\n        };\n    }\n\n    @Bean\n    @StepScope\n    public JdbcPagingItemReader<Customer> partitionedReader(\n            @Value(\"#{stepExecutionContext['minId']}\") Long minId,\n            @Value(\"#{stepExecutionContext['maxId']}\") Long maxId,\n            @Value(\"#{stepExecutionContext['partitionName']}\") String partitionName) {\n\n        log.info(\"{} 시작 - ID 범위: {} ~ {}\", partitionName, minId, maxId);\n\n        return new JdbcPagingItemReaderBuilder<Customer>()\n                .name(\"partitionedReader_\" + partitionName)\n                .dataSource(dataSource)\n                .selectClause(\"SELECT *\")\n                .fromClause(\"FROM customers\")\n                .whereClause(\"WHERE id BETWEEN :minId AND :maxId\")\n                .parameterValues(Map.of(\"minId\", minId, \"maxId\", maxId))\n                .sortKeys(Map.of(\"id\", Order.ASCENDING))\n                .pageSize(1000)\n                .build();\n    }\n}\n```\n\n### 패턴 3: 오류 컨텍스트 저장\n\n```java\n@Component\npublic class ErrorTrackingProcessor implements ItemProcessor<Order, Order> {\n\n    @Value(\"#{stepExecutionContext}\")\n    private ExecutionContext stepContext;\n\n    @Override\n    public Order process(Order order) {\n        try {\n            return processOrder(order);\n        } catch (ValidationException e) {\n            // 오류 정보 저장\n            List<String> errors = getOrCreateErrorList();\n            errors.add(String.format(\"Order %d: %s\", order.getId(), e.getMessage()));\n            stepContext.put(\"validationErrors\", errors);\n\n            return null;  // 필터링\n        }\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    private List<String> getOrCreateErrorList() {\n        if (!stepContext.containsKey(\"validationErrors\")) {\n            stepContext.put(\"validationErrors\", new ArrayList<String>());\n        }\n        return (List<String>) stepContext.get(\"validationErrors\");\n    }\n}\n\n// Step 완료 후 오류 리포트\n@Bean\npublic StepExecutionListener errorReportListener() {\n    return new StepExecutionListener() {\n        @Override\n        public ExitStatus afterStep(StepExecution stepExecution) {\n            ExecutionContext context = stepExecution.getExecutionContext();\n\n            if (context.containsKey(\"validationErrors\")) {\n                List<String> errors = (List<String>) context.get(\"validationErrors\");\n                log.warn(\"검증 오류 {} 건 발생:\", errors.size());\n                errors.forEach(e -> log.warn(\"  - {}\", e));\n\n                // 오류 리포트 발송\n                sendErrorReport(errors);\n            }\n\n            return stepExecution.getExitStatus();\n        }\n    };\n}\n```\n\n### 패턴 4: 외부 리소스 체크포인트\n\n```java\n@Component\n@Slf4j\npublic class S3FileReader implements ItemStreamReader<String> {\n\n    private static final String CURRENT_FILE_KEY = \"currentFileKey\";\n    private static final String CURRENT_LINE = \"currentLine\";\n\n    private final S3Client s3Client;\n    private final List<String> fileKeys;\n\n    private int currentFileIndex = 0;\n    private long currentLine = 0;\n    private BufferedReader currentReader;\n\n    @Override\n    public void open(ExecutionContext context) {\n        // 재시작 시 이전 파일/라인 위치 복구\n        if (context.containsKey(CURRENT_FILE_KEY)) {\n            String lastFileKey = context.getString(CURRENT_FILE_KEY);\n            currentFileIndex = fileKeys.indexOf(lastFileKey);\n            currentLine = context.getLong(CURRENT_LINE);\n\n            log.info(\"재시작 - 파일: {}, 라인: {}\", lastFileKey, currentLine);\n        }\n\n        openFile(currentFileIndex);\n        skipLines(currentLine);\n    }\n\n    @Override\n    public String read() throws Exception {\n        String line = currentReader.readLine();\n\n        if (line == null) {\n            // 현재 파일 끝 → 다음 파일로\n            currentFileIndex++;\n            currentLine = 0;\n\n            if (currentFileIndex >= fileKeys.size()) {\n                return null;  // 모든 파일 처리 완료\n            }\n\n            openFile(currentFileIndex);\n            return read();  // 재귀 호출\n        }\n\n        currentLine++;\n        return line;\n    }\n\n    @Override\n    public void update(ExecutionContext context) {\n        context.putString(CURRENT_FILE_KEY, fileKeys.get(currentFileIndex));\n        context.putLong(CURRENT_LINE, currentLine);\n    }\n\n    @Override\n    public void close() {\n        if (currentReader != null) {\n            try {\n                currentReader.close();\n            } catch (IOException e) {\n                log.warn(\"Reader 종료 실패\", e);\n            }\n        }\n    }\n\n    private void openFile(int index) {\n        String key = fileKeys.get(index);\n        InputStream stream = s3Client.getObject(GetObjectRequest.builder()\n                .bucket(bucketName)\n                .key(key)\n                .build());\n        currentReader = new BufferedReader(new InputStreamReader(stream));\n    }\n\n    private void skipLines(long lines) {\n        for (long i = 0; i < lines; i++) {\n            try {\n                currentReader.readLine();\n            } catch (IOException e) {\n                throw new RuntimeException(\"라인 스킵 실패\", e);\n            }\n        }\n    }\n}\n```\n\n---\n\n## 주의사항\n\n### 1. 직렬화 가능한 데이터만 저장\n\n```java\n// ❌ 잘못된 예: 직렬화 불가능한 객체\ncontext.put(\"connection\", dataSource.getConnection());  // 안 됨!\ncontext.put(\"lambda\", (Runnable) () -> {});  // 안 됨!\n\n// ✅ 올바른 예\ncontext.putString(\"connectionInfo\", \"jdbc:mysql://...\");\ncontext.putLong(\"lastId\", 12345L);\n```\n\n### 2. 큰 데이터 저장 금지\n\n```java\n// ❌ 잘못된 예: 대용량 데이터 저장\nList<Customer> allCustomers = repository.findAll();  // 100만 건\ncontext.put(\"customers\", allCustomers);  // 메타데이터 테이블 폭발!\n\n// ✅ 올바른 예: ID만 저장\ncontext.putLong(\"lastCustomerId\", 999999L);\n```\n\n### 3. 멀티스레드 환경 주의\n\n```java\n// 멀티스레드 Step에서는 ExecutionContext 공유 불가\n@Bean\npublic Step multiThreadStep(JobRepository jobRepository,\n                            PlatformTransactionManager transactionManager) {\n    return new StepBuilder(\"multiThreadStep\", jobRepository)\n            .<Customer, Customer>chunk(100, transactionManager)\n            .reader(reader())\n            .writer(writer())\n            .taskExecutor(taskExecutor())\n            .build();\n}\n\n@Bean\npublic JdbcPagingItemReader<Customer> reader() {\n    return new JdbcPagingItemReaderBuilder<Customer>()\n            .name(\"reader\")\n            .saveState(false)  // 멀티스레드에서는 필수!\n            // ...\n            .build();\n}\n```\n\n### 4. Key 이름 충돌 방지\n\n```java\n// ❌ 잘못된 예: 일반적인 이름\ncontext.put(\"count\", 100);  // 다른 컴포넌트와 충돌 가능\n\n// ✅ 올바른 예: 네임스페이스 사용\ncontext.put(\"payment.processor.count\", 100);\ncontext.put(\"customer.reader.lastId\", 12345L);\n```\n\n### 5. null 값 처리\n\n```java\n// ❌ 잘못된 예: NPE 위험\nLong lastId = context.getLong(\"lastId\");  // 없으면 예외!\n\n// ✅ 올바른 예: 기본값 지정\nLong lastId = context.getLong(\"lastId\", 0L);\n\n// 또는 존재 여부 확인\nif (context.containsKey(\"lastId\")) {\n    Long lastId = context.getLong(\"lastId\");\n}\n```\n\n---\n\n## 관련 문서\n\n- [Spring Batch 기초](./spring-batch-basics.md) - Job, Step, 실행 흐름\n- [Spring Batch Chunk 처리](./spring-batch-chunk.md) - ItemReader, ItemProcessor, ItemWriter\n- [Spring Batch 고급 활용](./spring-batch-advanced.md) - 비동기, 파티셔닝, 원격 실행\n- [Spring Batch 실무 베스트 프랙티스](./spring-batch-best-practices.md) - 정기 결제, 정산 사례\n\n*마지막 업데이트: 2024년 12월*\n", "size": 42517, "lines": 1182}, {"filename": "spring-bean-container-context-ioc.md", "title": "Spring Bean Container, Context, IoC 핵심 개념", "path": "spring/spring-bean-container-context-ioc.md", "content": "# Spring Bean Container, Context, IoC 핵심 개념\n\nSpring Framework의 핵심인 IoC(Inversion of Control) 컨테이너와 Bean 관리 메커니즘을 이해한다.\n\n## 목차\n\n- [IoC (Inversion of Control)란?](#ioc-inversion-of-control란)\n- [DI (Dependency Injection)](#di-dependency-injection)\n- [Spring Container](#spring-container)\n- [BeanFactory vs ApplicationContext](#beanfactory-vs-applicationcontext)\n- [Bean 등록 방법](#bean-등록-방법)\n- [Bean Scope](#bean-scope)\n- [Bean 생명주기](#bean-생명주기)\n- [의존성 주입 방식](#의존성-주입-방식)\n\n---\n\n## IoC (Inversion of Control)란?\n\nIoC는 **제어의 역전**으로, 객체의 생성과 의존성 관리를 개발자가 아닌 프레임워크가 담당하는 설계 원칙이다.\n\n### 기존 방식 (직접 제어)\n\n```java\npublic class OrderService {\n    // 개발자가 직접 객체를 생성하고 관리\n    private OrderRepository orderRepository = new OrderRepository();\n    private PaymentService paymentService = new PaymentService();\n\n    public void createOrder(Order order) {\n        orderRepository.save(order);\n        paymentService.process(order);\n    }\n}\n```\n\n**문제점:**\n- 강한 결합 (Tight Coupling)\n- 테스트 어려움\n- 유연성 부족\n\n### IoC 적용 후\n\n```java\n@Service\npublic class OrderService {\n    // Spring Container가 객체를 생성하고 주입\n    private final OrderRepository orderRepository;\n    private final PaymentService paymentService;\n\n    @Autowired\n    public OrderService(OrderRepository orderRepository,\n                       PaymentService paymentService) {\n        this.orderRepository = orderRepository;\n        this.paymentService = paymentService;\n    }\n\n    public void createOrder(Order order) {\n        orderRepository.save(order);\n        paymentService.process(order);\n    }\n}\n```\n\n**장점:**\n- 느슨한 결합 (Loose Coupling)\n- 테스트 용이 (Mock 주입 가능)\n- 유연한 구성 변경\n\n---\n\n## DI (Dependency Injection)\n\nDI는 IoC를 구현하는 방법 중 하나로, **의존성을 외부에서 주입**받는 패턴이다.\n\n### DI의 핵심 원리\n\n```java\n// 인터페이스 정의\npublic interface MessageService {\n    void sendMessage(String message);\n}\n\n// 구현체 1\n@Component(\"emailService\")\npublic class EmailService implements MessageService {\n    @Override\n    public void sendMessage(String message) {\n        System.out.println(\"Email: \" + message);\n    }\n}\n\n// 구현체 2\n@Component(\"smsService\")\npublic class SmsService implements MessageService {\n    @Override\n    public void sendMessage(String message) {\n        System.out.println(\"SMS: \" + message);\n    }\n}\n\n// 사용하는 클래스\n@Service\npublic class NotificationService {\n    private final MessageService messageService;\n\n    // 인터페이스 타입으로 주입 - 구현체 교체 용이\n    @Autowired\n    public NotificationService(@Qualifier(\"emailService\") MessageService messageService) {\n        this.messageService = messageService;\n    }\n\n    public void notify(String message) {\n        messageService.sendMessage(message);\n    }\n}\n```\n\n---\n\n## Spring Container\n\nSpring Container는 Bean의 생성, 관리, 소멸을 담당하는 핵심 컴포넌트다.\n\n### Container의 역할\n\n```\n┌─────────────────────────────────────────────────────┐\n│                  Spring Container                    │\n│  ┌─────────────────────────────────────────────┐    │\n│  │              Bean Factory                    │    │\n│  │  ┌─────────┐  ┌─────────┐  ┌─────────┐     │    │\n│  │  │ Bean A  │  │ Bean B  │  │ Bean C  │     │    │\n│  │  └────┬────┘  └────┬────┘  └────┬────┘     │    │\n│  │       │            │            │           │    │\n│  │       └────────────┼────────────┘           │    │\n│  │                    ▼                        │    │\n│  │            의존성 주입 (DI)                  │    │\n│  └─────────────────────────────────────────────┘    │\n│                                                      │\n│  ┌─────────────────────────────────────────────┐    │\n│  │  Configuration Metadata                      │    │\n│  │  (XML, Annotation, Java Config)              │    │\n│  └─────────────────────────────────────────────┘    │\n└─────────────────────────────────────────────────────┘\n```\n\n### Container 생성 코드\n\n```java\n// 1. Java Config 기반\n@Configuration\npublic class AppConfig {\n\n    @Bean\n    public OrderRepository orderRepository() {\n        return new JpaOrderRepository();\n    }\n\n    @Bean\n    public OrderService orderService() {\n        return new OrderService(orderRepository());\n    }\n}\n\n// Container 생성\nApplicationContext context =\n    new AnnotationConfigApplicationContext(AppConfig.class);\n\n// Bean 조회\nOrderService orderService = context.getBean(OrderService.class);\n```\n\n```java\n// 2. Component Scan 기반\n@Configuration\n@ComponentScan(basePackages = \"com.example\")\npublic class AppConfig {\n}\n\n// 자동 스캔되는 컴포넌트\n@Repository\npublic class JpaOrderRepository implements OrderRepository {\n    // ...\n}\n\n@Service\npublic class OrderService {\n    private final OrderRepository orderRepository;\n\n    @Autowired\n    public OrderService(OrderRepository orderRepository) {\n        this.orderRepository = orderRepository;\n    }\n}\n```\n\n---\n\n## BeanFactory vs ApplicationContext\n\n### BeanFactory\n\n가장 기본적인 컨테이너 인터페이스로, Bean의 생성과 DI만 담당한다.\n\n```java\npublic interface BeanFactory {\n    Object getBean(String name) throws BeansException;\n    <T> T getBean(String name, Class<T> requiredType) throws BeansException;\n    <T> T getBean(Class<T> requiredType) throws BeansException;\n    boolean containsBean(String name);\n    boolean isSingleton(String name) throws NoSuchBeanDefinitionException;\n    boolean isPrototype(String name) throws NoSuchBeanDefinitionException;\n    // ...\n}\n```\n\n**특징:**\n- Lazy Loading (Bean 요청 시 생성)\n- 메모리 절약\n- 최소 기능만 제공\n\n### ApplicationContext\n\nBeanFactory를 확장한 인터페이스로, 엔터프라이즈 기능을 제공한다.\n\n```java\npublic interface ApplicationContext extends\n        EnvironmentCapable,          // 환경 변수 처리\n        ListableBeanFactory,         // Bean 목록 조회\n        HierarchicalBeanFactory,     // 부모 컨텍스트 지원\n        MessageSource,               // 국제화 (i18n)\n        ApplicationEventPublisher,   // 이벤트 발행\n        ResourcePatternResolver {    // 리소스 로딩\n    // ...\n}\n```\n\n### 주요 구현체\n\n```java\n// 1. AnnotationConfigApplicationContext - Java Config 기반\nApplicationContext context =\n    new AnnotationConfigApplicationContext(AppConfig.class);\n\n// 2. ClassPathXmlApplicationContext - XML 기반\nApplicationContext context =\n    new ClassPathXmlApplicationContext(\"applicationContext.xml\");\n\n// 3. GenericWebApplicationContext - 웹 애플리케이션용\n// (Spring Boot에서 자동 생성)\n```\n\n### 비교표\n\n| 기능 | BeanFactory | ApplicationContext |\n|------|-------------|-------------------|\n| Bean 생성/관리 | O | O |\n| 의존성 주입 | O | O |\n| Bean 후처리기 | O | O |\n| 국제화 (MessageSource) | X | O |\n| 이벤트 발행 | X | O |\n| AOP 통합 | X | O |\n| 환경 추상화 | X | O |\n| Bean 로딩 시점 | Lazy | Eager (기본) |\n\n---\n\n## Bean 등록 방법\n\n### 1. @Component 계열 어노테이션\n\n```java\n@Component  // 일반 컴포넌트\npublic class MyComponent { }\n\n@Service    // 서비스 레이어\npublic class MyService { }\n\n@Repository // 데이터 접근 레이어\npublic class MyRepository { }\n\n@Controller // 웹 컨트롤러\npublic class MyController { }\n\n@RestController // REST API 컨트롤러\npublic class MyRestController { }\n```\n\n### 2. @Bean 어노테이션\n\n```java\n@Configuration\npublic class AppConfig {\n\n    @Bean\n    public DataSource dataSource() {\n        HikariDataSource dataSource = new HikariDataSource();\n        dataSource.setJdbcUrl(\"jdbc:mysql://localhost:3306/mydb\");\n        dataSource.setUsername(\"root\");\n        dataSource.setPassword(\"password\");\n        return dataSource;\n    }\n\n    @Bean\n    public JdbcTemplate jdbcTemplate(DataSource dataSource) {\n        return new JdbcTemplate(dataSource);\n    }\n\n    // 조건부 Bean 등록\n    @Bean\n    @ConditionalOnProperty(name = \"cache.enabled\", havingValue = \"true\")\n    public CacheManager cacheManager() {\n        return new ConcurrentMapCacheManager();\n    }\n}\n```\n\n### 3. @Import 사용\n\n```java\n@Configuration\n@Import({DatabaseConfig.class, SecurityConfig.class})\npublic class AppConfig {\n}\n```\n\n### 4. FactoryBean 사용\n\n```java\npublic class MyServiceFactoryBean implements FactoryBean<MyService> {\n\n    @Override\n    public MyService getObject() throws Exception {\n        MyService service = new MyService();\n        // 복잡한 초기화 로직\n        service.init();\n        return service;\n    }\n\n    @Override\n    public Class<?> getObjectType() {\n        return MyService.class;\n    }\n\n    @Override\n    public boolean isSingleton() {\n        return true;\n    }\n}\n```\n\n---\n\n## Bean Scope\n\nBean의 생존 범위를 정의한다.\n\n### Singleton (기본값)\n\n```java\n@Component\n@Scope(\"singleton\")  // 생략 가능\npublic class SingletonBean {\n    // Container당 하나의 인스턴스\n}\n```\n\n```java\n// 테스트\n@Test\nvoid singletonTest() {\n    ApplicationContext ctx = new AnnotationConfigApplicationContext(AppConfig.class);\n\n    SingletonBean bean1 = ctx.getBean(SingletonBean.class);\n    SingletonBean bean2 = ctx.getBean(SingletonBean.class);\n\n    assertThat(bean1).isSameAs(bean2);  // 동일 인스턴스\n}\n```\n\n### Prototype\n\n```java\n@Component\n@Scope(\"prototype\")\npublic class PrototypeBean {\n    // 요청마다 새 인스턴스 생성\n}\n```\n\n```java\n// 테스트\n@Test\nvoid prototypeTest() {\n    ApplicationContext ctx = new AnnotationConfigApplicationContext(AppConfig.class);\n\n    PrototypeBean bean1 = ctx.getBean(PrototypeBean.class);\n    PrototypeBean bean2 = ctx.getBean(PrototypeBean.class);\n\n    assertThat(bean1).isNotSameAs(bean2);  // 다른 인스턴스\n}\n```\n\n### Web Scopes\n\n```java\n@Component\n@Scope(value = \"request\", proxyMode = ScopedProxyMode.TARGET_CLASS)\npublic class RequestScopedBean {\n    // HTTP 요청마다 새 인스턴스\n}\n\n@Component\n@Scope(value = \"session\", proxyMode = ScopedProxyMode.TARGET_CLASS)\npublic class SessionScopedBean {\n    // HTTP 세션마다 새 인스턴스\n}\n```\n\n### Singleton 내부에서 Prototype 사용 시 주의\n\n```java\n@Component\npublic class SingletonBean {\n\n    @Autowired\n    private PrototypeBean prototypeBean;  // 항상 같은 인스턴스!\n\n    // 해결책 1: ObjectProvider 사용\n    @Autowired\n    private ObjectProvider<PrototypeBean> prototypeBeanProvider;\n\n    public void doSomething() {\n        PrototypeBean bean = prototypeBeanProvider.getObject();  // 새 인스턴스\n    }\n\n    // 해결책 2: @Lookup 사용\n    @Lookup\n    public PrototypeBean getPrototypeBean() {\n        return null;  // Spring이 오버라이드\n    }\n}\n```\n\n---\n\n## Bean 생명주기\n\n```\nContainer 시작\n      │\n      ▼\n┌─────────────┐\n│  Bean 인스턴스화  │\n└──────┬──────┘\n       │\n       ▼\n┌─────────────┐\n│   의존성 주입    │\n└──────┬──────┘\n       │\n       ▼\n┌─────────────┐\n│  초기화 콜백    │  ← @PostConstruct, InitializingBean, init-method\n└──────┬──────┘\n       │\n       ▼\n┌─────────────┐\n│    Bean 사용    │\n└──────┬──────┘\n       │\n       ▼\n┌─────────────┐\n│   소멸 콜백     │  ← @PreDestroy, DisposableBean, destroy-method\n└──────┬──────┘\n       │\n       ▼\nContainer 종료\n```\n\n### 생명주기 콜백 구현\n\n```java\n@Component\npublic class MyBean implements InitializingBean, DisposableBean {\n\n    private Connection connection;\n\n    // 1. @PostConstruct (권장)\n    @PostConstruct\n    public void init() {\n        System.out.println(\"1. @PostConstruct\");\n        this.connection = createConnection();\n    }\n\n    // 2. InitializingBean 인터페이스\n    @Override\n    public void afterPropertiesSet() throws Exception {\n        System.out.println(\"2. afterPropertiesSet\");\n    }\n\n    // 3. DisposableBean 인터페이스\n    @Override\n    public void destroy() throws Exception {\n        System.out.println(\"4. destroy\");\n    }\n\n    // 4. @PreDestroy (권장)\n    @PreDestroy\n    public void cleanup() {\n        System.out.println(\"3. @PreDestroy\");\n        closeConnection(connection);\n    }\n}\n```\n\n### @Bean 에서 지정\n\n```java\n@Configuration\npublic class AppConfig {\n\n    @Bean(initMethod = \"init\", destroyMethod = \"cleanup\")\n    public MyBean myBean() {\n        return new MyBean();\n    }\n}\n```\n\n### BeanPostProcessor\n\n모든 Bean의 초기화 전후에 커스텀 로직을 실행할 수 있다.\n\n```java\n@Component\npublic class CustomBeanPostProcessor implements BeanPostProcessor {\n\n    @Override\n    public Object postProcessBeforeInitialization(Object bean, String beanName) {\n        System.out.println(\"Before Init: \" + beanName);\n        return bean;\n    }\n\n    @Override\n    public Object postProcessAfterInitialization(Object bean, String beanName) {\n        System.out.println(\"After Init: \" + beanName);\n\n        // 프록시 생성 등 가능\n        if (bean instanceof MyService) {\n            return createProxy(bean);\n        }\n        return bean;\n    }\n}\n```\n\n---\n\n## 의존성 주입 방식\n\n### 1. 생성자 주입 (권장)\n\n```java\n@Service\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n    private final PaymentService paymentService;\n\n    // 생성자가 하나면 @Autowired 생략 가능\n    public OrderService(OrderRepository orderRepository,\n                       PaymentService paymentService) {\n        this.orderRepository = orderRepository;\n        this.paymentService = paymentService;\n    }\n}\n```\n\n**장점:**\n- 불변성 보장 (final 사용 가능)\n- 필수 의존성 명확\n- 테스트 용이\n- 순환 참조 컴파일 시점에 발견\n\n### 2. Setter 주입\n\n```java\n@Service\npublic class OrderService {\n\n    private OrderRepository orderRepository;\n\n    @Autowired\n    public void setOrderRepository(OrderRepository orderRepository) {\n        this.orderRepository = orderRepository;\n    }\n}\n```\n\n**사용 케이스:** 선택적 의존성\n\n### 3. 필드 주입 (비권장)\n\n```java\n@Service\npublic class OrderService {\n\n    @Autowired\n    private OrderRepository orderRepository;  // 테스트 어려움\n}\n```\n\n### Lombok 활용\n\n```java\n@Service\n@RequiredArgsConstructor  // final 필드에 대한 생성자 자동 생성\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n    private final PaymentService paymentService;\n\n    // 생성자 자동 생성됨\n}\n```\n\n---\n\n## 정리\n\n| 개념 | 설명 |\n|------|------|\n| IoC | 객체 생성/관리 권한을 Container에 위임 |\n| DI | 의존성을 외부에서 주입받는 패턴 |\n| BeanFactory | 기본적인 Bean 관리 컨테이너 |\n| ApplicationContext | BeanFactory + 엔터프라이즈 기능 |\n| @Component | 자동 스캔 대상 Bean 등록 |\n| @Bean | 수동 Bean 등록 (Java Config) |\n| Singleton | 기본 Scope, 컨테이너당 하나 |\n| Prototype | 요청마다 새 인스턴스 |\n\n**핵심 원칙:**\n1. 생성자 주입을 기본으로 사용\n2. 인터페이스에 의존하여 유연성 확보\n3. Bean Scope를 명확히 이해하고 적절히 사용\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 16600, "lines": 651}, {"filename": "spring-boot-auto-configuration.md", "title": "Spring Boot 자동 설정 (Auto Configuration)", "path": "spring/spring-boot-auto-configuration.md", "content": "# Spring Boot 자동 설정 (Auto Configuration)\n\nSpring Boot의 자동 설정은 클래스패스에 있는 라이브러리를 기반으로 애플리케이션을 자동으로 구성하는 기능이다.\n\n## 목차\n\n- [Auto Configuration이란?](#auto-configuration이란)\n- [동작 원리](#동작-원리)\n- [@EnableAutoConfiguration](#enableautoconfiguration)\n- [@Conditional 어노테이션](#conditional-어노테이션)\n- [자동 설정 확인하기](#자동-설정-확인하기)\n- [자동 설정 비활성화](#자동-설정-비활성화)\n- [커스텀 Auto Configuration 만들기](#커스텀-auto-configuration-만들기)\n\n---\n\n## Auto Configuration이란?\n\nSpring Boot는 클래스패스에 존재하는 jar 의존성을 분석하여 필요한 빈(Bean)을 자동으로 등록한다.\n\n```java\n@SpringBootApplication  // @EnableAutoConfiguration 포함\npublic class MyApplication {\n    public static void main(String[] args) {\n        SpringApplication.run(MyApplication.class, args);\n    }\n}\n```\n\n`@SpringBootApplication`은 다음 세 가지 어노테이션을 포함한다:\n\n```java\n@Target(ElementType.TYPE)\n@Retention(RetentionPolicy.RUNTIME)\n@SpringBootConfiguration\n@EnableAutoConfiguration  // 자동 설정 활성화\n@ComponentScan\npublic @interface SpringBootApplication {\n    // ...\n}\n```\n\n---\n\n## 동작 원리\n\n### 1. spring.factories 파일\n\n자동 설정 클래스는 `META-INF/spring.factories` 파일에 등록된다.\n\n```properties\n# spring-boot-autoconfigure.jar의 spring.factories\norg.springframework.boot.autoconfigure.EnableAutoConfiguration=\\\norg.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\\\norg.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration,\\\norg.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\\\n...\n```\n\n### 2. Spring Boot 3.x에서의 변경\n\nSpring Boot 3.x부터는 `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports` 파일을 사용한다.\n\n```text\norg.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration\norg.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration\norg.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration\n```\n\n### 3. 로딩 순서\n\n```\n@SpringBootApplication\n        ↓\n@EnableAutoConfiguration\n        ↓\nAutoConfigurationImportSelector\n        ↓\nspring.factories / AutoConfiguration.imports 로드\n        ↓\n@Conditional 조건 평가\n        ↓\n조건 만족 시 빈 등록\n```\n\n---\n\n## @EnableAutoConfiguration\n\n자동 설정을 활성화하는 핵심 어노테이션이다.\n\n```java\n@Target(ElementType.TYPE)\n@Retention(RetentionPolicy.RUNTIME)\n@Inherited\n@AutoConfigurationPackage\n@Import(AutoConfigurationImportSelector.class)\npublic @interface EnableAutoConfiguration {\n\n    String ENABLED_OVERRIDE_PROPERTY = \"spring.boot.enableautoconfiguration\";\n\n    // 제외할 자동 설정 클래스\n    Class<?>[] exclude() default {};\n\n    // 제외할 자동 설정 클래스 이름\n    String[] excludeName() default {};\n}\n```\n\n### AutoConfigurationImportSelector\n\n실제 자동 설정 클래스를 로드하는 역할을 한다.\n\n```java\npublic class AutoConfigurationImportSelector implements DeferredImportSelector {\n\n    @Override\n    public String[] selectImports(AnnotationMetadata annotationMetadata) {\n        if (!isEnabled(annotationMetadata)) {\n            return NO_IMPORTS;\n        }\n\n        // 자동 설정 후보 로드\n        AutoConfigurationEntry autoConfigurationEntry =\n            getAutoConfigurationEntry(annotationMetadata);\n\n        return StringUtils.toStringArray(autoConfigurationEntry.getConfigurations());\n    }\n\n    protected AutoConfigurationEntry getAutoConfigurationEntry(\n            AnnotationMetadata annotationMetadata) {\n\n        // 1. 모든 자동 설정 후보 로드\n        List<String> configurations = getCandidateConfigurations(\n            annotationMetadata, attributes);\n\n        // 2. 중복 제거\n        configurations = removeDuplicates(configurations);\n\n        // 3. 제외 설정 적용\n        Set<String> exclusions = getExclusions(annotationMetadata, attributes);\n        configurations.removeAll(exclusions);\n\n        // 4. 필터링 (@Conditional 조건 평가)\n        configurations = getConfigurationClassFilter()\n            .filter(configurations);\n\n        return new AutoConfigurationEntry(configurations, exclusions);\n    }\n}\n```\n\n---\n\n## @Conditional 어노테이션\n\n조건부로 빈을 등록하는 핵심 메커니즘이다.\n\n### 주요 @Conditional 어노테이션\n\n| 어노테이션 | 설명 |\n|-----------|------|\n| `@ConditionalOnClass` | 특정 클래스가 클래스패스에 있을 때 |\n| `@ConditionalOnMissingClass` | 특정 클래스가 클래스패스에 없을 때 |\n| `@ConditionalOnBean` | 특정 빈이 존재할 때 |\n| `@ConditionalOnMissingBean` | 특정 빈이 없을 때 |\n| `@ConditionalOnProperty` | 특정 프로퍼티 값이 일치할 때 |\n| `@ConditionalOnResource` | 특정 리소스가 존재할 때 |\n| `@ConditionalOnWebApplication` | 웹 애플리케이션일 때 |\n| `@ConditionalOnNotWebApplication` | 웹 애플리케이션이 아닐 때 |\n\n### @ConditionalOnClass 예제\n\n```java\n@Configuration\n@ConditionalOnClass(DataSource.class)  // DataSource 클래스가 있을 때만 활성화\npublic class DataSourceAutoConfiguration {\n\n    @Bean\n    @ConditionalOnMissingBean  // 사용자가 직접 등록한 빈이 없을 때만\n    public DataSource dataSource(DataSourceProperties properties) {\n        return DataSourceBuilder.create()\n            .url(properties.getUrl())\n            .username(properties.getUsername())\n            .password(properties.getPassword())\n            .build();\n    }\n}\n```\n\n### @ConditionalOnProperty 예제\n\n```java\n@Configuration\n@ConditionalOnProperty(\n    name = \"myapp.feature.enabled\",\n    havingValue = \"true\",\n    matchIfMissing = false  // 프로퍼티가 없으면 비활성화\n)\npublic class MyFeatureAutoConfiguration {\n\n    @Bean\n    public MyFeatureService myFeatureService() {\n        return new MyFeatureService();\n    }\n}\n```\n\n```yaml\n# application.yml\nmyapp:\n  feature:\n    enabled: true\n```\n\n### @ConditionalOnBean 예제\n\n```java\n@Configuration\npublic class CacheAutoConfiguration {\n\n    @Bean\n    @ConditionalOnBean(CacheManager.class)  // CacheManager 빈이 있을 때\n    public CacheService cacheService(CacheManager cacheManager) {\n        return new CacheService(cacheManager);\n    }\n\n    @Bean\n    @ConditionalOnMissingBean(CacheManager.class)  // CacheManager 빈이 없을 때\n    public CacheService noOpCacheService() {\n        return new NoOpCacheService();\n    }\n}\n```\n\n### 커스텀 Condition 구현\n\n```java\n// 커스텀 조건 클래스\npublic class OnProductionCondition implements Condition {\n\n    @Override\n    public boolean matches(ConditionContext context,\n                          AnnotatedTypeMetadata metadata) {\n        String env = context.getEnvironment()\n            .getProperty(\"spring.profiles.active\");\n        return \"prod\".equals(env);\n    }\n}\n\n// 사용\n@Configuration\n@Conditional(OnProductionCondition.class)\npublic class ProductionOnlyConfiguration {\n\n    @Bean\n    public ProductionService productionService() {\n        return new ProductionService();\n    }\n}\n```\n\n---\n\n## 자동 설정 확인하기\n\n### 1. 디버그 모드 활성화\n\n```yaml\n# application.yml\ndebug: true\n```\n\n실행 시 아래와 같은 조건 평가 리포트가 출력된다:\n\n```\n============================\nCONDITIONS EVALUATION REPORT\n============================\n\nPositive matches:\n-----------------\n   DataSourceAutoConfiguration matched:\n      - @ConditionalOnClass found required classes 'javax.sql.DataSource'\n\nNegative matches:\n-----------------\n   ActiveMQAutoConfiguration:\n      Did not match:\n         - @ConditionalOnClass did not find required class 'javax.jms.ConnectionFactory'\n```\n\n### 2. Actuator 엔드포인트\n\n```yaml\n# application.yml\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: conditions\n```\n\n```bash\ncurl http://localhost:8080/actuator/conditions\n```\n\n### 3. 코드에서 확인\n\n```java\n@Component\npublic class AutoConfigurationReporter implements ApplicationRunner {\n\n    @Autowired\n    private ConditionEvaluationReport report;\n\n    @Override\n    public void run(ApplicationArguments args) {\n        report.getConditionAndOutcomesBySource().forEach((source, outcomes) -> {\n            System.out.println(\"Source: \" + source);\n            outcomes.forEach(outcome -> {\n                System.out.println(\"  - \" + outcome.getCondition().getClass().getSimpleName()\n                    + \": \" + outcome.isMatch());\n            });\n        });\n    }\n}\n```\n\n---\n\n## 자동 설정 비활성화\n\n### 1. exclude 속성 사용\n\n```java\n@SpringBootApplication(exclude = {\n    DataSourceAutoConfiguration.class,\n    JpaRepositoriesAutoConfiguration.class\n})\npublic class MyApplication {\n    public static void main(String[] args) {\n        SpringApplication.run(MyApplication.class, args);\n    }\n}\n```\n\n### 2. application.yml 사용\n\n```yaml\nspring:\n  autoconfigure:\n    exclude:\n      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration\n      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration\n```\n\n### 3. 프로퍼티로 전체 비활성화\n\n```yaml\nspring:\n  boot:\n    enableautoconfiguration: false\n```\n\n---\n\n## 커스텀 Auto Configuration 만들기\n\n### 1. 자동 설정 클래스 작성\n\n```java\n@AutoConfiguration  // Spring Boot 3.x\n@ConditionalOnClass(MyService.class)\n@EnableConfigurationProperties(MyServiceProperties.class)\npublic class MyServiceAutoConfiguration {\n\n    @Bean\n    @ConditionalOnMissingBean\n    public MyService myService(MyServiceProperties properties) {\n        return new MyService(properties.getEndpoint(), properties.getTimeout());\n    }\n}\n```\n\n### 2. Properties 클래스\n\n```java\n@ConfigurationProperties(prefix = \"myservice\")\npublic class MyServiceProperties {\n\n    private String endpoint = \"http://localhost:8080\";\n    private int timeout = 5000;\n\n    // getters, setters\n}\n```\n\n### 3. 등록 파일 작성\n\n**Spring Boot 3.x:**\n\n`src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports`:\n\n```text\ncom.example.autoconfigure.MyServiceAutoConfiguration\n```\n\n**Spring Boot 2.x:**\n\n`src/main/resources/META-INF/spring.factories`:\n\n```properties\norg.springframework.boot.autoconfigure.EnableAutoConfiguration=\\\ncom.example.autoconfigure.MyServiceAutoConfiguration\n```\n\n### 4. 자동 설정 순서 지정\n\n```java\n@AutoConfiguration(\n    after = DataSourceAutoConfiguration.class,\n    before = JpaRepositoriesAutoConfiguration.class\n)\n@ConditionalOnClass(MyService.class)\npublic class MyServiceAutoConfiguration {\n    // ...\n}\n```\n\n### 5. 사용 예시\n\n```yaml\n# application.yml\nmyservice:\n  endpoint: https://api.example.com\n  timeout: 10000\n```\n\n```java\n@RestController\n@RequiredArgsConstructor\npublic class MyController {\n\n    private final MyService myService;  // 자동 주입\n\n    @GetMapping(\"/data\")\n    public String getData() {\n        return myService.fetchData();\n    }\n}\n```\n\n---\n\n## 정리\n\n| 개념 | 설명 |\n|------|------|\n| `@EnableAutoConfiguration` | 자동 설정 활성화 |\n| `@Conditional*` | 조건부 빈 등록 |\n| `spring.factories` | 자동 설정 클래스 등록 (2.x) |\n| `AutoConfiguration.imports` | 자동 설정 클래스 등록 (3.x) |\n| `@ConditionalOnMissingBean` | 사용자 정의 빈 우선 |\n\n**자동 설정의 핵심 원칙:**\n1. 클래스패스 기반 조건부 설정\n2. 사용자 정의 빈이 항상 우선\n3. 프로퍼티로 세부 동작 제어\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 11720, "lines": 474}]}}, "metadata": {"totalFiles": 41, "totalCategories": 12, "totalLines": 26604, "generatedAt": "2026-01-11T12:34:45.439603"}};</script>
