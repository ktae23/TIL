천 개 | 수백만 개 |\n| Blocking I/O | 스레드 점유 | Carrier 반환 |\n| 풀링 필요 | 필수 | 불필요 |\n\n### 2.3 적합한 사용 케이스\n\n**적합한 경우:**\n- I/O 바운드 작업 (네트워크, 파일, DB 통신)\n- 대량의 동시 요청 처리 (웹 서버)\n- Blocking API 사용 시\n\n**부적합한 경우:**\n- CPU 집약적 작업 → Parallel Stream, ForkJoinPool 사용\n- 이미 비동기로 잘 구현된 시스템\n\n### 2.4 실제 동작 플로우 (I/O Bound 작업)\n\n#### Mount/Unmount 메커니즘\n\nVirtual Thread의 핵심은 I/O 블로킹 시 **Carrier Thread에서 자동으로 분리(Unmount)**되어 다른 Virtual Thread가 해당 Carrier를 사용할 수 있다는 점입니다.\n\n```\n시간 →\n\nVirtual Thread 1 (API 호출)\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[실행]        [I/O 대기]                              [실행]\n▓▓▓▓▓░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░▓▓▓▓▓\n ↑              ↑                                      ↑\n Mount          Unmount                               Mount\n (CT1에 탑승)    (CT1에서 하차, 힙에 저장)              (CT2에 탑승)\n\n\nCarrier Thread 1\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[VT1 실행] [VT2 실행] [VT3 실행]    [VT4 실행]   [VT5 실행]\n▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓\n       ↑           ↑           ↑           ↑\n       VT1 하차    VT2 하차     VT3 하차    ...\n       VT2 탑승    VT3 탑승     VT4 탑승\n```\n\n#### 실제 예시: 6건 이미지 API 병렬 처리\n\n외부 API 호출(약 18초 소요)을 6건 병렬 처리하는 상황:\n\n```\n┌────────────────────────────────────────────────────────────────────┐\n│ Step 1: Virtual Thread 생성 (즉시 완료, 수 μs)                      │\n├────────────────────────────────────────────────────────────────────┤\n│                                                                    │\n│   ExecutorService executor = Executors.newVirtualThreadPerTaskExecutor();\n│                                                                    │\n│   ┌─────┐ ┌─────┐ ┌─────┐ ┌─────┐ ┌─────┐ ┌─────┐               │\n│   │ VT1 │ │ VT2 │ │ VT3 │ │ VT4 │ │ VT5 │ │ VT6 │  ← 힙에 생성   │\n│   │ img1│ │ img2│ │ img3│ │ img4│ │ img5│ │ img6│    (각 수 KB)  │\n│   └─────┘ └─────┘ └─────┘ └─────┘ └─────┘ └─────┘               │\n│                                                                    │\n└────────────────────────────────────────────────────────────────────┘\n                                 ↓\n┌────────────────────────────────────────────────────────────────────┐\n│ Step 2: 캐리어 스레드에 Mount & API 요청 전송 (수 ms)               │\n├────────────────────────────────────────────────────────────────────┤\n│                                                                    │\n│   Carrier Thread Pool (보통 CPU 코어 수만큼, 예: 4개)              │\n│   ┌──────────┬──────────┬──────────┬──────────┐                   │\n│   │   CT1    │   CT2    │   CT3    │   CT4    │                   │\n│   │  [VT1]   │  [VT2]   │  [VT3]   │  [VT4]   │  ← 4개 먼저 Mount │\n│   └────┬─────┴────┬─────┴────┬─────┴────┬─────┘                   │\n│        │          │          │          │                          │\n│        ▼          ▼          ▼          ▼                          │\n│   ┌─────────────────────────────────────────────┐                 │\n│   │         HTTP 요청 전송 → 외부 API            │                 │\n│   └─────────────────────────────────────────────┘                 │\n│                                                                    │\n│   VT5, VT6은 대기 큐에서 대기                                       │\n│                                                                    │\n└────────────────────────────────────────────────────────────────────┘\n                                 ↓\n┌────────────────────────────────────────────────────────────────────┐\n│ Step 3: I/O 블로킹 → Unmount (핵심!)                               │\n├────────────────────────────────────────────────────────────────────┤\n│                                                                    │\n│   HTTP 응답 대기 시작 (blocking I/O)                               │\n│                                                                    │\n│   VT1: \"나 지금 응답 기다려야 해\" → JVM이 감지                      │\n│        ↓                                                           │\n│   VT1의 스택 상태를 힙에 저장 (Continuation)                        │\n│        ↓                                                           │\n│   VT1을 CT1에서 Unmount (분리)                                     │\n│        ↓                                                           │\n│   CT1이 즉시 VT5를 Mount!                                          │\n│                                                                    │\n│   ┌──────────┬──────────┬──────────┬──────────┐                   │\n│   │   CT1    │   CT2    │   CT3    │   CT4    │                   │\n│   │  [VT5]   │  [VT6]   │  (idle)  │  (idle)  │  ← VT5,6도 요청   │\n│   └──────────┴──────────┴──────────┴──────────┘                   │\n│                                                                    │\n│   VT1~VT6 모두 힙에서 응답 대기 중 (캐리어 스레드 점유 X)           │\n│   ┌─────┐ ┌─────┐ ┌─────┐ ┌─────┐ ┌─────┐ ┌─────┐               │\n│   │ VT1 │ │ VT2 │ │ VT3 │ │ VT4 │ │ VT5 │ │ VT6 │               │\n│   │ 😴  │ │ 😴  │ │ 😴  │ │ 😴  │ │ 😴  │ │ 😴  │  ← 힙에서 대기 │\n│   │(wait)│(wait)│(wait)│(wait)│(wait)│(wait)│               │\n│   └─────┘ └─────┘ └─────┘ └─────┘ └─────┘ └─────┘               │\n│                                                                    │\n│   이 시점에 캐리어 스레드는 다른 작업 가능!                          │\n│                                                                    │\n└────────────────────────────────────────────────────────────────────┘\n                                 ↓\n                        (약 18초 경과...)\n                                 ↓\n┌────────────────────────────────────────────────────────────────────┐\n│ Step 4: 응답 도착 → Mount & 처리 재개                              │\n├────────────────────────────────────────────────────────────────────┤\n│                                                                    │\n│   외부 API 응답 도착 (예: VT3 먼저)                                 │\n│        ↓                                                           │\n│   VT3: \"응답 왔다!\" → JVM이 감지                                   │\n│        ↓                                                           │\n│   VT3을 사용 가능한 캐리어 스레드(CT1)에 Mount                      │\n│        ↓                                                           │\n│   힙에서 저장된 스택 상태 복원 (Continuation)                       │\n│        ↓                                                           │\n│   VT3 실행 재개 (응답 파싱, DTO 변환)                              │\n│                                                                    │\n│   ┌──────────┬──────────┬──────────┬──────────┐                   │\n│   │   CT1    │   CT2    │   CT3    │   CT4    │                   │\n│   │  [VT3]   │  [VT1]   │  [VT6]   │  [VT2]   │  ← 응답 온 순서로 │\n│   │ 처리중   │ 처리중    │ 처리중   │ 처리중    │     Mount       │\n│   └──────────┴──────────┴──────────┴──────────┘                   │\n│                                                                    │\n└────────────────────────────────────────────────────────────────────┘\n                                 ↓\n┌────────────────────────────────────────────────────────────────────┐\n│ Step 5: 모든 처리 완료 → 결과 수집                                  │\n├────────────────────────────────────────────────────────────────────┤\n│                                                                    │\n│   CompletableFuture.allOf(futures).join();  // 모든 VT 완료 대기   │\n│                                                                    │\n│   총 소요 시간: ~18초 (6건 병렬 처리)                               │\n│   순차 처리였다면: 18초 × 6 = 108초                                 │\n│                                                                    │\n└────────────────────────────────────────────────────────────────────┘\n```\n\n#### 플랫폼 스레드 vs Virtual Thread 비교\n\n```\n┌─────────────────────────────────────────────────────────────────────┐\n│                    플랫폼 스레드 (6건 처리)                          │\n├─────────────────────────────────────────────────────────────────────┤\n│                                                                     │\n│   Thread 1: ████░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░████  │\n│   Thread 2: ████░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░████  │\n│   Thread 3: ████░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░████  │\n│   Thread 4: ████░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░████  │\n│   Thread 5: ████░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░████  │\n│   Thread 6: ████░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░████  │\n│             ↑                   ↑                            ↑     │\n│           요청 전송          I/O 대기 (블로킹)            응답 처리  │\n│                                                                     │\n│   ████ = CPU 사용    ░░░░ = 블로킹 대기 (스레드 자원 점유!)         │\n│                                                                     │\n│   문제점:                                                           │\n│   - 6개 스레드가 각각 ~1MB 스택 메모리 점유                         │\n│   - I/O 대기 중에도 OS 스케줄러에서 관리                            │\n│   - 스레드 풀 크기 제한 → 동시 요청 수 제한                         │\n│                                                                     │\n└─────────────────────────────────────────────────────────────────────┘\n\n┌─────────────────────────────────────────────────────────────────────┐\n│                    Virtual Thread (6건 처리)                        │\n├─────────────────────────────────────────────────────────────────────┤\n│                                                                     │\n│   Carrier 1: ██VT1██VT5██░░░░░░██VT3██VT1██                        │\n│   Carrier 2: ██VT2██VT6██░░░░░░██VT4██VT2██                        │\n│   Carrier 3: ██VT3██░░░░░░░░░░░██VT5██░░░░                          │\n│   Carrier 4: ██VT4██░░░░░░░░░░░██VT6██░░░░                          │\n│              ↑                 ↑                                    │\n│            요청 전송         응답 처리                              │\n│            (Mount/Unmount)   (다시 Mount)                           │\n│                                                                     │\n│   VT 상태: VT1~6 모두 힙에서 I/O 완료 대기 (캐리어 점유 X)          │\n│                                                                     │\n│   장점:                                                             │\n│   - 캐리어 스레드는 4개만 사용 (CPU 코어 수)                        │\n│   - I/O 대기 중 VT는 힙 메모리만 사용 (수 KB)                       │\n│   - 캐리어 스레드가 다른 VT 작업 처리 가능                          │\n│   - 수천 개 동시 요청도 처리 가능                                   │\n│                                                                     │\n└─────────────────────────────────────────────────────────────────────┘\n```\n\n#### I/O Bound 작업에서의 효율성 요약\n\n| 항목 | 플랫폼 스레드 | Virtual Thread |\n|------|--------------|----------------|\n| I/O 대기 시 | OS 스레드 블로킹 유지 | 캐리어에서 Unmount, 힙 저장 |\n| 메모리 | 스레드당 ~1MB | VT당 수 KB |\n| 6건 처리 시 스레드 | 6개 점유 | 4개 캐리어 공유 |\n| 동시 처리 한계 | 스레드 풀 크기 | 사실상 무제한 |\n| 컨텍스트 스위칭 | OS 레벨 (비용 높음) | JVM 레벨 (비용 낮음) |\n| 6건 처리 시간 | 18초 (병렬) | 18초 (병렬) |\n| 리소스 효율 | I/O 대기 중 낭비 | I/O 대기 중 자원 반환 |\n\n> **핵심**: Virtual Thread는 I/O 대기 시간이 긴 작업(외부 API 호출, DB 쿼리 등)에서 **동일한 처리 시간으로 훨씬 적은 리소스를 사용**합니다. 처리량 증가가 아닌 **리소스 효율성 향상**이 핵심 이점입니다.\n\n---\n\n## 3. 기본 사용법\n\n### 3.1 Virtual Thread 생성\n\n```java\n// 방법 1: Thread.startVirtualThread()\nThread vThread = Thread.startVirtualThread(() -> {\n    System.out.println(\"Hello from Virtual Thread!\");\n});\n\n// 방법 2: Thread.ofVirtual().start()\nThread vThread2 = Thread.ofVirtual()\n    .name(\"my-virtual-thread\")\n    .start(() -> {\n        System.out.println(\"Named Virtual Thread\");\n    });\n\n// 방법 3: Thread.ofVirtual().unstarted()\nThread vThread3 = Thread.ofVirtual()\n    .name(\"unstarted-vthread\")\n    .unstarted(() -> {\n        System.out.println(\"Started later\");\n    });\nvThread3.start();\n```\n\n### 3.2 ExecutorService 활용\n\n```java\n// Virtual Thread per Task Executor (권장)\ntry (ExecutorService executor = Executors.newVirtualThreadPerTaskExecutor()) {\n\n    // 100만 개의 작업 제출 가능\n    IntStream.range(0, 1_000_000).forEach(i -> {\n        executor.submit(() -> {\n            Thread.sleep(Duration.ofSeconds(1));\n            return i;\n        });\n    });\n\n} // try-with-resources로 자동 종료 대기\n```\n\n### 3.3 Virtual Thread 확인\n\n```java\nThread current = Thread.currentThread();\n\n// Virtual Thread 여부 확인\nif (current.isVirtual()) {\n    System.out.println(\"This is a Virtual Thread\");\n}\n\n// 스레드 정보 출력\nSystem.out.println(current); // VirtualThread[#21]/runnable@ForkJoinPool-1-worker-1\n```\n\n### 3.4 Structured Concurrency (Preview)\n\nJDK 21에서 Preview로 도입된 구조적 동시성:\n\n```java\n// --enable-preview 필요\ntry (var scope = new StructuredTaskScope.ShutdownOnFailure()) {\n\n    Subtask<String> user = scope.fork(() -> fetchUser());\n    Subtask<Integer> order = scope.fork(() -> fetchOrder());\n\n    scope.join();           // 모든 subtask 완료 대기\n    scope.throwIfFailed();  // 예외 발생 시 전파\n\n    // 결과 사용\n    return new Response(user.get(), order.get());\n}\n```\n\n---\n\n## 4. Spring Boot에서의 활용\n\n### 4.1 기본 설정 (Spring Boot 3.2+)\n\n```yaml\n# application.yml\nspring:\n  threads:\n    virtual:\n      enabled: true  # 이 한 줄로 Virtual Thread 활성화!\n  main:\n    keep-alive: true  # 모든 스레드가 Virtual/Daemon일 때 JVM 유지\n```\n\n### 4.2 자동 설정되는 항목\n\n`spring.threads.virtual.enabled=true` 설정 시 자동 적용:\n\n| 컴포넌트 | 동작 |\n|----------|------|\n| **Tomcat/Jetty** | 요청 처리에 Virtual Thread 사용 |\n| **@Async** | Virtual Thread Executor 사용 |\n| **@Scheduled** | Virtual Thread로 실행 |\n| **RabbitMQ Listener** | Virtual Thread Executor 사용 |\n| **Kafka Listener** | Virtual Thread Executor 사용 |\n| **Spring Data Redis** | ClusterCommandExecutor에 Virtual Thread 사용 |\n| **Apache Pulsar** | VirtualThreadTaskExecutor 사용 |\n\n### 4.3 커스텀 TaskExecutor 설정\n\n```java\n@Configuration\npublic class VirtualThreadConfig {\n\n    @Bean\n    public Executor taskExecutor() {\n        return Executors.newVirtualThreadPerTaskExecutor();\n    }\n\n    // 또는 ThreadFactory 사용\n    @Bean\n    public Executor customVirtualExecutor() {\n        ThreadFactory factory = Thread.ofVirtual()\n            .name(\"custom-vt-\", 0)\n            .factory();\n        return Executors.newThreadPerTaskExecutor(factory);\n    }\n}\n```\n\n### 4.4 @Async와 함께 사용\n\n```java\n@Service\npublic class AsyncService {\n\n    @Async  // Virtual Thread에서 실행됨\n    public CompletableFuture<String> asyncOperation() {\n        // Blocking I/O도 안전하게 사용 가능\n        String result = restTemplate.getForObject(url, String.class);\n        return CompletableFuture.completedFuture(result);\n    }\n}\n```\n\n### 4.5 WebClient와의 비교\n\n```java\n// Virtual Thread 사용 시 - 동기 코드로 간단하게 작성\n@GetMapping(\"/users/{id}\")\npublic User getUser(@PathVariable Long id) {\n    // RestTemplate 사용 (Blocking이지만 Virtual Thread라 OK)\n    return restTemplate.getForObject(\"/api/users/\" + id, User.class);\n}\n\n// 기존 Reactive 방식 - 복잡한 체이닝 필요\n@GetMapping(\"/users/{id}\")\npublic Mono<User> getUserReactive(@PathVariable Long id) {\n    return webClient.get()\n        .uri(\"/api/users/\" + id)\n        .retrieve()\n        .bodyToMono(User.class);\n}\n```\n\n---\n\n## 5. Pinning 문제와 해결\n\n### 5.1 Pinning이란?\n\n**Pinning(고정)**은 Virtual Thread가 Carrier Thread(Platform Thread)에 \"고정\"되어 다른 Virtual Thread가 해당 Carrier를 사용하지 못하는 상황입니다.\n\n```\n정상 동작:\nVT1 → Carrier1 (I/O 대기) → Carrier1 반환 → 다른 VT 실행 가능\n\nPinning 발생:\nVT1 → Carrier1 (synchronized 내 I/O) → Carrier1 점유 유지 ❌\n→ Carrier Thread Pool 고갈 가능!\n```\n\n### 5.2 JDK 21에서의 Pinning 원인\n\n1. **synchronized 블록/메서드 내 Blocking 작업**\n2. **Native 코드 실행 (JNI, FFM API)**\n\n```java\n// Pinning 발생 예시 (JDK 21)\nsynchronized (lock) {\n    // 이 안에서 Blocking I/O 수행 시 Pinning!\n    Thread.sleep(1000);\n    httpClient.send(request, handler);\n}\n```\n\n### 5.3 JDK 21에서의 해결 방법\n\n```java\n// 해결책 1: ReentrantLock 사용\nprivate final ReentrantLock lock = new ReentrantLock();\n\npublic void safeMethod() {\n    lock.lock();\n    try {\n        // Blocking I/O 수행 - Pinning 발생 안 함\n        Thread.sleep(1000);\n    } finally {\n        lock.unlock();\n    }\n}\n\n// 해결책 2: synchronized 범위 최소화\npublic void optimizedMethod() {\n    Data data;\n    synchronized (lock) {\n        data = prepareData();  // 빠른 작업만\n    }\n    // Blocking 작업은 synchronized 밖에서\n    sendData(data);\n}\n```\n\n### 5.4 Pinning 감지\n\n```bash\n# JVM 옵션으로 Pinning 감지\njava -Djdk.tracePinnedThreads=full MyApplication\n\n# 또는 short 모드\njava -Djdk.tracePinnedThreads=short MyApplication\n```\n\n출력 예시:\n```\nThread[#24,ForkJoinPool-1-worker-1,5,CarrierThreads]\n    java.base/java.lang.VirtualThread$VThreadContinuation.onPinned(VirtualThread.java:185)\n    java.base/java.lang.VirtualThread.park(VirtualThread.java:582)\n    java.base/java.lang.System$2.parkVirtualThread(System.java:2643)\n    java.base/jdk.internal.misc.VirtualThreads.park(VirtualThreads.java:54)\n    java.base/java.util.concurrent.locks.LockSupport.park(LockSupport.java:219)\n    ...\n```\n\n### 5.5 JDK 24: Pinning 문제 해결! (JEP 491)\n\n**JDK 24부터 synchronized 블록에서 Pinning이 발생하지 않습니다!**\n\n```java\n// JDK 24+ : 이제 안전함!\nsynchronized (lock) {\n    Thread.sleep(1000);  // Pinning 없음\n    httpClient.send(request, handler);  // Pinning 없음\n}\n```\n\n> **JEP 491 적용 후:**\n> - Virtual Thread가 synchronized 내에서 block되면 Carrier Thread 반환\n> - 다른 Platform Thread가 나중에 작업 재개 가능\n> - **약 98% 성능 향상** (Pinning이 많던 워크로드 기준)\n\n### 5.6 남아있는 Pinning 케이스 (JDK 24+)\n\n```java\n// 여전히 Pinning 발생\n// 1. Native 메서드 호출\npublic native void nativeMethod();\n\n// 2. Foreign Function & Memory API 사용\ntry (Arena arena = Arena.ofConfined()) {\n    // FFM 작업 중 Pinning 가능\n}\n```\n\n---\n\n## 6. 베스트 프랙티스\n\n### 6.1 DO (권장사항)\n\n```java\n// ✅ Virtual Thread per Task Executor 사용\nExecutorService executor = Executors.newVirtualThreadPerTaskExecutor();\n\n// ✅ try-with-resources로 리소스 관리\ntry (var executor = Executors.newVirtualThreadPerTaskExecutor()) {\n    executor.submit(task);\n}\n\n// ✅ I/O 바운드 작업에 활용\nexecutor.submit(() -> {\n    var response = httpClient.send(request, handler);\n    repository.save(parseResponse(response));\n});\n\n// ✅ JDK 21에서는 ReentrantLock 고려 (JDK 24+는 불필요)\nprivate final ReentrantLock lock = new ReentrantLock();\n```\n\n### 6.2 DON'T (주의사항)\n\n```java\n// ❌ Virtual Thread를 풀링하지 마세요\nExecutorService pool = Executors.newFixedThreadPool(100,\n    Thread.ofVirtual().factory());  // 의미 없음!\n\n// ❌ ThreadLocal 남용 금지 (메모리 누수 위험)\nprivate static final ThreadLocal<ExpensiveObject> cache =\n    ThreadLocal.withInitial(ExpensiveObject::new);\n// 수백만 Virtual Thread × ExpensiveObject = 메모리 폭발!\n\n// ❌ CPU 집약적 작업에 사용 금지\nexecutor.submit(() -> {\n    // CPU 바운드 작업 - 이점 없음\n    return fibonacci(1000000);\n});\n\n// ❌ synchronized 내 장시간 Blocking (JDK 21)\nsynchronized (lock) {\n    Thread.sleep(10_000);  // JDK 24 이전에서는 피하세요\n}\n```\n\n### 6.3 점진적 마이그레이션 전략\n\n```\n1단계: 환경 준비\n   └── JDK 21+ 업그레이드\n   └── Spring Boot 3.2+ 업그레이드\n\n2단계: 설정 활성화\n   └── spring.threads.virtual.enabled=true\n\n3단계: 모니터링\n   └── Pinning 감지 로그 활성화\n   └── Micrometer 메트릭 설정\n\n4단계: 코드 최적화\n   └── synchronized → ReentrantLock (JDK 21)\n   └── ThreadLocal 사용 검토\n\n5단계: JDK 24 업그레이드 (권장)\n   └── Pinning 문제 완전 해결\n   └── synchronized 코드 유지 가능\n```\n\n### 6.4 ThreadLocal 대안\n\n```java\n// ❌ 기존 방식 - Virtual Thread에서 비효율적\nprivate static final ThreadLocal<SimpleDateFormat> formatter =\n    ThreadLocal.withInitial(() -> new SimpleDateFormat(\"yyyy-MM-dd\"));\n\n// ✅ 대안 1: Immutable 객체 사용\nprivate static final DateTimeFormatter formatter =\n    DateTimeFormatter.ofPattern(\"yyyy-MM-dd\");\n\n// ✅ 대안 2: 지역 변수로 사용\npublic String format(LocalDate date) {\n    DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"yyyy-MM-dd\");\n    return date.format(formatter);\n}\n\n// ✅ 대안 3: Scoped Values (Preview in JDK 21+)\nprivate static final ScopedValue<User> CURRENT_USER = ScopedValue.newInstance();\n\nScopedValue.where(CURRENT_USER, user).run(() -> {\n    // CURRENT_USER.get()으로 접근\n});\n```\n\n---\n\n## 7. 성능 및 모니터링\n\n### 7.1 성능 벤치마크 (참고용)\n\n| 시나리오 | Platform Thread | Virtual Thread | 개선율 |\n|----------|-----------------|----------------|--------|\n| 500 동시 사용자, 1000 요청 | 기준 | ~2배 향상 | 100% |\n| I/O 대기 많은 워크로드 | 기준 | ~5-10배 향상 | 400-900% |\n| CPU 집약적 워크로드 | 기준 | 동일 또는 약간 저하 | 0% |\n\n### 7.2 Micrometer 메트릭 설정\n\n```java\n@Configuration\npublic class VirtualThreadMetricsConfig {\n\n    @Bean\n    public MeterBinder virtualThreadMetrics() {\n        return registry -> {\n            Gauge.builder(\"jvm.threads.virtual\",\n                    () -> Thread.getAllStackTraces().keySet().stream()\n                        .filter(Thread::isVirtual)\n                        .count())\n                .description(\"Number of virtual threads\")\n                .register(registry);\n        };\n    }\n}\n```\n\n### 7.3 JFR(Java Flight Recorder) 활용\n\n```bash\n# JFR 시작\njava -XX:StartFlightRecording=filename=recording.jfr,duration=60s \\\n     -jar myapp.jar\n\n# 주요 이벤트\n# - jdk.VirtualThreadStart\n# - jdk.VirtualThreadEnd\n# - jdk.VirtualThreadPinned\n# - jdk.VirtualThreadSubmitFailed\n```\n\n---\n\n## 8. 참고 자료\n\n### 공식 문서\n- [JEP 444: Virtual Threads](https://openjdk.org/jeps/444)\n- [JEP 491: Synchronize Virtual Threads without Pinning](https://openjdk.org/jeps/491)\n- [Oracle Virtual Threads Documentation](https://docs.oracle.com/en/java/javase/21/core/virtual-threads.html)\n\n### Spring 관련\n- [Spring Boot 3.2 Release Notes](https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes)\n- [Working with Virtual Threads in Spring - Baeldung](https://www.baeldung.com/spring-6-virtual-threads)\n\n### 심화 학습\n- [Java Virtual Threads: A Case Study - InfoQ](https://www.infoq.com/articles/java-virtual-threads-a-case-study/)\n- [JDK 24's Major Improvement: Virtual Threads Without Pinning](https://www.danvega.dev/blog/jdk-24-virtual-threads-without-pinning)\n- [Java 24 Thread Pinning Revisited](https://mikemybytes.com/2025/04/09/java24-thread-pinning-revisited/)\n\n---\n\n## 요약\n\n| 항목 | 핵심 내용 |\n|------|-----------|\n| **정식 릴리스** | JDK 21 (LTS) - JEP 444 |\n| **Spring 지원** | Spring Boot 3.2+ |\n| **활성화 방법** | `spring.threads.virtual.enabled=true` |\n| **적합한 케이스** | I/O 바운드 작업, 대량 동시 요청 |\n| **주의사항** | ThreadLocal 남용, CPU 작업 사용 |\n| **Pinning 해결** | JDK 24 (JEP 491)로 synchronized 문제 해결 |\n\n---\n\n*마지막 업데이트: 2025년 12월 (I/O Bound 동작 플로우 추가)*\n", "size": 35036, "lines": 747}, {"filename": "jvm-classloader-and-modules.md", "title": "JVM 클래스 로더와 모듈 시스템", "path": "java/jvm-classloader-and-modules.md", "content": "# JVM 클래스 로더와 모듈 시스템\n\nJVM의 클래스 로딩 메커니즘, 모듈 시스템, 어노테이션 프로세싱에 대한 상세 분석입니다.\n\n**기준 버전**: Java 8 → Java 9+ 모듈 시스템 변경사항 포함\n\n## 목차\n\n- [클래스 로더](#클래스-로더)\n  - [Java 8: JAR 기반](#java-8-jar-기반-클래스-로딩)\n  - [Java 9+: 모듈 기반](#java-9-모듈-시스템-jpms-기반-클래스-로딩)\n- [클래스 로딩 과정](#클래스-로딩-과정-3단계)\n- [어노테이션 프로세서](#어노테이션-프로세서)\n- [참고 자료](#참고-자료)\n\n---\n\n## 클래스 로더\n\n클래스 로더는 `.class` 파일을 JVM 메모리에 로딩하는 역할을 수행합니다.\n\n### 클래스 로더 계층 구조\n\n#### Java 8: JAR 기반 클래스 로딩\n\n```\n┌─────────────────────────────────────┐\n│  Bootstrap ClassLoader              │\n│  (Native 코드, null로 표현)         │\n│  - rt.jar (java.lang.*, ...)        │\n│  - 핵심 JDK 클래스 로딩              │\n└─────────────────────────────────────┘\n             ↓ 부모\n┌─────────────────────────────────────┐\n│  Extension ClassLoader              │\n│  (sun.misc.Launcher$ExtClassLoader) │\n│  - jre/lib/ext/*.jar                │\n│  - 확장 라이브러리 로딩              │\n└─────────────────────────────────────┘\n             ↓ 부모\n┌─────────────────────────────────────┐\n│  Application ClassLoader            │\n│  (sun.misc.Launcher$AppClassLoader) │\n│  - classpath의 애플리케이션 클래스   │\n│  - 사용자 작성 클래스 로딩           │\n└─────────────────────────────────────┘\n             ↓ 부모 (optional)\n┌─────────────────────────────────────┐\n│  Custom ClassLoader (사용자 정의)   │\n│  - 특수 로딩 로직 (암호화, 네트워크) │\n└─────────────────────────────────────┘\n```\n\n**Java 8 클래스 로더 특징:**\n- **단일 거대 JAR**: rt.jar에 모든 핵심 클래스 포함 (60MB+)\n- **전역 classpath**: 모든 클래스가 동일한 classpath 공유\n- **캡슐화 부족**: internal API 접근 가능 (`sun.*`, `com.sun.*`)\n- **의존성 충돌**: JAR Hell 문제 (같은 클래스 다른 버전)\n\n#### Java 9+: 모듈 시스템 (JPMS) 기반 클래스 로딩\n\n```\n┌─────────────────────────────────────────────────────────┐\n│  Bootstrap ClassLoader (BootLoader)                     │\n│  (Native 코드, null로 표현)                             │\n│  ┌─────────────────────────────────────────────────┐   │\n│  │ 핵심 모듈 (rt.jar 제거, 모듈로 분리)             │   │\n│  │  - java.base (필수, 자동 로드)                   │   │\n│  │  - java.logging, java.xml, java.prefs           │   │\n│  └─────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────┘\n             ↓ 부모\n┌─────────────────────────────────────────────────────────┐\n│  Platform ClassLoader (PlatformClassLoader)             │\n│  (jdk.internal.loader.ClassLoaders$PlatformClassLoader) │\n│  ┌─────────────────────────────────────────────────┐   │\n│  │ Java SE 플랫폼 모듈 (Extension 대체)             │   │\n│  │  - java.se (Java SE API)                        │   │\n│  │  - java.sql, java.naming, java.management       │   │\n│  │  - java.desktop, java.compiler                  │   │\n│  └─────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────┘\n             ↓ 부모\n┌─────────────────────────────────────────────────────────┐\n│  Application ClassLoader (AppClassLoader)               │\n│  (jdk.internal.loader.ClassLoaders$AppClassLoader)      │\n│  ┌─────────────────────────────────────────────────┐   │\n│  │ 애플리케이션 모듈 + classpath                    │   │\n│  │  - 사용자 정의 모듈 (module-path)                │   │\n│  │  - classpath의 클래스 (하위 호환)                │   │\n│  └─────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────┘\n             ↓ 부모 (optional)\n┌─────────────────────────────────────────────────────────┐\n│  Custom ClassLoader (사용자 정의)                       │\n│  - 동일 (모듈 시스템과 호환)                             │\n└─────────────────────────────────────────────────────────┘\n```\n\n**Java 9+ 클래스 로더 변경사항:**\n\n1. **Extension ClassLoader → Platform ClassLoader**\n   - 이름 변경: `ExtClassLoader` → `PlatformClassLoader`\n   - 역할 확대: Java SE 플랫폼 모듈 로딩\n   - `jre/lib/ext` 디렉토리 제거\n\n2. **rt.jar 제거, 모듈로 분리**\n   - 단일 거대 JAR 제거\n   - 90개 이상의 모듈로 분리 (`jmods/` 디렉토리)\n   - 필요한 모듈만 선택적 로드 (경량화)\n\n3. **모듈 경로 (module-path) 도입**\n   - classpath와 별도로 module-path 존재\n   - `--module-path` 또는 `-p` 옵션으로 지정\n\n4. **강력한 캡슐화**\n   - internal API 접근 차단 (`sun.*`, `jdk.internal.*`)\n   - `--add-exports`, `--add-opens`로만 접근 가능\n\n**Java 8 vs Java 9+ 클래스 로더 비교:**\n\n| 항목 | Java 8 | Java 9+ | 변경 이유 |\n|------|--------|---------|----------|\n| **핵심 클래스 로더** | Bootstrap / Extension / Application | Bootstrap / Platform / Application | 모듈 시스템 지원 |\n| **Extension CL 이름** | `sun.misc.Launcher$ExtClassLoader` | `jdk.internal.loader.ClassLoaders$PlatformClassLoader` | 역할 변경 (확장→플랫폼) |\n| **Application CL 이름** | `sun.misc.Launcher$AppClassLoader` | `jdk.internal.loader.ClassLoaders$AppClassLoader` | 모듈 경로 지원 |\n| **핵심 라이브러리** | rt.jar (단일 거대 JAR) | 모듈로 분리 (java.base 등) | 경량화, 선택적 로드 |\n| **확장 라이브러리** | jre/lib/ext/*.jar | Platform 모듈 (java.se 등) | 모듈 시스템 통합 |\n| **클래스 경로** | classpath만 존재 | classpath + module-path | 모듈과 JAR 공존 |\n| **캡슐화** | 약함 (internal API 접근 가능) | 강함 (모듈 경계 강제) | 보안, API 안정성 |\n| **로딩 방식** | JAR 전체 스캔 | 모듈 디스크립터 기반 | 성능 향상 |\n\n**모듈 시스템 예시:**\n\n```java\n// module-info.java (모듈 디스크립터)\nmodule com.example.myapp {\n    requires java.base;      // 자동 포함 (명시 불필요)\n    requires java.sql;       // Platform CL이 로드\n    requires java.logging;   // Platform CL이 로드\n\n    exports com.example.api; // 외부에 공개\n    // com.example.internal은 캡슐화 (외부 접근 불가)\n}\n```\n\n**클래스 로더 확인 코드 (Java 9+):**\n\n```java\npublic class ModuleClassLoaderTest {\n    public static void main(String[] args) {\n        // Bootstrap ClassLoader (여전히 null)\n        System.out.println(\"String: \" + String.class.getClassLoader());\n        // 출력: null\n\n        // Platform ClassLoader (java.sql 모듈)\n        System.out.println(\"java.sql.Connection: \" +\n            java.sql.Connection.class.getClassLoader());\n        // 출력: jdk.internal.loader.ClassLoaders$PlatformClassLoader@...\n\n        // Application ClassLoader\n        System.out.println(\"MyClass: \" + ModuleClassLoaderTest.class.getClassLoader());\n        // 출력: jdk.internal.loader.ClassLoaders$AppClassLoader@...\n\n        // 모듈 정보 확인\n        Module stringModule = String.class.getModule();\n        System.out.println(\"String 모듈: \" + stringModule.getName());\n        // 출력: java.base\n\n        System.out.println(\"java.base는 모든 모듈에 자동 포함: \" +\n            stringModule.getDescriptor().requires());\n    }\n}\n```\n\n**주요 모듈 목록:**\n\n```bash\n# Java 9+ 모듈 확인\njava --list-modules\n\n# 핵심 모듈 (Bootstrap CL)\njava.base                  # 필수 모듈 (자동 로드)\njava.logging\njava.xml\njava.prefs\n\n# 플랫폼 모듈 (Platform CL)\njava.se                    # Java SE 전체 API\njava.sql\njava.naming\njava.management\njava.desktop\njava.compiler\n\n# JDK 전용 모듈\njdk.compiler               # javac 컴파일러\njdk.jshell                 # JShell REPL\njdk.httpserver             # 간단한 HTTP 서버\n```\n\n### 클래스 로더 종류 (Java 8)\n\n| 클래스 로더 | 로딩 대상 | 구현 언어 | 확인 방법 |\n|-----------|---------|---------|----------|\n| **Bootstrap** | JDK 핵심 라이브러리<br>`rt.jar` (java.lang.*, java.util.*) | Native 코드 (C/C++) | `String.class.getClassLoader()` → null |\n| **Extension** | 확장 라이브러리<br>`jre/lib/ext/*.jar` | Java | `DNSNameService.class.getClassLoader()` |\n| **Application** | 애플리케이션 클래스<br>`classpath`의 모든 클래스 | Java | `MyClass.class.getClassLoader()` |\n| **Custom** | 사용자 정의 로딩 로직 | Java | 직접 구현 (`extends ClassLoader`) |\n\n### 클래스 로딩 과정 (3단계)\n\n```\n┌──────────────────────────────────────────────────────┐\n│ 1. Loading (로딩)                                     │\n│    - 클래스 로더가 .class 파일을 찾아 바이트로 읽음    │\n│    - Method Area(Metaspace)에 클래스 정보 저장        │\n│    - Heap에 Class 객체 생성 (java.lang.Class)         │\n│                                                       │\n│    위임 모델 (Delegation Model):                      │\n│    ┌───────────────────────────────────────┐         │\n│    │ 1. Application CL이 요청 받음         │         │\n│    │ 2. Extension CL에 위임                │         │\n│    │ 3. Bootstrap CL에 위임                │         │\n│    │ 4. Bootstrap이 로드 실패 → Ext 시도   │         │\n│    │ 5. Extension도 실패 → App 시도        │         │\n│    │ 6. 모두 실패 → ClassNotFoundException │         │\n│    └───────────────────────────────────────┘         │\n└──────────────────────────────────────────────────────┘\n                       ↓\n┌──────────────────────────────────────────────────────┐\n│ 2. Linking (링킹)                                     │\n│    ┌──────────────────────────────────────┐          │\n│    │ 2-1. Verification (검증)             │          │\n│    │      - 바이트코드 형식 검사           │          │\n│    │      - 타입 안전성 검사               │          │\n│    │      - final 클래스 상속 여부 확인    │          │\n│    └──────────────────────────────────────┘          │\n│                    ↓                                  │\n│    ┌──────────────────────────────────────┐          │\n│    │ 2-2. Preparation (준비)              │          │\n│    │      - static 변수 메모리 할당        │          │\n│    │      - 기본값으로 초기화              │          │\n│    │        int → 0, boolean → false, ... │          │\n│    └──────────────────────────────────────┘          │\n│                    ↓                                  │\n│    ┌──────────────────────────────────────┐          │\n│    │ 2-3. Resolution (해석) - Optional    │          │\n│    │      - 심볼릭 참조→실제 메모리 주소   │          │\n│    │      - 클래스, 필드, 메서드 참조 확정 │          │\n│    │      - Lazy Resolution (필요시 수행)  │          │\n│    └──────────────────────────────────────┘          │\n└──────────────────────────────────────────────────────┘\n                       ↓\n┌──────────────────────────────────────────────────────┐\n│ 3. Initialization (초기화)                            │\n│    - static 변수에 실제 값 할당                        │\n│    - static 블록 실행 (위에서 아래로 순차 실행)        │\n│    - <clinit> 메서드 호출                             │\n│    - Thread-safe 보장 (동시 초기화 방지)              │\n└──────────────────────────────────────────────────────┘\n```\n\n### 클래스 로딩 예시 코드\n\n```java\npublic class Example {\n    static int count = 10;       // Preparation: 0 → Initialization: 10\n    static String name;          // Preparation: null (그대로 유지)\n\n    static {\n        System.out.println(\"Static block 1\");  // Initialization 시 실행\n        count = 20;\n    }\n\n    static {\n        System.out.println(\"Static block 2\");  // 순차 실행\n        name = \"Example\";\n    }\n\n    public static void main(String[] args) {\n        System.out.println(count);  // 출력: 20\n        System.out.println(name);   // 출력: Example\n    }\n}\n\n// 실행 결과:\n// Static block 1\n// Static block 2\n// 20\n// Example\n```\n\n**클래스 로더 확인 코드:**\n\n```java\npublic class ClassLoaderTest {\n    public static void main(String[] args) {\n        // Bootstrap ClassLoader (null 반환)\n        System.out.println(\"String: \" + String.class.getClassLoader());\n        // 출력: String: null\n\n        // Extension ClassLoader (Java 8)\n        System.out.println(\"DNSNameService: \" +\n            com.sun.jndi.dns.DnsClient.class.getClassLoader());\n        // 출력: sun.misc.Launcher$ExtClassLoader@...\n\n        // Application ClassLoader\n        System.out.println(\"MyClass: \" + ClassLoaderTest.class.getClassLoader());\n        // 출력: sun.misc.Launcher$AppClassLoader@...\n\n        // 부모 확인\n        ClassLoader appCL = ClassLoaderTest.class.getClassLoader();\n        System.out.println(\"Parent: \" + appCL.getParent());\n        // 출력: sun.misc.Launcher$ExtClassLoader@...\n        System.out.println(\"Parent's Parent: \" + appCL.getParent().getParent());\n        // 출력: null (Bootstrap)\n    }\n}\n```\n\n---\n\n## 어노테이션 프로세서\n\n어노테이션 프로세서는 **컴파일 타임**에 어노테이션을 분석하고 코드를 생성하거나 검증하는 도구입니다.\n\n### 처리 시점 비교\n\n| 시점 | 도구 | 예시 | 특징 | 성능 영향 |\n|------|------|------|------|---------|\n| **컴파일 타임** | Annotation Processor | Lombok, QueryDSL, AutoValue | 소스 코드 생성, 컴파일 오류 검출 | 런타임 오버헤드 없음 |\n| **런타임** | Reflection API | Spring AOP, JPA, Jackson | 동적 프록시, 메타데이터 읽기 | 리플렉션 오버헤드 있음 |\n\n### 주요 사용 사례\n\n**1. 코드 생성 (Boilerplate 제거)**\n\n```java\n// Lombok 사용 전 (Java 8 기준)\npublic class User {\n    private Long id;\n    private String name;\n    private String email;\n\n    public User() {}\n\n    public User(Long id, String name, String email) {\n        this.id = id;\n        this.name = name;\n        this.email = email;\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n\n    public String getName() { return name; }\n    public void setName(String name) { this.name = name; }\n\n    public String getEmail() { return email; }\n    public void setEmail(String email) { this.email = email; }\n\n    @Override\n    public boolean equals(Object o) {\n        if (this == o) return true;\n        if (o == null || getClass() != o.getClass()) return false;\n        User user = (User) o;\n        return Objects.equals(id, user.id) &&\n               Objects.equals(name, user.name) &&\n               Objects.equals(email, user.email);\n    }\n\n    @Override\n    public int hashCode() {\n        return Objects.hash(id, name, email);\n    }\n\n    @Override\n    public String toString() {\n        return \"User{id=\" + id + \", name='\" + name + \"', email='\" + email + \"'}\";\n    }\n}\n```\n\n```java\n// Lombok 사용 후 (컴파일 타임에 위 코드가 자동 생성됨)\n@Getter @Setter\n@NoArgsConstructor\n@AllArgsConstructor\n@EqualsAndHashCode\n@ToString\npublic class User {\n    private Long id;\n    private String name;\n    private String email;\n}\n```\n\n**2. QueryDSL - 타입 안전 쿼리 생성**\n\n```java\n// JPA 엔티티\n@Entity\npublic class Product {\n    @Id private Long id;\n    private String name;\n    private int price;\n}\n\n// 컴파일 타임에 QProduct.java 자동 생성\n// 생성된 코드 (일부):\npublic class QProduct extends EntityPathBase<Product> {\n    public final NumberPath<Long> id = createNumber(\"id\", Long.class);\n    public final StringPath name = createString(\"name\");\n    public final NumberPath<Integer> price = createNumber(\"price\", Integer.class);\n}\n\n// 타입 안전 쿼리 사용\nQProduct product = QProduct.product;\nList<Product> result = queryFactory\n    .selectFrom(product)\n    .where(product.price.gt(10000))\n    .fetch();\n```\n\n**3. 컴파일 타임 검증**\n\n```java\n// AutoValue - 불변 객체 생성 및 검증\n@AutoValue\npublic abstract class Money {\n    public abstract String currency();\n    public abstract long amount();\n\n    public static Money create(String currency, long amount) {\n        if (amount < 0) {\n            // 컴파일 타임에 오류 검출\n            throw new IllegalArgumentException(\"Amount cannot be negative\");\n        }\n        return new AutoValue_Money(currency, amount);\n    }\n}\n```\n\n### 동작 원리 (Java 8 Annotation Processing API)\n\n```\n┌───────────────────────────────────────────────────┐\n│ 1. 소스 코드 작성                                  │\n│    User.java (@Getter @Setter 어노테이션 포함)    │\n└───────────────────────────────────────────────────┘\n                     ↓\n┌───────────────────────────────────────────────────┐\n│ 2. javac 컴파일러 실행                             │\n│    javac -processor LombokProcessor User.java    │\n└───────────────────────────────────────────────────┘\n                     ↓\n┌───────────────────────────────────────────────────┐\n│ 3. Annotation Processor 초기화                    │\n│    - javax.annotation.processing.Processor 로드   │\n│    - META-INF/services에 등록된 프로세서 탐색      │\n└───────────────────────────────────────────────────┘\n                     ↓\n┌───────────────────────────────────────────────────┐\n│ 4. AST (Abstract Syntax Tree) 생성                │\n│    - 소스 코드를 트리 구조로 파싱                  │\n│    - 컴파일러 내부 표현으로 변환                   │\n└───────────────────────────────────────────────────┘\n                     ↓\n┌───────────────────────────────────────────────────┐\n│ 5. Annotation Processing Rounds                   │\n│    ┌───────────────────────────────────┐          │\n│    │ Round 1:                          │          │\n│    │  - @Getter, @Setter 어노테이션 발견│          │\n│    │  - getter/setter 메서드 코드 생성  │          │\n│    │  - 새로운 소스 파일/바이트코드 생성│          │\n│    └───────────────────────────────────┘          │\n│                   ↓                                │\n│    ┌───────────────────────────────────┐          │\n│    │ Round 2:                          │          │\n│    │  - 새로 생성된 파일 검사           │          │\n│    │  - 추가 어노테이션 없으면 종료     │          │\n│    └───────────────────────────────────┘          │\n└───────────────────────────────────────────────────┘\n                     ↓\n┌───────────────────────────────────────────────────┐\n│ 6. 최종 컴파일                                     │\n│    - 생성된 코드 포함하여 .class 파일 생성         │\n│    User.class (getter/setter 메서드 포함)         │\n└───────────────────────────────────────────────────┘\n```\n\n### Annotation Processor vs Reflection\n\n```java\n// Annotation Processor (컴파일 타임)\n@Retention(RetentionPolicy.SOURCE)  // .class 파일에 포함되지 않음\npublic @interface Getter {}\n\n// 컴파일 후:\n// - Getter 어노테이션은 제거됨\n// - 생성된 getter 메서드만 .class에 존재\n// - 런타임 오버헤드 없음\n```\n\n```java\n// Reflection (런타임)\n@Retention(RetentionPolicy.RUNTIME)  // .class 파일에 포함\npublic @interface Entity {}\n\n// 런타임에:\nif (User.class.isAnnotationPresent(Entity.class)) {\n    // 리플렉션으로 메타데이터 읽기\n    Entity entity = User.class.getAnnotation(Entity.class);\n    // 동적 처리 (프록시 생성, 테이블 매핑 등)\n}\n// - 런타임 오버헤드 발생\n// - 동적 처리 가능\n```\n\n**비교 표:**\n\n| 특성 | Annotation Processor | Reflection |\n|------|---------------------|------------|\n| **실행 시점** | 컴파일 타임 | 런타임 |\n| **Retention** | SOURCE, CLASS | RUNTIME |\n| **성능** | 런타임 오버헤드 없음 | 리플렉션 비용 발생 |\n| **타입 안전성** | 컴파일 타임 검증 | 런타임 오류 가능 |\n| **코드 생성** | 가능 | 불가능 (프록시만 가능) |\n| **사용 예** | Lombok, QueryDSL | Spring, JPA, Jackson |\n\n---\n\n---\n\n## 참고 자료\n\n- [Java Class Loading Mechanism](https://docs.oracle.com/javase/8/docs/technotes/tools/findingclasses.html)\n- [Java Platform Module System](https://openjdk.org/projects/jigsaw/)\n- [Annotation Processing in Java](https://docs.oracle.com/javase/8/docs/api/javax/annotation/processing/package-summary.html)\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 26324, "lines": 545}, {"filename": "jvm-execution-and-compilation.md", "title": "JVM 실행 흐름과 컴파일러", "path": "java/jvm-execution-and-compilation.md", "content": "# JVM 실행 흐름과 컴파일러\n\nJVM의 바이트코드 실행 흐름과 컴파일러 (인터프리터, JIT, AOT, GraalVM)에 대한 상세 분석입니다.\n\n**기준 버전**: Java 8 → Java 17+ 변경사항 포함\n\n## 목차\n\n- [전체 실행 과정](#전체-실행-과정-상세)\n- [메서드 호출과 Stack Frame](#메서드-호출-예시-stack-frame-생성-과정)\n- [실행 엔진 비교](#실행-엔진-비교)\n  - [Java 8: 인터프리터 + JIT](#java-8-인터프리터--jit-컴파일러)\n  - [Java 9+: AOT 컴파일러](#java-9-aot-ahead-of-time-컴파일러-추가)\n  - [Java 17+: GraalVM Native Image](#java-17-aotgraal-jit-제거-및-graalvm-native-image로의-전환)\n- [참고 자료](#참고-자료)\n\n---\n\n## 실행 흐름\n\n### 전체 실행 과정 (상세)\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│ 1. 개발 단계: 소스 코드 작성                                      │\n│    Example.java                                                  │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│ 2. 컴파일: javac 컴파일러                                         │\n│    - 소스 코드(.java) → 바이트코드(.class) 변환                   │\n│    - 어노테이션 프로세서 실행 (컴파일 타임 코드 생성)              │\n│    Example.class (바이트코드)                                     │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│ 3. JVM 시작: java Example                                        │\n│    - JVM 프로세스 생성                                            │\n│    - 메모리 영역 초기화 (Heap, Metaspace, Stack 등)               │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│ 4. 클래스 로딩: Class Loader Subsystem                            │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ 4-1. Loading (로딩)                                   │     │\n│    │      - .class 파일을 메모리로 로드                     │     │\n│    │      - 위임 모델: Bootstrap → Extension → Application │     │\n│    └──────────────────────────────────────────────────────┘     │\n│                           ↓                                      │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ 4-2. Linking (링킹)                                   │     │\n│    │      - Verification: 바이트코드 검증                   │     │\n│    │      - Preparation: static 변수 기본값 초기화          │     │\n│    │      - Resolution: 심볼릭 참조 → 실제 주소 변환        │     │\n│    └──────────────────────────────────────────────────────┘     │\n│                           ↓                                      │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ 4-3. Initialization (초기화)                          │     │\n│    │      - static 변수 실제 값 할당                        │     │\n│    │      - static 블록 실행                                │     │\n│    └──────────────────────────────────────────────────────┘     │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│ 5. 실행 엔진: Execution Engine                                    │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ 바이트코드 → 기계어 변환                              │     │\n│    │                                                       │     │\n│    │  ┌─────────────┐          ┌──────────────┐          │     │\n│    │  │ 인터프리터   │          │ JIT 컴파일러  │          │     │\n│    │  │             │          │              │          │     │\n│    │  │ - 한줄씩 해석│ ──────→  │ - Hot Spot   │          │     │\n│    │  │ - 초기 실행  │  빈번한   │   감지       │          │     │\n│    │  │             │  코드     │ - 네이티브   │          │     │\n│    │  │             │  발견시   │   코드 생성  │          │     │\n│    │  └─────────────┘          └──────────────┘          │     │\n│    └──────────────────────────────────────────────────────┘     │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│ 6. 런타임 실행                                                    │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ 메서드 호출                                           │     │\n│    │  ↓                                                    │     │\n│    │ Stack에 Frame 생성                                    │     │\n│    │  - 지역 변수 할당                                      │     │\n│    │  - Operand Stack (연산 스택)                          │     │\n│    │  - Return Address                                     │     │\n│    └──────────────────────────────────────────────────────┘     │\n│                           ↓                                      │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ 객체 생성 (new 키워드)                                │     │\n│    │  ↓                                                    │     │\n│    │ Heap의 Eden 영역에 메모리 할당                         │     │\n│    │  - 생성자 실행                                         │     │\n│    │  - 참조값을 Stack의 지역 변수에 저장                   │     │\n│    └──────────────────────────────────────────────────────┘     │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│ 7. 가비지 컬렉션 (GC)                                             │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ Minor GC (Young Generation)                           │     │\n│    │  - Eden 영역 가득 차면 실행                            │     │\n│    │  - 살아있는 객체 → Survivor로 이동                     │     │\n│    │  - 일정 횟수 생존 → Old Generation으로 이동 (Promotion)│     │\n│    └──────────────────────────────────────────────────────┘     │\n│                           ↓                                      │\n│    ┌──────────────────────────────────────────────────────┐     │\n│    │ Major GC (Old Generation)                             │     │\n│    │  - Old 영역 가득 차면 실행                             │     │\n│    │  - STW (Stop-The-World) 발생                          │     │\n│    │  - 애플리케이션 일시 중지                              │     │\n│    └──────────────────────────────────────────────────────┘     │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 메서드 호출 예시 (Stack Frame 생성 과정)\n\n```java\npublic class Example {\n    public static void main(String[] args) {  // Frame 1\n        int result = calculate(5);             // Frame 2 생성 예정\n        System.out.println(result);\n    }\n\n    public static int calculate(int num) {     // Frame 2\n        int temp = num * 2;                    // Frame 2의 지역 변수\n        return temp;\n    }\n}\n```\n\n**Stack 상태 변화:**\n\n```\n1. main() 호출 시\n┌──────────────┐\n│  Frame 1     │\n│  main()      │\n│ ─────────    │\n│ args: [...]  │\n└──────────────┘\n\n2. calculate(5) 호출 시\n┌──────────────┐\n│  Frame 2     │ ← 현재 실행\n│ calculate()  │\n│ ─────────    │\n│ num: 5       │\n│ temp: 10     │\n├──────────────┤\n│  Frame 1     │\n│  main()      │\n│ ─────────    │\n│ args: [...]  │\n│ result: ?    │\n└──────────────┘\n\n3. calculate() 종료 후\n┌──────────────┐\n│  Frame 1     │\n│  main()      │\n│ ─────────    │\n│ args: [...]  │\n│ result: 10   │ ← 반환값 저장\n└──────────────┘\n```\n\n### 실행 엔진 비교\n\n#### Java 8: 인터프리터 + JIT 컴파일러\n\n**동작 흐름:**\n\n```\n바이트코드 실행\n     ↓\n┌─────────────────┐\n│  인터프리터      │ ← 초기 실행 (즉시 시작)\n└─────────────────┘\n     ↓\n  Hot Spot 감지\n  (메서드 호출 횟수 카운팅)\n     ↓\n┌─────────────────┐\n│ JIT C1 컴파일러  │ ← Client 컴파일러 (빠른 컴파일)\n│ (Client)        │   - 기본 최적화\n└─────────────────┘   - 적은 컴파일 시간\n     ↓\n  더 많은 호출 감지\n     ↓\n┌─────────────────┐\n│ JIT C2 컴파일러  │ ← Server 컴파일러 (고도 최적화)\n│ (Server)        │   - 인라이닝, 루프 최적화\n└─────────────────┘   - 긴 컴파일 시간\n     ↓\n  네이티브 코드 캐싱\n  (Code Cache에 저장)\n```\n\n**비교표 (Java 8):**\n\n| 방식 | 동작 원리 | 장점 | 단점 | 사용 시점 | Hot Spot 임계값 |\n|------|----------|------|------|---------|----------------|\n| **인터프리터** | 바이트코드를 한 줄씩 읽어 즉시 실행 | 즉시 실행 가능, 메모리 효율적 | 느린 실행 속도 (10-100배 느림) | 프로그램 초기 실행, 한 번만 실행되는 코드 | - |\n| **JIT C1** | Hot Spot 코드를 네이티브 코드로 컴파일 | 빠른 실행 속도, 짧은 컴파일 시간 | C2보다 최적화 부족 | 반복 실행되는 코드 | 1,500회 호출 |\n| **JIT C2** | 고도로 최적화된 네이티브 코드 생성 | 매우 빠른 실행 속도 | 긴 컴파일 시간 (워밍업) | 매우 자주 실행되는 코드 | 10,000회 호출 |\n\n**JIT 컴파일 최적화 기법:**\n- **인라이닝 (Inlining)**: 메서드 호출을 메서드 본문으로 치환\n- **루프 최적화**: 루프 펼치기, 루프 병합\n- **Escape Analysis**: 객체가 메서드 외부로 탈출하지 않으면 Stack 할당\n- **Dead Code Elimination**: 실행되지 않는 코드 제거\n\n#### Java 9+: AOT (Ahead-of-Time) 컴파일러 추가\n\n**AOT 컴파일러 도입 배경:**\n- **문제**: JIT는 런타임에 컴파일하므로 워밍업 시간 필요\n- **필요성**: 클라우드 네이티브 환경에서 빠른 시작 시간 요구\n- **해결**: 실행 전에 미리 네이티브 코드로 컴파일\n\n**AOT 컴파일 흐름:**\n\n```\n┌─────────────────────────────────────┐\n│ 1. 컴파일 타임 (개발 단계)           │\n│    jaotc 도구 사용                   │\n└─────────────────────────────────────┘\n         ↓\n    .class 파일\n         ↓\n┌─────────────────────────────────────┐\n│ $ jaotc --output mylib.so \\         │\n│         --module java.base          │\n└─────────────────────────────────────┘\n         ↓\n    .so 파일 (네이티브 코드)\n         ↓\n┌─────────────────────────────────────┐\n│ 2. 런타임 (실행 시)                  │\n│    $ java -XX:AOTLibrary=./mylib.so │\n│           MyApp                     │\n└─────────────────────────────────────┘\n         ↓\n    즉시 네이티브 코드 실행\n    (JIT 워밍업 불필요)\n```\n\n**Java 8 vs Java 9+ 실행 엔진 비교:**\n\n| 항목 | Java 8 | Java 9+ | 차이점 |\n|------|--------|---------|--------|\n| **컴파일 방식** | JIT (런타임) | JIT + AOT (선택 가능) | AOT는 사전 컴파일 |\n| **시작 시간** | 느림 (워밍업 필요) | 빠름 (AOT 사용 시) | 워밍업 시간 제거 |\n| **Peak 성능** | 매우 높음 (C2 최적화) | JIT와 동일 | AOT는 런타임 정보 없어 최적화 제한 |\n| **메모리 사용** | Code Cache 필요 | .so 파일 로드 | AOT는 메모리 절약 |\n| **적합한 환경** | 장시간 실행 서버 | 짧은 실행 (Lambda, CLI) | 사용 패턴에 따라 선택 |\n| **프로파일링** | 런타임 프로파일링 가능 | 사전 컴파일로 제한적 | JIT가 더 정확한 최적화 |\n\n**AOT 사용 예시:**\n\n```bash\n# 1. Java 모듈을 AOT 컴파일\njaotc --output java.base.so --module java.base\n\n# 2. 애플리케이션 실행 (AOT 라이브러리 사용)\njava -XX:AOTLibrary=./java.base.so MyApp\n\n# 3. 성능 측정\n# - 시작 시간: 30-70% 단축\n# - Peak 성능: JIT보다 5-10% 낮음 (런타임 최적화 부족)\n```\n\n**AOT의 장단점:**\n\n| 장점 | 단점 |\n|------|------|\n| ✅ 빠른 시작 시간 (워밍업 불필요) | ❌ Peak 성능이 JIT보다 낮음 (런타임 정보 부족) |\n| ✅ 예측 가능한 성능 (사전 컴파일) | ❌ 플랫폼 종속적 (.so 파일은 OS별로 다름) |\n| ✅ 메모리 효율적 (Code Cache 불필요) | ❌ 컴파일 파일 크기 증가 |\n| ✅ 보안 향상 (디컴파일 어려움) | ❌ 동적 클래스 로딩 지원 제한 |\n\n**적합한 사용 사례:**\n- **AOT 추천**: 서버리스 (AWS Lambda), CLI 도구, 마이크로서비스 (빠른 스케일링)\n- **JIT 추천**: 장시간 실행 서버, 높은 처리량 필요 애플리케이션\n\n#### Java 17+: AOT/Graal JIT 제거 및 GraalVM Native Image로의 전환\n\n**변경 이유:**\n- Java 9-16의 `jaotc` 기반 AOT는 제한적인 성능 향상\n- 플랫폼 종속적이고 유지보수 비용 증가\n- **GraalVM Native Image**가 더 우수한 대안으로 부상\n\n**Java AOT vs GraalVM Native Image 비교:**\n\n| 항목 | Java AOT (Java 9-16) | GraalVM Native Image (Java 17+) |\n|------|---------------------|----------------------------------|\n| **컴파일 범위** | 일부 모듈만 AOT 컴파일 | 전체 애플리케이션을 네이티브 바이너리로 컴파일 |\n| **런타임** | 여전히 JVM 필요 | **JVM 불필요 (독립 실행 파일)** |\n| **시작 시간** | 30-70% 단축 | **90% 이상 단축 (밀리초 단위)** |\n| **메모리 사용** | JVM 오버헤드 존재 | **매우 낮음 (1/10 수준)** |\n| **Peak 성능** | JIT보다 5-10% 낮음 | JIT보다 10-30% 낮음 (트레이드오프) |\n| **배포 크기** | JRE 포함 필요 (수십 MB) | **단일 바이너리 (수 MB)** |\n| **플랫폼 지원** | JVM 지원 플랫폼 | OS별 네이티브 바이너리 빌드 |\n| **리플렉션 지원** | 완전 지원 | 제한적 (사전 등록 필요) |\n\n**GraalVM Native Image 동작 방식:**\n\n```\n┌─────────────────────────────────────────┐\n│ 1. Java 애플리케이션 코드               │\n│    MyApp.java + 의존성 라이브러리       │\n└─────────────────────────────────────────┘\n              ↓\n┌─────────────────────────────────────────┐\n│ 2. AOT 컴파일 (native-image 도구)       │\n│    - 정적 분석 (Closed World Assumption)│\n│    - 사용되는 모든 클래스/메서드 탐색    │\n│    - 리플렉션/동적 프록시 사전 등록      │\n└─────────────────────────────────────────┘\n              ↓\n┌─────────────────────────────────────────┐\n│ 3. 네이티브 코드 생성                    │\n│    - Substrate VM (경량 VM) 포함        │\n│    - GC 포함 (Serial GC 또는 G1 GC)     │\n│    - 모든 클래스를 네이티브 코드로 변환  │\n└─────────────────────────────────────────┘\n              ↓\n┌─────────────────────────────────────────┐\n│ 4. 네이티브 바이너리 생성                │\n│    myapp (실행 파일)                    │\n│    - JVM 불필요                         │\n│    - OS 직접 실행                       │\n└─────────────────────────────────────────┘\n```\n\n**GraalVM Native Image 사용 예시:**\n\n```bash\n# 1. GraalVM 설치\nsdk install java 21-graal\n\n# 2. Native Image 빌드\nnative-image -jar myapp.jar myapp\n\n# 빌드 옵션:\n# --no-fallback : 런타임 컴파일 완전 비활성화\n# -H:+ReportExceptionStackTraces : 빌드 오류 상세 출력\n# --initialize-at-build-time=<class> : 빌드 타임에 초기화\n\n# 3. 실행 (JVM 불필요!)\n./myapp\n\n# 성능 측정:\n# 시작 시간: 0.005s (기존 JVM: 0.5s, 100배 빠름)\n# 메모리 사용: 10MB (기존 JVM: 100MB, 1/10 수준)\n```\n\n**Spring Boot + GraalVM Native Image:**\n\n```java\n// Spring Boot 3.0+ 기본 지원\n// pom.xml\n<plugin>\n    <groupId>org.graalvm.buildtools</groupId>\n    <artifactId>native-maven-plugin</artifactId>\n</plugin>\n\n// 빌드\nmvn -Pnative native:compile\n\n// 결과:\n// - 시작 시간: 0.05초 (기존 2-3초 → 50배 빠름)\n// - 메모리: 20MB (기존 200MB → 1/10)\n// - 컨테이너 이미지: 50MB (기존 200MB → 1/4)\n```\n\n**GraalVM Native Image 제약사항 및 해결책:**\n\n| 제약사항 | 이유 | 해결책 |\n|---------|------|--------|\n| **리플렉션 사전 등록** | 정적 분석으로 리플렉션 대상 파악 불가 | `reflect-config.json` 작성 또는 자동 생성 |\n| **동적 프록시 제한** | 런타임 클래스 생성 불가 | `proxy-config.json` 작성 |\n| **JNI 호출** | 네이티브 코드 호출 사전 등록 필요 | `jni-config.json` 작성 |\n| **클래스 패스 스캐닝** | 런타임 클래스 로딩 불가 | 빌드 타임에 모든 클래스 포함 |\n\n**리플렉션 설정 예시:**\n\n```json\n// reflect-config.json\n[\n  {\n    \"name\": \"com.example.MyClass\",\n    \"allDeclaredMethods\": true,\n    \"allDeclaredFields\": true,\n    \"allDeclaredConstructors\": true\n  }\n]\n```\n\n**자동 설정 생성 (Agent 사용):**\n\n```bash\n# 1. Agent로 애플리케이션 실행 (메타데이터 수집)\njava -agentlib:native-image-agent=config-output-dir=META-INF/native-image \\\n     -jar myapp.jar\n\n# 2. 수집된 설정 파일로 Native Image 빌드\nnative-image -jar myapp.jar\n```\n\n**언제 GraalVM Native Image를 사용할까?**\n\n✅ **추천하는 경우:**\n- 서버리스 환경 (AWS Lambda, Google Cloud Functions)\n- 컨테이너 기반 마이크로서비스 (빠른 스케일링)\n- CLI 도구 (즉각적인 실행)\n- IoT 디바이스 (제한된 리소스)\n- 클라우드 비용 절감 (낮은 메모리 사용)\n\n❌ **권장하지 않는 경우:**\n- 리플렉션/동적 프록시를 많이 사용하는 레거시 애플리케이션\n- 최고 성능(Peak Performance)이 중요한 장시간 실행 서버\n- 빌드 시간이 매우 중요한 경우 (Native Image 빌드는 느림, 수 분 소요)\n\n**결론:**\n\n| 환경 | 권장 방식 |\n|------|---------|\n| 전통적인 서버 애플리케이션 | **JIT (JVM)** |\n| 서버리스, 마이크로서비스 | **GraalVM Native Image** |\n| 개발/테스트 환경 | **JIT (빠른 빌드)** |\n| 프로덕션 (클라우드) | **GraalVM Native Image (비용 절감)** |\n\n---\n\n## 참고 자료\n\n- [Oracle Java 8 JVM Specification](https://docs.oracle.com/javase/specs/jvms/se8/html/)\n- [JIT Compiler Overview](https://docs.oracle.com/en/java/javase/11/vm/java-virtual-machine-technology-overview.html)\n- [GraalVM Native Image](https://www.graalvm.org/latest/reference-manual/native-image/)\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 24885, "lines": 447}, {"filename": "jvm-memory-and-gc.md", "title": "JVM 메모리 구조와 가비지 컬렉션", "path": "java/jvm-memory-and-gc.md", "content": "# JVM 메모리 구조와 가비지 컬렉션\n\nJVM의 메모리 영역과 가비지 컬렉션 메커니즘에 대한 상세 분석입니다.\n\n**기준 버전**: Java 8 → Java 11+ 변경사항 포함\n\n## 목차\n\n- [메모리 영역 개요](#메모리-영역-개요)\n- [Metaspace](#metaspace)\n- [Heap 메모리와 GC](#heap-메모리와-gc)\n  - [JVM 힙 메모리 기본값 (Ergonomics)](#jvm-힙-메모리-기본값-ergonomics)\n  - [힙 메모리 동적 확장 메커니즘](#힙-메모리-동적-확장-메커니즘)\n  - [Java 8: Parallel GC](#java-8-기본-gc-parallel-gc)\n  - [Java 9+: G1 GC](#java-9-기본-gc-g1-gc-garbage-first)\n  - [Java 11: ZGC](#java-11-zgc-z-garbage-collector)\n  - [Java 11: Epsilon GC](#java-11-epsilon-gc-no-op-garbage-collector)\n  - [GC 알고리즘 통합 비교](#gc-알고리즘-통합-비교)\n- [Runtime 클래스로 메모리 확인](#runtime-클래스로-메모리-확인)\n- [실전 활용: Elastic Beanstalk 설정](#실전-활용-elastic-beanstalk-설정)\n- [Stack](#stack)\n- [핵심 요약](#핵심-요약)\n- [참고 자료](#참고-자료)\n\n---\n\n## 메모리 영역 개요\n\nJVM은 다음과 같은 메모리 영역으로 구분됩니다:\n\n### 메모리 영역 비교표 (Java 8 기준)\n\n| 영역 | 스레드 공유 | 생명주기 | 주요 저장 내용 | GC 대상 |\n|------|------------|---------|--------------|---------|\n| **Metaspace** | ✅ 공유 | JVM 시작~종료 | 클래스 메타데이터, static 변수, 상수 풀 | ✅ |\n| **Heap** | ✅ 공유 | JVM 시작~종료 | 객체 인스턴스, 배열 | ✅ |\n| **Stack** | ❌ 스레드별 | 스레드 시작~종료 | 지역 변수, 메서드 호출 정보 | ❌ |\n| **PC Register** | ❌ 스레드별 | 스레드 시작~종료 | 현재 실행 중인 명령어 주소 | ❌ |\n| **Native Method Stack** | ❌ 스레드별 | 스레드 시작~종료 | Native 메서드 호출 정보 | ❌ |\n\n---\n\n## Metaspace\n\n### Java 8의 핵심 변경사항: PermGen → Metaspace\n\n```\nJava 7 이전              Java 8 이후\n┌─────────────────┐      ┌─────────────────┐\n│   Heap Memory   │      │   Heap Memory   │\n│  ┌───────────┐  │      │  ┌───────────┐  │\n│  │  PermGen  │  │  →   │  │ (PermGen  │  │\n│  │ (고정크기) │  │      │  │   제거)   │  │\n│  └───────────┘  │      │  └───────────┘  │\n└─────────────────┘      └─────────────────┘\n                         ┌─────────────────┐\n                         │ Native Memory   │\n                         │  ┌───────────┐  │\n                         │  │Metaspace  │  │\n                         │  │(동적확장)  │  │\n                         │  └───────────┘  │\n                         └─────────────────┘\n```\n\n### Java 7 이전 (PermGen)\n\n- Heap 내부에 위치\n- 고정된 크기 (`-XX:MaxPermSize=128m`)\n- 클래스 메타데이터, static 변수, 상수 풀 저장\n- **문제점**: `OutOfMemoryError: PermGen space` 발생 빈번\n\n### Java 8 이후 (Metaspace)\n\n- Native Memory에 위치 (Heap 외부)\n- 동적 확장 가능 (`-XX:MaxMetaspaceSize` 기본값: 무제한)\n- OS 메모리 한도까지 자동 확장\n- **장점**: PermGen 공간 부족 문제 해결, 메모리 효율성 향상\n\n---\n\n## Heap 메모리와 GC\n\n### JVM 힙 메모리 기본값 (Ergonomics)\n\n#### 별도 설정 없을 시 기본값\n\nJVM은 물리 메모리를 기반으로 힙 크기를 자동 설정합니다 (Java 5 이후):\n\n```\n초기 힙 (-Xms) = 물리 메모리 / 64 (최소 32MB)\n최대 힙 (-Xmx) = 물리 메모리 / 4\n```\n\n**예시: 16GB RAM 인스턴스**\n- 초기 힙: 256MB (16GB ÷ 64)\n- 최대 힙: 4GB (16GB ÷ 4)\n\n#### Java 버전별 발전 과정\n\n| 버전 | 연도 | 주요 변화 |\n|------|------|-----------|\n| Java 1.0 | 1996 | 동적 할당 메커니즘 존재 (수동 설정) |\n| **Java 1.4** | **2002** | **Ergonomics 도입** - Server-Class Machine Detection |\n| **Java 5** | **2004** | **1/64, 1/4 규칙 정립** |\n| Java 6-7 | 2006-2011 | 최대 힙 1GB 제한 완화, G1GC 도입 |\n| **Java 8** | **2014** | **현대적 기본값** - 제한 제거, PermGen → Metaspace |\n| Java 10+ | 2018~ | 컨테이너(Docker/K8s) 환경 인식 개선 |\n\n#### 컨테이너 환경에서의 차이\n\n```bash\n# Java 8 이하: 호스트 메모리 인식\n컨테이너 제한 2GB, 호스트 16GB\n→ JVM이 16GB 인식 → 최대 힙 4GB 할당 (❌ OOM 발생)\n\n# Java 10 이상: 컨테이너 제한 인식\n컨테이너 제한 2GB\n→ JVM이 2GB 인식 → 최대 힙 512MB 할당 (✅ 올바름)\n```\n\n### 힙 메모리 동적 확장 메커니즘\n\n#### 기본 개념\n\nJVM은 **동적 할당**을 지원합니다 (Java 1.0부터):\n- 초기 힙(Xms)으로 시작\n- 필요 시 최대 힙(Xmx)까지 자동 확장\n- 여유 시 힙 축소 가능\n\n#### 확장 메커니즘 순서도\n\n```\n1. 초기 힙 할당 (예: 256MB)\n   ↓\n2. 객체 생성 → 메모리 사용량 증가\n   ↓\n3. 힙이 거의 가득 찬 상태 (임계값 도달)\n   ↓\n4. 🔄 GC 실행 (메모리 회수 시도)\n   ↓\n5. GC 후에도 여전히 부족?\n   ├─ YES → 📈 힙 확장 (예: 1GB → 1.5GB)\n   └─ NO  → ✅ 계속 실행\n   ↓\n6. 반복 (최대 Xmx까지)\n   ↓\n7. Xmx 도달 후에도 부족?\n   └─ 💥 OutOfMemoryError\n```\n\n#### 확장/축소 트리거 조건\n\n**확장 조건:**\n```java\nif (GC 후 여유 공간 < 40%) {\n    힙 확장 (현재 크기의 약 20~50% 증가)\n}\n```\n\n**축소 조건:**\n```java\nif (GC 후 여유 공간 > 70%) {\n    힙 축소 고려 (확장보다 덜 적극적)\n}\n```\n\n#### 실제 동작 예시\n\n**시나리오: 사진 업로드 처리**\n\n```\n시작: 256MB 할당\n├─ 평소 사용: 500MB까지 증가\n├─ GC 실행 → 300MB로 회수\n└─ 다시 사용: 800MB까지 증가\n\n사진 업로드 폭주:\n├─ 메모리 사용: 950MB (힙 거의 가득)\n├─ 🔄 GC 실행 → 700MB로 회수\n├─ 여전히 부족 → 📈 힙 확장: 1GB → 1.5GB\n├─ 계속 사용: 1.3GB\n├─ 🔄 GC 실행 → 1GB로 회수\n├─ 여전히 부족 → 📈 힙 확장: 1.5GB → 2GB\n└─ 반복... 최대 4GB까지\n```\n\n#### 힙 확장 시 GC 영향\n\n**문제점:**\n\n```\n힙 부족 → GC → 확장 → 또 부족 → GC → 확장...\n→ GC가 너무 자주 발생\n→ CPU 사용량 증가\n→ 애플리케이션 일시 정지 (STW - Stop The World)\n```\n\n**Full GC 발생:**\n- 힙 확장 시 Full GC 트리거\n- 전체 힙 스캔\n- 수백ms ~ 수초 정지\n- 사용자 요청 지연\n\n#### 모니터링 패턴 해석\n\n**톱니 패턴 (Sawtooth Pattern):**\n\n```\n메모리 사용량\n  ^\n1G|     /\\      /\\      /\\\n  |    /  \\    /  \\    /  \\\n  |   /    \\  /    \\  /    \\\n500|  /      \\/      \\/      \\\n  |_________________________> 시간\n```\n\n- **증가**: 객체 생성\n- **급격한 하락**: GC 실행\n- **정상적인 패턴**: GC가 잘 작동 중\n- **주의**: 너무 빈번하면 성능 저하\n\n### Java 8 기본 GC: Parallel GC\n\n```\n┌──────────────────────────────────────────┐\n│              Heap Memory                 │\n├──────────────────────┬───────────────────┤\n│  Young Generation    │  Old Generation   │\n│ ┌─────┬──────────┐   │                   │\n│ │Eden │Survivor 0│   │   (장기 객체)      │\n│ │     │Survivor 1│   │                   │\n│ └─────┴──────────┘   │                   │\n└──────────────────────┴───────────────────┘\n```\n\n**특징:**\n- **Young Generation**: 새로 생성된 객체 저장 (Minor GC 대상)\n  - Eden: 객체 최초 생성 위치\n  - Survivor 0/1: Minor GC에서 살아남은 객체\n- **Old Generation**: 오래 살아남은 객체 저장 (Major GC 대상)\n- **고정된 세대 구조**: Young과 Old 영역이 물리적으로 분리\n- **처리량 중심**: 멀티 스레드로 병렬 GC 수행\n- **Stop-The-World**: GC 중 애플리케이션 일시 중지\n\n**장단점:**\n- ✅ 높은 처리량 (Throughput)\n- ✅ 멀티 CPU 활용 효율적\n- ❌ 긴 중지 시간 (특히 Old GC)\n- ❌ 중지 시간 예측 어려움\n\n### Java 9+ 기본 GC: G1 GC (Garbage First)\n\n```\n┌─────────────────────────────────────────────────────────┐\n│                    Heap Memory (G1)                     │\n│  ┌────┬────┬────┬────┬────┬────┬────┬────┬────┬────┐   │\n│  │ E  │ E  │ S  │ O  │ O  │ H  │ E  │ S  │ O  │ H  │   │\n│  ├────┼────┼────┼────┼────┼────┼────┼────┼────┼────┤   │\n│  │ O  │ E  │ E  │ H  │ S  │ O  │ O  │ E  │ S  │ E  │   │\n│  └────┴────┴────┴────┴────┴────┴────┴────┴────┴────┘   │\n│                                                          │\n│  E: Eden (Young)      S: Survivor (Young)               │\n│  O: Old               H: Humongous (대형 객체, ≥50% region)│\n└─────────────────────────────────────────────────────────┘\n```\n\n**Region 기반 구조:**\n- Heap을 동일한 크기의 **Region**으로 분할 (기본 1MB~32MB, 자동 계산)\n- 각 Region은 Eden, Survivor, Old, Humongous 역할을 **동적으로 변경**\n- Young/Old 구분은 논리적으로만 존재\n\n**동작 방식:**\n1. **Young GC (Evacuation Pause)**\n   - Eden과 Survivor Region의 살아있는 객체를 다른 Region으로 복사\n   - 빈 Region은 재사용 가능\n   - 병렬 처리로 빠른 수행\n\n2. **Mixed GC**\n   - Young + Old Region 일부를 동시에 GC\n   - **가비지 비율이 높은 Region 우선 수집** (Garbage First)\n   - 목표 중지 시간 내에서 최대한 많은 가비지 수집\n\n3. **Full GC (최후 수단)**\n   - 모든 Region을 단일 스레드로 GC (매우 느림)\n   - Concurrent Mark를 통해 최대한 회피\n\n**특징:**\n- **예측 가능한 중지 시간**: `-XX:MaxGCPauseMillis=200` (기본 200ms)\n- **Concurrent Marking**: 애플리케이션과 동시에 마킹 작업\n- **점진적 수집**: 전체 Heap을 한 번에 수집하지 않음\n- **압축 (Compaction)**: GC 중 메모리 단편화 자동 해결\n\n**장단점:**\n- ✅ 예측 가능한 중지 시간 (목표 시간 설정 가능)\n- ✅ 큰 Heap에서 효율적 (6GB 이상 권장)\n- ✅ 메모리 단편화 방지\n- ❌ 작은 Heap에서는 Parallel GC보다 느릴 수 있음\n- ❌ CPU 오버헤드 약간 증가 (Concurrent 작업)\n\n**Java 8 vs Java 9+ GC 비교:**\n\n| 항목 | Java 8 (Parallel GC) | Java 9+ (G1 GC) |\n|------|---------------------|-----------------|\n| **기본 GC** | Parallel GC | G1 GC |\n| **메모리 구조** | 고정된 Young/Old 영역 | 동적 Region 기반 |\n| **목표** | 높은 처리량 (Throughput) | 예측 가능한 중지 시간 |\n| **중지 시간** | 길고 예측 어려움 (수백ms~수초) | 짧고 예측 가능 (목표 시간 설정) |\n| **적합한 환경** | 배치 처리, 백그라운드 작업 | 실시간 서비스, 대용량 Heap |\n| **Full GC 빈도** | 높음 | 낮음 (Concurrent Mark) |\n| **튜닝 복잡도** | 중간 | 낮음 (자동 튜닝) |\n\n---\n\n## Java 11 최신 GC\n\nJava 11은 LTS(Long-Term Support) 버전으로, GC 분야에서 혁신적인 발전이 있었습니다.\n\n### Java 11: Epsilon GC (No-Op Garbage Collector)\n\n**개념:**\n- **아무것도 하지 않는 GC**: 메모리 할당만 수행, 회수는 하지 않음\n- 메모리가 다 차면 JVM 종료\n\n**동작 방식:**\n\n```\n애플리케이션 실행\n     ↓\nHeap 메모리 할당\n     ↓\n객체 생성 계속...\n     ↓\nHeap 메모리 고갈\n     ↓\nOutOfMemoryError 발생\n     ↓\nJVM 종료\n```\n\n**사용 사례:**\n- **성능 테스트**: GC 오버헤드 측정\n- **초단기 실행 작업**: 배치 작업, 함수형 프로그래밍 (메모리 부족 전에 종료)\n- **GC 성능 분석**: GC가 없을 때 vs 있을 때 비교\n\n**사용 방법:**\n\n```bash\njava -XX:+UnlockExperimentalVMOptions \\\n     -XX:+UseEpsilonGC \\\n     -Xmx1g \\\n     MyApp\n\n# 출력 예시:\n# [0.001s][info][gc] Using Epsilon\n# ...\n# [10.5s][info][gc] OutOfMemoryError: Java heap space\n```\n\n**장단점:**\n\n| 장점 | 단점 |\n|------|------|\n| ✅ GC 오버헤드 완전 제거 (0ms 중지 시간) | ❌ 장시간 실행 불가 (메모리 고갈) |\n| ✅ 예측 가능한 성능 (GC로 인한 변동 없음) | ❌ 메모리 누수 위험 높음 |\n| ✅ 벤치마크 테스트에 유용 | ❌ 프로덕션 환경에 부적합 |\n\n### Java 11: ZGC (Z Garbage Collector)\n\n**개념:**\n- **초저지연 GC**: 중지 시간 10ms 이하 목표\n- **대용량 Heap 지원**: 수백 GB ~ 수 TB까지\n- **동시성 GC**: 대부분의 작업을 애플리케이션과 동시 수행\n\n**동작 방식:**\n\n```\n┌─────────────────────────────────────────────┐\n│ Heap Memory (ZGC Region 기반)              │\n│  ┌──┬──┬──┬──┬──┬──┬──┬──┬──┬──┬──┬──┐   │\n│  │S │S │M │M │M │L │L │L │L │M │S │M │   │\n│  └──┴──┴──┴──┴──┴──┴──┴──┴──┴──┴──┴──┘   │\n│                                             │\n│  S: Small (2MB)   M: Medium (32MB)         │\n│  L: Large (N * 2MB, 동적 크기)             │\n└─────────────────────────────────────────────┘\n\n동작 단계:\n1. Concurrent Mark (동시 마킹)\n   - 애플리케이션 실행 중 마킹\n   - STW 없음\n\n2. Concurrent Prepare (준비)\n   - 재배치 대상 선정\n   - STW 없음\n\n3. Concurrent Relocate (재배치)\n   - 살아있는 객체 이동\n   - 메모리 단편화 해결\n   - STW: 1ms 미만\n\n4. Concurrent Remap (재매핑)\n   - 객체 참조 업데이트\n   - STW 없음\n```\n\n**핵심 기술:**\n\n1. **Colored Pointers (착색 포인터)**\n   - 64비트 포인터의 일부 비트를 메타데이터로 사용\n   - 객체 상태를 포인터에 인코딩 (Marked, Remapped 등)\n\n2. **Load Barriers**\n   - 객체 접근 시 포인터 상태 확인\n   - 필요시 재매핑 (런타임 오버헤드 < 4%)\n\n**Java 8 Parallel GC vs Java 9 G1 GC vs Java 11 ZGC:**\n\n| 항목 | Parallel GC (Java 8) | G1 GC (Java 9+) | ZGC (Java 11+) |\n|------|---------------------|-----------------|----------------|\n| **중지 시간** | 수백ms ~ 수초 | 수십ms ~ 수백ms (목표 시간 설정 가능) | **10ms 미만 (일관됨)** |\n| **대용량 Heap** | 비효율적 (8GB 이상) | 효율적 (수십 GB) | **매우 효율적 (수 TB)** |\n| **메모리 구조** | 고정된 Young/Old | 동적 Region | 동적 Region (3 사이즈) |\n| **동시성** | STW 중심 | 일부 Concurrent | **대부분 Concurrent** |\n| **처리량** | 매우 높음 (100%) | 높음 (90-95%) | 중간 (85-90%, Load Barrier 오버헤드) |\n| **적합한 환경** | 배치, 높은 처리량 | 일반 서버 | **실시간 서비스, 대용량 메모리** |\n| **최소 Heap** | 제한 없음 | 제한 없음 | 8GB 이상 권장 |\n\n**ZGC 사용 방법:**\n\n```bash\n# Java 11-14 (실험적)\njava -XX:+UnlockExperimentalVMOptions \\\n     -XX:+UseZGC \\\n     -Xmx16g \\\n     MyApp\n\n# Java 15+ (프로덕션 준비)\njava -XX:+UseZGC \\\n     -Xmx16g \\\n     MyApp\n\n# ZGC 로그 확인\njava -XX:+UseZGC \\\n     -Xlog:gc*:gc.log \\\n     MyApp\n\n# 출력 예시:\n# [2.123s][info][gc] GC(10) Pause Mark Start 0.012ms\n# [2.456s][info][gc] GC(10) Concurrent Mark 333.245ms\n# [2.789s][info][gc] GC(10) Pause Mark End 0.008ms\n# [3.012s][info][gc] GC(10) Concurrent Relocate 223.567ms\n```\n\n**ZGC 장단점:**\n\n| 장점 | 단점 |\n|------|------|\n| ✅ 일관된 초저지연 (10ms 미만) | ❌ 처리량 약간 낮음 (Load Barrier 오버헤드) |\n| ✅ 대용량 Heap 효율적 처리 | ❌ 메모리 사용량 증가 (메타데이터) |\n| ✅ 중지 시간이 Heap 크기에 비례하지 않음 | ❌ 작은 Heap에서는 G1보다 느릴 수 있음 |\n| ✅ 실시간 애플리케이션에 적합 | ❌ Java 11 이상 필요 |\n\n---\n\n### GC 알고리즘 통합 비교\n\n| GC 종류 | Java 버전 | 중지 시간 | 처리량 | 대용량 Heap | 적합한 상황 |\n|---------|-----------|----------|--------|-------------|-------------|\n| **Serial GC** | Java 1.0+ | 긴 시간 | 낮음 | 비효율적 | 작은 애플리케이션, 단일 코어 |\n| **Parallel GC** | Java 5+ (Java 8 기본) | 수백ms~수초 | **매우 높음** | 비효율적 (8GB 이상) | 배치 작업, 처리량 중시 |\n| **G1GC** | Java 9+ (기본) | 수십~수백ms (예측 가능) | 높음 (90-95%) | 효율적 (수십 GB) | 범용, 대부분의 애플리케이션 |\n| **ZGC** | Java 11+ | **10ms 미만** | 중간 (85-90%) | **매우 효율적 (TB급)** | 대용량 힙, 낮은 지연 요구 |\n| **Shenandoah** | Java 12+ | 낮은 일시정지 | 중간 | 효율적 | 실시간성 요구 애플리케이션 |\n| **Epsilon GC** | Java 11+ | **0ms** (GC 없음) | **100%** | N/A | 성능 테스트, 초단기 실행 |\n\n---\n\n## Runtime 클래스로 메모리 확인\n\n### 주요 메서드\n\n| 메서드 | 설명 | 반환값 |\n|--------|------|--------|\n| `maxMemory()` | 최대 힙 크기 (-Xmx) | bytes |\n| `totalMemory()` | 현재 할당된 힙 크기 | bytes |\n| `freeMemory()` | 할당된 힙 중 사용 가능한 메모리 | bytes |\n\n**실제 사용 중인 메모리 계산:**\n```\n사용 중 메모리 = totalMemory() - freeMemory()\n```\n\n### 코드 예제\n\n```java\npublic class MemoryMonitor {\n    public static void printMemoryInfo() {\n        Runtime runtime = Runtime.getRuntime();\n\n        long maxMemory = runtime.maxMemory();\n        long totalMemory = runtime.totalMemory();\n        long freeMemory = runtime.freeMemory();\n        long usedMemory = totalMemory - freeMemory;\n\n        System.out.println(\"=== JVM Memory Info ===\");\n        System.out.println(\"Max Memory:   \" + formatBytes(maxMemory) +\n                          \" (-Xmx)\");\n        System.out.println(\"Total Memory: \" + formatBytes(totalMemory) +\n                          \" (현재 할당)\");\n        System.out.println(\"Used Memory:  \" + formatBytes(usedMemory) +\n                          \" (실제 사용)\");\n        System.out.println(\"Free Memory:  \" + formatBytes(freeMemory) +\n                          \" (할당 중 여유)\");\n        System.out.println(\"Usage: \" +\n                          (usedMemory * 100 / totalMemory) + \"%\");\n    }\n\n    private static String formatBytes(long bytes) {\n        long mb = bytes / (1024 * 1024);\n        return mb + \"MB (\" + bytes + \" bytes)\";\n    }\n\n    public static void main(String[] args) {\n        // 초기 상태\n        printMemoryInfo();\n\n        // 메모리 사용 시뮬레이션\n        System.out.println(\"\\n큰 배열 생성...\");\n        int[] largeArray = new int[10_000_000]; // 약 40MB\n\n        printMemoryInfo();\n\n        // GC 강제 실행 (권장하지 않음, 테스트용)\n        System.out.println(\"\\nGC 실행...\");\n        System.gc();\n\n        printMemoryInfo();\n    }\n}\n```\n\n**실행 결과 예시:**\n\n```\n=== JVM Memory Info ===\nMax Memory:   4096MB (-Xmx)\nTotal Memory: 256MB (현재 할당)\nUsed Memory:  50MB (실제 사용)\nFree Memory:  206MB (할당 중 여유)\nUsage: 19%\n\n큰 배열 생성...\n=== JVM Memory Info ===\nMax Memory:   4096MB (-Xmx)\nTotal Memory: 512MB (현재 할당)  ← 힙 확장됨\nUsed Memory:  90MB (실제 사용)\nFree Memory:  422MB (할당 중 여유)\nUsage: 17%\n\nGC 실행...\n=== JVM Memory Info ===\nMax Memory:   4096MB (-Xmx)\nTotal Memory: 512MB (현재 할당)\nUsed Memory:  45MB (실제 사용)  ← GC로 회수\nFree Memory:  467MB (할당 중 여유)\nUsage: 8%\n```\n\n### 실전 활용: 메모리 부족 감지\n\n```java\npublic class MemoryWatcher {\n    private static final double WARNING_THRESHOLD = 0.8; // 80%\n    private static final double CRITICAL_THRESHOLD = 0.9; // 90%\n\n    public static void checkMemoryUsage() {\n        Runtime runtime = Runtime.getRuntime();\n        long maxMemory = runtime.maxMemory();\n        long usedMemory = runtime.totalMemory() - runtime.freeMemory();\n\n        double usage = (double) usedMemory / maxMemory;\n\n        if (usage > CRITICAL_THRESHOLD) {\n            System.err.println(\"CRITICAL: Memory usage \" +\n                              (int)(usage * 100) + \"%\");\n            // 로깅, 알림 발송 등\n        } else if (usage > WARNING_THRESHOLD) {\n            System.out.println(\"WARNING: Memory usage \" +\n                              (int)(usage * 100) + \"%\");\n        }\n    }\n}\n```\n\n---\n\n## 실전 활용: Elastic Beanstalk 설정\n\n### 인스턴스 타입별 권장 힙 크기\n\n| 인스턴스 | RAM | 권장 힙 (-Xmx) | 초기 힙 (-Xms) |\n|----------|-----|----------------|----------------|\n| t3.small | 2GB | 1~1.5GB | 512MB~1GB |\n| t3.medium | 4GB | 2~3GB | 1~2GB |\n| m7g.large | 8GB | 4~6GB | 2~4GB |\n| **m7g.xlarge** | **16GB** | **6~10GB** | **3~6GB** |\n\n**메모리 할당 가이드:**\n- 인스턴스 RAM의 50~75%를 힙에 할당\n- 나머지는 OS, Metaspace, Direct Memory 등을 위해 예약\n\n### 설정 방법\n\n#### 방법 1: 환경 속성 (Console)\n\n1. Elastic Beanstalk Console → 환경 선택\n2. **구성(Configuration)** → **소프트웨어(Software)**\n3. **환경 속성(Environment properties)** 추가:\n   ```\n   이름: JAVA_TOOL_OPTIONS\n   값: -Xmx6g -Xms3g -XX:+UseG1GC\n   ```\n\n#### 방법 2: `.ebextensions` 설정\n\n```yaml\n# .ebextensions/jvm-options.config\noption_settings:\n  aws:elasticbeanstalk:application:environment:\n    JAVA_TOOL_OPTIONS: \"-Xmx6g -Xms3g -XX:+UseG1GC -XX:MaxGCPauseMillis=200\"\n```\n\n#### 방법 3: Java 플랫폼 전용 설정\n\n```yaml\n# .ebextensions/java-settings.config\noption_settings:\n  aws:elasticbeanstalk:container:java:\n    Xmx: 6g\n    Xms: 3g\n```\n\n### 자동 설정 vs 명시적 설정 비교\n\n| 구분 | 자동 설정 | 명시적 설정 |\n|------|-----------|-------------|\n| **설정** | 없음 (기본값) | `-Xmx6g -Xms3g` |\n| **초기 힙** | 256MB | 3GB |\n| **최대 힙** | 4GB | 6GB |\n| **확장** | 필요 시 자동 | 최소화 |\n| **GC 빈도** | 높음 | 낮음 |\n| **성능** | 예측 불가 | 안정적 |\n| **메모리 활용** | 보수적 | 적극적 |\n| **적합한 경우** | 테스트, 소규모 | **프로덕션, 대용량** |\n\n### 사진 처리 워크로드 사례\n\n**문제 상황:**\n```\n현재: 힙 1GB, 사용률 75~90%\n추가: 사진 업로드/처리 기능\n이미지: 10MB 사진 → 메모리 50~100MB 차지\n```\n\n**자동 확장 시 문제점:**\n```\n사용자 동시 업로드\n→ 메모리 급증 (1GB → 2GB 필요)\n→ GC 실행 → 힙 확장 → Full GC\n→ 수백ms ~ 수초 정지\n→ 사용자 요청 지연\n```\n\n**권장 설정 (m7g.xlarge, 16GB):**\n```bash\nJAVA_TOOL_OPTIONS: \"-Xmx8g -Xms4g -XX:+UseG1GC\"\n```\n\n**효과:**\n- ✅ 시작부터 4GB 확보\n- ✅ 사진 처리 시 여유 있음\n- ✅ 힙 확장 최소화\n- ✅ 예측 가능한 성능\n\n### 배포 시 주의사항\n\n**롤링 배포 정책:**\n\n| 정책 | 다운타임 | 용량 감소 | 환경 속성 변경 시 |\n|------|----------|-----------|-------------------|\n| 전체 한번에 | 있음 | 100% | 전체 재시작 |\n| 롤링 | 없음 | 일시적 | 순차 재시작 |\n| **추가 배치 롤링** | **없음** | **없음** | **무중단 업데이트** |\n| 변경 불가능 | 없음 | 없음 | 새 인스턴스 세트 |\n\n**추가 배치 롤링 (권장):**\n1. 새 인스턴스 추가 생성 (새 JVM 설정)\n2. 헬스체크 통과\n3. 기존 인스턴스 순차 교체\n4. 완료 후 추가 인스턴스 제거\n\n**확인 방법:**\n```bash\n# 로그에서 JVM 옵션 확인\neb logs | grep \"JAVA_TOOL_OPTIONS\"\n\n# 출력 예시:\n# Picked up JAVA_TOOL_OPTIONS: -Xmx8g -Xms4g -XX:+UseG1GC\n```\n\n---\n\n## Stack\n\n```\nThread-1 Stack       Thread-2 Stack\n┌──────────────┐     ┌──────────────┐\n│ Stack Frame  │     │ Stack Frame  │\n│ ┌──────────┐ │     │ ┌──────────┐ │\n│ │지역 변수  │ │     │ │지역 변수  │ │\n│ │operand   │ │     │ │operand   │ │\n│ │return    │ │     │ │return    │ │\n│ │  addr    │ │     │ │  addr    │ │\n│ └──────────┘ │     │ └──────────┘ │\n└──────────────┘     └──────────────┘\n```\n\n- 메서드 호출마다 Stack Frame 생성\n- 메서드 종료 시 자동 제거 (GC 불필요)\n- `-Xss` 옵션으로 크기 조정 (기본: 1MB)\n\n---\n\n## 핵심 요약\n\n### 기억할 것\n\n1. **기본값은 자동 설정됨** (Java 5+)\n   - 초기: RAM / 64\n   - 최대: RAM / 4\n\n2. **동적 확장은 Java 1.0부터 지원**\n   - 메모리 부족 → GC → 확장 → 반복\n\n3. **자동 확장의 비용**\n   - GC 빈발 → 성능 저하\n   - Full GC → 일시 정지\n\n4. **프로덕션에서는 명시적 설정 권장**\n   - 예측 가능한 성능\n   - 메모리 집약적 워크로드 대비\n\n5. **메모리 모니터링 필수**\n   - Runtime 클래스 활용\n   - CloudWatch, APM 도구 사용\n\n### 빠른 의사결정 가이드\n\n```\n메모리 사용률 < 50% → 현재 설정 유지\n메모리 사용률 50~70% → 모니터링 강화\n메모리 사용률 > 70% → 힙 크기 증설 고려\nGC 빈도 증가 → 힙 크기 증설\nFull GC 빈발 → GC 알고리즘 변경 또는 힙 증설\n```\n\n---\n\n## 참고 자료\n\n- [Oracle Java 8 JVM Specification](https://docs.oracle.com/javase/specs/jvms/se8/html/)\n- [Oracle Java SE Documentation - Ergonomics](https://docs.oracle.com/en/java/javase/21/gctuning/ergonomics.html)\n- [From PermGen to Metaspace](https://www.baeldung.com/java-permgen-metaspace)\n- [G1 GC Overview](https://www.oracle.com/technical-resources/articles/java/g1gc.html)\n- [G1GC Tuning Guide](https://docs.oracle.com/en/java/javase/21/gctuning/garbage-first-g1-garbage-collector1.html)\n- [ZGC Documentation](https://wiki.openjdk.org/display/zgc/Main)\n- [AWS Elastic Beanstalk - Java SE Platform](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/java-se-platform.html)\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 27194, "lines": 783}, {"filename": "jvm-overview.md", "title": "JVM 완전 가이드 (Java 8 → Java 17+)", "path": "java/jvm-overview.md", "content": "# JVM 완전 가이드 (Java 8 → Java 17+)\n\nJava Virtual Machine의 메모리 구조, 실행 흐름, 클래스 로딩, 컴파일러, 가비지 컬렉션에 대한 종합 가이드입니다.\n\n**기준 버전**: Java 8 (Java 9, 11, 17 변경사항 포함)\n\n---\n\n## 📚 문서 구성\n\n이 가이드는 3개의 상세 문서로 구성되어 있습니다:\n\n### 1. [JVM 메모리 구조와 가비지 컬렉션](jvm-memory-and-gc.md)\n\nJVM의 메모리 영역과 GC 메커니즘을 다룹니다.\n\n**주요 내용:**\n- **메모리 영역**: Metaspace, Heap, Stack, PC Register\n- **Java 8 Parallel GC**: 고정된 Young/Old 구조, 높은 처리량\n- **Java 9+ G1 GC**: Region 기반, 예측 가능한 중지 시간\n- **Java 11 ZGC**: 초저지연 (10ms 이하), 대용량 Heap (TB급)\n- **Java 11 Epsilon GC**: No-Op GC, 성능 테스트용\n\n**핵심 비교:**\n\n| GC | Java 버전 | 중지 시간 | 적합한 환경 |\n|---|---|---|---|\n| Parallel | Java 8 기본 | 수백ms~수초 | 배치, 높은 처리량 |\n| G1 | Java 9+ 기본 | 수십~수백ms | 일반 서버, 대용량 Heap |\n| ZGC | Java 11+ | **10ms 미만** | 실시간 서비스, 초대용량 |\n\n---\n\n### 2. [JVM 실행 흐름과 컴파일러](jvm-execution-and-compilation.md)\n\n바이트코드 실행 흐름과 다양한 컴파일러를 다룹니다.\n\n**주요 내용:**\n- **전체 실행 과정**: 소스 코드 → 바이트코드 → 실행 → GC\n- **Stack Frame**: 메서드 호출과 지역 변수 관리\n- **Java 8 인터프리터 + JIT**: Hot Spot 감지, C1/C2 컴파일러\n- **Java 9+ AOT**: 사전 컴파일, 빠른 시작 (Java 17에서 제거)\n- **Java 17+ GraalVM Native Image**: JVM 불필요, 밀리초 시작\n\n**핵심 비교:**\n\n| 방식 | 시작 시간 | Peak 성능 | 메모리 | 적합한 환경 |\n|---|---|---|---|---|\n| JIT (Java 8) | 느림 (워밍업) | 매우 높음 | 높음 | 장시간 실행 서버 |\n| AOT (Java 9-16) | 30-70% 단축 | JIT보다 5-10% 낮음 | 중간 | 짧은 실행 |\n| GraalVM Native Image | **90% 이상 단축** | JIT보다 10-30% 낮음 | **1/10** | 서버리스, 마이크로서비스 |\n\n---\n\n### 3. [JVM 클래스 로더와 모듈 시스템](jvm-classloader-and-modules.md)\n\n클래스 로딩 메커니즘과 Java 9 모듈 시스템을 다룹니다.\n\n**주요 내용:**\n- **Java 8 클래스 로더**: Bootstrap / Extension / Application\n- **Java 9+ 모듈 시스템 (JPMS)**: rt.jar 제거, Platform ClassLoader\n- **클래스 로딩 3단계**: Loading → Linking → Initialization\n- **어노테이션 프로세서**: 컴파일 타임 코드 생성 (Lombok, QueryDSL)\n\n**핵심 변경:**\n\n| 항목 | Java 8 | Java 9+ |\n|---|---|---|\n| 핵심 라이브러리 | rt.jar (60MB+) | 모듈로 분리 (java.base 등) |\n| Extension CL | `ExtClassLoader` | `PlatformClassLoader` |\n| 캡슐화 | 약함 (internal API 접근 가능) | 강함 (모듈 경계 강제) |\n| 클래스 경로 | classpath만 | classpath + module-path |\n\n---\n\n## 🔑 Java 버전별 핵심 변경사항\n\n### Java 8 (2014)\n- **Metaspace 도입**: PermGen 제거, Native Memory 사용\n- **Parallel GC 기본**: 고정된 Young/Old 구조\n- **Lambda와 Stream API**: 함수형 프로그래밍\n\n### Java 9 (2017)\n- **모듈 시스템 (JPMS)**: rt.jar 제거, 강력한 캡슐화\n- **G1 GC 기본**: Region 기반, 예측 가능한 중지 시간\n- **AOT 컴파일러**: 사전 컴파일로 빠른 시작\n\n### Java 11 (2018, LTS)\n- **ZGC**: 초저지연 (10ms 미만), TB급 Heap 지원\n- **Epsilon GC**: No-Op GC, 성능 테스트용\n- **Flight Recorder 오픈소스화**: 무료 프로파일링 도구\n\n### Java 17 (2021, LTS)\n- **AOT/Graal JIT 제거**: GraalVM Native Image로 대체\n- **Sealed Classes**: 상속 제한\n- **Pattern Matching for switch**: 패턴 매칭\n\n---\n\n## 📖 추천 학습 순서\n\n1. **초급**: [메모리 구조와 GC](jvm-memory-and-gc.md) → Java 8 Parallel GC 부분만\n2. **중급**: [실행 흐름](jvm-execution-and-compilation.md) → JIT 컴파일러까지\n3. **고급**: [클래스 로더](jvm-classloader-and-modules.md) → 모듈 시스템\n4. **심화**: 각 문서의 Java 9+, Java 11 변경사항\n\n---\n\n## 🔗 참고 자료\n\n- [Oracle Java 8 JVM Specification](https://docs.oracle.com/javase/specs/jvms/se8/html/)\n- [G1 GC Overview](https://www.oracle.com/technical-resources/articles/java/g1gc.html)\n- [ZGC Documentation](https://wiki.openjdk.org/display/zgc/Main)\n- [GraalVM Native Image](https://www.graalvm.org/latest/reference-manual/native-image/)\n- [Java Platform Module System](https://openjdk.org/projects/jigsaw/)\n\n---\n\n*마지막 업데이트: 2025년 12월*\n", "size": 4585, "lines": 120}]}, "network": {"files": [{"filename": "chapter-01-web-browser-http-dns.md", "title": "Chapter 01. 웹 브라우저가 메시지를 만든다", "path": "network/chapter-01-web-browser-http-dns.md", "content": "# Chapter 01. 웹 브라우저가 메시지를 만든다\n\n## 개요\n\n웹 브라우저가 URL을 입력받아 웹 서버와 통신하기까지의 전체 과정을 다룹니다. HTTP 리퀘스트 메시지 생성부터 DNS를 통한 IP 주소 조회, 그리고 프로토콜 스택을 통한 메시지 송신까지의 원리를 실무 사례와 함께 살펴봅니다.\n\n## 목차\n\n1. [HTTP 리퀘스트 메시지 작성](#1-http-리퀘스트-메시지-작성)\n2. [DNS 서버를 통한 IP 주소 조회](#2-dns-서버를-통한-ip-주소-조회)\n3. [전 세계 DNS 서버의 연대](#3-전-세계-dns-서버의-연대)\n4. [프로토콜 스택에 메시지 송신 의뢰](#4-프로토콜-스택에-메시지-송신-의뢰)\n\n---\n\n## 1. HTTP 리퀘스트 메시지 작성\n\n### 탐험 여행은 URL 입력부터 시작한다\n\n웹 브라우저의 동작은 사용자가 URL을 입력하는 순간부터 시작됩니다. URL(Uniform Resource Locator)은 인터넷 상의 리소스 위치를 나타내는 표준 형식입니다.\n\n### 브라우저는 먼저 URL을 해독한다\n\n**URL의 기본 구조:**\n```\nhttp://user:password@www.example.com:80/path/to/resource?key1=value1&key2=value2#section\n```\n\n각 부분의 의미:\n- **프로토콜(Scheme)**: `http://` 또는 `https://` - 통신 방식 지정\n- **사용자 정보**: `user:password@` - 기본 인증 정보 (현재는 거의 사용되지 않음)\n- **호스트명**: `www.example.com` - 웹 서버의 도메인 이름\n- **포트 번호**: `:80` - 생략 시 HTTP는 80, HTTPS는 443 사용\n- **경로**: `/path/to/resource` - 서버 내 리소스 위치\n- **쿼리 문자열**: `?key1=value1&key2=value2` - 서버에 전달할 파라미터\n- **프래그먼트**: `#section` - 페이지 내 특정 위치 (서버로 전송되지 않음)\n\n**실무 사례:**\n```\nhttps://api.example.com/v1/users?page=2&limit=20\n```\n- 프로토콜: `https` (보안 연결)\n- 호스트: `api.example.com`\n- 경로: `/v1/users` (RESTful API 엔드포인트)\n- 쿼리: `page=2&limit=20` (페이지네이션 파라미터)\n\n### 파일명을 생략한 경우\n\n경로의 마지막이 `/`로 끝나는 경우, 웹 서버는 **디렉터리 인덱스** 파일을 반환합니다.\n\n```\nhttp://www.example.com/products/\n↓\nhttp://www.example.com/products/index.html (또
